                    <div style={{ padding: "8px 12px", background: "rgba(99,102,241,0.06)", border: "0.5px solid rgba(99,102,241,0.25)", borderRadius: 8, display: "flex", alignItems: "flex-start", gap: 8 }}>
                      <span style={{ fontSize: 14 }}>📋</span>
                      <span style={{ fontSize: 11, color: "#4338CA", lineHeight: 1.5 }}>
                        {(() => {
                          const gC = p.goces.filter(g => g.acuerdoInfo?.porConvenio);
                          return <>Tiene <strong>{gC.length} goce{gC.length !== 1 ? "s" : ""}</strong> por convenio: <strong>{gC.reduce((s, g) => s + g.dias, 0)} días</strong> acumulados bajo acuerdo firmado.</>;
                        })()}
                      </span>
                    </div>
                  )}
                  {p.diasBase > 0 && p.diasGozados > p.diasBase && (
                    <div style={{ padding: "8px 12px", background: "rgba(239,68,68,0.06)", border: "0.5px solid rgba(239,68,68,0.3)", borderRadius: 8, display: "flex", alignItems: "flex-start", gap: 8 }}>
                      <span style={{ fontSize: 14 }}>ℹ️</span>
                      <span style={{ fontSize: 11, color: "#991B1B", lineHeight: 1.5 }}>
                        Exceso de goce de <strong>{(p.diasGozados - p.diasBase).toFixed(2)} días</strong>. Déficit cubierto por otros períodos.
                      </span>
                    </div>
                  )}
                </div>
              )}
            </div>
          );
        })}
      </div>

      {/* Modales de detalle */}
      {goceSeleccionado && <GoceModal goce={goceSeleccionado} onClose={() => setGoceSeleccionado(null)} />}
      {compraSeleccionada && <CompraModal compra={compraSeleccionada} onClose={() => setCompraSeleccionada(null)} />}
    </div>
  );
}

// ─── PÁGINA: FICHA DEL COLABORADOR ───────────────────────────────────────────
// ─── GENERADOR DE FICHA EN PDF (individual / masivo) ──────────────────────
function generarFichaPDF(colab, fechaCorteGlobal, doc) {
  const { jsPDF } = window.jspdf;
  const esStandalone = !doc;
  if (esStandalone) doc = new jsPDF({ unit: "pt", format: "a4" });

  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const marginX = 40;
  let y = 40;

  const hoy = dateOnly(fechaCorteGlobal);
  const pendiente = colab.periodos.find((p) => p.tipo === "PENDIENTE" && p.saldo > 0);
  const trunca = colab.periodos.find((p) => p.tipo === "TRUNCA" && p.saldo > 0);
  const fechaTope = pendiente
    ? dateOnly(new Date(pendiente.fechaVencimiento.getTime() - (pendiente.saldo - 1) * 86400000))
    : null;
  const diasHastaTope = fechaTope ? daysBetween(hoy, fechaTope) : null;

  const semaforo = colab.totalVencidas > 0
    ? { color: [220, 38, 38], bg: [254, 242, 242], texto: "Tiene dias perdidos", sub: Math.round(colab.totalVencidas) + " dias que ya no se pueden recuperar" }
    : colab.enRiesgo
    ? { color: [234, 88, 12], bg: [255, 247, 237], texto: "Atencion — pronto vencen sus dias", sub: fechaTope ? "Debe salir antes del " + fmtDate(fechaTope) : "" }
    : pendiente
    ? { color: [22, 163, 74], bg: [240, 253, 244], texto: "Esta al dia", sub: "Tiene " + (Math.round(pendiente.saldo * 100) / 100) + " dias disponibles" }
    : { color: [107, 114, 128], bg: [249, 250, 251], texto: "Sin dias pendientes", sub: "Consultar con Gestion Humana" };

  const checkPageBreak = (alturaNecesaria) => {
    if (y + alturaNecesaria > pageH - 40) {
      doc.addPage();
      y = 40;
      return true;
    }
    return false;
  };

  // ── Cabecera verde con datos del colaborador ──
  doc.setFillColor(13, 92, 42);
  doc.roundedRect(marginX, y, pageW - marginX * 2, 64, 6, 6, "F");
  doc.setTextColor(255, 255, 255);
  doc.setFont("helvetica", "bold");
  doc.setFontSize(14);
  doc.text(colab.nombres, marginX + 16, y + 24);
  doc.setFont("helvetica", "normal");
  doc.setFontSize(9);
  doc.text(`${colab.gerencia}${colab.unidadOrg ? " - " + colab.unidadOrg : ""}`, marginX + 16, y + 40);
  doc.text(`DNI: ${colab.doc}   ·   Cod: ${colab.cod}   ·   Ingreso: ${fmtDate(colab.fechaCorte)}`, marginX + 16, y + 54);
  y += 64 + 14;

  // ── Banda de semáforo ──
  doc.setFillColor(...semaforo.bg);
  doc.roundedRect(marginX, y, pageW - marginX * 2, 36, 5, 5, "F");
  doc.setTextColor(...semaforo.color);
  doc.setFont("helvetica", "bold");
  doc.setFontSize(11);
  doc.text(semaforo.texto, marginX + 14, y + 16);
  doc.setFont("helvetica", "normal");
  doc.setFontSize(8.5);
  doc.setTextColor(80, 80, 80);
  if (semaforo.sub) doc.text(semaforo.sub, marginX + 14, y + 28);
  y += 36 + 14;

  // ── 3 tarjetas resumen ──
  const cardW = (pageW - marginX * 2 - 16) / 3;
  const resumen = [
    { label: "Dias disponibles ahora", value: Math.round((pendiente ? pendiente.saldo : 0) * 100) / 100, color: [13, 92, 42] },
    { label: "Dias acumulandose", value: Math.round((trunca ? trunca.saldo : 0) * 100) / 100, color: [124, 58, 237] },
    { label: "Dias perdidos", value: Math.round(colab.totalVencidas * 100) / 100, color: colab.totalVencidas > 0 ? [220, 38, 38] : [107, 114, 128] },
  ];
  resumen.forEach((r, i) => {
    const x = marginX + i * (cardW + 8);
    doc.setDrawColor(229, 231, 235);
    doc.setFillColor(249, 250, 251);
    doc.roundedRect(x, y, cardW, 52, 5, 5, "FD");
    doc.setTextColor(120, 120, 120);
    doc.setFont("helvetica", "normal");
    doc.setFontSize(7.5);
    doc.text(r.label, x + cardW / 2, y + 16, { align: "center" });
    doc.setTextColor(...r.color);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(18);
    doc.text(String(r.value), x + cardW / 2, y + 36, { align: "center" });
  });
  y += 52 + 16;

  // ── Fecha tope (si aplica) ──
  if (fechaTope) {
    const colorTope = diasHastaTope < 0 ? [220, 38, 38] : diasHastaTope <= 30 ? [234, 88, 12] : [13, 92, 42];
    const bgTope = diasHastaTope < 0 ? [254, 242, 242] : diasHastaTope <= 30 ? [255, 247, 237] : [240, 253, 244];
    doc.setFillColor(...bgTope);
    doc.roundedRect(marginX, y, pageW - marginX * 2, 34, 5, 5, "F");
    doc.setTextColor(100, 100, 100);
    doc.setFont("helvetica", "normal");
    doc.setFontSize(8);
    doc.text("Fecha tope para salir de vacaciones", marginX + 14, y + 14);
    doc.setTextColor(...colorTope);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(12);
    doc.text(fmtDate(fechaTope), marginX + 14, y + 27);
    const txtDias = (diasHastaTope < 0 ? "Vencio hace " : "Quedan ") + Math.abs(diasHastaTope) + " dias";
    doc.setFontSize(10);
    doc.text(txtDias, pageW - marginX - 14, y + 21, { align: "right" });
    y += 34 + 16;
  }

  // ── Tabla de períodos ──
  checkPageBreak(40);
  doc.setTextColor(20, 20, 20);
  doc.setFont("helvetica", "bold");
  doc.setFontSize(11);
  doc.text("Periodos vacacionales", marginX, y);
  y += 14;

  const cols = [
    { key: "periodo", label: "Periodo", w: 65 },
    { key: "tipo", label: "Tipo", w: 70 },
    { key: "rango", label: "Inicio - Fin", w: 110 },
    { key: "vence", label: "Vence", w: 60 },
    { key: "base", label: "Base", w: 35 },
    { key: "gozado", label: "Gozado", w: 40 },
    { key: "comprado", label: "Comp.", w: 38 },
    { key: "saldo", label: "Saldo", w: 38 },
  ];
  const tableW = cols.reduce((s, c) => s + c.w, 0);
  const startX = marginX;

  const drawTableHeader = () => {
    doc.setFillColor(13, 92, 42);
    doc.rect(startX, y, tableW, 20, "F");
    doc.setTextColor(255, 255, 255);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(7.5);
    let cx = startX;
    cols.forEach(c => {
      doc.text(c.label, cx + 5, y + 13);
      cx += c.w;
    });
    y += 20;
  };

  drawTableHeader();

  const periodosOrdenados = [...colab.periodos].reverse();
  periodosOrdenados.forEach((p, idx) => {
    if (checkPageBreak(18)) drawTableHeader();

    const cfg = TIPO_CONFIG[p.tipo] || TIPO_CONFIG.TRUNCA;
    const esCubierto = p.tipo === "VENCIDA" && (p.diasVencidosReales === 0 || p.diasCedidosAntiguos > 0);
    const tipoLabel = p.tipo === "VENCIDA" && esCubierto ? "Gozado" : cfg.label;
    const saldoP = p.tipo === "VENCIDA" ? (p.diasVencidosReales || 0) : p.saldo;

    let rowColor = idx % 2 === 0 ? [255, 255, 255] : [249, 250, 251];
    let textColor = [40, 40, 40];
    if (p.tipo === "VENCIDA" && !esCubierto) textColor = [220, 38, 38];
    else if (p.tipo === "PENDIENTE") textColor = [13, 92, 42];
    else if (p.tipo === "TRUNCA") textColor = [124, 58, 237];
    else if (p.tipo === "INDEMNIZACION") textColor = [249, 115, 22];

    doc.setFillColor(...rowColor);
    doc.rect(startX, y, tableW, 18, "F");
    doc.setDrawColor(229, 231, 235);
    doc.line(startX, y + 18, startX + tableW, y + 18);

    doc.setFont("helvetica", "normal");
    doc.setFontSize(7.5);
    doc.setTextColor(...textColor);
    let cx = startX;
    const rowVals = {
      periodo: p.esAjuste ? "P0-Ajuste" : `Año ${p.anio}`,
      tipo: tipoLabel,
      rango: `${p.inicio ? fmtDate(p.inicio) : "—"} a ${p.fin ? fmtDate(p.fin) : "—"}`,
      vence: p.fechaVencimiento ? fmtDate(p.fechaVencimiento) : "—",
      base: String(p.diasBase ?? "—"),
      gozado: String(p.diasGozados ?? 0),
      comprado: String(p.diasComprados || 0),
      saldo: String(Math.round(saldoP * 100) / 100),
    };
    cols.forEach(c => {
      const txt = rowVals[c.key];
      doc.text(txt.length > 22 ? txt.slice(0, 21) + "…" : txt, cx + 5, y + 12);
      cx += c.w;
    });
    y += 18;
  });

  y += 20;

  // ── Pie de página ──
  const totalPaginas = doc.internal.getNumberOfPages();
  for (let i = 1; i <= totalPaginas; i++) {
    doc.setPage(i);
    doc.setFont("helvetica", "normal");
    doc.setFontSize(7.5);
    doc.setTextColor(150, 150, 150);
    doc.text(
      `Generado el ${fmtDate(hoy)} · NidoGestor Vacacional — La Calera`,
      marginX, pageH - 20
    );
    doc.text(`Pagina ${i} de ${totalPaginas}`, pageW - marginX, pageH - 20, { align: "right" });
  }

  if (esStandalone) {
    const nombreArchivo = `Ficha_${colab.cod}_${colab.nombres.replace(/[^a-zA-Z0-9]+/g, "_").slice(0, 40)}.pdf`;
    doc.save(nombreArchivo);
  }
  return doc;
}

function generarFichasPDFMasivo(colaboradores, fechaCorteGlobal) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "pt", format: "a4" });
  colaboradores.forEach((colab, i) => {
    if (i > 0) doc.addPage();
    generarFichaPDF(colab, fechaCorteGlobal, doc);
  });
  const fecha = new Date().toISOString().slice(0, 10).replace(/-/g, "");
  doc.save(`Fichas_Masivo_${fecha}.pdf`);
}

function PaginaFicha({ colaboradores, fechaCorteGlobal, todosColaboradores }) {
  const [busqueda, setBusqueda] = useState("");
  const [colab, setColab] = useState(null);
  const [tabActiva, setTabActiva] = useState("ficha");
  const hoy = dateOnly(fechaCorteGlobal);

  const sugerencias = useMemo(() => {
    if (!busqueda || busqueda.length < 2) return [];
    const q = busqueda.toLowerCase();
    return colaboradores
      .filter((c) => c.nombres.toLowerCase().includes(q) || c.cod.includes(q) || c.doc.includes(q))
      .slice(0, 8);
  }, [colaboradores, busqueda]);

  const pendiente = colab?.periodos.find((p) => p.tipo === "PENDIENTE" && p.saldo > 0);
  const trunca = colab?.periodos.find((p) => p.tipo === "TRUNCA" && p.saldo > 0);
  const fechaTope = pendiente
    ? dateOnly(new Date(pendiente.fechaVencimiento.getTime() - (pendiente.saldo - 1) * 86400000))
    : null;
  const diasHastaTope = fechaTope ? daysBetween(hoy, fechaTope) : null;
  const semaforo = !colab ? null
    : colab.totalVencidas > 0 ? { color: "#DC2626", bg: "#FEF2F2", icon: "\uD83D\uDD34", texto: "Tienes dias perdidos", sub: Math.round(colab.totalVencidas) + " dias que ya no se pueden recuperar" }
    : colab.enRiesgo ? { color: "#EA580C", bg: "#FFF7ED", icon: "\uD83D\uDFE0", texto: "Atencion — pronto vencen tus dias", sub: fechaTope ? "Debes salir antes del " + fmtDate(fechaTope) : "" }
    : pendiente ? { color: "#16A34A", bg: "#F0FDF4", icon: "\uD83D\uDFE2", texto: "Estas al dia", sub: "Tienes " + (Math.round(pendiente.saldo * 100) / 100) + " dias disponibles" }
    : { color: "#6B7280", bg: "#F9FAFB", icon: "\u26AA", texto: "Sin dias pendientes", sub: "Consulta con Gestion Humana" };

  const datosAnios = useMemo(() => {
    if (!colab) return [];
    return colab.periodos
      .filter((p) => p.tipo === "INDEMNIZACION" || p.tipo === "VENCIDA" || p.tipo === "PENDIENTE")
      .map((p) => {
        const base = p.diasBase;
        // Verde: gozado a tiempo (diasGozados directamente en el período, sin exceso)
        const gozadoATiempo = Math.min(p.diasGozados, base);
        // Rojo: este período absorbió exceso de período más antiguo → gozó ANTES de que correspondiera
        const gozadoAntes = Math.min(p.diasCedidosAntiguos || 0, base - gozadoATiempo);
        // Amarillo: este período compensó exceso de período más reciente → gozó DESPUÉS
        const gozadoDespues = Math.min(p.diasCedidosHaciaExceso || 0, base - gozadoATiempo - gozadoAntes);
        // Comprados: naranja
        const comprados = p.diasComprados || 0;
        return {
          label: "Ano " + p.anio,
          disponibles: base,
          gozadoATiempo,
          gozadoDespues,
          gozadoAntes,
          comprados,
          totalGozado: gozadoATiempo + gozadoDespues + gozadoAntes + comprados,
        };
      })
      .reverse();
  }, [colab]);

  const maxVal = datosAnios.length > 0 ? Math.max(...datosAnios.map((d) => d.disponibles)) : 30;
  const inputStyle = { background: COLORS.surface, border: "0.5px solid " + COLORS.border, color: COLORS.texto, borderRadius: 10, padding: "10px 14px", fontSize: 13, outline: "none", width: "100%" };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 20, maxWidth: 900 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 12 }}>
        <div>
          <div style={{ fontSize: 20, fontWeight: 600, color: COLORS.texto }}>Ficha del Colaborador</div>
          <div style={{ fontSize: 13, color: COLORS.textoMuted, marginTop: 2 }}>Vista simplificada y detalle completo por colaborador</div>
        </div>
        <div style={{ display: "flex", background: COLORS.bg, borderRadius: 10, border: "0.5px solid " + COLORS.border, padding: 4 }}>
          {[["ficha","\uD83E\uDEAA Ficha"],["detalle","\uD83D\uDCCB Detalle colaborador"],["masivo","\uD83D\uDCE6 Exportar Masivo"]].map(([id, label]) => (
            <button key={id} onClick={() => setTabActiva(id)} style={{
              background: tabActiva === id ? COLORS.surface : "transparent",
              border: tabActiva === id ? "0.5px solid " + COLORS.border : "none",
              borderRadius: 8, padding: "7px 18px", fontSize: 12.5,
              fontWeight: tabActiva === id ? 600 : 400,
              color: tabActiva === id ? COLORS.texto : COLORS.textoMuted,
              cursor: "pointer", boxShadow: tabActiva === id ? "0 1px 3px rgba(0,0,0,0.06)" : "none",
              whiteSpace: "nowrap",
            }}>{label}</button>
          ))}
        </div>
      </div>
      {tabActiva !== "masivo" && (
      <div style={{ background: COLORS.surface, borderRadius: 12, border: "0.5px solid " + COLORS.border, padding: 20 }}>
        <div style={{ position: "relative" }}>
          <input placeholder="Buscar por nombre, codigo o DNI..." value={colab ? colab.nombres : busqueda}
            onChange={(e) => { setBusqueda(e.target.value); setColab(null); setTabActiva("ficha"); }} style={inputStyle} />
          {sugerencias.length > 0 && !colab && (
            <div style={{ position: "absolute", top: "100%", left: 0, right: 0, background: COLORS.surface, border: "0.5px solid " + COLORS.border, borderRadius: 10, zIndex: 10, boxShadow: "0 4px 20px rgba(0,0,0,0.1)", marginTop: 4, overflow: "hidden" }}>
              {sugerencias.map((c) => (
                <div key={c.cod} onClick={() => { setColab(c); setBusqueda(""); setTabActiva("ficha"); }}
                  style={{ padding: "10px 14px", cursor: "pointer", borderBottom: "0.5px solid " + COLORS.border, display: "flex", justifyContent: "space-between", alignItems: "center" }}
                  onMouseEnter={(e) => e.currentTarget.style.background = COLORS.surfaceHigh}
                  onMouseLeave={(e) => e.currentTarget.style.background = "transparent"}>
                  <div><div style={{ fontSize: 13, fontWeight: 500, color: COLORS.texto }}>{c.nombres}</div><div style={{ fontSize: 11, color: COLORS.textoMuted }}>{c.gerencia} · DNI: {c.doc}</div></div>
                  <div style={{ fontSize: 11, color: COLORS.textoSecundario }}>Cod: {c.cod}</div>
                </div>
              ))}
            </div>
          )}
        </div>
        {colab && <button onClick={() => { setColab(null); setBusqueda(""); setTabActiva("ficha"); }} style={{ marginTop: 8, background: "transparent", border: "0.5px solid " + COLORS.border, color: COLORS.textoMuted, borderRadius: 6, padding: "3px 10px", cursor: "pointer", fontSize: 12 }}>Cambiar colaborador</button>}
        {colab && tabActiva === "ficha" && (
          <button onClick={() => generarFichaPDF(colab, fechaCorteGlobal)} style={{ marginTop: 8, marginLeft: 8, background: COLORS.accent, border: "none", color: "#fff", borderRadius: 6, padding: "3px 12px", cursor: "pointer", fontSize: 12, fontWeight: 600 }}>📄 Descargar ficha en PDF</button>
        )}
      </div>
      )}

      {/* TAB: EXPORTAR MASIVO */}
      {tabActiva === "masivo" && (
        <PaginaExportarMasivo colaboradores={todosColaboradores || colaboradores} fechaCorteGlobal={fechaCorteGlobal} />
      )}

      {colab && tabActiva === "detalle" && (
        <div style={{ background: COLORS.surface, borderRadius: 12, border: "0.5px solid " + COLORS.border, padding: "12px 8px", overflowX: "hidden" }}>
          <DetalleColaborador colab={colab} />
        </div>
      )}

      {colab && semaforo && tabActiva === "ficha" && (
        <>
          <div style={{ background: COLORS.surface, borderRadius: 12, border: "0.5px solid " + COLORS.border, overflow: "hidden" }}>
            <div style={{ background: COLORS.accent, padding: "20px 24px", display: "flex", alignItems: "center", gap: 16 }}>
              <div style={{ width: 52, height: 52, borderRadius: "50%", background: "rgba(255,255,255,0.2)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 20, fontWeight: 700, color: "white", flexShrink: 0 }}>
                {colab.nombres.split(" ").slice(0, 2).map((n) => n[0]).join("")}
              </div>
              <div>
                <div style={{ fontSize: 18, fontWeight: 600, color: "white" }}>{colab.nombres}</div>
                <div style={{ fontSize: 12, color: "rgba(255,255,255,0.7)", marginTop: 2 }}>{colab.gerencia} - {colab.unidadOrg}</div>
                <div style={{ fontSize: 12, color: "rgba(255,255,255,0.6)", marginTop: 1 }}>DNI: {colab.doc} - Cod: {colab.cod} - Ingreso: {fmtDate(colab.fechaCorte)}</div>
              </div>
            </div>
            <div style={{ margin: 20, padding: "14px 18px", background: semaforo.bg, borderRadius: 10, display: "flex", alignItems: "center", gap: 12 }}>
              <div style={{ fontSize: 28 }}>{semaforo.icon}</div>
              <div><div style={{ fontSize: 15, fontWeight: 600, color: semaforo.color }}>{semaforo.texto}</div><div style={{ fontSize: 12, color: COLORS.textoSecundario, marginTop: 2 }}>{semaforo.sub}</div></div>
            </div>
            <div style={{ padding: "0 20px 20px", display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(140px, 1fr))", gap: 12 }}>
              {[
                { label: "Dias disponibles ahora", value: Math.round((pendiente ? pendiente.saldo : 0) * 100) / 100, sub: "para gozar", color: COLORS.accent, bg: COLORS.bg, border: COLORS.border },
                { label: "Dias acumulandose", value: Math.round((trunca ? trunca.saldo : 0) * 100) / 100, sub: "del periodo en curso", color: "#7C3AED", bg: COLORS.bg, border: COLORS.border },
                { label: "Dias perdidos", value: Math.round(colab.totalVencidas * 100) / 100, sub: "no recuperables", color: colab.totalVencidas > 0 ? "#DC2626" : COLORS.textoMuted, bg: colab.totalVencidas > 0 ? "#FEF2F2" : COLORS.bg, border: colab.totalVencidas > 0 ? "#FCA5A5" : COLORS.border },
              ].map(({ label, value, sub, color, bg, border }) => (
                <div key={label} style={{ padding: "14px 16px", background: bg, borderRadius: 10, border: "0.5px solid " + border, textAlign: "center" }}>
                  <div style={{ fontSize: 11, color: COLORS.textoMuted, marginBottom: 6 }}>{label}</div>
                  <div style={{ fontSize: 26, fontWeight: 600, color }}>{value}</div>
                  <div style={{ fontSize: 11, color: COLORS.textoMuted, marginTop: 4 }}>{sub}</div>
                </div>
              ))}
            </div>
            {fechaTope && (
              <div style={{ margin: "0 20px 20px", padding: "12px 16px", background: diasHastaTope < 0 ? "#FEF2F2" : diasHastaTope <= 30 ? "#FFF7ED" : "#F0FDF4", borderRadius: 10, border: "0.5px solid " + (diasHastaTope < 0 ? "#FCA5A5" : diasHastaTope <= 30 ? "#FCD34D" : "#86EFAC"), display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <div><div style={{ fontSize: 12, color: COLORS.textoMuted }}>Fecha tope para salir de vacaciones</div><div style={{ fontSize: 16, fontWeight: 600, color: diasHastaTope < 0 ? "#DC2626" : diasHastaTope <= 30 ? "#EA580C" : COLORS.accent, marginTop: 2 }}>{fmtDate(fechaTope)}</div></div>
                <div style={{ textAlign: "right" }}><div style={{ fontSize: 11, color: COLORS.textoMuted }}>{diasHastaTope < 0 ? "Vencio hace" : "Quedan"}</div><div style={{ fontSize: 20, fontWeight: 600, color: diasHastaTope < 0 ? "#DC2626" : diasHastaTope <= 30 ? "#EA580C" : COLORS.accent }}>{Math.abs(diasHastaTope)} dias</div></div>
              </div>
            )}
            <div style={{ margin: "0 20px 20px" }}>
              <div style={{ fontSize: 12, fontWeight: 600, color: COLORS.textoMuted, marginBottom: 10, textTransform: "uppercase", letterSpacing: "0.05em" }}>Tus periodos</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                {colab.periodos
                  .filter((p) => p.tipo !== "INDEMNIZACION")
                  .slice(0, 5).map((p, i) => {
                  const esCubierto = p.tipo === "VENCIDA" && (p.diasVencidosReales === 0 || p.diasCedidosAntiguos > 0);
                  const etiqueta = p.tipo === "TRUNCA" ? "Acumulandose"
                    : p.tipo === "PENDIENTE" ? "Disponible"
                    : esCubierto ? "Gozado"
                    : "Vencido sin gozar";
                  const colorP = p.tipo === "TRUNCA" ? "#7C3AED"
                    : p.tipo === "PENDIENTE" ? COLORS.accent
                    : esCubierto ? COLORS.positivo
                    : "#DC2626";
                  const saldoP = p.tipo === "VENCIDA" ? (p.diasVencidosReales || 0) : p.saldo;
                  return (
                    <div key={i} style={{ display: "flex", alignItems: "center", gap: 12, padding: "8px 12px", background: COLORS.bg, borderRadius: 8, border: "0.5px solid " + COLORS.border }}>
                      <div style={{ width: 8, height: 8, borderRadius: "50%", background: colorP, flexShrink: 0 }} />
                      <div style={{ flex: 1, fontSize: 12, color: COLORS.textoSecundario }}>Ano {p.anio} — {fmtDate(p.inicio)} al {fmtDate(p.fin)}</div>
                      <div style={{ fontSize: 11, color: colorP, fontWeight: 500 }}>{etiqueta}</div>
                      <div style={{ fontSize: 13, fontWeight: 600, color: colorP, minWidth: 40, textAlign: "right" }}>{Math.round(saldoP * 100) / 100}d</div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>

          <div style={{ background: COLORS.surface, borderRadius: 12, border: "0.5px solid " + COLORS.border, padding: 24 }}>
            <div style={{ fontSize: 14, fontWeight: 600, color: COLORS.texto, marginBottom: 4 }}>Comparativo por anos laborales</div>
            <div style={{ fontSize: 12, color: COLORS.textoMuted, marginBottom: 20 }}>Dias disponibles vs dias gozados — todos los periodos</div>
            {datosAnios.length === 0 ? (
              <div style={{ textAlign: "center", padding: 30, color: COLORS.textoMuted }}>Sin periodos historicos</div>
            ) : (
              <>
                <div style={{ display: "flex", flexDirection: "column", gap: 10, maxHeight: 400, overflowY: "auto", paddingRight: 4 }}>
                  {datosAnios.map((d, i) => {
                    const pVerde = maxVal > 0 ? (d.gozadoATiempo / maxVal) * 100 : 0;
                    const pAmarillo = maxVal > 0 ? (d.gozadoDespues / maxVal) * 100 : 0;
                    const pRojo = maxVal > 0 ? (d.gozadoAntes / maxVal) * 100 : 0;
                    const pNaranja = maxVal > 0 ? (d.comprados / maxVal) * 100 : 0;
                    const pBase = maxVal > 0 ? (d.disponibles / maxVal) * 100 : 0;
                    return (
                      <div key={i} style={{ display: "flex", alignItems: "center", gap: 12 }}>
                        <div style={{ width: 52, fontSize: 11, color: COLORS.textoMuted, textAlign: "right", flexShrink: 0 }}>{d.label}</div>
                        <div style={{ flex: 1, position: "relative", height: 28, background: COLORS.bg, borderRadius: 6, overflow: "hidden" }}>
                          {/* Base disponible (gris) */}
                          <div style={{ position: "absolute", left: 0, top: 0, height: "100%", width: pBase + "%", background: "#E5E7EB", borderRadius: 6 }} />
                          {/* Verde: gozado a tiempo */}
                          <div style={{ position: "absolute", left: 0, top: 0, height: "100%", width: pVerde + "%", background: COLORS.accent + "CC", borderRadius: 6 }} />
                          {/* Rojo: gozado antes (absorbió exceso de período más antiguo) */}
                          {pRojo > 0 && <div style={{ position: "absolute", left: pVerde + "%", top: 0, height: "100%", width: pRojo + "%", background: "#DC2626CC" }} />}
                          {/* Amarillo: gozado después (compensó exceso de período más reciente) */}
                          {pAmarillo > 0 && <div style={{ position: "absolute", left: (pVerde + pRojo) + "%", top: 0, height: "100%", width: pAmarillo + "%", background: "#F59E0B" }} />}
                          {/* Azul: comprados */}
                          {pNaranja > 0 && <div style={{ position: "absolute", left: (pVerde + pRojo + pAmarillo) + "%", top: 0, height: "100%", width: pNaranja + "%", background: "#3B82F6CC" }} />}
                        </div>
                        <div style={{ width: 90, fontSize: 11, color: COLORS.textoSecundario, flexShrink: 0 }}>
                          <span style={{ color: COLORS.accent, fontWeight: 500 }}>{d.gozadoATiempo}d</span>
                          {d.gozadoDespues > 0 && <span style={{ color: "#F59E0B", fontWeight: 500 }}> +{d.gozadoDespues}d</span>}
                          {d.gozadoAntes > 0 && <span style={{ color: "#DC2626", fontWeight: 500 }}> +{d.gozadoAntes}d</span>}
                          {d.comprados > 0 && <span style={{ color: "#F97316", fontWeight: 500 }}> +{d.comprados}c</span>}
                          <span style={{ color: COLORS.textoMuted }}> / {d.disponibles}d</span>
                        </div>
                      </div>
                    );
                  })}
                </div>
                <div style={{ display: "flex", gap: 16, marginTop: 16, flexWrap: "wrap" }}>
                  {[
                    { color: COLORS.accent + "CC", label: "Gozado a tiempo" },
                    { color: "#DC2626CC", label: "Gozado antes" },
                    { color: "#F59E0B", label: "Gozado despues" },
                    { color: "#3B82F6CC", label: "Comprados" },
                    { color: "#E5E7EB", label: "Base disponible" },
                  ].map(({ color, label }) => (
                    <div key={label} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 11, color: COLORS.textoMuted }}><div style={{ width: 14, height: 10, borderRadius: 3, background: color }} />{label}</div>
                  ))}
                </div>
                <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(130px, 1fr))", gap: 10, marginTop: 16 }}>
                  {[
                    { label: "Promedio gozado/ano", value: (datosAnios.reduce((s, d) => s + d.totalGozado, 0) / datosAnios.length).toFixed(1) + "d", color: COLORS.accent },
                    { label: "Total gozado", value: datosAnios.reduce((s, d) => s + d.totalGozado, 0) + "d", color: COLORS.texto },
                    { label: "Total comprado", value: datosAnios.reduce((s, d) => s + d.comprados, 0) + "d", color: "#F97316" },
                  ].map(({ label, value, color }) => (
                    <div key={label} style={{ padding: "10px 14px", background: COLORS.bg, borderRadius: 8, border: "0.5px solid " + COLORS.border, textAlign: "center" }}>
                      <div style={{ fontSize: 10, color: COLORS.textoMuted, marginBottom: 4 }}>{label}</div>
                      <div style={{ fontSize: 18, fontWeight: 600, color }}>{value}</div>
                    </div>
                  ))}
                </div>
              </>
            )}
          </div>
        </>
      )}

      {!colab && (
        <div style={{ textAlign: "center", padding: 60, color: COLORS.textoMuted }}>
          <div style={{ fontSize: 48, marginBottom: 16 }}>🪪</div>
          <div style={{ fontSize: 16, fontWeight: 500, color: COLORS.textoSecundario }}>Busca un colaborador para ver su ficha</div>
          <div style={{ fontSize: 13, marginTop: 6 }}>Ingresa nombre, codigo o DNI en el buscador</div>
        </div>
      )}
    </div>
  );
}


// ─── PÁGINA: EXPORTAR MASIVO ──────────────────────────────────────────────────
function PaginaExportarMasivo({ colaboradores, fechaCorteGlobal }) {
  const [archivo, setArchivo] = useState(null);
  const [codigos, setCodigos] = useState([]);
  const [noEncontrados, setNoEncontrados] = useState([]);
  const [procesando, setProcesando] = useState(false);
  const [resultado, setResultado] = useState(null); // { total, encontrados }
  const [generandoPDF, setGenerandoPDF] = useState(false);
  const inputRef = React.useRef();

  const leerArchivo = (file) => {
    if (!file) return;
    setArchivo(file);
    setCodigos([]); setNoEncontrados([]); setResultado(null);
    setProcesando(true);
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const wb = XLSX.read(e.target.result, { type: "array" });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });
        // Buscar columna de código (primera columna no vacía, o columna "código"/"cod")
        const header = rows[0] || [];
        let colIdx = 0;
        const hLower = header.map(h => String(h).toLowerCase().trim());
        const posibles = ["código","codigo","cod","code","id"];
        for (const p of posibles) { const idx = hLower.indexOf(p); if (idx >= 0) { colIdx = idx; break; } }
        // Extraer códigos desde fila 1 (saltar encabezado si parece texto)
        const startRow = isNaN(Number(String(rows[0]?.[colIdx]).trim())) ? 1 : 0;
        const codsLeidos = [];
        for (let i = startRow; i < rows.length; i++) {
          const val = String(rows[i][colIdx]).trim();
          if (val && val !== "") codsLeidos.push(val);
        }
        setCodigos(codsLeidos);
      } catch { setCodigos([]); }
      setProcesando(false);
    };
    reader.readAsArrayBuffer(file);
  };

  const exportar = () => {
    if (!codigos.length) return;
    const mapColab = new Map(colaboradores.map(c => [String(c.cod).trim(), c]));
    const encontrados = [];
    const noEnc = [];
    for (const cod of codigos) {
      const c = mapColab.get(cod);
      if (c) encontrados.push(c); else noEnc.push(cod);
    }
    setNoEncontrados(noEnc);
    setResultado({ total: codigos.length, encontrados: encontrados.length });
    if (!encontrados.length) return;

    const encTP = ["Código","Apellidos y Nombres","Período","Tipo","Inicio","Fin","Gozar hasta","Vence el","Base (días)","Gozado","Comprado","Indemnización","Saldo","Ampliado (días)","Obs"];
    const filas = [];
    for (const c of encontrados) {
      for (const p of [...c.periodos].reverse()) {
        const cfg = TIPO_CONFIG[p.tipo] || TIPO_CONFIG.TRUNCA;
        filas.push({
          "Código": c.cod,
          "Apellidos y Nombres": c.nombres,
          "Período": p.esAjuste ? "P0 – Ajuste" : `Año ${p.anio}`,
          "Tipo": cfg.label,
          "Inicio": p.inicio ? fmtDate(p.inicio) : "—",
          "Fin": p.fin ? fmtDate(p.fin) : "—",
          "Gozar hasta": p.fechaVencimiento ? fmtDate(p.fechaVencimiento) : "—",
          "Vence el": p.fechaVencimiento ? fmtDate(new Date(p.fechaVencimiento.getTime() + 86400000)) : "—",
          "Base (días)": p.diasBase,
          "Gozado": p.diasGozados,
          "Comprado": p.diasComprados || 0,
          "Indemnización": (p.tipo === "INDEMNIZACION" || (p.tipo === "VENCIDA" && p.diasIndemnizacionBruta > 0)) && p.diasIndemnizacionBruta !== null ? p.diasIndemnizacionBruta : "",
          "Saldo": Math.round(p.saldo * 100) / 100,
          "Ampliado (días)": p.diasExtension || 0,
          "Obs": p.obs || "",
        });
      }
    }

    const wb = XLSX.utils.book_new();
    const aoa = [encTP, ...filas.map(f => encTP.map(h => f[h] ?? ""))];
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws["!cols"] = [10,28,10,14,12,12,14,12,10,8,8,12,8,14,20].map(w => ({ wch: w }));
    // Encabezado verde
    encTP.forEach((_, ci) => {
      const addr = XLSX.utils.encode_cell({ r: 0, c: ci });
      if (!ws[addr]) ws[addr] = { v: "", t: "s" };
      ws[addr].s = { font: { bold: true, sz: 11, color: { rgb: "FFFFFF" } }, fill: { fgColor: { rgb: "1A5C2E" } }, alignment: { horizontal: "center" } };
    });
    // Colores por tipo + zebra
    filas.forEach((f, ri) => {
      const r = 1 + ri;
      encTP.forEach((h, ci) => {
        const addr = XLSX.utils.encode_cell({ r, c: ci });
        const val = f[h];
        let fillRgb = ri % 2 === 0 ? "FFFFFF" : "F9FAFB";
        let textRgb = "111827"; let bold = false;
        if (h === "Tipo") {
          if (f["Tipo"] === "Vencida")           { fillRgb = "FEF2F2"; textRgb = "DC2626"; bold = true; }
          else if (f["Tipo"] === "Indemnización") { fillRgb = "FFF7ED"; textRgb = "F97316"; bold = true; }
          else if (f["Tipo"] === "Pendiente")    { fillRgb = "FFFBEB"; textRgb = "D97706"; bold = true; }
          else if (f["Tipo"] === "Trunca")       { fillRgb = "F5F3FF"; textRgb = "7C3AED"; bold = true; }
        }
        if (h === "Saldo" && typeof val === "number" && val > 0) { textRgb = "16A34A"; bold = true; }
        if (h === "Indemnización" && typeof val === "number" && val > 0) { textRgb = "F97316"; bold = true; }
        if (!ws[addr]) ws[addr] = { v: val ?? "", t: typeof val === "number" ? "n" : "s" };
        ws[addr].s = { font: { sz: 11, color: { rgb: textRgb }, bold }, fill: { fgColor: { rgb: fillRgb } }, alignment: { horizontal: typeof val === "number" ? "right" : "left" }, border: { bottom: { style: "thin", color: { rgb: "E5E7EB" } } } };
      });
    });
    ws["!rows"] = [{ hpt: 24 }, ...filas.map(() => ({ hpt: 20 }))];
    XLSX.utils.book_append_sheet(wb, ws, "Períodos");

    // Hoja 2: no encontrados
    if (noEnc.length > 0) {
      const wsNE = XLSX.utils.aoa_to_sheet([["Código no encontrado"], ...noEnc.map(c => [c])]);
      wsNE["!cols"] = [{ wch: 22 }];
      XLSX.utils.book_append_sheet(wb, wsNE, "No encontrados");
    }

    const fecha = new Date().toISOString().slice(0,10).replace(/-/g,"");
    XLSX.writeFile(wb, `Exportar_Masivo_${fecha}.xlsx`);
  };

  // Generar un PDF con la ficha de cada colaborador encontrado (uno por persona, varias páginas si hace falta)
  const exportarFichasPDF = () => {
    if (!codigos.length) return;
    const mapColab = new Map(colaboradores.map(c => [String(c.cod).trim(), c]));
    const encontrados = [];
    const noEnc = [];
    for (const cod of codigos) {
      const c = mapColab.get(cod);
      if (c) encontrados.push(c); else noEnc.push(cod);
    }
    setNoEncontrados(noEnc);
    setResultado({ total: codigos.length, encontrados: encontrados.length });
    if (!encontrados.length) return;
    setGenerandoPDF(true);
    setTimeout(() => {
      try {
        generarFichasPDFMasivo(encontrados, fechaCorteGlobal);
      } catch (e) {
        console.error(e);
        alert("Ocurrió un error generando los PDFs. Intenta con menos colaboradores a la vez.");
      }
      setGenerandoPDF(false);
    }, 50);
  };

  // Generar plantilla de ejemplo
  const descargarPlantilla = () => {
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet([["Código"],["10001"],["10002"],["10003"]]);
    ws["!cols"] = [{ wch: 14 }];
    const addr = "A1"; ws[addr].s = { font: { bold: true, sz: 11, color: { rgb: "FFFFFF" } }, fill: { fgColor: { rgb: "1A5C2E" } }, alignment: { horizontal: "center" } };
    XLSX.utils.book_append_sheet(wb, ws, "Códigos");
    XLSX.writeFile(wb, "Plantilla_Exportar_Masivo.xlsx");
  };

  const cardStyle = { background: COLORS.surface, borderRadius: 12, border: "0.5px solid " + COLORS.border, padding: 24 };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 20, maxWidth: 700 }}>
      <div>
        <div style={{ fontSize: 20, fontWeight: 600, color: COLORS.texto }}>Exportar Masivo</div>
        <div style={{ fontSize: 13, color: COLORS.textoMuted, marginTop: 2 }}>
          Sube un Excel con códigos de colaboradores y descarga el detalle en tabla (Excel) o fichas individuales en PDF
        </div>
      </div>

      {/* Paso 1: subir archivo */}
      <div style={cardStyle}>
        <div style={{ fontSize: 13, fontWeight: 600, color: COLORS.texto, marginBottom: 12, display: "flex", alignItems: "center", gap: 8 }}>
          <span style={{ background: COLORS.accent, color: "#fff", borderRadius: "50%", width: 22, height: 22, display: "inline-flex", alignItems: "center", justifyContent: "center", fontSize: 11, fontWeight: 700, flexShrink: 0 }}>1</span>
          Sube tu Excel con códigos
        </div>
        <div
          onClick={() => inputRef.current?.click()}
          onDragOver={(e) => e.preventDefault()}
          onDrop={(e) => { e.preventDefault(); leerArchivo(e.dataTransfer.files[0]); }}
          style={{
            border: `2px dashed ${archivo ? COLORS.accentLight : COLORS.border}`,
            borderRadius: 10, padding: "28px 20px", textAlign: "center",
            cursor: "pointer", background: archivo ? "#F0FDF4" : COLORS.bg,
            transition: "all 0.2s",
          }}
        >
          <div style={{ fontSize: 32, marginBottom: 8 }}>{archivo ? "✅" : "📂"}</div>
          {archivo
            ? <div style={{ fontSize: 13, fontWeight: 600, color: COLORS.positivo }}>{archivo.name} — {codigos.length} código{codigos.length !== 1 ? "s" : ""} leído{codigos.length !== 1 ? "s" : ""}</div>
            : <>
                <div style={{ fontSize: 13, fontWeight: 500, color: COLORS.textoSecundario }}>Arrastra tu Excel aquí o haz clic para seleccionar</div>
                <div style={{ fontSize: 11, color: COLORS.textoMuted, marginTop: 4 }}>El archivo debe tener una columna con los códigos de los colaboradores</div>
              </>}
          <input ref={inputRef} type="file" accept=".xlsx,.xls" style={{ display: "none" }}
            onChange={(e) => leerArchivo(e.target.files[0])} />
        </div>
        <div style={{ display: "flex", gap: 8, marginTop: 10, alignItems: "center", flexWrap: "wrap" }}>
          <button onClick={descargarPlantilla} style={{
            background: "transparent", border: "0.5px solid " + COLORS.border,
            color: COLORS.textoMuted, borderRadius: 8, padding: "6px 14px",
            cursor: "pointer", fontSize: 12,
          }}>⬇ Descargar plantilla de ejemplo</button>
          {archivo && <button onClick={() => { setArchivo(null); setCodigos([]); setNoEncontrados([]); setResultado(null); }} style={{
            background: "transparent", border: "0.5px solid " + COLORS.border,
            color: COLORS.textoMuted, borderRadius: 8, padding: "6px 14px",
            cursor: "pointer", fontSize: 12,
          }}>✕ Limpiar</button>}
        </div>
      </div>

      {/* Paso 2: previsualizar y exportar */}
      {codigos.length > 0 && (
        <div style={cardStyle}>
          <div style={{ fontSize: 13, fontWeight: 600, color: COLORS.texto, marginBottom: 14, display: "flex", alignItems: "center", gap: 8 }}>
            <span style={{ background: COLORS.accent, color: "#fff", borderRadius: "50%", width: 22, height: 22, display: "inline-flex", alignItems: "center", justifyContent: "center", fontSize: 11, fontWeight: 700, flexShrink: 0 }}>2</span>
            Códigos detectados — {codigos.length} en total
          </div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6, maxHeight: 160, overflowY: "auto", marginBottom: 16 }}>
            {codigos.map((cod, i) => {
              const existe = colaboradores.some(c => String(c.cod).trim() === cod);
              return (
                <span key={i} style={{
                  fontSize: 12, padding: "3px 10px", borderRadius: 6, fontWeight: 500,
                  background: existe ? "#F0FDF4" : "#FEF2F2",
                  color: existe ? COLORS.positivo : "#DC2626",
                  border: `1px solid ${existe ? "#86EFAC" : "#FCA5A5"}`,
                }}>{cod}</span>
              );
            })}
          </div>
          <div style={{ display: "flex", gap: 12, alignItems: "center", flexWrap: "wrap" }}>
            <button onClick={exportar} style={{
              background: COLORS.accent, color: "#fff", border: "none",
              borderRadius: 10, padding: "11px 24px", cursor: "pointer",
              fontSize: 13, fontWeight: 700, display: "flex", alignItems: "center", gap: 8,
            }}>⬇ Exportar Excel masivo</button>
            <button onClick={exportarFichasPDF} disabled={generandoPDF} style={{
              background: "#fff", color: COLORS.accent, border: "1.5px solid " + COLORS.accent,
              borderRadius: 10, padding: "11px 24px", cursor: generandoPDF ? "wait" : "pointer",
              fontSize: 13, fontWeight: 700, display: "flex", alignItems: "center", gap: 8,
            }}>{generandoPDF ? "⏳ Generando PDFs..." : "📄 Exportar fichas en PDF (1 por persona)"}</button>
            <div style={{ fontSize: 12, color: COLORS.textoMuted }}>
              {colaboradores.filter(c => codigos.includes(String(c.cod).trim())).length} colaboradores encontrados en base de datos
            </div>
          </div>
        </div>
      )}

      {/* Resultado */}
      {resultado && (
        <div style={{ ...cardStyle, background: resultado.encontrados > 0 ? "#F0FDF4" : "#FEF2F2", border: `1px solid ${resultado.encontrados > 0 ? "#86EFAC" : "#FCA5A5"}` }}>
          <div style={{ fontSize: 14, fontWeight: 600, color: resultado.encontrados > 0 ? COLORS.positivo : "#DC2626", marginBottom: 8 }}>
            {resultado.encontrados > 0 ? "✅ Excel generado correctamente" : "⚠️ No se encontró ningún código"}
          </div>
          <div style={{ fontSize: 12, color: COLORS.textoSecundario }}>
            {resultado.encontrados} de {resultado.total} colaboradores encontrados y exportados.
            {noEncontrados.length > 0 && ` El Excel incluye una hoja "No encontrados" con los ${noEncontrados.length} códigos sin match.`}
          </div>
          {noEncontrados.length > 0 && (
            <div style={{ marginTop: 10, display: "flex", flexWrap: "wrap", gap: 6 }}>
              {noEncontrados.map((c, i) => (
                <span key={i} style={{ fontSize: 12, padding: "3px 10px", borderRadius: 6, fontWeight: 500, background: "#FEF2F2", color: "#DC2626", border: "1px solid #FCA5A5" }}>{c}</span>
              ))}
            </div>
          )}
        </div>
      )}

      {/* Info de columnas */}
      <div style={{ ...cardStyle, background: COLORS.bg }}>
        <div style={{ fontSize: 12, fontWeight: 600, color: COLORS.textoMuted, marginBottom: 8 }}>📋 Columnas del Excel exportado</div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
          {["Código","Apellidos y Nombres","Período","Tipo","Inicio","Fin","Gozar hasta","Vence el","Base (días)","Gozado","Comprado","Indemnización","Saldo","Ampliado (días)","Obs"].map(col => (
            <span key={col} style={{ fontSize: 11, padding: "3px 8px", background: COLORS.surfaceHigh, borderRadius: 5, color: COLORS.textoSecundario, border: "0.5px solid " + COLORS.border }}>{col}</span>
          ))}
        </div>
      </div>
    </div>
  );
}


  // ── FIREBASE SOLICITUDES ─────────────────────────────────────────────────
  // Estados posibles:
  //   SIN_PDF      → solicitud creada, falta adjuntar el documento firmado
  //   CON_PDF      → BP adjuntó el PDF, admin puede revisar
  //   APROBADA     → admin aprobó
  //   RECHAZADA    → admin rechazó (con comentario)

  function useSolicitudes(bpUsuario, bpAdmin) {
    const [solicitudes, setSolicitudes] = React.useState([]);
    const [cargando, setCargando] = React.useState(true);

    React.useEffect(() => {
      const checkFirebase = setInterval(() => {
        if (window._firebase?.db) {
          clearInterval(checkFirebase);
          const { db, collection, onSnapshot, query, orderBy, where } = window._firebase;
          let q;
          if (bpAdmin) {
            q = query(collection(db, "solicitudes"), orderBy("fechaCreacion", "desc"));
          } else {
            q = query(collection(db, "solicitudes"), where("bpUsuario", "==", bpUsuario), orderBy("fechaCreacion", "desc"));
          }
          const unsub = onSnapshot(q, (snap) => {
            const todas = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            // BPs no ven las solicitudes que ellos mismos eliminaron (ocultaParaBP)
            const visibles = bpAdmin ? todas : todas.filter(s => !s.ocultaParaBP);
            setSolicitudes(visibles);
            setCargando(false);
          }, (err) => { console.error("Firebase error:", err); setCargando(false); });
          return () => unsub();
        }
      }, 500);
      return () => clearInterval(checkFirebase);
    }, [bpUsuario, bpAdmin]);

    return { solicitudes, cargando };
  }

  async function waitForFirebase() {
    return new Promise((resolve) => {
      const iv = setInterval(() => {
        if (window._firebase?.db) { clearInterval(iv); resolve(window._firebase); }
      }, 200);
    });
  }

  async function enviarSolicitud(datos) {
    const fb = await waitForFirebase();
    const { db, collection, addDoc } = fb;
    return addDoc(collection(db, "solicitudes"), {
      ...datos,
      fechaCreacion: new Date().toISOString(),
      estado: "SIN_PDF",
      pdfBase64: null,
      pdfNombre: null,
      comentarioAdmin: "",
    });
  }

  async function adjuntarPDF(id, pdfBase64, pdfNombre) {
    const fb = window._firebase;
    if (!fb) return;
    const { db, doc, updateDoc } = fb;
    return updateDoc(doc(db, "solicitudes", id), {
      pdfBase64,
      pdfNombre,
      estado: "CON_PDF",
      fechaPDF: new Date().toISOString(),
    });
  }

  async function actualizarEstadoSolicitud(id, estado, comentarioAdmin = "") {
    const fb = window._firebase;
    if (!fb) return;
    const { db, doc, updateDoc } = fb;
    return updateDoc(doc(db, "solicitudes", id), {
      estado,
      comentarioAdmin,
      fechaActualizacion: new Date().toISOString(),
    });
  }

  async function cancelarSolicitud(id, canceladoPor) {
    const fb = window._firebase;
    if (!fb) return;
    const { db, doc, updateDoc } = fb;
    return updateDoc(doc(db, "solicitudes", id), {
      estado: "CANCELADA",
      canceladoPor,
      fechaCancelacion: new Date().toISOString(),
    });
  }

  async function eliminarSolicitud(id) {
    const fb = window._firebase;
    if (!fb) return;
    const { db, doc } = fb;
    return fb.deleteDoc(doc(db, "solicitudes", id));
  }

  // BP "elimina" su solicitud — en realidad la marca como ELIMINADA_BP
  // El BP deja de verla, pero el admin la sigue viendo en su historial
  async function eliminarSolicitudBP(id) {
    const fb = window._firebase;
    if (!fb) return;
    const { db, doc, updateDoc } = fb;
    return updateDoc(doc(db, "solicitudes", id), {
      estado: "ELIMINADA_BP",
      ocultaParaBP: true,
      fechaEliminacionBP: new Date().toISOString(),
    });
  }

  // Libera el espacio del PDF (pesado) sin borrar el registro de la solicitud: fechas, estado, comentario, etc. se conservan.
  async function liberarPDF(id) {
    const fb = window._firebase;
    if (!fb) return;
    const { db, doc, updateDoc } = fb;
    return updateDoc(doc(db, "solicitudes", id), {
      pdfBase64: null,
      pdfNombre: null,
      pdfLiberadoEn: new Date().toISOString(),
    });
  }

  // Colores y etiquetas por estado
  const ESTADO_META = {
    SIN_PDF:        { label: "⏳ Sin PDF",           color: "#D97706", bg: "rgba(217,119,6,0.1)",    border: "rgba(217,119,6,0.3)" },
    CON_PDF:        { label: "📎 PDF adjunto",       color: "#2563EB", bg: "rgba(37,99,235,0.08)",   border: "rgba(37,99,235,0.25)" },
    APROBADA:       { label: "✅ Aprobada",          color: "#16A34A", bg: "rgba(22,163,74,0.08)",   border: "rgba(22,163,74,0.25)" },
    RECHAZADA:      { label: "❌ Rechazada",         color: "#DC2626", bg: "rgba(220,38,38,0.08)",   border: "rgba(220,38,38,0.25)" },
    CANCELADA:      { label: "🚫 Cancelada",         color: "#6b7280", bg: "rgba(107,114,128,0.08)", border: "rgba(107,114,128,0.25)" },
    ELIMINADA_BP:   { label: "🗑 Eliminada por BP",  color: "#9ca3af", bg: "rgba(156,163,175,0.08)", border: "rgba(156,163,175,0.25)" },
    PENDIENTE:      { label: "⏳ Pendiente",         color: "#D97706", bg: "rgba(217,119,6,0.1)",    border: "rgba(217,119,6,0.3)" },
  };

  function BadgeEstado({ estado }) {
    const m = ESTADO_META[estado] || ESTADO_META["SIN_PDF"];
    return (
      <span style={{
        fontSize: 11, fontWeight: 700, padding: "4px 12px", borderRadius: 20,
        background: m.bg, color: m.color, border: `1px solid ${m.border}`,
        whiteSpace: "nowrap",
      }}>{m.label}</span>
    );
  }

  // Modal de rechazo con comentario
  function ModalRechazo({ onConfirmar, onCancelar }) {
    const [comentario, setComentario] = React.useState("");
    return (
      <div style={{
        position: "fixed", inset: 0, zIndex: 9000,
        background: "rgba(0,0,0,0.45)", display: "flex", alignItems: "center", justifyContent: "center", padding: 20,
      }}>
        <div style={{ background: "#fff", borderRadius: 16, padding: 28, width: "100%", maxWidth: 440, boxShadow: "0 20px 60px rgba(0,0,0,0.2)" }}>
          <div style={{ fontSize: 16, fontWeight: 800, marginBottom: 6, color: "#DC2626" }}>❌ Rechazar solicitud</div>
          <div style={{ fontSize: 13, color: "#6b7280", marginBottom: 16 }}>Escribe el motivo del rechazo. El BP lo verá en su historial.</div>
          <textarea
            autoFocus
            rows={3}
            placeholder="Ej: Faltan días disponibles en el período / Fechas no autorizadas..."
            value={comentario}
            onChange={e => setComentario(e.target.value)}
            style={{ width: "100%", padding: "10px 14px", border: "1px solid #e5e7eb", borderRadius: 8, fontSize: 13, fontFamily: "inherit", resize: "vertical", outline: "none", boxSizing: "border-box" }}
          />
          <div style={{ display: "flex", gap: 10, justifyContent: "flex-end", marginTop: 16 }}>
            <button onClick={onCancelar} style={{ padding: "9px 18px", borderRadius: 8, border: "1px solid #e5e7eb", background: "transparent", cursor: "pointer", fontSize: 13 }}>Cancelar</button>
            <button
              onClick={() => onConfirmar(comentario)}
              disabled={!comentario.trim()}
              style={{ padding: "9px 20px", borderRadius: 8, border: "none", background: comentario.trim() ? "#DC2626" : "#e5e7eb", color: comentario.trim() ? "#fff" : "#9ca3af", fontWeight: 700, cursor: comentario.trim() ? "pointer" : "not-allowed", fontSize: 13 }}
            >Confirmar rechazo</button>
          </div>
        </div>
      </div>
    );
  }

  // Visor de PDF en modal
  function ModalPDF({ pdfBase64, pdfNombre, onCerrar }) {
    const dataUrl = `data:application/pdf;base64,${pdfBase64}`;
    return (
      <div style={{
        position: "fixed", inset: 0, zIndex: 9000,
        background: "rgba(0,0,0,0.7)", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 20,
      }}>
        <div style={{ background: "#1f2937", borderRadius: 12, width: "100%", maxWidth: 860, maxHeight: "90vh", display: "flex", flexDirection: "column", overflow: "hidden" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "12px 20px", borderBottom: "1px solid #374151" }}>
            <div style={{ fontSize: 13, fontWeight: 600, color: "#f9fafb" }}>📄 {pdfNombre || "Documento firmado"}</div>
            <div style={{ display: "flex", gap: 10 }}>
              <a href={dataUrl} download={pdfNombre || "documento.pdf"} style={{ fontSize: 12, color: "#60a5fa", textDecoration: "none", fontWeight: 600 }}>⬇ Descargar</a>
              <button onClick={onCerrar} style={{ background: "rgba(255,255,255,0.1)", border: "none", color: "#f9fafb", borderRadius: 6, padding: "4px 12px", cursor: "pointer", fontSize: 13 }}>✕ Cerrar</button>
            </div>
          </div>
          <iframe src={dataUrl} style={{ flex: 1, border: "none", minHeight: 500 }} title="PDF" />
        </div>
      </div>
    );
  }

  // Modal de detalle: se abre desde la tabla al hacer clic en "Ver" — muestra PDF embebido + comentario + liberar PDF
  function ModalDetalleSolicitud({ s, bpAdmin, onCerrar }) {
    const [accionando, setAccionando] = React.useState(false);

    const handleLiberarPDF = async () => {
      if (!confirm(`¿Eliminar el PDF de esta solicitud (${s.colaboradorNombre})?\n\nEl registro de la solicitud (fechas, estado, comentario) se mantiene. Solo se borra el documento adjunto para liberar espacio.\n\nEsta acción no se puede deshacer.`)) return;
      setAccionando(true);
      await liberarPDF(s.id);
      setAccionando(false);
      onCerrar();
    };

    return (
      <div style={{
        position: "fixed", inset: 0, zIndex: 9000,
        background: "rgba(0,0,0,0.55)", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 20,
      }}>
        <div style={{ background: "#fff", borderRadius: 14, width: "100%", maxWidth: 760, maxHeight: "90vh", display: "flex", flexDirection: "column", overflow: "hidden" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", padding: "16px 20px", borderBottom: "1px solid #e5e7eb" }}>
            <div>
              <div style={{ fontSize: 14, fontWeight: 700 }}>{s.colaboradorNombre} {s.colaboradorCod ? <span style={{ fontWeight: 400, color: "#9ca3af", fontSize: 12 }}>· {s.colaboradorCod}</span> : ""}</div>
              <div style={{ fontSize: 12, color: "#6b7280", marginTop: 2 }}>{s.tipo} · {s.fechaInicio} → {s.fechaFin}{s.dias ? ` · ${s.dias} días` : ""}</div>
              {bpAdmin && <div style={{ fontSize: 11, color: "#9ca3af", marginTop: 2 }}>BP: <strong>{s.bpNombre}</strong> · {s.bpGerencia}</div>}
            </div>
            <button onClick={onCerrar} style={{ background: "rgba(0,0,0,0.05)", border: "none", borderRadius: 6, padding: "4px 12px", cursor: "pointer", fontSize: 13 }}>✕</button>
          </div>

          <div style={{ padding: "16px 20px", overflowY: "auto", flex: 1 }}>
            {s.comentarioAdmin && (
              <div style={{ background: s.estado === "RECHAZADA" ? "rgba(220,38,38,0.05)" : "rgba(22,163,74,0.05)", border: `1px solid ${s.estado === "RECHAZADA" ? "rgba(220,38,38,0.2)" : "rgba(22,163,74,0.2)"}`, borderRadius: 8, padding: "10px 14px", marginBottom: 14 }}>
                <div style={{ fontSize: 11, fontWeight: 700, color: s.estado === "RECHAZADA" ? "#DC2626" : "#16A34A", marginBottom: 2 }}>
                  {s.estado === "RECHAZADA" ? "💬 Motivo de rechazo:" : "💬 Comentario:"}
                </div>
                <div style={{ fontSize: 13, color: "#374151" }}>{s.comentarioAdmin}</div>
              </div>
            )}

            {s.pdfBase64 ? (
              <iframe src={`data:application/pdf;base64,${s.pdfBase64}`} style={{ width: "100%", height: 480, border: "1px solid #e5e7eb", borderRadius: 8 }} title="PDF" />
            ) : s.pdfLiberadoEn ? (
              <div style={{ textAlign: "center", padding: 40, color: "#9ca3af", fontSize: 13, fontStyle: "italic" }}>
                🗑 PDF liberado el {new Date(s.pdfLiberadoEn).toLocaleString("es-PE")} (registro conservado)
              </div>
            ) : (
              <div style={{ textAlign: "center", padding: 40, color: "#9ca3af", fontSize: 13 }}>Aún no se ha adjuntado el documento.</div>
            )}
          </div>

          {bpAdmin && s.pdfBase64 && (
            <div style={{ padding: "12px 20px", borderTop: "1px solid #e5e7eb", display: "flex", justifyContent: "flex-end", gap: 10 }}>
              <a href={`data:application/pdf;base64,${s.pdfBase64}`} download={s.pdfNombre || "documento.pdf"} style={{ fontSize: 12, color: "#2563EB", textDecoration: "none", fontWeight: 600, alignSelf: "center" }}>⬇ Descargar</a>
              <button onClick={handleLiberarPDF} disabled={accionando} title="Elimina solo el PDF para liberar espacio. El registro de la solicitud se mantiene." style={{
                background: "transparent", border: "1px solid rgba(220,38,38,0.25)", color: "#DC2626",
                borderRadius: 7, padding: "6px 14px", fontSize: 12, cursor: accionando ? "wait" : "pointer",
              }}>🗑 Liberar PDF</button>
            </div>
          )}
        </div>
      </div>
    );
  }

  // Fila de tabla — misma lógica que TarjetaSolicitud, formato compacto en una línea por solicitud
  function FilaSolicitud({ s, bpAdmin, bpUsuario, bpNombre, onVerDetalle, mobileAdjuntarOnly = false, mobileAprobacionOnly = false }) {
    const [subiendoPDF, setSubiendoPDF] = React.useState(false);
    const [modalRechazo, setModalRechazo] = React.useState(false);
    const [accionando, setAccionando] = React.useState(false);
    const inputPDFRef = React.useRef(null);

    const esMia = s.bpUsuario === bpUsuario;

    const handlePDF = async (file) => {
      if (!file || file.type !== "application/pdf") { alert("Solo se aceptan archivos PDF."); return; }
      if (file.size > 4 * 1024 * 1024) { alert("El PDF no debe superar 4 MB."); return; }
      setSubiendoPDF(true);
      try {
        const base64 = await new Promise((res, rej) => {
          const r = new FileReader();
          r.onload = () => res(r.result.split(",")[1]);
          r.onerror = rej;
          r.readAsDataURL(file);
        });
        await adjuntarPDF(s.id, base64, file.name);
      } catch(e) { console.error(e); alert("Error al subir el PDF. Intenta de nuevo."); }
      setSubiendoPDF(false);
    };

    const handleAprobar = async () => {
      setAccionando(true);
      await actualizarEstadoSolicitud(s.id, "APROBADA", "");
      setAccionando(false);
    };

    const handleDesaprobar = async () => {
      if (!confirm("¿Desaprobar la solicitud de " + s.colaboradorNombre + "?\n\nVolverá al estado \"PDF adjunto\" y sus días regresarán al saldo del colaborador.")) return;
      setAccionando(true);
      await actualizarEstadoSolicitud(s.id, "CON_PDF", "");
      setAccionando(false);
    };

    const handleRechazar = async (comentario) => {
      setAccionando(true);
      await actualizarEstadoSolicitud(s.id, "RECHAZADA", comentario);
      setModalRechazo(false);
      setAccionando(false);
    };

    const tdStyle = { padding: "10px 12px", fontSize: 12, color: "#374151", borderBottom: "1px solid #f1f5f9", whiteSpace: "nowrap" };

    return (
      <>
        {modalRechazo && <ModalRechazo onConfirmar={handleRechazar} onCancelar={() => setModalRechazo(false)} />}
        <tr style={{ opacity: accionando ? 0.5 : 1, transition: "opacity 0.2s" }}
          onMouseEnter={(e) => e.currentTarget.style.background = "#F9FAFB"}
          onMouseLeave={(e) => e.currentTarget.style.background = "transparent"}
        >
          <td style={tdStyle}>{s.colaboradorCod || "—"}</td>
          <td style={{ ...tdStyle, fontWeight: 600, color: "#111827", whiteSpace: "normal", maxWidth: 200 }}>{s.colaboradorNombre}</td>
          <td style={tdStyle}>{s.tipo}</td>
          <td style={tdStyle}>{s.fechaInicio}</td>
          <td style={tdStyle}>{s.fechaFin}</td>
          <td style={{ ...tdStyle, textAlign: "center" }}>{s.dias || "—"}</td>
          <td style={tdStyle}>{
            s.tipo === "COMPRA" || s.tipo === "CONVENIO" ? "—"
              : s.adelantoRemun === true ? <span style={{ color: "#16A34A", fontWeight: 600 }}>Sí</span>
              : s.adelantoRemun === false ? <span style={{ color: "#6b7280" }}>No</span>
              : "—"
          }</td>
          {bpAdmin && <td style={tdStyle}>
            <div>{s.creadoPorNombre || s.bpNombre}</div>
            {s.creadoPorNombre && s.bpNombre && s.creadoPorNombre !== s.bpNombre && (
              <div style={{ fontSize: 10, color: "#9ca3af", marginTop: 1 }}>BP: {s.bpNombre}</div>
            )}
          </td>}
          {bpAdmin && <td style={{ ...tdStyle, whiteSpace: "normal", maxWidth: 150 }}>{s.bpGerencia}</td>}
          {bpAdmin && <td style={{ ...tdStyle, whiteSpace: "normal", maxWidth: 150 }}>{s.colaboradorUnidadOrg || "—"}</td>}
          <td style={tdStyle}><BadgeEstado estado={s.estado} /></td>
          <td style={{ ...tdStyle, color: "#9ca3af" }}>{new Date(s.fechaCreacion).toLocaleDateString("es-PE")}</td>
          <td style={{ ...tdStyle, whiteSpace: "normal", maxWidth: 180, fontStyle: "italic", color: "#6b7280" }}>{s.comentarioAdmin || "—"}</td>
          <td style={{ padding: "10px 12px", borderBottom: "1px solid #f1f5f9" }}>
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center" }}>
              <button onClick={onVerDetalle} title="Ver detalle" style={{
                background: "transparent", border: "1px solid #e5e7eb", color: "#374151",
                borderRadius: 6, padding: "4px 9px", fontSize: 11, cursor: "pointer",
              }}>👁</button>

              {/* BP: adjuntar/reemplazar PDF */}
              {!bpAdmin && esMia && (s.estado === "SIN_PDF" || s.estado === "RECHAZADA" || s.estado === "CON_PDF") && (
                <>
                  <input ref={inputPDFRef} type="file" accept="application/pdf" style={{ display: "none" }}
                    onChange={e => { if (e.target.files[0]) handlePDF(e.target.files[0]); e.target.value = ""; }} />
                  <button
                    onClick={() => inputPDFRef.current?.click()}
                    disabled={subiendoPDF}
                    style={{ background: s.estado === "CON_PDF" ? "transparent" : "#0d5c2a", color: s.estado === "CON_PDF" ? "#6b7280" : "#fff", border: s.estado === "CON_PDF" ? "1px solid #e5e7eb" : "none", borderRadius: 6, padding: "4px 10px", fontSize: 11, fontWeight: 600, cursor: subiendoPDF ? "wait" : "pointer", whiteSpace: "nowrap" }}
                  >{subiendoPDF ? "⏳" : s.estado === "CON_PDF" ? "🔄 Reemplazar" : "📎 Adjuntar PDF"}</button>
                </>
              )}

              {/* BP: cancelar (solo Sin PDF o Con PDF) */}
              {!bpAdmin && esMia && (s.estado === "SIN_PDF" || s.estado === "CON_PDF") && (
                <button onClick={async () => {
                  if (!confirm(`¿Cancelar esta solicitud de ${s.colaboradorNombre}?\n\nQuedará registrada como cancelada en el historial.`)) return;
                  setAccionando(true);
                  await cancelarSolicitud(s.id, "BP");
                  setAccionando(false);
                }} disabled={accionando} title="Cancelar solicitud" style={{
                  background: "transparent", border: "1px solid rgba(107,114,128,0.35)", color: "#6b7280",
                  borderRadius: 6, padding: "4px 10px", fontSize: 11, fontWeight: 600, cursor: accionando ? "wait" : "pointer",
                }}>🚫 Cancelar</button>
              )}

              {/* Admin: aprobar / rechazar en cualquier estado activo (no terminal) */}
              {/* Admin: desaprobar una solicitud ya aprobada (revierte el goce del sistema) */}
              {bpAdmin && s.estado === "APROBADA" && (
                <button onClick={handleDesaprobar} disabled={accionando} title="Desaprobar — devuelve los días al saldo" style={{
                  background: "#FFFBEB", border: "1px solid #FCD34D", color: "#B45309",
                  borderRadius: 6, padding: "4px 10px", fontSize: 11, fontWeight: 600,
                  cursor: accionando ? "wait" : "pointer",
                }}>↩ Desaprobar</button>
              )}

              {bpAdmin && !["APROBADA", "CANCELADA"].includes(s.estado) && (
                <>
                  <button onClick={handleAprobar} disabled={accionando} title="Aprobar" style={{ background: "#16A34A", color: "#fff", border: "none", borderRadius: 6, padding: "4px 10px", fontSize: 11, fontWeight: 700, cursor: accionando ? "wait" : "pointer" }}>✅</button>
                  <button onClick={() => setModalRechazo(true)} disabled={accionando} title="Rechazar" style={{ background: "rgba(220,38,38,0.08)", color: "#DC2626", border: "1px solid rgba(220,38,38,0.3)", borderRadius: 6, padding: "4px 10px", fontSize: 11, fontWeight: 700, cursor: accionando ? "wait" : "pointer" }}>❌</button>
                </>
              )}

              {/* BP: eliminar su solicitud (desaparece de su vista, admin la sigue viendo) */}
              {!bpAdmin && esMia && (s.estado === "SIN_PDF" || s.estado === "CON_PDF") && (
                <button onClick={async () => {
                  if (!confirm(`¿Eliminar esta solicitud de ${s.colaboradorNombre}?\n\nDesaparecerá de tu lista.`)) return;
                  setAccionando(true);
                  await eliminarSolicitudBP(s.id);
                  setAccionando(false);
                }} disabled={accionando} title="Eliminar solicitud" style={{
                  background: "transparent", border: "1px solid rgba(107,114,128,0.3)", color: "#9ca3af",
                  borderRadius: 6, padding: "4px 8px", fontSize: 11, cursor: accionando ? "wait" : "pointer",
                }}>🗑</button>
              )}

              {/* Admin: eliminar solicitudes propias (las que él generó — aparece como BP) */}
              {bpAdmin && (s.bpUsuario === "admin" || s.creadoPorAdmin === true || (s.bpNombre && bpNombre && s.bpNombre.toLowerCase().includes(bpNombre.split(" ")[0].toLowerCase()))) && (
                <button onClick={async () => {
                  if (!confirm(`¿Eliminar definitivamente esta solicitud de ${s.colaboradorNombre}?\n\nEsta acción no se puede deshacer y no quedará registro.`)) return;
                  setAccionando(true);
                  await eliminarSolicitud(s.id);
                  setAccionando(false);
                }} disabled={accionando} title="Eliminar solicitud" style={{
                  background: "transparent", border: "1px solid rgba(220,38,38,0.3)", color: "#DC2626",
                  borderRadius: 6, padding: "4px 8px", fontSize: 11, cursor: accionando ? "wait" : "pointer",
                }}>🗑</button>
              )}

              {/* Admin: cancelar (cualquier estado no terminal, incluyendo Aprobada) */}
              {bpAdmin && !["CANCELADA", "RECHAZADA", "ELIMINADA_BP"].includes(s.estado) && (
                <button onClick={async () => {
                  if (!confirm(`¿Cancelar la solicitud de ${s.colaboradorNombre}?\n\nQuedará registrada como cancelada en el historial.`)) return;
                  setAccionando(true);
                  await cancelarSolicitud(s.id, "ADMIN");
                  setAccionando(false);
                }} disabled={accionando} title="Cancelar solicitud" style={{
                  background: "transparent", border: "1px solid rgba(107,114,128,0.35)", color: "#6b7280",
                  borderRadius: 6, padding: "4px 10px", fontSize: 11, fontWeight: 600, cursor: accionando ? "wait" : "pointer",
                }}>🚫</button>
              )}

              {/* Admin: eliminar definitivamente Canceladas o Eliminadas por BP */}
              {bpAdmin && ["CANCELADA", "ELIMINADA_BP"].includes((s.estado || "").trim().toUpperCase()) && (
                <button onClick={async () => {
                  if (!confirm(`¿Eliminar definitivamente esta solicitud de ${s.colaboradorNombre}?\n\nEsta acción no se puede deshacer.`)) return;
                  setAccionando(true);
                  await eliminarSolicitud(s.id);
                  setAccionando(false);
                }} disabled={accionando} title="Eliminar definitivamente" style={{
                  background: "transparent", border: "1px solid rgba(220,38,38,0.3)", color: "#DC2626",
                  borderRadius: 6, padding: "4px 8px", fontSize: 11, cursor: accionando ? "wait" : "pointer",
                }}>🗑</button>
              )}
            </div>
          </td>
        </tr>
      </>
    );
  }

  function PanelSolicitudesFirebase({ bpUsuario, bpNombre, bpAdmin, bpGerencias }) {

    const { solicitudes, cargando } = useSolicitudes(bpUsuario, bpAdmin);
    const [filtroEstado, setFiltroEstado] = React.useState("TODOS");
    const [tabTipo, setTabTipo] = React.useState("TODAS");
    const [verDetalleId, setVerDetalleId] = React.useState(null);
    const isMobile = useIsMobile();

    // Filtrar por tipo de solicitud
    const solicitudesPorTipo = tabTipo === "TODAS" ? solicitudes
      : tabTipo === "CANCELADAS" ? solicitudes.filter(s => s.estado === "CANCELADA")
      : tabTipo === "COMPRAS" ? solicitudes.filter(s => s.tipo === "COMPRA" && s.estado !== "CANCELADA")
      : tabTipo === "CONVENIOS" ? solicitudes.filter(s => s.tipo === "CONVENIO" && s.estado !== "CANCELADA")
      : solicitudes.filter(s => s.estado !== "CANCELADA" && (s.tipoPeriodo === tabTipo || (tabTipo === "PENDIENTE" && !s.tipoPeriodo && s.tipo !== "COMPRA" && s.tipo !== "CONVENIO")));

    // Filtrar solicitudes por estado
    const solicitudesFiltradas = filtroEstado === "TODOS"
      ? solicitudesPorTipo
      : solicitudesPorTipo.filter(s => s.estado === filtroEstado);

    // Contadores por estado
    const contadores = solicitudes.reduce((acc, s) => {
      acc[s.estado] = (acc[s.estado] || 0) + 1;
      return acc;
    }, {});

    const exportarExcel = () => {
      const data = solicitudesFiltradas;
      let filas;
      if (tabTipo === "COMPRAS") {
        filas = data.map(s => ({
          "Fecha solicitud": new Date(s.fechaCreacion).toLocaleString("es-PE"),
          "Colaborador": s.colaboradorNombre, "Código": s.colaboradorCod || "", "DNI": s.colaboradorDni || "",
          "Gerencia": s.bpGerencia, "Período": s.periodo || "",
          "Días a comprar": s.dias || "", "Dirección": s.direccion || "",
          "Estado": s.estado, "Aprobado por": s.aprobadoPor || "",
        }));
      } else if (tabTipo === "CONVENIOS") {
        filas = data.map(s => ({
          "Fecha solicitud": new Date(s.fechaCreacion).toLocaleString("es-PE"),
          "Colaborador": s.colaboradorNombre, "Código": s.colaboradorCod || "", "DNI": s.colaboradorDni || "",
          "Gerencia": s.bpGerencia, "Período": s.periodo || "",
          "Días a acumular": s.dias || "",
          "Estado": s.estado, "Aprobado por": s.aprobadoPor || "",
        }));
      } else {
        filas = data.map(s => ({
          "Fecha solicitud": new Date(s.fechaCreacion).toLocaleString("es-PE"),
          "Colaborador": s.colaboradorNombre, "Código": s.colaboradorCod || "", "DNI": s.colaboradorDni || "",
          "Gerencia": s.bpGerencia, "Período": s.periodo || "",
          "Tipo": s.tipoPeriodo || s.tipo || "",
          "Unidad Org.": s.colaboradorUnidadOrg || "",
          "Adelanto Rem. Vac.": (s.tipo === "COMPRA" || s.tipo === "CONVENIO") ? "" : (s.adelantoRemun === true ? "Sí" : s.adelantoRemun === false ? "No" : ""),
          "Creada por": s.creadoPorNombre || s.bpNombre || "",
          "Días solicitados": s.dias || "", "Fecha inicio": s.fechaInicio || "", "Fecha fin": s.fechaFin || "",
          "Estado": s.estado, "Aprobado por": s.aprobadoPor || "",
        }));
      }
      const ws = XLSX.utils.json_to_sheet(filas);
      const wb = XLSX.utils.book_new();
      const tabLabel = tabTipo === "TODAS" ? "Todas" : tabTipo === "COMPRAS" ? "Compras" : tabTipo === "CONVENIOS" ? "Convenios" : tabTipo;
      XLSX.utils.book_append_sheet(wb, ws, tabLabel);
      XLSX.writeFile(wb, "Solicitudes_" + tabLabel + ".xlsx");
    };

    return (
      <div style={{ padding: "24px 28px" }}>

        {/* Header */}
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 20, flexWrap: "wrap", gap: 12 }}>
          <div>
            <div style={{ fontSize: 20, fontWeight: 800 }}>📋 Solicitudes Vacacionales</div>
            <div style={{ fontSize: 13, color: "#6b7280", marginTop: 4 }}>
              {bpAdmin ? "Revisa, aprueba o rechaza las solicitudes de los BPs" : "Genera tus solicitudes desde \"Solicitud Vacac.\" y adjunta aquí el documento firmado"}
            </div>
          </div>
          <div style={{ display: "flex", gap: 10 }}>
            {solicitudes.length > 0 && (
              <button onClick={exportarExcel} style={{
                background: "#16a34a", color: "#fff", border: "none", borderRadius: 10,
