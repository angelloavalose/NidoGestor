            if (a.procede === true) gerenciasData[c.gerencia].proceden++;
            else if (a.procede === false) gerenciasData[c.gerencia].noProceden++;
          }
        }
        const entries = Object.entries(gerenciasData).filter(([, d]) => d.proceden + d.noProceden > 0);
        if (entries.length === 0) return null;
        const maxVal = Math.max(...entries.map(([, d]) => d.proceden + d.noProceden), 1);
        return (
          <div style={{ background: COLORS.surface, borderRadius: 10, border: `0.5px solid ${COLORS.border}`, padding: "20px 24px" }}>
            <div style={{ fontSize: 13, fontWeight: 700, color: COLORS.texto, marginBottom: 16 }}>📊 Convenios por gerencia — Proceden vs No proceden</div>
            <div style={{ display: "flex", gap: 12, marginBottom: 10 }}>
              <span style={{ fontSize: 11, display: "flex", alignItems: "center", gap: 4 }}><span style={{ width: 12, height: 12, background: COLORS.positivo, borderRadius: 2, display: "inline-block" }} />Proceden</span>
              <span style={{ fontSize: 11, display: "flex", alignItems: "center", gap: 4 }}><span style={{ width: 12, height: 12, background: "#EF4444", borderRadius: 2, display: "inline-block" }} />No proceden</span>
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {entries.sort(([, a], [, b]) => (b.proceden + b.noProceden) - (a.proceden + a.noProceden)).map(([ger, d]) => {
                const total = d.proceden + d.noProceden;
                const pctP = (d.proceden / maxVal) * 100;
                const pctN = (d.noProceden / maxVal) * 100;
                return (
                  <div key={ger}>
                    <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 3 }}>
                      <span style={{ fontSize: 11, color: COLORS.textoMuted }}>{ger.length > 35 ? ger.slice(0,35)+"…" : ger}</span>
                      <span style={{ fontSize: 11, color: COLORS.textoMuted }}>{total} total</span>
                    </div>
                    <div style={{ display: "flex", gap: 3, height: 14 }}>
                      {d.proceden > 0 && <div style={{ width: `${pctP}%`, background: COLORS.positivo, borderRadius: 3, display: "flex", alignItems: "center", justifyContent: "center" }}>
                        <span style={{ fontSize: 9, color: "#fff", fontWeight: 700 }}>{d.proceden}</span>
                      </div>}
                      {d.noProceden > 0 && <div style={{ width: `${pctN}%`, background: "#EF4444", borderRadius: 3, display: "flex", alignItems: "center", justifyContent: "center" }}>
                        <span style={{ fontSize: 9, color: "#fff", fontWeight: 700 }}>{d.noProceden}</span>
                      </div>}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        );
      })()}

      {conAcuerdo.length === 0 && (
        <div style={{ textAlign: "center", padding: 60, color: COLORS.textoMuted, fontSize: 14 }}>
          {totalConvenios === 0
            ? "📂 Carga el archivo de Acuerdo de Acumulación Vacacional en Importación"
            : "✅ Ningún colaborador cumple los filtros seleccionados"}
        </div>
      )}

      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {conAcuerdo.map(c => (
          <div key={c.cod} style={{ background: COLORS.surfaceHigh, borderRadius: 12, border: `0.5px solid ${COLORS.border}`, padding: "16px 18px" }}>
            <div style={{ fontSize: 14, fontWeight: 700, color: COLORS.texto, marginBottom: 2 }}>{c.nombres}</div>
            <div style={{ fontSize: 12, color: COLORS.textoMuted, marginBottom: 12 }}>{c.gerencia} · Cód: {c.cod} · DNI: {c.doc}</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {c.acuerdosDetalle.map((a, i) => {
                const cfg = estadoConfig[a.estado];
                return (
                  <div key={i} style={{ background: cfg.bg, border: `1px solid ${cfg.color}33`, borderRadius: 10, padding: "12px 14px", borderLeft: `3px solid ${cfg.color}` }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 8 }}>
                      <div>
                        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6, flexWrap: "wrap" }}>
                          <div style={{ fontSize: 13, fontWeight: 700, color: COLORS.texto }}>Período {a.periodo}</div>
                          {/* Estado al momento de la firma */}
                          {a.estadoAlFirmar && (() => {
                            const cfgFirma = {
                              TRUNCA:    { bg: "rgba(139,92,246,0.12)", color: "#8B5CF6", border: "#8B5CF633", label: "Trunca al firmar" },
                              PENDIENTE: { bg: "rgba(245,158,11,0.12)", color: "#D97706", border: "#D9770633", label: "Pendiente al firmar" },
                              VENCIDA:   { bg: "rgba(239,68,68,0.12)",  color: "#EF4444", border: "#EF444433", label: "Vencida al firmar" },
                            }[a.estadoAlFirmar];
                            // Texto de tiempo restante para vencer
                            const fmtTiempo = (a) => {
                              const partes = [];
                              if (a.anosParaVencer > 0) partes.push(`${a.anosParaVencer}a`);
                              if (a.mesesParaVencer > 0) partes.push(`${a.mesesParaVencer}m`);
                              partes.push(`${a.diasRestParaVencer}d`);
                              return partes.join(" ");
                            };
                            let tiempoLabel = null;
                            if (a.estadoAlFirmar === "VENCIDA") {
                              tiempoLabel = "ya vencida al firmar";
                            } else if (a.anosParaVencer !== null) {
                              tiempoLabel = `${fmtTiempo(a)} para vencer`;
                            }
                            return cfgFirma ? (
                              <span style={{
                                fontSize: 11, fontWeight: 700, borderRadius: 6,
                                padding: "2px 9px",
                                background: cfgFirma.bg,
                                color: cfgFirma.color,
                                border: `1px solid ${cfgFirma.border}`,
                                display: "inline-flex", alignItems: "center", gap: 5,
                              }}>
                                {cfgFirma.label}
                                {tiempoLabel && (
                                  <span style={{ fontWeight: 400, opacity: 0.85 }}>· {tiempoLabel}</span>
                                )}
                              </span>
                            ) : null;
                          })()}
                          {/* Estado actual del período */}
                          {a.periodoReal && <Badge tipo={a.periodoReal.tipo} small />}
                          {a.fechaFirma && (
                            <span style={{ fontSize: 11, color: COLORS.textoMuted }}>
                              📅 Firmado: <strong style={{ color: COLORS.textoSecundario }}>{fmtDate(a.fechaFirma)}</strong>
                            </span>
                          )}
                        </div>
                        <div style={{ display: "flex", gap: 16, flexWrap: "wrap", fontSize: 12 }}>
                          <span style={{ color: COLORS.textoMuted }}>Días firmados: <strong style={{ color: COLORS.texto }}>{a.diasAcordados}</strong></span>
                          <span style={{ color: COLORS.textoMuted }}>Saldo vencido: <strong style={{ color: a.saldoVencido > 0 ? COLORS.vencida : COLORS.textoMuted }}>{a.saldoVencido}</strong></span>
                          <span style={{ color: COLORS.textoMuted }}>Aplicables: <strong style={{ color: COLORS.accentLight }}>{a.diasAplicables}</strong></span>
                          <span style={{ color: COLORS.textoMuted }}>Gozados: <strong style={{ color: COLORS.accentLight }}>{a.diasGozados}</strong></span>
                          <span style={{ color: COLORS.textoMuted }}>Pendientes: <strong style={{ color: a.diasPendientes > 0 ? COLORS.pendiente : COLORS.positivo }}>{a.diasPendientes}</strong></span>
                        </div>
                        {a.periodoReal && a.periodoReal.inicio && (
                          <div style={{ marginTop: 6, fontSize: 11, color: COLORS.textoMuted, display: "flex", gap: 12, flexWrap: "wrap" }}>
                            <span>Inicio año laboral: <strong style={{ color: COLORS.textoSecundario }}>{fmtDate(a.periodoReal.inicio)}</strong></span>
                            <span>Fin año laboral: <strong style={{ color: COLORS.textoSecundario }}>{fmtDate(a.periodoReal.fin)}</strong></span>
                            {a.periodoReal.fechaVencimiento && (
                              <span>Gozar hasta: <strong style={{ color: a.periodoReal.tipo === "VENCIDA" ? "#EF4444" : COLORS.accentLight }}>{fmtDate(a.periodoReal.fechaVencimiento)}</strong></span>
                            )}
                          </div>
                        )}
                        {a.tieneInconsistencia && (
                          <div style={{ marginTop: 6, fontSize: 11, color: COLORS.pendiente, fontWeight: 600 }}>
                            ⚠ Inconsistencia: firmó {a.diasAcordados} días pero el saldo real es {a.saldoReal} días ({a.inconsistenciaDias} días de diferencia)
                          </div>
                        )}
                        {/* Cuadro de procedencia del convenio */}
                        {a.procede === true && !a.diasFirmadosSuperanVencidos && !a.diasFirmadosSuperanVencidosCero && (
                          <div style={{
                            marginTop: 8, padding: "7px 12px",
                            background: "rgba(22,163,74,0.08)",
                            border: "1px solid rgba(22,163,74,0.3)",
                            borderRadius: 8, fontSize: 11,
                            color: COLORS.positivo, fontWeight: 600,
                            display: "flex", alignItems: "center", gap: 6,
                          }}>
                            ✅ Procede — el período cumple la regla de aplicación del convenio
                          </div>
                        )}
                        {a.procede === true && a.diasFirmadosSuperanVencidosCero && (
                          <div style={{
                            marginTop: 8, padding: "7px 12px",
                            background: "rgba(239,68,68,0.07)",
                            border: "1px solid rgba(239,68,68,0.3)",
                            borderRadius: 8, fontSize: 11,
                            color: COLORS.vencida, fontWeight: 600,
                          }}>
                            ❌ No aplica — firmó {a.diasAcordados} días pero este período no tiene días vencidos (saldo = 0). El convenio no tiene efecto.
                          </div>
                        )}
                        {a.procede === true && a.diasFirmadosSuperanVencidos && (
                          <div style={{
                            marginTop: 8, padding: "8px 12px",
                            background: "rgba(245,158,11,0.08)",
                            border: "1px solid rgba(245,158,11,0.3)",
                            borderRadius: 8, fontSize: 11,
                            color: "#D97706", fontWeight: 600,
                            lineHeight: 1.6,
                          }}>
                            ⚠ Aplicación parcial — firmó <strong>{a.diasAcordados} días</strong> pero solo tenía <strong>{a.diasVencidosReales} día{a.diasVencidosReales !== 1 ? "s" : ""} vencidos</strong> al momento de la firma.
                            <div style={{ marginTop: 4, display: "flex", gap: 16, flexWrap: "wrap" }}>
                              <span>Contra vencidos: <strong>{a.diasContraVencidos}d</strong></span>
                              {a.diasContraPendientes > 0 && (
                                <span>Contra pendientes: <strong>{a.diasContraPendientes}d</strong></span>
                              )}
                              <span style={{ color: COLORS.positivo }}>Total aplicable: <strong>{a.diasAplicables}d</strong></span>
                            </div>
                          </div>
                        )}
                        {a.procede === false && (
                          <div style={{
                            marginTop: 8, padding: "7px 12px",
                            background: "rgba(239,68,68,0.07)",
                            border: "1px solid rgba(239,68,68,0.3)",
                            borderRadius: 8, fontSize: 11,
                            color: COLORS.vencida, fontWeight: 600,
                            display: "flex", alignItems: "center", gap: 6,
                          }}>
                            ❌ No procede — {a.motivoNoProcede}
                          </div>
                        )}
                        {a.procede === null && a.fechaFirma === null && (
                          <div style={{
                            marginTop: 8, padding: "7px 12px",
                            background: "rgba(100,116,139,0.07)",
                            border: "1px solid rgba(100,116,139,0.2)",
                            borderRadius: 8, fontSize: 11,
                            color: COLORS.textoMuted, fontWeight: 500,
                            display: "flex", alignItems: "center", gap: 6,
                          }}>
                            ℹ Sin fecha de firma — no se puede evaluar la procedencia
                          </div>
                        )}
                      </div>
                      <div style={{ padding: "4px 12px", background: cfg.color + "22", borderRadius: 8, fontSize: 12, fontWeight: 700, color: cfg.color, flexShrink: 0 }}>
                        {cfg.label}
                      </div>
                    </div>
                    {a.diasAcordados > 0 && (
                      <div style={{ marginTop: 10, height: 6, background: COLORS.bg, borderRadius: 3, overflow: "hidden" }}>
                        <div style={{ width: `${Math.min(100, (a.diasGozados / a.diasAcordados) * 100)}%`, height: "100%", background: cfg.color, borderRadius: 3, transition: "width 0.3s" }} />
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}



function PaginaGoces({ colaboradores, bpAdmin }) {
  const [busqueda, setBusqueda] = useState("");
  const [filtroGerencia, setFiltroGerencia] = useState("Todas");
  const [filtroUnidadOrg, setFiltroUnidadOrg] = useState("Todas");
  const [filtroAnio, setFiltroAnio] = useState("Todos");
  const [filtroFechaDesde, setFiltroFechaDesde] = useState("");
  const [filtroFechaHasta, setFiltroFechaHasta] = useState("");
  const [mesSeleccionado, setMesSeleccionado] = useState(null);

  const todosGoces = useMemo(() => {
    const rows = [];
    for (const c of colaboradores) {
      for (const p of c.periodos) {
        if (!p.goces || p.goces.length === 0) continue;
        for (const g of p.goces) {
          rows.push({
            cod: c.cod,
            nombres: c.nombres,
            gerencia: c.gerencia || "—",
            unidadOrg: c.unidadOrg || "—",
            ceco: c.ceco || "—",
            dni: c.dni,
            inicio: g.inicio,
            fin: g.fin,
            dias: g.dias,
            anioNum: p.anio,
            anioInicio: p.inicio,
            anioFin: p.fin,
            registrado: g.obs ? g.obs.toLowerCase().includes("con registro") : false,
            porConvenio: g.acuerdoInfo?.porConvenio === true,
          });
        }
      }
    }
    return rows.sort((a, b) => (a.cod || "").localeCompare(b.cod || ""));
  }, [colaboradores]);

  const gerencias = useMemo(() => ["Todas", ...Array.from(new Set(todosGoces.map(r => r.gerencia))).filter(Boolean).sort()], [todosGoces]);
  const unidadesOrg = useMemo(() => {
    const base = filtroGerencia === "Todas" ? todosGoces : todosGoces.filter(r => r.gerencia === filtroGerencia);
    return ["Todas", ...Array.from(new Set(base.map(r => r.unidadOrg))).filter(Boolean).sort()];
  }, [todosGoces, filtroGerencia]);

  const aniosDisponibles = useMemo(() => {
    const set = new Set(todosGoces.map(r => r.anioNum).filter(Boolean));
    return ["Todos", ...Array.from(set).sort((a,b)=>a-b).map(n=>`Año ${n}`)];
  }, [todosGoces]);

  const gocesFiltrados = useMemo(() => {
    const q = busqueda.toLowerCase().trim();
    return todosGoces.filter(r => {
      const matchBusqueda = !q || r.nombres.toLowerCase().includes(q) || String(r.cod).includes(q);
      const matchGerencia = filtroGerencia === "Todas" || r.gerencia === filtroGerencia;
      const matchUnidad = filtroUnidadOrg === "Todas" || r.unidadOrg === filtroUnidadOrg;
      const matchAnio = filtroAnio === "Todos" || `Año ${r.anioNum}` === filtroAnio;
      const matchDesde = !filtroFechaDesde || (r.inicio && r.inicio >= dateOnly(new Date(filtroFechaDesde + "T12:00:00")));
      const matchHasta = !filtroFechaHasta || (r.inicio && r.inicio <= dateOnly(new Date(filtroFechaHasta + "T12:00:00")));
      const matchMes = !mesSeleccionado || (r.inicio && `${r.inicio.getFullYear()}-${String(r.inicio.getMonth()+1).padStart(2,"0")}` === mesSeleccionado);
      return matchBusqueda && matchGerencia && matchUnidad && matchAnio && matchDesde && matchHasta && matchMes;
    });
  }, [todosGoces, busqueda, filtroGerencia, filtroUnidadOrg, filtroAnio, filtroFechaDesde, filtroFechaHasta, mesSeleccionado]);

  // KPIs
  const [paginaGoces, setPaginaGoces] = React.useState(0);
  const POR_PAG_GOCES = 100;
  const totalGoces = gocesFiltrados.length;
  const totalDias = gocesFiltrados.reduce((s, r) => s + r.dias, 0);
  const colaboradoresConGoces = new Set(gocesFiltrados.map(r => r.cod)).size;
  const promedioDias = totalGoces > 0 ? Math.round((totalDias / totalGoces) * 10) / 10 : 0;
  const maxGoce = gocesFiltrados.reduce((max, r) => r.dias > (max?.dias ?? 0) ? r : max, null);
  const porConvenioCount = gocesFiltrados.filter(r => r.porConvenio).length;
  const referencialesCount = gocesFiltrados.filter(r => !r.registrado).length;

  const exportarExcel = () => {
    const encGoces = ["Cód","Apellidos y Nombres","Gerencia","Unid. Org.","Año","Inicio año laboral","Fin año laboral","Fecha Inicio","Fecha Fin","Días","Estado","Por convenio"];
    const filas = gocesFiltrados.map(r => ({
      "Cód": r.cod, "Apellidos y Nombres": r.nombres, "Gerencia": r.gerencia,
      "Unid. Org.": r.unidadOrg, "Año": `Año ${r.anioNum}`,
      "Inicio año laboral": fmtDate(r.anioInicio), "Fin año laboral": fmtDate(r.anioFin),
      "Fecha Inicio": fmtDate(r.inicio), "Fecha Fin": fmtDate(r.fin),
      "Días": r.dias,
      "Estado": r.registrado ? "Registrado" : "No registrado",
      "Por convenio": r.porConvenio ? "Sí" : "No",
    }));
    crearEstiloExcel(filas, encGoces, "Goces Vacaciones", "Goces_Vacaciones.xlsx", { "Apellidos y Nombres": { wch: 30 }, "Gerencia": { wch: 28 } });
  };

  return (
    <div style={{ padding: "28px 32px", maxWidth: 1300, margin: "0 auto" }}>
      {/* Header */}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 24 }}>
        <div>
          <div style={{ fontSize: 22, fontWeight: 800, color: COLORS.texto }}>🏖 Vacaciones Gozadas</div>
          <div style={{ fontSize: 13, color: COLORS.textoMuted, marginTop: 4 }}>Registro de goces vacacionales por colaborador</div>
        </div>
        <button onClick={exportarExcel} style={{
          background: COLORS.accent, color: "#fff", border: "none",
          borderRadius: 10, padding: "10px 20px", cursor: "pointer",
          fontSize: 13, fontWeight: 700, display: "flex", alignItems: "center", gap: 8,
        }}>
          ⬇ Exportar Excel
        </button>
      </div>

      {/* KPIs */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(150px, 1fr))", gap: 14, marginBottom: 24 }}>
        {[
          { label: "Total goces", value: totalGoces, icon: "🏖", color: COLORS.texto },
          { label: "Total días gozados", value: totalDias, icon: "📅", color: COLORS.accentLight },
          { label: "Colaboradores", value: colaboradoresConGoces, icon: "👥", color: COLORS.positivo },
          { label: "Promedio días/goce", value: promedioDias, icon: "📊", color: COLORS.pendiente },
          { label: "Goce más largo", value: maxGoce ? `${maxGoce.dias}d` : "—", icon: "🏆", color: "#F97316", sub: maxGoce?.nombres?.split(" ").slice(0,2).join(" ") },
          { label: "Por convenio", value: porConvenioCount, icon: "📋", color: "#6366F1" },
          { label: "Referenciales", value: referencialesCount, icon: "⚠", color: "#D97706", sub: "Sin registro SAP" },
        ].map((k, i) => (
          <div key={i} style={{
            background: COLORS.surface, borderRadius: 14, padding: "16px 18px",
            border: `0.5px solid ${COLORS.border}`,
          }}>
            <div style={{ fontSize: 11, color: COLORS.textoMuted, fontWeight: 600, marginBottom: 4 }}>{k.icon} {k.label}</div>
            <div style={{ fontSize: 24, fontWeight: 800, color: k.color }}>{k.value}</div>
            {k.sub && <div style={{ fontSize: 10, color: COLORS.textoMuted, marginTop: 2 }}>{k.sub}</div>}
          </div>
        ))}
      </div>

      {/* Filtros */}
      <div style={{ display: "flex", gap: 12, marginBottom: 12, flexWrap: "wrap" }}>
        <input value={busqueda} onChange={e => setBusqueda(e.target.value)} placeholder="🔍 Buscar por nombre o código..."
          style={{ flex: 1, minWidth: 220, padding: "9px 14px", borderRadius: 10, border: `0.5px solid ${COLORS.border}`, background: COLORS.surface, color: COLORS.texto, fontSize: 13, outline: "none" }} />
        <select value={filtroGerencia} onChange={e => { setFiltroGerencia(e.target.value); setFiltroUnidadOrg("Todas"); }}
          style={{ padding: "9px 14px", borderRadius: 10, border: `0.5px solid ${COLORS.border}`, background: COLORS.surface, color: COLORS.texto, fontSize: 13, cursor: "pointer" }}>
          {gerencias.map(g => <option key={g}>{g}</option>)}
        </select>
        <select value={filtroUnidadOrg} onChange={e => setFiltroUnidadOrg(e.target.value)}
          style={{ padding: "9px 14px", borderRadius: 10, border: `0.5px solid ${COLORS.border}`, background: COLORS.surface, color: COLORS.texto, fontSize: 13, cursor: "pointer" }}>
          {unidadesOrg.map(u => <option key={u}>{u}</option>)}
        </select>
        <select value={filtroAnio} onChange={e => setFiltroAnio(e.target.value)}
          style={{ padding: "9px 14px", borderRadius: 10, border: `0.5px solid ${COLORS.border}`, background: COLORS.surface, color: COLORS.texto, fontSize: 13, cursor: "pointer" }}>
          {aniosDisponibles.map(a => <option key={a}>{a}</option>)}
        </select>
      </div>
      <div style={{ display: "flex", gap: 12, marginBottom: 20, flexWrap: "wrap", alignItems: "center" }}>
        <label style={{ fontSize: 12, color: COLORS.textoMuted }}>Desde:</label>
        <input type="date" value={filtroFechaDesde} onChange={e => setFiltroFechaDesde(e.target.value)}
          style={{ padding: "7px 12px", borderRadius: 8, border: `0.5px solid ${COLORS.border}`, background: COLORS.surface, color: COLORS.texto, fontSize: 12, colorScheme: "light" }} />
        <label style={{ fontSize: 12, color: COLORS.textoMuted }}>Hasta:</label>
        <input type="date" value={filtroFechaHasta} onChange={e => setFiltroFechaHasta(e.target.value)}
          style={{ padding: "7px 12px", borderRadius: 8, border: `0.5px solid ${COLORS.border}`, background: COLORS.surface, color: COLORS.texto, fontSize: 12, colorScheme: "light" }} />
        {(filtroFechaDesde || filtroFechaHasta || mesSeleccionado || filtroAnio !== "Todos") && (
          <button onClick={() => { setFiltroFechaDesde(""); setFiltroFechaHasta(""); setMesSeleccionado(null); setFiltroAnio("Todos"); }}
            style={{ padding: "7px 12px", borderRadius: 8, border: `0.5px solid ${COLORS.border}`, background: "transparent", color: COLORS.textoMuted, cursor: "pointer", fontSize: 12 }}>
            ✕ Limpiar filtros
          </button>
        )}
      </div>

      {/* Gráfico de concentración por mes (interactivo) */}
      {(() => {
        const porMes = {};
        for (const r of todosGoces) {
          if (!r.inicio) continue;
          const k = `${r.inicio.getFullYear()}-${String(r.inicio.getMonth()+1).padStart(2,"0")}`;
          if (!porMes[k]) porMes[k] = { goces: 0, dias: 0 };
          porMes[k].goces++;
          porMes[k].dias += r.dias;
        }
        const entries = Object.entries(porMes).sort(([a],[b]) => a.localeCompare(b));
        if (entries.length === 0) return null;
        const maxDias = Math.max(...entries.map(([,d])=>d.dias), 1);
        return (
          <div style={{ background: COLORS.surface, borderRadius: 10, border: `0.5px solid ${COLORS.border}`, padding: "20px 24px", marginBottom: 8 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
              <div style={{ fontSize: 13, fontWeight: 700, color: COLORS.texto }}>
                📊 Concentración de goces por mes
                <span style={{ fontSize: 11, fontWeight: 400, color: COLORS.textoMuted, marginLeft: 10 }}>Clic para filtrar tabla</span>
              </div>
              {mesSeleccionado && <button onClick={() => setMesSeleccionado(null)} style={{ fontSize: 11, color: COLORS.textoMuted, background: "transparent", border: `0.5px solid ${COLORS.border}`, borderRadius: 6, padding: "3px 10px", cursor: "pointer" }}>✕ {MESES[parseInt(mesSeleccionado.split("-")[1])-1]} {mesSeleccionado.split("-")[0]}</button>}
            </div>
            <div style={{ overflowX: "auto" }}>
              <div style={{ display: "flex", gap: 6, alignItems: "flex-end", minWidth: entries.length * 40, height: 110 }}>
                {entries.map(([mes, d]) => {
                  const h = Math.max(4, (d.dias / maxDias) * 90);
                  const activo = mes === mesSeleccionado;
                  const [y, m] = mes.split("-");
                  return (
                    <div key={mes} style={{ flex: "0 0 36px", display: "flex", flexDirection: "column", alignItems: "center", cursor: "pointer" }}
                      onClick={() => setMesSeleccionado(mes === mesSeleccionado ? null : mes)} title={`${MESES[parseInt(m)-1]} ${y}: ${d.dias} días, ${d.goces} goces`}>
                      <div style={{ fontSize: 9, color: activo ? COLORS.texto : COLORS.textoMuted, marginBottom: 2, fontWeight: activo ? 700 : 400 }}>{d.dias}d</div>
                      <div style={{ width: 28, height: h, background: activo ? COLORS.accent : COLORS.accentLight + "88", borderRadius: "4px 4px 0 0", transition: "all 0.2s" }} />
                      <div style={{ fontSize: 8, color: activo ? COLORS.texto : COLORS.textoMuted, marginTop: 3, textAlign: "center", fontWeight: activo ? 700 : 400 }}>
                        {MESES[parseInt(m)-1].slice(0,3)}<br/>{y.slice(2)}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        );
      })()}

      {/* Tabla */}
      {Math.ceil(gocesFiltrados.length / POR_PAG_GOCES) > 1 && (
        <div style={{ display: "flex", gap: 10, alignItems: "center", justifyContent: "center", margin: "8px 0" }}>
          <button onClick={() => setPaginaGoces(p => Math.max(0, p-1))} disabled={paginaGoces === 0}
            style={{ padding: "5px 14px", borderRadius: 8, border: "0.5px solid " + COLORS.border, background: COLORS.surface, color: paginaGoces === 0 ? COLORS.textoMuted : COLORS.texto, cursor: paginaGoces === 0 ? "default" : "pointer", fontSize: 12 }}>← Ant.</button>
          <span style={{ fontSize: 12, color: COLORS.textoSecundario }}>Pág. {paginaGoces + 1} / {Math.ceil(gocesFiltrados.length / POR_PAG_GOCES)}</span>
          <button onClick={() => setPaginaGoces(p => Math.min(Math.ceil(gocesFiltrados.length / POR_PAG_GOCES)-1, p+1))} disabled={paginaGoces >= Math.ceil(gocesFiltrados.length / POR_PAG_GOCES)-1}
            style={{ padding: "5px 14px", borderRadius: 8, border: "0.5px solid " + COLORS.border, background: COLORS.surface, color: paginaGoces >= Math.ceil(gocesFiltrados.length / POR_PAG_GOCES)-1 ? COLORS.textoMuted : COLORS.texto, cursor: paginaGoces >= Math.ceil(gocesFiltrados.length / POR_PAG_GOCES)-1 ? "default" : "pointer", fontSize: 12 }}>Sig. →</button>
        </div>
      )}
      {gocesFiltrados.length === 0 ? (
        <div style={{ textAlign: "center", padding: 60, color: COLORS.textoMuted }}>
          <div style={{ fontSize: 40, marginBottom: 12 }}>🏖</div>
          <div style={{ fontSize: 16, fontWeight: 600 }}>No hay goces registrados{mesSeleccionado ? ` en ${MESES[parseInt(mesSeleccionado.split("-")[1])-1]} ${mesSeleccionado.split("-")[0]}` : ""}</div>
        </div>
      ) : (
        <div style={{ background: COLORS.surface, borderRadius: 16, border: `0.5px solid ${COLORS.border}`, overflow: "hidden" }}>
          {/* Cabecera */}
          <div style={{
            display: "grid",
            gridTemplateColumns: bpAdmin ? "60px 1fr 130px 130px 105px 85px 85px 50px 105px" : "55px 1fr 115px 115px 110px 100px 80px 80px 45px 100px",
            padding: "12px 18px", background: COLORS.surfaceHigh,
            borderBottom: `1px solid ${COLORS.border}`,
            fontSize: 11, fontWeight: 700, color: COLORS.textoMuted, gap: 8,
          }}>
            <span>Cód</span>
            <span>Apellidos y Nombres</span>
            <span>Gerencia</span>
            <span>Unidad Org.</span>
            {!bpAdmin && <span>CECO</span>}
            <span>Año que impacta</span>
            <span>Fecha inicio</span>
            <span>Fecha fin</span>
            <span>Días</span>
            <span>Estado</span>
          </div>
          {/* Filas */}
          {gocesFiltrados.slice(paginaGoces * POR_PAG_GOCES, (paginaGoces + 1) * POR_PAG_GOCES).map((r, i) => (
            <div key={i} style={{
              display: "grid",
              gridTemplateColumns: bpAdmin ? "60px 1fr 130px 130px 105px 85px 85px 50px 105px" : "55px 1fr 115px 115px 110px 100px 80px 80px 45px 100px",
              padding: "11px 18px", gap: 8,
              borderBottom: i < gocesFiltrados.length - 1 ? `1px solid ${COLORS.border}` : "none",
              background: i % 2 === 0 ? COLORS.surface : COLORS.bg,
              fontSize: 12, alignItems: "center",
            }}>
              <span style={{ fontWeight: 700, color: COLORS.accentLight }}>{r.cod}</span>
              <div>
                <div style={{ fontWeight: 600, color: COLORS.texto }}>{r.nombres}</div>
              </div>
              <div style={{ fontSize: 10, color: COLORS.textoMuted, overflow: "hidden", textOverflow: "ellipsis" }}>{r.gerencia}</div>
              <div style={{ fontSize: 10, color: COLORS.textoMuted, overflow: "hidden", textOverflow: "ellipsis" }}>{r.unidadOrg}</div>
              {!bpAdmin && <div style={{ fontSize: 10, color: COLORS.textoMuted, overflow: "hidden", textOverflow: "ellipsis" }}>{r.ceco || "—"}</div>}
              <div style={{ fontSize: 11, lineHeight: 1.5 }}>
                <div style={{ fontWeight: 700, color: COLORS.accentLight }}>Año {r.anioNum}</div>
                <div style={{ color: "#F97316", fontWeight: 500 }}>{fmtDate(r.anioInicio)}</div>
                <div style={{ color: COLORS.textoMuted }}>al {fmtDate(r.anioFin)}</div>
              </div>
              <span style={{ color: COLORS.textoSecundario }}>{fmtDate(r.inicio)}</span>
              <span style={{ color: COLORS.textoSecundario }}>{fmtDate(r.fin)}</span>
              <span style={{ fontWeight: 800, color: COLORS.accentLight, fontSize: 13 }}>{r.dias}d</span>
              <div style={{ display: "flex", flexDirection: "column", gap: 3 }}>
                <span style={{
                  fontSize: 10, fontWeight: 700, borderRadius: 5, padding: "2px 7px",
                  background: bpAdmin ? (r.registrado ? "rgba(22,163,74,0.1)" : "rgba(220,38,38,0.1)") : COLORS.surfaceHigh,
                  color: bpAdmin ? (r.registrado ? COLORS.positivo : "#DC2626") : COLORS.textoMuted,
                  border: bpAdmin ? `1px solid ${r.registrado ? "rgba(22,163,74,0.25)" : "rgba(220,38,38,0.25)"}` : `0.5px solid ${COLORS.border}`,
                  display: "inline-block",
                }}>
                  {bpAdmin ? (r.registrado ? "✅ Registrado" : "❌ No registrado") : null}
                </span>
                {r.porConvenio && (
                  <span style={{
                    fontSize: 10, fontWeight: 700, borderRadius: 5, padding: "2px 7px",
                    background: "rgba(99,102,241,0.1)", color: "#6366F1",
                    border: "1px solid rgba(99,102,241,0.25)", display: "inline-block",
                  }}>
                    📋 Por convenio
                  </span>
                )}
              </div>
            </div>
          ))}
        </div>
      )}

      <div style={{ marginTop: 12, fontSize: 12, color: COLORS.textoMuted, textAlign: "right" }}>
        {gocesFiltrados.length} registro{gocesFiltrados.length !== 1 ? "s" : ""} · {totalDias} días totales
      </div>
    </div>
  );
}

function PaginaCompras({ colaboradores, bpAdmin }) {
  const [busqueda, setBusqueda] = useState("");
  const [filtroGerencia, setFiltroGerencia] = useState("Todas");
  const [filtroUnidadOrg, setFiltroUnidadOrg] = useState("Todas");
  const [filtroAnio, setFiltroAnio] = useState("Todos");
  const [filtroFechaDesde, setFiltroFechaDesde] = useState("");
  const [filtroFechaHasta, setFiltroFechaHasta] = useState("");
  const [mesSeleccionado, setMesSeleccionado] = useState(null);

  // Extraer todas las compras de todos los colaboradores
  const todasCompras = useMemo(() => {
    const rows = [];
    for (const c of colaboradores) {
      for (const p of c.periodos) {
        if (!p.compras || p.compras.length === 0) continue;
        for (const compra of p.compras) {
          rows.push({
            cod: c.cod,
            nombres: c.nombres,
            gerencia: c.gerencia || "—",
            unidadOrg: c.unidadOrg || "—",
            ceco: c.ceco || "—",
            dni: c.dni,
            inicio: compra.inicio,
            fin: compra.fin,
            dias: compra.dias,
            anioLabel: `${fmtDate(p.inicio)} al ${fmtDate(p.fin)}`,
            anioInicio: p.inicio,
            anioFin: p.fin,
            anioVencimiento: p.fechaVencimiento || null,
            registrado: compra.obs ? compra.obs.toLowerCase().includes("con registro") : false,
            estadoAlComprar: (() => {
              if (!compra.inicio || !p.inicio) return null;
              if (compra.inicio <= p.fin) return "TRUNCA";
              if (p.fechaVencimiento && compra.inicio <= p.fechaVencimiento) return "PENDIENTE";
              if (p.fechaVencimiento && compra.inicio > p.fechaVencimiento) return "VENCIDA";
              return null;
            })(),
            periodoAnio: p.anio,
            obs: compra.obs || "",
          });
        }
      }
    }
    return rows.sort((a, b) => (a.cod || "").localeCompare(b.cod || ""));
  }, [colaboradores]);

  // Opciones de filtros
  const gerencias = useMemo(() => ["Todas", ...Array.from(new Set(todasCompras.map(r => r.gerencia))).filter(Boolean).sort()], [todasCompras]);
  const unidadesOrg = useMemo(() => {
    const base = filtroGerencia === "Todas" ? todasCompras : todasCompras.filter(r => r.gerencia === filtroGerencia);
    return ["Todas", ...Array.from(new Set(base.map(r => r.unidadOrg))).filter(Boolean).sort()];
  }, [todasCompras, filtroGerencia]);

  // Filtrar
  const aniosDisponibles = useMemo(() => {
    const set = new Set(todasCompras.map(r => r.periodoAnio).filter(Boolean));
    return ["Todos", ...Array.from(set).sort((a,b)=>a-b).map(n=>`Año ${n}`)];
  }, [todasCompras]);

  const comprasFiltradas = useMemo(() => {
    const q = busqueda.toLowerCase().trim();
    return todasCompras.filter(r => {
      const matchBusqueda = !q || r.nombres.toLowerCase().includes(q) || String(r.cod).includes(q);
      const matchGerencia = filtroGerencia === "Todas" || r.gerencia === filtroGerencia;
      const matchUnidad = filtroUnidadOrg === "Todas" || r.unidadOrg === filtroUnidadOrg;
      const matchAnio = filtroAnio === "Todos" || `Año ${r.periodoAnio}` === filtroAnio;
      const matchDesde = !filtroFechaDesde || (r.inicio && r.inicio >= dateOnly(new Date(filtroFechaDesde + "T12:00:00")));
      const matchHasta = !filtroFechaHasta || (r.inicio && r.inicio <= dateOnly(new Date(filtroFechaHasta + "T12:00:00")));
      const matchMes = !mesSeleccionado || (r.inicio && `${r.inicio.getFullYear()}-${String(r.inicio.getMonth()+1).padStart(2,"0")}` === mesSeleccionado);
      // Alerta: compra en período ya vencido
      // Solo es "vencido" si la fecha de compra supera la fechaVencimiento (plazo de goce)
      // Si está dentro del plazo de goce → es Pendiente, no vencido
      r.enPeriodoVencido = r.anioVencimiento && r.inicio && r.inicio > r.anioVencimiento;
      return matchBusqueda && matchGerencia && matchUnidad && matchAnio && matchDesde && matchHasta && matchMes;
    });
  }, [todasCompras, busqueda, filtroGerencia, filtroUnidadOrg, filtroAnio, filtroFechaDesde, filtroFechaHasta, mesSeleccionado]);

  // KPIs
  const [paginaCompras, setPaginaCompras] = React.useState(0);
  const POR_PAG_COMPRAS = 100;
  const totalCompras = comprasFiltradas.length;
  const totalDias = comprasFiltradas.reduce((s, r) => s + r.dias, 0);
  const colaboradoresConCompras = new Set(comprasFiltradas.map(r => r.cod)).size;
  const promedioDias = totalCompras > 0 ? Math.round((totalDias / totalCompras) * 10) / 10 : 0;
  const maxCompra = comprasFiltradas.reduce((max, r) => r.dias > (max?.dias ?? 0) ? r : max, null);

  // Exportar Excel
  const exportarExcel = () => {
    const encCompras = ["Cód","Apellidos y Nombres","Gerencia","Unid. Org.","Mes de compra","Estado","Días","Año que impacta"];
    const filas = comprasFiltradas.map(r => ({
      "Cód": r.cod, "Apellidos y Nombres": r.nombres, "Gerencia": r.gerencia,
      "Unid. Org.": r.unidadOrg, "Mes de compra": fmtMesAnio(r.inicio),
      "Estado": r.registrado ? "Registrado" : "No registrado",
      "Días": r.dias, "Año que impacta": r.anioLabel,
    }));
    crearEstiloExcel(filas, encCompras, "Compras Vacaciones", "Compras_Vacaciones.xlsx", { "Apellidos y Nombres": { wch: 30 }, "Gerencia": { wch: 28 } });
  };

  return (
    <div style={{ padding: "28px 32px", maxWidth: 1200, margin: "0 auto" }}>
      {/* Header */}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 24 }}>
        <div>
          <div style={{ fontSize: 22, fontWeight: 800, color: COLORS.texto }}>🛒 Compras de Vacaciones</div>
          <div style={{ fontSize: 13, color: COLORS.textoMuted, marginTop: 4 }}>Registro de días de vacaciones comprados por colaborador</div>
        </div>
        <button onClick={exportarExcel} style={{
          background: COLORS.accent, color: "#fff", border: "none",
          borderRadius: 10, padding: "10px 20px", cursor: "pointer",
          fontSize: 13, fontWeight: 700, display: "flex", alignItems: "center", gap: 8,
        }}>
          ⬇ Exportar Excel
        </button>
      </div>

      {/* KPIs */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(160px, 1fr))", gap: 14, marginBottom: 24 }}>
        {[
          { label: "Total compras", value: totalCompras, icon: "🛒", color: COLORS.texto },
          { label: "Total días comprados", value: totalDias, icon: "📅", color: COLORS.accentLight },
          { label: "Colaboradores", value: colaboradoresConCompras, icon: "👥", color: COLORS.positivo },
          { label: "Promedio días/compra", value: promedioDias, icon: "📊", color: COLORS.pendiente },
          { label: "Compra más alta", value: maxCompra ? `${maxCompra.dias}d` : "—", icon: "🏆", color: "#F97316", sub: maxCompra?.nombres?.split(" ").slice(0,2).join(" ") },
        ].map((k, i) => (
          <div key={i} style={{
            background: COLORS.surface, borderRadius: 14, padding: "16px 18px",
            border: `0.5px solid ${COLORS.border}`,
          }}>
            <div style={{ fontSize: 11, color: COLORS.textoMuted, fontWeight: 600, marginBottom: 4 }}>{k.icon} {k.label}</div>
            <div style={{ fontSize: 24, fontWeight: 800, color: k.color }}>{k.value}</div>
            {k.sub && <div style={{ fontSize: 10, color: COLORS.textoMuted, marginTop: 2 }}>{k.sub}</div>}
          </div>
        ))}
      </div>

      {/* Filtros */}
      <div style={{ display: "flex", gap: 12, marginBottom: 12, flexWrap: "wrap" }}>
        <input value={busqueda} onChange={e => setBusqueda(e.target.value)} placeholder="🔍 Buscar por nombre o código..."
          style={{ flex: 1, minWidth: 220, padding: "9px 14px", borderRadius: 10, border: `0.5px solid ${COLORS.border}`, background: COLORS.surface, color: COLORS.texto, fontSize: 13, outline: "none" }} />
        <select value={filtroGerencia} onChange={e => { setFiltroGerencia(e.target.value); setFiltroUnidadOrg("Todas"); }}
          style={{ padding: "9px 14px", borderRadius: 10, border: `0.5px solid ${COLORS.border}`, background: COLORS.surface, color: COLORS.texto, fontSize: 13, cursor: "pointer" }}>
          {gerencias.map(g => <option key={g}>{g}</option>)}
        </select>
        <select value={filtroUnidadOrg} onChange={e => setFiltroUnidadOrg(e.target.value)}
          style={{ padding: "9px 14px", borderRadius: 10, border: `0.5px solid ${COLORS.border}`, background: COLORS.surface, color: COLORS.texto, fontSize: 13, cursor: "pointer" }}>
          {unidadesOrg.map(u => <option key={u}>{u}</option>)}
        </select>
        <select value={filtroAnio} onChange={e => setFiltroAnio(e.target.value)}
          style={{ padding: "9px 14px", borderRadius: 10, border: `0.5px solid ${COLORS.border}`, background: COLORS.surface, color: COLORS.texto, fontSize: 13, cursor: "pointer" }}>
          {aniosDisponibles.map(a => <option key={a}>{a}</option>)}
        </select>
      </div>
      <div style={{ display: "flex", gap: 12, marginBottom: 20, flexWrap: "wrap", alignItems: "center" }}>
        <label style={{ fontSize: 12, color: COLORS.textoMuted }}>Desde:</label>
        <input type="date" value={filtroFechaDesde} onChange={e => setFiltroFechaDesde(e.target.value)}
          style={{ padding: "7px 12px", borderRadius: 8, border: `0.5px solid ${COLORS.border}`, background: COLORS.surface, color: COLORS.texto, fontSize: 12, colorScheme: "light" }} />
        <label style={{ fontSize: 12, color: COLORS.textoMuted }}>Hasta:</label>
        <input type="date" value={filtroFechaHasta} onChange={e => setFiltroFechaHasta(e.target.value)}
          style={{ padding: "7px 12px", borderRadius: 8, border: `0.5px solid ${COLORS.border}`, background: COLORS.surface, color: COLORS.texto, fontSize: 12, colorScheme: "light" }} />
        {(filtroFechaDesde || filtroFechaHasta || mesSeleccionado || filtroAnio !== "Todos") && (
          <button onClick={() => { setFiltroFechaDesde(""); setFiltroFechaHasta(""); setMesSeleccionado(null); setFiltroAnio("Todos"); }}
            style={{ padding: "7px 12px", borderRadius: 8, border: `0.5px solid ${COLORS.border}`, background: "transparent", color: COLORS.textoMuted, cursor: "pointer", fontSize: 12 }}>
            ✕ Limpiar filtros
          </button>
        )}
      </div>

      {/* Gráfico interactivo por mes */}
      {(() => {
        const porMes = {};
        for (const r of todasCompras) {
          if (!r.inicio) continue;
          const k = `${r.inicio.getFullYear()}-${String(r.inicio.getMonth()+1).padStart(2,"0")}`;
          if (!porMes[k]) porMes[k] = { compras: 0, dias: 0 };
          porMes[k].compras++;
          porMes[k].dias += r.dias;
        }
        const entries = Object.entries(porMes).sort(([a],[b]) => a.localeCompare(b));
        if (entries.length === 0) return null;
        const maxDias = Math.max(...entries.map(([,d])=>d.dias), 1);
        return (
          <div style={{ background: COLORS.surface, borderRadius: 10, border: `0.5px solid ${COLORS.border}`, padding: "20px 24px", marginBottom: 8 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
              <div style={{ fontSize: 13, fontWeight: 700, color: COLORS.texto }}>
                📊 Concentración de compras por mes
                <span style={{ fontSize: 11, fontWeight: 400, color: COLORS.textoMuted, marginLeft: 10 }}>Clic para filtrar tabla</span>
              </div>
              {mesSeleccionado && <button onClick={() => setMesSeleccionado(null)} style={{ fontSize: 11, color: COLORS.textoMuted, background: "transparent", border: `0.5px solid ${COLORS.border}`, borderRadius: 6, padding: "3px 10px", cursor: "pointer" }}>✕ Limpiar mes</button>}
            </div>
            <div style={{ overflowX: "auto" }}>
              <div style={{ display: "flex", gap: 6, alignItems: "flex-end", minWidth: entries.length * 40, height: 110 }}>
                {entries.map(([mes, d]) => {
                  const h = Math.max(4, (d.dias / maxDias) * 90);
                  const activo = mes === mesSeleccionado;
                  const [y, m] = mes.split("-");
                  return (
                    <div key={mes} style={{ flex: "0 0 36px", display: "flex", flexDirection: "column", alignItems: "center", cursor: "pointer" }}
                      onClick={() => setMesSeleccionado(mes === mesSeleccionado ? null : mes)} title={`${MESES[parseInt(m)-1]} ${y}: ${d.dias} días, ${d.compras} compras`}>
                      <div style={{ fontSize: 9, color: activo ? COLORS.texto : COLORS.textoMuted, marginBottom: 2, fontWeight: activo ? 700 : 400 }}>{d.dias}d</div>
                      <div style={{ width: 28, height: h, background: activo ? "#EA580C" : "#F97316aa", borderRadius: "4px 4px 0 0", transition: "all 0.2s" }} />
                      <div style={{ fontSize: 8, color: activo ? COLORS.texto : COLORS.textoMuted, marginTop: 3, textAlign: "center", fontWeight: activo ? 700 : 400 }}>
                        {MESES[parseInt(m)-1].slice(0,3)}<br/>{y.slice(2)}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        );
      })()}

      {/* Tabla */}
      {Math.ceil(comprasFiltradas.length / POR_PAG_COMPRAS) > 1 && (
        <div style={{ display: "flex", gap: 10, alignItems: "center", justifyContent: "center", margin: "8px 0" }}>
          <button onClick={() => setPaginaCompras(p => Math.max(0, p-1))} disabled={paginaCompras === 0}
            style={{ padding: "5px 14px", borderRadius: 8, border: "0.5px solid " + COLORS.border, background: COLORS.surface, color: paginaCompras === 0 ? COLORS.textoMuted : COLORS.texto, cursor: paginaCompras === 0 ? "default" : "pointer", fontSize: 12 }}>← Ant.</button>
          <span style={{ fontSize: 12, color: COLORS.textoSecundario }}>Pág. {paginaCompras + 1} / {Math.ceil(comprasFiltradas.length / POR_PAG_COMPRAS)}</span>
          <button onClick={() => setPaginaCompras(p => Math.min(Math.ceil(comprasFiltradas.length / POR_PAG_COMPRAS)-1, p+1))} disabled={paginaCompras >= Math.ceil(comprasFiltradas.length / POR_PAG_COMPRAS)-1}
            style={{ padding: "5px 14px", borderRadius: 8, border: "0.5px solid " + COLORS.border, background: COLORS.surface, color: paginaCompras >= Math.ceil(comprasFiltradas.length / POR_PAG_COMPRAS)-1 ? COLORS.textoMuted : COLORS.texto, cursor: paginaCompras >= Math.ceil(comprasFiltradas.length / POR_PAG_COMPRAS)-1 ? "default" : "pointer", fontSize: 12 }}>Sig. →</button>
        </div>
      )}
      {comprasFiltradas.length === 0 ? (
        <div style={{ textAlign: "center", padding: 60, color: COLORS.textoMuted }}>
          <div style={{ fontSize: 40, marginBottom: 12 }}>🛒</div>
          <div style={{ fontSize: 16, fontWeight: 600 }}>No hay compras registradas</div>
        </div>
      ) : (
        <div style={{ background: COLORS.surface, borderRadius: 16, border: `0.5px solid ${COLORS.border}`, overflow: "hidden" }}>
          {/* Cabecera */}
          <div style={{
            display: "grid",
            gridTemplateColumns: bpAdmin ? "65px 1fr 125px 125px 110px 55px 115px 1fr 105px" : "60px 1fr 110px 110px 105px 105px 50px 105px 1fr 100px",
            padding: "12px 18px", background: COLORS.surfaceHigh,
            borderBottom: `1px solid ${COLORS.border}`,
            fontSize: 11, fontWeight: 700, color: COLORS.textoMuted, gap: 8,
          }}>
            <span>Cód</span>
            <span>Apellidos y Nombres</span>
            <span>Gerencia</span>
            <span>Unidad Org.</span>
            {!bpAdmin && <span>CECO</span>}
            <span>Año que impacta</span>
            <span>Días</span>
            <span>Mes de compra</span>
            <span>Comentario</span>
            <span>Estado</span>
          </div>
          {/* Filas */}
          {comprasFiltradas.slice(paginaCompras * POR_PAG_COMPRAS, (paginaCompras + 1) * POR_PAG_COMPRAS).map((r, i) => (
            <div key={i} style={{
              display: "grid",
              gridTemplateColumns: bpAdmin ? "65px 1fr 125px 125px 110px 55px 115px 1fr 105px" : "60px 1fr 110px 110px 105px 105px 50px 105px 1fr 100px",
              padding: "11px 18px", gap: 8,
              borderBottom: i < comprasFiltradas.length - 1 ? `1px solid ${COLORS.border}` : "none",
              background: i % 2 === 0 ? COLORS.surface : COLORS.bg,
              fontSize: 12, alignItems: "center",
            }}>
              <span style={{ fontWeight: 700, color: COLORS.accentLight }}>{r.cod}</span>
              <div>
                <div style={{ fontWeight: 600, color: COLORS.texto }}>{r.nombres}</div>
              </div>
              <div style={{ fontSize: 10, color: COLORS.textoMuted, overflow: "hidden", textOverflow: "ellipsis" }}>{r.gerencia}</div>
              <div style={{ fontSize: 10, color: COLORS.textoMuted, overflow: "hidden", textOverflow: "ellipsis" }}>{r.unidadOrg}</div>
              {!bpAdmin && <div style={{ fontSize: 10, color: COLORS.textoMuted, overflow: "hidden", textOverflow: "ellipsis" }}>{r.ceco || "—"}</div>}
              <div style={{ fontSize: 12, color: "#F97316", fontWeight: 600 }}>
                {r.anioInicio ? r.anioInicio.getFullYear() : "—"} — {r.anioFin ? r.anioFin.getFullYear() : "—"}
              </div>
              <span style={{ fontWeight: 800, color: "#F97316", fontSize: 14 }}>{r.dias}d</span>
              <span style={{ color: COLORS.textoSecundario, fontWeight: 500 }}>{fmtMesAnio(r.inicio)}</span>
              <span style={{ fontSize: 11, color: COLORS.textoMuted, fontStyle: r.obs ? "normal" : "italic" }}>
                {r.obs || "—"}
              </span>
              <div style={{ display: "flex", flexDirection: "column", gap: 3 }}>
                <span style={{
                  fontSize: 11, fontWeight: 700, borderRadius: 6, padding: "2px 8px",
                  background: bpAdmin ? (r.registrado ? "rgba(22,163,74,0.1)" : "rgba(220,38,38,0.1)") : COLORS.surfaceHigh,
                  color: bpAdmin ? (r.registrado ? COLORS.positivo : "#DC2626") : COLORS.textoMuted,
                  border: bpAdmin ? `1px solid ${r.registrado ? "rgba(22,163,74,0.25)" : "rgba(220,38,38,0.25)"}` : `0.5px solid ${COLORS.border}`,
                  display: "inline-block",
                }}>
                  {bpAdmin ? (r.registrado ? "✅ Registrado" : "❌ No registrado") : null}
                </span>
                {r.estadoAlComprar && (() => {
                  const cfg = {
                    TRUNCA:   { label: "Trunco al comprar",   bg: "rgba(139,92,246,0.1)", color: "#8B5CF6", border: "rgba(139,92,246,0.25)" },
                    PENDIENTE:{ label: "Pendiente al comprar",bg: "rgba(245,158,11,0.1)", color: "#D97706", border: "rgba(245,158,11,0.25)" },
                    VENCIDA:  { label: "Vencido al comprar",  bg: "rgba(220,38,38,0.1)",  color: "#DC2626", border: "rgba(220,38,38,0.25)" },
                  }[r.estadoAlComprar];
                  return cfg ? (
                    <span style={{ fontSize: 10, fontWeight: 700, borderRadius: 5, padding: "2px 7px", background: cfg.bg, color: cfg.color, border: `1px solid ${cfg.border}`, display: "inline-block" }}>
                      {cfg.label}
                    </span>
                  ) : null;
                })()}
              </div>
            </div>
          ))}
        </div>
      )}

      <div style={{ marginTop: 12, fontSize: 12, color: COLORS.textoMuted, textAlign: "right" }}>
        {comprasFiltradas.length} registro{comprasFiltradas.length !== 1 ? "s" : ""} · {totalDias} días totales
      </div>
    </div>
  );
}


// ─── MÓDULO: DETALLE DEL COLABORADOR (igual al modal PeriodosDetalle) ────────
function DetalleColaborador({ colab }) {
  const [goceSeleccionado, setGoceSeleccionado] = useState(null);
  const [compraSeleccionada, setCompraSeleccionada] = useState(null);

  // Exportar Excel con detalle completo del colaborador
  const exportarDetalleExcel = () => {
    // ── Hoja 1: Resumen + KPIs ──
    const wb = XLSX.utils.book_new();

    // Hoja 1: Períodos
    const filasP = [];
    for (const p of [...colab.periodos].reverse()) {
      const cfg = TIPO_CONFIG[p.tipo] || TIPO_CONFIG.TRUNCA;
      filasP.push({
        "Período": p.esAjuste ? "P0 – Ajuste" : `Año ${p.anio}`,
        "Tipo": cfg.label,
        "Inicio": p.inicio ? fmtDate(p.inicio) : "—",
        "Fin": p.fin ? fmtDate(p.fin) : "—",
        "Gozar hasta": p.fechaVencimiento ? fmtDate(p.fechaVencimiento) : "—",
        "Vence el": p.fechaVencimiento ? fmtDate(new Date(p.fechaVencimiento.getTime() + 86400000)) : "—",
        "Base (días)": p.diasBase,
        "Gozado": p.diasGozados,
        "Comprado": p.diasComprados || 0,
        "Indemnización": (p.tipo === "INDEMNIZACION" || (p.tipo === "VENCIDA" && p.diasIndemnizacionBruta > 0)) && p.diasIndemnizacionBruta !== null ? p.diasIndemnizacionBruta : "",
        "Saldo": Math.round(p.saldo * 100) / 100,
        "Ampliado (días)": p.diasExtension || 0,
        "Obs": p.obs || "",
      });
    }

    const encP = ["Período","Tipo","Inicio","Fin","Gozar hasta","Vence el","Base (días)","Gozado","Comprado","Indemnización","Saldo","Ampliado (días)","Obs"];
    const aoaP = [
      // Cabecera del colaborador
      [`DETALLE VACACIONAL — ${colab.nombres}`],
      [`Cód: ${colab.cod}  |  DNI: ${colab.doc}  |  ${colab.gerencia}  |  ${colab.unidadOrg}`],
      [`Fecha de Corte: ${fmtDate(colab.fechaCorte)}  |  Fecha de Ingreso: ${fmtDate(colab.feIngreso)}`],
      [],
      // KPIs
      ["RESUMEN","","","","","",""],
      ["Total ganados","Total gozados","Comprado","Por gozar","Indemnización","Total vencidas",""],
      [
        Math.round(colab.totalGanados * 100) / 100,
        Math.round(colab.totalGozados * 100) / 100,
        Math.round((colab.totalComprados || 0) * 100) / 100,
        Math.round(colab.totalPorGozar * 100) / 100,
        Math.round((colab.diasIndemnizacion || 0) * 100) / 100,
        Math.round((colab.totalVencidas || 0) * 100) / 100,
        "",
      ],
      [],
      // Encabezado de períodos
      encP,
      ...filasP.map(f => encP.map(h => f[h] ?? "")),
    ];

    const wsP = XLSX.utils.aoa_to_sheet(aoaP);
    wsP["!cols"] = [14,12,12,12,14,12,10,8,8,12,8,14,20].map(w => ({ wch: w }));

    // Estilos fila título
    const applyStyle = (addr, s) => { if (!wsP[addr]) wsP[addr] = { v: "", t: "s" }; wsP[addr].s = s; };
    const hdrStyle = { font: { bold: true, sz: 13, color: { rgb: "FFFFFF" } }, fill: { fgColor: { rgb: "1A5C2E" } }, alignment: { horizontal: "left" } };
    applyStyle("A1", hdrStyle); applyStyle("A2", { font: { sz: 11 }, fill: { fgColor: { rgb: "F0FDF4" } } });
    applyStyle("A3", { font: { sz: 11 }, fill: { fgColor: { rgb: "F0FDF4" } } });

    // Estilo fila KPI labels (fila 6 = índice 5)
    const kpiLabelStyle = { font: { bold: true, sz: 10, color: { rgb: "6B7280" } }, alignment: { horizontal: "center" } };
    ["A","B","C","D","E","F"].forEach(col => applyStyle(`${col}6`, kpiLabelStyle));

    // Estilo fila KPI valores (fila 7 = índice 6)
    [
      ["A7", "111827"], ["B7", "166534"], ["C7", "F97316"],
      ["D7", "16A34A"], ["E7", "F97316"], ["F7", "DC2626"],
    ].forEach(([addr, rgb]) => applyStyle(addr, { font: { bold: true, sz: 14, color: { rgb } }, alignment: { horizontal: "center" } }));

    // Encabezado de tabla períodos (fila 9 = índice 8)
    encP.forEach((_, ci) => {
      const addr = XLSX.utils.encode_cell({ r: 8, c: ci });
      applyStyle(addr, { font: { bold: true, sz: 11, color: { rgb: "FFFFFF" } }, fill: { fgColor: { rgb: "1A5C2E" } }, alignment: { horizontal: "center" }, border: { bottom: { style: "thin", color: { rgb: "14472A" } } } });
    });

    // Estilos filas de datos de períodos
    filasP.forEach((f, ri) => {
      const r = 9 + ri;
      encP.forEach((h, ci) => {
        const addr = XLSX.utils.encode_cell({ r, c: ci });
        const val = f[h];
        let fillRgb = ri % 2 === 0 ? "FFFFFF" : "F9FAFB";
        let textRgb = "111827";
        let bold = false;
        if (h === "Tipo") {
          if (f["Tipo"] === "Vencida")        { fillRgb = "FEF2F2"; textRgb = "DC2626"; bold = true; }
          else if (f["Tipo"] === "Indemnización") { fillRgb = "FFF7ED"; textRgb = "F97316"; bold = true; }
          else if (f["Tipo"] === "Pendiente") { fillRgb = "FFFBEB"; textRgb = "D97706"; bold = true; }
          else if (f["Tipo"] === "Trunca")    { fillRgb = "F5F3FF"; textRgb = "7C3AED"; bold = true; }
        }
        if (h === "Saldo" && typeof val === "number" && val > 0) { textRgb = "16A34A"; bold = true; }
        if (h === "Indemnización" && typeof val === "number" && val > 0) { textRgb = "F97316"; bold = true; }
        applyStyle(addr, { font: { sz: 11, color: { rgb: textRgb }, bold }, fill: { fgColor: { rgb: fillRgb } }, alignment: { horizontal: typeof val === "number" ? "right" : "left" }, border: { bottom: { style: "thin", color: { rgb: "E5E7EB" } } } });
      });
    });

    wsP["!rows"] = [{ hpt: 22 }, { hpt: 18 }, { hpt: 18 }, { hpt: 8 }, { hpt: 16 }, { hpt: 18 }, { hpt: 22 }, { hpt: 8 }, { hpt: 24 }, ...filasP.map(() => ({ hpt: 20 }))];
    XLSX.utils.book_append_sheet(wb, wsP, "Períodos");

    // ── Hoja 2: Goces detallados ──
    const filasG = [];
    for (const p of [...colab.periodos].reverse()) {
      for (const g of p.goces) {
        filasG.push({
          "Período": p.esAjuste ? "P0" : `Año ${p.anio}`,
          "Tipo período": (TIPO_CONFIG[p.tipo] || TIPO_CONFIG.TRUNCA).label,
          "Fecha inicio": fmtDate(g.inicio),
          "Fecha fin": fmtDate(g.fin),
          "Días gozados": g.dias,
          "Obs": g.obs || "",
          "Por convenio": g.porAcuerdo ? "Sí" : "No",
          "Desde truncas": g.consumoDesdeTracas ? "Sí" : "No",
          "Saldo antes": g.saldoAntes?.toFixed(2) ?? "",
          "Saldo después": g.saldoDespues?.toFixed(2) ?? "",
        });
      }
    }

    const encG = ["Período","Tipo período","Fecha inicio","Fecha fin","Días gozados","Obs","Por convenio","Desde truncas","Saldo antes","Saldo después"];
    const aoaG = [encG, ...filasG.map(f => encG.map(h => f[h] ?? ""))];
    const wsG = XLSX.utils.aoa_to_sheet(aoaG);
    wsG["!cols"] = [10,12,12,12,12,20,12,12,12,12].map(w => ({ wch: w }));
    encG.forEach((_, ci) => {
      const addr = XLSX.utils.encode_cell({ r: 0, c: ci });
      if (!wsG[addr]) wsG[addr] = { v: "", t: "s" };
      wsG[addr].s = { font: { bold: true, sz: 11, color: { rgb: "FFFFFF" } }, fill: { fgColor: { rgb: "1A5C2E" } }, alignment: { horizontal: "center" } };
    });
    wsG["!rows"] = [{ hpt: 24 }, ...filasG.map(() => ({ hpt: 20 }))];
    XLSX.utils.book_append_sheet(wb, wsG, "Goces");

    // ── Hoja 3: Compras ──
    const filasC = [];
    for (const p of [...colab.periodos].reverse()) {
      for (const c of (p.compras || [])) {
        filasC.push({
          "Período": p.esAjuste ? "P0" : `Año ${p.anio}`,
          "Tipo período": (TIPO_CONFIG[p.tipo] || TIPO_CONFIG.TRUNCA).label,
          "Fecha": fmtDate(c.inicio),
          "Días comprados": c.dias,
          "Obs": c.obs || "",
        });
      }
    }
    if (filasC.length > 0) {
      const encC = ["Período","Tipo período","Fecha","Días comprados","Obs"];
      const aoaC = [encC, ...filasC.map(f => encC.map(h => f[h] ?? ""))];
      const wsC = XLSX.utils.aoa_to_sheet(aoaC);
      wsC["!cols"] = [10,12,12,14,20].map(w => ({ wch: w }));
      encC.forEach((_, ci) => {
        const addr = XLSX.utils.encode_cell({ r: 0, c: ci });
        if (!wsC[addr]) wsC[addr] = { v: "", t: "s" };
        wsC[addr].s = { font: { bold: true, sz: 11, color: { rgb: "FFFFFF" } }, fill: { fgColor: { rgb: "F97316" } }, alignment: { horizontal: "center" } };
      });
      XLSX.utils.book_append_sheet(wb, wsC, "Compras");
    }

    const nombre = colab.nombres.replace(/[^a-zA-Z0-9]/g, "_").slice(0, 30);
    XLSX.writeFile(wb, `Detalle_${nombre}_${colab.cod}.xlsx`);
  };

  // ── Exportar tabla plana (Código | Nombre | Período | ...) ──
  const exportarTablaPlana = () => {
    const encTP = ["Código","Apellidos y Nombres","Período","Tipo","Inicio","Fin","Gozar hasta","Vence el","Base (días)","Gozado","Comprado","Indemnización","Saldo","Ampliado (días)","Obs"];
    const filas = [];
    for (const p of [...colab.periodos].reverse()) {
      const cfg = TIPO_CONFIG[p.tipo] || TIPO_CONFIG.TRUNCA;
      filas.push({
        "Código": colab.cod,
        "Apellidos y Nombres": colab.nombres,
        "Período": p.esAjuste ? "P0 – Ajuste" : `Año ${p.anio}`,
        "Tipo": cfg.label,
        "Inicio": p.inicio ? fmtDate(p.inicio) : "—",
        "Fin": p.fin ? fmtDate(p.fin) : "—",
        "Gozar hasta": p.fechaVencimiento ? fmtDate(p.fechaVencimiento) : "—",
        "Vence el": p.fechaVencimiento ? fmtDate(new Date(p.fechaVencimiento.getTime() + 86400000)) : "—",
        "Base (días)": p.diasBase,
        "Gozado": p.diasGozados,
        "Comprado": p.diasComprados || 0,
        "Indemnización": (p.tipo === "INDEMNIZACION" || (p.tipo === "VENCIDA" && p.diasIndemnizacionBruta > 0)) && p.diasIndemnizacionBruta !== null ? p.diasIndemnizacionBruta : "",
        "Saldo": Math.round(p.saldo * 100) / 100,
        "Ampliado (días)": p.diasExtension || 0,
        "Obs": p.obs || "",
      });
    }
    const wb = XLSX.utils.book_new();
    const aoa = [encTP, ...filas.map(f => encTP.map(h => f[h] ?? ""))];
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws["!cols"] = [10,28,10,14,12,12,14,12,10,8,8,12,8,14,20].map(w => ({ wch: w }));
    // Estilo encabezado
    encTP.forEach((_, ci) => {
      const addr = XLSX.utils.encode_cell({ r: 0, c: ci });
      if (!ws[addr]) ws[addr] = { v: "", t: "s" };
      ws[addr].s = { font: { bold: true, sz: 11, color: { rgb: "FFFFFF" } }, fill: { fgColor: { rgb: "1A5C2E" } }, alignment: { horizontal: "center" } };
    });
    // Estilos filas de datos
    filas.forEach((f, ri) => {
      const r = 1 + ri;
      encTP.forEach((h, ci) => {
        const addr = XLSX.utils.encode_cell({ r, c: ci });
        const val = f[h];
        let fillRgb = ri % 2 === 0 ? "FFFFFF" : "F9FAFB";
        let textRgb = "111827"; let bold = false;
        if (h === "Tipo") {
          if (f["Tipo"] === "Vencida")           { fillRgb = "FEF2F2"; textRgb = "DC2626"; bold = true; }
          else if (f["Tipo"] === "Indemnización") { fillRgb = "FFF7ED"; textRgb = "F97316"; bold = true; }
          else if (f["Tipo"] === "Pendiente")    { fillRgb = "FFFBEB"; textRgb = "D97706"; bold = true; }
          else if (f["Tipo"] === "Trunca")       { fillRgb = "F5F3FF"; textRgb = "7C3AED"; bold = true; }
        }
        if (h === "Saldo" && typeof val === "number" && val > 0) { textRgb = "16A34A"; bold = true; }
        if (h === "Indemnización" && typeof val === "number" && val > 0) { textRgb = "F97316"; bold = true; }
        if (!ws[addr]) ws[addr] = { v: val ?? "", t: typeof val === "number" ? "n" : "s" };
        ws[addr].s = { font: { sz: 11, color: { rgb: textRgb }, bold }, fill: { fgColor: { rgb: fillRgb } }, alignment: { horizontal: typeof val === "number" ? "right" : "left" }, border: { bottom: { style: "thin", color: { rgb: "E5E7EB" } } } };
      });
    });
    ws["!rows"] = [{ hpt: 24 }, ...filas.map(() => ({ hpt: 20 }))];
    XLSX.utils.book_append_sheet(wb, ws, "Períodos");
    const nombre = colab.nombres.replace(/[^a-zA-Z0-9]/g, "_").slice(0, 30);
    XLSX.writeFile(wb, `Tabla_${nombre}_${colab.cod}.xlsx`);
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      {/* Header con botones exportar */}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 10 }}>
        <div>
          <div style={{ fontSize: 20, fontWeight: 700, color: COLORS.texto }}>{colab.nombres}</div>
          <div style={{ fontSize: 13, color: COLORS.textoMuted, marginTop: 4 }}>
            Cód: {colab.cod} · DNI: {colab.doc} · {colab.gerencia}
          </div>
          <div style={{ display: "flex", gap: 20, marginTop: 6, flexWrap: "wrap" }}>
            <div style={{ fontSize: 12, color: COLORS.textoSecundario }}>
              <span style={{ color: COLORS.textoMuted }}>Fecha de Ingreso: </span>
              <strong>{fmtDate(colab.feIngreso)}</strong>
              {colab.feIngreso && colab.fechaCorte &&
                colab.feIngreso.getTime() !== colab.fechaCorte.getTime() && (
                <span style={{ marginLeft: 6, background: "rgba(139,92,246,0.12)", color: "#A78BFA", borderRadius: 4, padding: "1px 6px", fontSize: 11, fontWeight: 600 }}>Reingreso</span>
              )}
            </div>
            <div style={{ fontSize: 12, color: COLORS.textoSecundario }}>
              <span style={{ color: COLORS.textoMuted }}>Fecha de Corte: </span>
              <strong style={{ color: COLORS.accentLight }}>{fmtDate(colab.fechaCorte)}</strong>
            </div>
          </div>
        </div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <button onClick={exportarDetalleExcel} style={{
            background: "#F0FDF4", border: "1px solid #86EFAC",
            color: COLORS.positivo, borderRadius: 10, padding: "10px 18px",
            cursor: "pointer", fontSize: 12, fontWeight: 700,
            display: "flex", alignItems: "center", gap: 6,
          }}>⬇ Exportar detalle</button>
          <button onClick={exportarTablaPlana} style={{
            background: "#EFF6FF", border: "1px solid #93C5FD",
            color: "#1D4ED8", borderRadius: 10, padding: "10px 18px",
            cursor: "pointer", fontSize: 12, fontWeight: 700,
            display: "flex", alignItems: "center", gap: 6,
          }}>⬇ Tabla plana</button>
        </div>
      </div>

      {/* KPIs */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(6, 1fr)", gap: 10 }}>
        {[
          ["Total ganados",   colab.totalGanados,                                              COLORS.texto],
          ["Total gozados",   colab.totalGozados,                                              COLORS.accentLight],
          ["Comprado",        colab.totalComprados || 0,                                       "#F97316"],
          ["Por gozar",       colab.totalPorGozar,                                             COLORS.positivo],
          ["Indemnización",   (colab.diasIndemnizacion || 0) + (colab.diasVencidas || 0),      "#F97316"],
          ["Total vencidas",  colab.totalVencidas || 0,                                        "#DC2626"],
        ].map(([l, v, c]) => (
          <div key={l} style={{
            background: COLORS.surfaceHigh, borderRadius: 10,
            padding: "12px 14px", border: `0.5px solid ${COLORS.border}`,
            textAlign: "center",
          }}>
            <div style={{ fontSize: 11, color: COLORS.textoMuted, marginBottom: 4 }}>{l}</div>
            <div style={{ fontSize: 20, fontWeight: 700, color: c }}>{Math.round(v * 100) / 100}</div>
          </div>
        ))}
      </div>

      {/* Estructura de períodos */}
      <div style={{ fontSize: 13, fontWeight: 600, color: COLORS.textoMuted, letterSpacing: "0.05em", textTransform: "uppercase" }}>
        Estructura de Períodos
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {[...colab.periodos].reverse().map((p) => {
          const cfg = TIPO_CONFIG[p.tipo] || TIPO_CONFIG.TRUNCA;
          const neg = p.saldo < 0;
          return (
            <div key={p.id} style={{
              background: COLORS.surfaceHigh, borderRadius: 12,
              border: `1px solid ${neg ? "#EF444444" : COLORS.border}`,
              overflow: "hidden",
            }}>
              <div style={{
                display: "flex", alignItems: "center", gap: 12,
                padding: "14px 18px",
                borderLeft: `4px solid ${cfg.color}`,
              }}>
                <Badge tipo={p.tipo} small />
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 13, color: COLORS.texto, fontWeight: 600 }}>
                    {p.esAjuste
                      ? `Año 0 — Ajuste Vacacional${p.obs ? ` (${p.obs})` : ""}`
                      : `Año ${p.anio} — ${fmtDate(p.inicio)} al ${fmtDate(p.fin)}`}
                  </div>
                  {p.fechaVencimiento && (() => {
                    const venceEl = new Date(p.fechaVencimiento.getTime() + 86400000);
                    return (
                      <div style={{ fontSize: 11, color: COLORS.textoMuted, marginTop: 3, display: "flex", gap: 12, flexWrap: "wrap" }}>
                        <span>Gozar hasta: <strong style={{ color: COLORS.textoSecundario }}>{fmtDate(p.fechaVencimiento)}</strong></span>
                        <span>Vence el: <strong style={{ color: p.tipo === "PENDIENTE" ? "#F59E0B" : p.tipo === "VENCIDA" ? "#EF4444" : "#F97316" }}>{fmtDate(venceEl)}</strong></span>
                      </div>
                    );
                  })()}
                  {p.diasExtension > 0 && (
                    <div style={{ marginTop: 4, display: "inline-flex", alignItems: "center", gap: 5, background: "rgba(217,119,6,0.08)", border: "1px solid rgba(217,119,6,0.25)", borderRadius: 6, padding: "2px 8px" }}>
                      <span style={{ fontSize: 10 }}>⏳</span>
                      <span style={{ fontSize: 11, color: COLORS.pendiente, fontWeight: 600 }}>
                        {p.diasExtensionSubsidio > 0 && `Ampliado +${p.diasExtensionSubsidio} días por Subsidio Enfermedad (D.L. 713)`}{p.diasExtensionSubsidio > 0 && p.diasExtensionLSG > 0 && " · "}{p.diasExtensionLSG > 0 && `Ampliado +${p.diasExtensionLSG} días por Licencia Sin Goce`}
                      </span>
                    </div>
                  )}
                </div>
                <div style={{ display: "flex", gap: 16, alignItems: "center" }}>
                  <div style={{ textAlign: "center" }}>
                    <div style={{ fontSize: 10, color: COLORS.textoMuted }}>Base</div>
                    <div style={{ fontSize: 14, fontWeight: 600, color: COLORS.texto }}>{p.diasBase}</div>
                  </div>
                  {(p.diasComprados || 0) > 0 && (
                    <div style={{ textAlign: "center" }}>
                      <div style={{ fontSize: 10, color: COLORS.textoMuted }}>Comprado</div>
                      <div style={{ fontSize: 14, fontWeight: 600, color: "#F97316" }}>{p.diasComprados}</div>
                    </div>
                  )}
                  <div style={{ textAlign: "center" }}>
                    <div style={{ fontSize: 10, color: COLORS.textoMuted }}>Gozado</div>
                    <div style={{ fontSize: 14, fontWeight: 600, color: COLORS.accentLight }}>{p.diasGozados}</div>
                  </div>
                  {(p.tipo === "INDEMNIZACION" || (p.tipo === "VENCIDA" && p.diasIndemnizacionBruta > 0)) && p.diasIndemnizacionBruta !== null && (
                    <div style={{ textAlign: "center" }}>
                      <div style={{ fontSize: 10, color: COLORS.textoMuted }}>Indemn.</div>
                      <div style={{ fontSize: 14, fontWeight: 600, color: p.diasIndemnizacionBruta >= 0 ? "#F97316" : "#EF4444" }}>
                        {p.diasIndemnizacionBruta >= 0 ? "" : "▼ "}{Math.abs(p.diasIndemnizacionBruta).toFixed(2)}
                      </div>
                    </div>
                  )}
                  <div style={{ textAlign: "center" }}>
                    <div style={{ fontSize: 10, color: COLORS.textoMuted }}>Saldo</div>
                    <SaldoBadge saldo={p.saldo} />
                  </div>
                </div>
              </div>

              {/* Goces */}
              {p.goces.length > 0 && (
                <div style={{ padding: "0 18px 14px", display: "flex", flexDirection: "column", gap: 6 }}>
                  <div style={{ fontSize: 11, color: COLORS.textoMuted, fontWeight: 600, marginBottom: 4, marginTop: 4 }}>
                    GOCES EN ESTE PERÍODO ({p.goces.length})
                  </div>
                  {p.goces.map((g, gi) => (
                    <div key={gi} onClick={() => setGoceSeleccionado(g)}
                      style={{
                        display: "flex", justifyContent: "space-between", alignItems: "center",
                        padding: "8px 12px", background: COLORS.bg,
                        borderRadius: 8, border: `0.5px solid ${COLORS.border}`,
                        cursor: "pointer",
                      }}
                      onMouseEnter={(e) => e.currentTarget.style.background = COLORS.surfaceHigh}
                      onMouseLeave={(e) => e.currentTarget.style.background = COLORS.bg}
                    >
                      <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
                        <span style={{ fontSize: 12, color: COLORS.textoSecundario }}>{fmtDate(g.inicio)} → {fmtDate(g.fin)}</span>
                        {g.obs && <span style={{ fontSize: 10, background: "rgba(16,185,129,0.12)", color: "#10B981", borderRadius: 4, padding: "1px 6px", fontWeight: 600 }}>{g.obs}</span>}
                        {g.acuerdoInfo?.porConvenio && <span style={{ fontSize: 10, background: "rgba(99,102,241,0.12)", color: "#6366F1", borderRadius: 4, padding: "1px 6px", fontWeight: 600, border: "1px solid rgba(99,102,241,0.25)" }}>📋 Por convenio</span>}
                      </div>
                      <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                        {g.consumoDesdeTracas && <span style={{ fontSize: 11, color: "#A78BFA", fontWeight: 600 }}>⚠ Truncas</span>}
                        <span style={{ fontSize: 12, fontWeight: 700, color: COLORS.accentLight }}>{g.dias} días</span>
                        <span style={{ fontSize: 11, color: COLORS.textoMuted }}>▶ ver detalle</span>
                      </div>
                    </div>
                  ))}
                </div>
              )}

              {/* Compras */}
              {p.compras && p.compras.length > 0 && (
                <div style={{ padding: "0 18px 14px", display: "flex", flexDirection: "column", gap: 6 }}>
                  <div style={{ fontSize: 11, color: "#F97316", fontWeight: 600, marginBottom: 4, marginTop: 4 }}>
                    🛒 COMPRAS EN ESTE PERÍODO ({p.compras.length})
                  </div>
                  {p.compras.map((c, ci) => (
                    <div key={ci} onClick={() => setCompraSeleccionada(c)}
                      style={{
                        display: "flex", justifyContent: "space-between", alignItems: "center",
                        padding: "8px 12px", background: "rgba(249,115,22,0.05)",
                        borderRadius: 8, border: "1px solid rgba(249,115,22,0.2)",
                        cursor: "pointer",
                      }}
                      onMouseEnter={(e) => e.currentTarget.style.background = "rgba(249,115,22,0.1)"}
                      onMouseLeave={(e) => e.currentTarget.style.background = "rgba(249,115,22,0.05)"}
                    >
                      <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
                        {c.obs && <span style={{ fontSize: 10, background: "rgba(16,185,129,0.12)", color: "#10B981", borderRadius: 4, padding: "1px 6px", fontWeight: 600 }}>{c.obs}</span>}
                      </div>
                      <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                        <span style={{ fontSize: 12, fontWeight: 700, color: "#F97316" }}>{c.dias} días</span>
                        <span style={{ fontSize: 11, color: COLORS.textoMuted }}>▶ ver detalle</span>
                      </div>
                    </div>
                  ))}
                </div>
              )}

              {/* Notas */}
              {(p.diasCedidosAntiguos > 0 || p.diasCedidosHaciaExceso > 0 || (p.diasBase > 0 && p.diasGozados > p.diasBase) || p.compras?.length > 0 || p.diasExtension > 0 || p.goces?.some(g => g.acuerdoInfo?.porConvenio)) && (
                <div style={{ padding: "0 18px 14px", display: "flex", flexDirection: "column", gap: 8 }}>
                  {p.compras?.length > 0 && (
                    <div style={{ padding: "8px 12px", background: "rgba(249,115,22,0.06)", border: "0.5px solid rgba(249,115,22,0.25)", borderRadius: 8, display: "flex", alignItems: "flex-start", gap: 8 }}>
                      <span style={{ fontSize: 14 }}>🛒</span>
                      <span style={{ fontSize: 11, color: "#92400E", lineHeight: 1.5 }}>
                        {p.compras.length === 1
                          ? <>Se realizó <strong>1 compra</strong> de <strong>{p.compras[0].dias} días</strong> el {fmtDate(p.compras[0].inicio)}. Días compensados económicamente.</>
                          : <>Se realizaron <strong>{p.compras.length} compras</strong> por un total de <strong>{p.compras.reduce((s, c) => s + c.dias, 0)} días</strong> compensados.</>}
                      </span>
                    </div>
                  )}
                  {p.diasExtension > 0 && (
                    <div style={{ padding: "8px 12px", background: "rgba(139,92,246,0.06)", border: "0.5px solid rgba(139,92,246,0.25)", borderRadius: 8, display: "flex", alignItems: "flex-start", gap: 8 }}>
                      <span style={{ fontSize: 14 }}>🏥</span>
                      <span style={{ fontSize: 11, color: "#5B21B6", lineHeight: 1.5 }}>
                        {p.diasExtensionSubsidio > 0 && <span>Período ampliado <strong>+{p.diasExtensionSubsidio} días</strong> por subsidio de enfermedad (D.L. 713). </span>}{p.diasExtensionLSG > 0 && <span>Período ampliado <strong>+{p.diasExtensionLSG} días</strong> por Licencia Sin Goce.</span>}
                      </span>
                    </div>
                  )}
                  {p.goces?.some(g => g.acuerdoInfo?.porConvenio) && (
