          <div style={{ background: COLORS.surface, borderRadius: 12, border: `0.5px solid ${COLORS.border}`, padding: 24 }}>
            <div style={{ fontSize: 13, fontWeight: 600, color: COLORS.texto, marginBottom: 8 }}>1. Descarga la plantilla Excel</div>
            <div style={{ fontSize: 12, color: COLORS.textoMuted, marginBottom: 14 }}>Columnas: Código · DNI · F. Inicio (DD/MM/AAAA) · F. Fin (DD/MM/AAAA) · Adelanto (SI/NO, opcional)</div>
            <button onClick={generarPlantilla} style={{ background: "#F0FDF4", border: `0.5px solid #86EFAC`, color: COLORS.positivo, borderRadius: 8, padding: "9px 18px", fontSize: 13, fontWeight: 500, cursor: "pointer" }}>
              ⬇️ Descargar Plantilla_Solicitudes_Vacaciones.xlsx
            </button>
          </div>

          <div style={{ background: COLORS.surface, borderRadius: 12, border: `0.5px solid ${COLORS.border}`, padding: 24 }}>
            <div style={{ fontSize: 13, fontWeight: 600, color: COLORS.texto, marginBottom: 14 }}>2. Carga el Excel con las solicitudes</div>
            <label style={{ display: "inline-flex", alignItems: "center", gap: 8, background: COLORS.accent, color: "white", borderRadius: 8, padding: "9px 18px", fontSize: 13, fontWeight: 500, cursor: "pointer" }}>

              <input type="file" accept=".xlsx,.xls" onChange={cargarExcelMasivo} style={{ display: "none" }} />
            </label>
          </div>

          {(
            <div style={{ background: COLORS.surface, borderRadius: 12, border: `0.5px solid ${COLORS.border}`, padding: 24 }}>
              <div style={{ fontSize: 13, fontWeight: 600, color: COLORS.texto, marginBottom: 10 }}>
                Adelanto de remuneración vacacional <span style={{ color: COLORS.vencida }}>*</span>
                <span style={{ fontSize: 11, fontWeight: 400, color: COLORS.textoMuted, marginLeft: 8 }}>(solo para las filas sin la columna &quot;Adelanto&quot; llena en el Excel)</span>
              </div>
              <div style={{ display: "flex", gap: 10, marginBottom: bpAdmin ? 16 : 0 }}>
                {[{ v: true, l: "Sí" }, { v: false, l: "No" }].map(o => (
                  <div key={o.l}
                    onClick={() => setAdelantoRemun(o.v)}
                    style={{
                      padding: "9px 22px", borderRadius: 8, cursor: "pointer",
                      background: adelantoRemun === o.v ? COLORS.accent + "22" : COLORS.bg,
                      border: adelantoRemun === o.v ? "2px solid " + COLORS.accent : "0.5px solid " + COLORS.border,
                      fontSize: 13, fontWeight: adelantoRemun === o.v ? 700 : 500,
                      color: adelantoRemun === o.v ? COLORS.accent : COLORS.textoMuted,
                    }}>{o.l}</div>
                ))}
              </div>
              {bpAdmin && (
                <div style={{ marginBottom: 4 }}>
                  <div style={{ fontSize: 13, fontWeight: 600, color: COLORS.texto, marginBottom: 10 }}>Tipo de documento</div>

                    {[
                      { v: "COMPLETO", l: "Completo", d: "4 anotaciones" },
                      { v: "SIMPLE", l: "Simple", d: "solo adelanto" },
                    ].map(o => (
                      <div key={o.v}
                        onClick={() => setTipoPDF(o.v)}

                          padding: "9px 18px", borderRadius: 8, cursor: "pointer", textAlign: "center",
                          background: tipoPDF === o.v ? COLORS.accent + "22" : COLORS.bg,
                          border: tipoPDF === o.v ? "2px solid " + COLORS.accent : "0.5px solid " + COLORS.border,
                        }}>
                        <div style={{ fontSize: 13, fontWeight: tipoPDF === o.v ? 700 : 500, color: tipoPDF === o.v ? COLORS.accent : COLORS.textoMuted }}>{o.l}</div>
                        <div style={{ fontSize: 10, color: COLORS.textoMuted, marginTop: 2 }}>{o.d}</div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          )}

                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {filasMasivo.map((f) => (
                      <tr key={f.idx} style={{ borderBottom: `0.5px solid ${COLORS.border}`, background: f.estado === "ERROR" ? "#FEF2F2" : f.estado === "ALERTA" ? "#FFFBEB" : "transparent" }}>

                        <td style={{ padding: "9px 10px", color: COLORS.textoSecundario }}>{f.fIniStr}</td>
                        <td style={{ padding: "9px 10px", color: COLORS.textoSecundario }}>{f.fFinStr}</td>
                        <td style={{ padding: "9px 10px", fontWeight: 500, color: COLORS.texto }}>{f.diasSol > 0 ? f.diasSol : "—"}</td>

                          : adelantoRemun === false ? <span style={{ color: COLORS.textoMuted }}>No <span style={{ fontSize: 10 }}>(global)</span></span>
                          : <span style={{ color: COLORS.vencida }}>—</span>
                        }</td>
                        <td style={{ padding: "9px 10px" }}>
                          <span style={{ background: EC[f.estado] + "15", color: EC[f.estado], border: `0.5px solid ${EC[f.estado]}44`, borderRadius: 5, padding: "2px 8px", fontSize: 11, fontWeight: 500 }}>
                            {EI[f.estado]}
                          </span>
                        </td>
                        <td style={{ padding: "9px 10px", fontSize: 11, color: f.estado === "ERROR" ? COLORS.vencida : COLORS.pendiente }}>{f.motivo || "—"}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
              <div style={{ display: "flex", gap: 10, marginTop: 20, flexWrap: "wrap" }}>
                {filasMasivo.filter((f) => f.estado === "OK").length > 0 && (

                  </button>
                )}
                {filasMasivo.filter((f) => f.estado === "ALERTA").length > 0 && (
                  <button onClick={() => generarMasivo(false)} disabled={procesandoMasivo}
                    style={{ background: "#FFFBEB", color: COLORS.pendiente, border: `0.5px solid #FCD34D`, borderRadius: 8, padding: "10px 20px", fontSize: 13, fontWeight: 500, cursor: "pointer", opacity: procesandoMasivo ? 0.6 : 1 }}>
                    {"Generar OK + Alertas (" + filasMasivo.filter((f) => f.estado !== "ERROR").length + ")"}
                  </button>
                )}
              </div>
              {exitoMasivo && (
                <div style={{ marginTop: 14, padding: "12px 16px", background: "rgba(22,163,74,0.08)", border: `0.5px solid #86EFAC`, borderRadius: 10, color: COLORS.positivo, fontSize: 13, fontWeight: 500 }}>

                  <div style={{ fontWeight: 400, marginTop: 6, fontSize: 12 }}>

                  </div>
                </div>
              )}
            </div>
          )}
        </>

        const gozadosPropios = pendienteConvenio ? (pendienteConvenio.diasGozados || 0) : 0;
        const absorbidosPrevios = pendienteConvenio
          ? Math.max(0, Math.round((
              (pendienteConvenio.diasBase ?? pendienteConvenio.base ?? 0)
              - (pendienteConvenio.saldo || 0)
              - gozadosPropios
              - (pendienteConvenio.diasComprados || 0)
            ) * 100) / 100)
          : 0;
        const diasGozadosPendiente = Math.round((gozadosPropios + absorbidosPrevios) * 100) / 100;

          } catch(e) { console.error("Error registrando convenio:", e); }
        };

        return (
          <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
            {/* Búsqueda colaborador */}
            <div style={{ background: COLORS.surface, borderRadius: 12, border: `0.5px solid ${COLORS.border}`, padding: 24 }}>
              <div style={{ fontSize: 13, fontWeight: 600, color: COLORS.texto, marginBottom: 12 }}>1. Selecciona el colaborador</div>
              <div style={{ position: "relative" }}>
                <input placeholder="🔍 Buscar por nombre, código o DNI..."
                  value={colabConvenio ? colabConvenio.nombres : busquedaConvenio}
                  onChange={e => { setBusquedaConvenio(e.target.value); setColabConvenio(null); }}
                  style={inputStyle} />
                {sugerenciasConvenio.length > 0 && (
                  <div style={{ position: "absolute", top: "100%", left: 0, right: 0, background: "#fff", border: `1px solid ${COLORS.border}`, borderRadius: 8, zIndex: 100, maxHeight: 220, overflowY: "auto", boxShadow: "0 4px 12px rgba(0,0,0,0.08)" }}>
                    {sugerenciasConvenio.map(c => (
                      <div key={c.cod} onClick={() => { setColabConvenio(c); setBusquedaConvenio(""); }}
                        style={{ padding: "10px 14px", cursor: "pointer", borderBottom: `1px solid ${COLORS.border}`, fontSize: 13 }}
                        onMouseEnter={e => e.currentTarget.style.background = COLORS.bg}
                        onMouseLeave={e => e.currentTarget.style.background = "transparent"}>
                        <span style={{ fontWeight: 600 }}>{c.nombres}</span>
                        <span style={{ color: COLORS.textoMuted, fontSize: 11, marginLeft: 8 }}>{c.gerencia} · Cód {c.cod}</span>
                      </div>
                    ))}
                  </div>
                )}
              </div>

              {colabConvenio && (
                <div style={{ marginTop: 12, padding: "12px 16px", background: COLORS.bg, borderRadius: 10, border: `0.5px solid ${COLORS.border}`, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <div>
                    <div style={{ fontWeight: 700, fontSize: 14, color: COLORS.texto }}>{colabConvenio.nombres}</div>
                    <div style={{ fontSize: 11, color: COLORS.textoMuted, marginTop: 2 }}>{colabConvenio.gerencia} · DNI: {colabConvenio.doc} · Cód: {colabConvenio.cod}</div>
                  </div>
                  <button onClick={() => { setColabConvenio(null); setBusquedaConvenio(""); }}
                    style={{ background: "transparent", border: `1px solid ${COLORS.border}`, borderRadius: 6, padding: "4px 10px", cursor: "pointer", fontSize: 12, color: COLORS.textoMuted }}>Cambiar</button>
                </div>
              )}
            </div>

            {/* Resultado */}
            {colabConvenio && (
              pendienteConvenio ? (
                <div style={{ background: COLORS.surface, borderRadius: 12, border: `0.5px solid ${COLORS.border}`, padding: 24, display: "flex", flexDirection: "column", gap: 16 }}>
                  <div style={{ display: "flex", gap: 16, flexWrap: "wrap" }}>
                    <div style={{ background: "rgba(26,92,46,0.07)", borderRadius: 10, padding: "12px 20px", textAlign: "center" }}>
                      <div style={{ fontSize: 10, color: COLORS.textoMuted, marginBottom: 4 }}>DÍAS A ACUMULAR</div>
                      <div style={{ fontSize: 22, fontWeight: 800, color: COLORS.accent }}>{Math.round(pendienteConvenio.saldo * 100) / 100}</div>
                    </div>
                    <div style={{ background: "rgba(26,92,46,0.07)", borderRadius: 10, padding: "12px 20px", textAlign: "center" }}>
                      <div style={{ fontSize: 10, color: COLORS.textoMuted, marginBottom: 4 }}>PERÍODO</div>
                      <div style={{ fontSize: 16, fontWeight: 700, color: COLORS.texto }}>
                        {pendienteConvenio.inicio?.getFullYear()} — {pendienteConvenio.fin?.getFullYear()}
                      </div>
                    </div>
                    <div style={{ background: cumpleMinimo ? "rgba(26,92,46,0.07)" : "rgba(220,38,38,0.07)", borderRadius: 10, padding: "12px 20px", textAlign: "center" }}>
                      <div style={{ fontSize: 10, color: COLORS.textoMuted, marginBottom: 4 }}>DÍAS GOZADOS</div>
                      <div style={{ fontSize: 22, fontWeight: 800, color: cumpleMinimo ? COLORS.positivo : "#DC2626" }}>{diasGozadosPendiente}</div>
                      <div style={{ fontSize: 9, color: cumpleMinimo ? COLORS.positivo : "#DC2626" }}>{cumpleMinimo ? "✅ Cumple mínimo" : "⚠ Mínimo 7 días"}</div>
                      {absorbidosPrevios > 0 && (
                        <div style={{ fontSize: 8.5, color: COLORS.textoMuted, marginTop: 3, lineHeight: 1.3 }}>
                          {gozadosPropios > 0 ? gozadosPropios + " en el período · " : ""}{absorbidosPrevios} gozados por adelantado
                        </div>
                      )}
                    </div>
                  </div>
                  {!cumpleMinimo && (
                    <div style={{ background: "rgba(220,38,38,0.05)", border: "1px solid rgba(220,38,38,0.2)", borderRadius: 10, padding: "12px 16px", color: "#DC2626", fontSize: 13 }}>
                      ⚠️ Según el Art. 18° del D.L. N° 713, el trabajador debe haber gozado al menos <strong>7 días</strong> del período pendiente para poder acumular el resto. Este colaborador solo ha gozado <strong>{diasGozadosPendiente} días</strong>.
                    </div>
                  )}
                  {cumpleMinimo && (
                    <div>
                      <div style={{ fontSize: 12, fontWeight: 600, color: COLORS.texto, marginBottom: 6 }}>Fecha del convenio</div>
                      <input type="date" value={fechaConvenio} onChange={e => setFechaConvenio(e.target.value)}
                        style={{ ...inputStyle, colorScheme: "light", maxWidth: 220 }} />
                    </div>
                  )}
                  {cumpleMinimo && (
                    <button onClick={generarConvenio} style={{
                      background: COLORS.accent, color: "#fff", border: "none", borderRadius: 10,
                      padding: "12px 28px", fontSize: 14, fontWeight: 700, cursor: "pointer", alignSelf: "flex-start"
                    }}>📝 Generar Convenio</button>
                  )}
                </div>
              ) : (
                <div style={{ background: "rgba(220,38,38,0.05)", border: "1px solid rgba(220,38,38,0.2)", borderRadius: 10, padding: "14px 18px", color: "#DC2626", fontSize: 13 }}>
                  ⚠️ <strong>{colabConvenio.nombres}</strong> no tiene días pendientes disponibles para acumular.
                </div>
              )
            )}
          </div>
        );
      })()}

// ─── PÁGINA: CESADOS ──────────────────────────────────────────────────────────
function PaginaCesados({ colaboradores, fechaCorteGlobal }) {
  const [gerencia, setGerencia] = React.useState("Todas");
  const [busqueda, setBusqueda] = React.useState("");
  const [tooltip, setTooltip] = React.useState(null);

  const gerencias = React.useMemo(() => {
    const g = new Set(colaboradores.filter(c => c.esCesado).map(c => c.gerencia).filter(Boolean));
    return ["Todas", ...Array.from(g).sort()];
  }, [colaboradores]);

  const cesados = React.useMemo(() => {
    return colaboradores.filter(c => c.esCesado).filter(c => {
      if (gerencia !== "Todas" && c.gerencia !== gerencia) return false;
      if (busqueda.trim()) {
        const q = busqueda.toLowerCase();
        if (!c.nombres.toLowerCase().includes(q) && !String(c.cod).includes(q) && !c.doc.includes(q)) return false;
      }
      return true;
    }).sort((a,b) => b.fechaCese - a.fechaCese);
  }, [colaboradores, gerencia, busqueda]);

  const totalPendientes = cesados.reduce((s,c) => s + (c.diasPendientes || 0), 0);
  const totalVencidos = cesados.reduce((s,c) => s + (c.totalVencidas || 0), 0);
  const totalIndemn = cesados.reduce((s,c) => s + (c.diasIndemnizacion || 0), 0);

  const exportarExcel = () => {
    const filas = cesados.map(c => ({
      "Código": c.cod,
      "Apellidos y Nombres": c.nombres,
      "DNI": c.doc,
      "Gerencia": c.gerencia,
      "Unidad Org.": c.unidadOrg,
      "Fecha cese": fmtDate(c.fechaCese),
      "Días pendientes": Math.round((c.diasPendientes || 0) * 100) / 100,
      "Días vencidos": Math.round((c.totalVencidas || 0) * 100) / 100,
      "Días truncos": Math.round((c.diasTrunca || 0) * 100) / 100,
      "Indemnización": Math.round((c.diasIndemnizacion || 0) * 100) / 100,
    }));
    crearEstiloExcel(filas, ["Código","Apellidos y Nombres","DNI","Gerencia","Unidad Org.","Fecha cese","Días pendientes","Días vencidos","Días truncos","Indemnización"], "Cesados", "Colaboradores_Cesados.xlsx", { "Apellidos y Nombres": { wch: 30 }, "Gerencia": { wch: 28 } });
  };

  const tdS = { padding: "10px 14px", fontSize: 12, borderBottom: "0.5px solid " + COLORS.border, color: COLORS.texto, whiteSpace: "nowrap" };

  const showTooltipVenc = (e, c) => {
    e.stopPropagation();
    const rect = e.currentTarget.getBoundingClientRect();
    const periodosVenc = c.periodos.filter(p => (p.tipo === "VENCIDA" || p.tipo === "INDEMNIZACION") && (p.diasVencidosReales || p.saldo || 0) > 0);
    if (!periodosVenc.length) return;
    setTooltip({
      x: rect.left, y: rect.bottom + 4,
      items: periodosVenc.map(p => ({
        periodo: (p.inicio ? p.inicio.getFullYear() : "") + "-" + (p.fin ? p.fin.getFullYear() : ""),
        dias: Math.round((p.tipo === "INDEMNIZACION" ? p.saldo : p.diasVencidosReales) * 100) / 100,
        tipo: p.tipo,
      }))
    });
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }} onClick={() => setTooltip(null)}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 12 }}>
        <div>
          <div style={{ fontSize: 22, fontWeight: 700, color: COLORS.texto }}>👤 Cesados</div>
          <div style={{ fontSize: 13, color: COLORS.textoMuted, marginTop: 2 }}>Colaboradores con fecha de cese · Cálculo hasta fecha de cese o corte {fmtDate(fechaCorteGlobal)}</div>
        </div>
        {cesados.length > 0 && (
          <button onClick={exportarExcel} style={{ background: COLORS.accent, color: "#fff", border: "none", borderRadius: 10, padding: "10px 20px", fontSize: 13, fontWeight: 700, cursor: "pointer" }}>⬇ Exportar Excel</button>
        )}
      </div>

      <div style={{ background: COLORS.surface, borderRadius: 12, border: "0.5px solid " + COLORS.border, padding: 16, display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center" }}>
        <input placeholder="🔍 Buscar colaborador, código o DNI..."
          value={busqueda} onChange={e => setBusqueda(e.target.value)}
          style={{ background: COLORS.surfaceHigh, border: "0.5px solid " + COLORS.border, color: COLORS.texto, borderRadius: 10, padding: "8px 14px", fontSize: 12, outline: "none", flex: 1, minWidth: 200 }} />
        <select value={gerencia} onChange={e => setGerencia(e.target.value)}
          style={{ background: COLORS.surfaceHigh, border: "0.5px solid " + COLORS.border, color: COLORS.texto, borderRadius: 10, padding: "8px 14px", fontSize: 12, outline: "none" }}>
          {gerencias.map(g => <option key={g} value={g}>{g === "Todas" ? "Todas las gerencias" : (g.length > 28 ? g.slice(0,28)+"..." : g)}</option>)}
        </select>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(130px, 1fr))", gap: 10 }}>

// ─── PÁGINA: LICENCIAS SIN GOCE ───────────────────────────────────────────────
function PaginaLSG({ colaboradores, bpAdmin, bpGerencias }) {
  const [gerencia, setGerencia] = React.useState("Todas");
  const [busqueda, setBusqueda] = React.useState("");

  const gerencias = React.useMemo(() => {
    const g = new Set(colaboradores.map(c => c.gerencia).filter(Boolean));
    return ["Todas", ...Array.from(g).sort()];
  }, [colaboradores]);

  const colabsFiltrados = React.useMemo(() => {
    return colaboradores.filter(c => {
      if (!bpAdmin && bpGerencias && !bpGerencias.includes(c.gerencia)) return false;
      if (gerencia !== "Todas" && c.gerencia !== gerencia) return false;
      if (!(c.eventosLSG && c.eventosLSG.length > 0)) return false;
      if (busqueda.trim()) {
        const q = busqueda.toLowerCase();
        if (!c.nombres.toLowerCase().includes(q) && !String(c.cod).includes(q) && !c.doc.includes(q)) return false;
      }
      return true;
    });
  }, [colaboradores, bpAdmin, bpGerencias, gerencia, busqueda]);

  const totalLSG = colabsFiltrados.reduce((s, c) => s + (c.diasExtensionLSG || 0), 0);
  const totalEventos = colabsFiltrados.reduce((s, c) => s + (c.eventosLSG?.length || 0), 0);

  const tdS = { padding: "10px 14px", fontSize: 12, borderBottom: "0.5px solid " + COLORS.border, color: COLORS.texto, whiteSpace: "nowrap" };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div>
        <div style={{ fontSize: 22, fontWeight: 700, color: COLORS.texto }}>🏥 Licencias Sin Goce</div>
        <div style={{ fontSize: 13, color: COLORS.textoMuted, marginTop: 2 }}>Colaboradores con extensión de período por LSG ≥ 30 días consecutivos</div>
      </div>

      {/* Filtros */}
      <div style={{ background: COLORS.surface, borderRadius: 12, border: "0.5px solid " + COLORS.border, padding: 16, display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center" }}>
        <input placeholder="🔍 Buscar colaborador, código o DNI..."
          value={busqueda} onChange={e => setBusqueda(e.target.value)}
          style={{ background: COLORS.surfaceHigh, border: "0.5px solid " + COLORS.border, color: COLORS.texto, borderRadius: 10, padding: "8px 14px", fontSize: 12, outline: "none", flex: 1, minWidth: 200 }} />
        <select value={gerencia} onChange={e => setGerencia(e.target.value)}
          style={{ background: COLORS.surfaceHigh, border: "0.5px solid " + COLORS.border, color: COLORS.texto, borderRadius: 10, padding: "8px 14px", fontSize: 12, outline: "none" }}>
          {gerencias.map(g => <option key={g} value={g}>{g === "Todas" ? "Todas las gerencias" : (g.length > 28 ? g.slice(0,28)+"..." : g)}</option>)}
        </select>
      </div>

      {/* KPIs */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(130px, 1fr))", gap: 10 }}>
        {[
          { label: "Colaboradores", value: colabsFiltrados.length, color: COLORS.texto },
          { label: "Total eventos LSG", value: totalEventos, color: "#5B21B6" },
          { label: "Total días extensión", value: Math.round(totalLSG * 100) / 100, color: "#D97706" },
        ].map(k => (
          <div key={k.label} style={{ background: COLORS.surface, borderRadius: 10, border: "0.5px solid " + COLORS.border, padding: "12px 14px" }}>
            <div style={{ fontSize: 11, color: COLORS.textoMuted, marginBottom: 4 }}>{k.label}</div>
            <div style={{ fontSize: 20, fontWeight: 700, color: k.color }}>{k.value}</div>
          </div>
        ))}
      </div>

      {/* Tabla */}
      {colabsFiltrados.length === 0 ? (
        <div style={{ textAlign: "center", padding: 60, color: COLORS.textoMuted, background: COLORS.surface, borderRadius: 12, border: "0.5px solid " + COLORS.border }}>
          <div style={{ fontSize: 32, marginBottom: 12 }}>🏥</div>
          <div style={{ fontSize: 14 }}>{busqueda || gerencia !== "Todas" ? "Sin resultados con ese filtro" : "No hay colaboradores con LSG cargada"}</div>
          <div style={{ fontSize: 12, marginTop: 6 }}>Importa el archivo 08__Licencias.xlsx para ver los datos</div>
        </div>
      ) : (
        <div style={{ background: COLORS.surface, borderRadius: 12, border: "0.5px solid " + COLORS.border, overflow: "hidden" }}>
          <div style={{ overflowX: "auto" }}>
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12 }}>
              <thead>
                <tr style={{ background: COLORS.surfaceHigh }}>
                  {["Cód","Colaborador","Gerencia","Unidad Org.", ...(!bpAdmin ? ["CECO"] : []), "Eventos LSG","Días extensión total","Detalle"].map(h => (
                    <th key={h} style={{ padding: "10px 14px", textAlign: "left", fontSize: 11, fontWeight: 600, color: COLORS.textoMuted, borderBottom: "0.5px solid " + COLORS.border, whiteSpace: "nowrap" }}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {colabsFiltrados.map(c => (
                  <tr key={c.cod} style={{ borderBottom: "0.5px solid " + COLORS.border }}>

                    <td style={{ ...tdS }}>

                    <td style={{ ...tdS, fontSize: 11, color: COLORS.textoSecundario }}>{c.unidadOrg || "—"}</td>
                    {!bpAdmin && <td style={{ ...tdS, fontSize: 11, color: COLORS.textoSecundario }}>{c.ceco || "—"}</td>}
