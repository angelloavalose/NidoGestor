  { id: "alertas",        icon: "🔔",  label: "Alertas" },
  { id: "historial",      icon: "📆",  label: "Historial Venc." },
  { id: "incapacidades",  icon: "🏥",  label: "Incapacidades" },
  { id: "convenios",      icon: "📋",  label: "Convenios Vac." },
  { id: "goces",          icon: "🏖",  label: "Goces Vac." },
  { id: "compras",        icon: "🛒",  label: "Compras Vac." },
  { id: "solicitud",      icon: "📄",  label: "Solicitud Vacac." },
  { id: "solicitudes-fb",  icon: "🔥",  label: "Solicitudes Online", badge: true },
  { id: "usuarios-mgmt",   icon: "👥",  label: "Gestión Usuarios",  adminOnly: true },
  { id: "ficha",          icon: "🪪",  label: "Ficha Colaborador" },
];

function App({ bpGerencias = null, bpNombre = "", bpAdmin = false, onLogout = null }) {
  useEffect(() => { if (window.__setAdminStatus) window.__setAdminStatus(bpAdmin); }, [bpAdmin]);

  // Badge count for solicitudes
  const [solicitudesBadge, setSolicitudesBadge] = React.useState(0);
  useEffect(() => {
    if (!bpAdmin) return;
    const checkFb = setInterval(() => {
      if (window._firebase?.db) {
        clearInterval(checkFb);
        const { db, collection, onSnapshot, query, orderBy } = window._firebase;
        const q = query(collection(db, "solicitudes"), orderBy("fechaCreacion", "desc"));
        onSnapshot(q, snap => {
          setSolicitudesBadge(snap.docs.length);
        });
      }
    }, 500);
  }, [bpAdmin]);
  const [pagina, setPagina] = useState("importacion");
  const [colaboradores, setColaboradores] = useState([]);
  const [fechaCorteGlobal, setFechaCorteGlobal] = useState(null);
  const [rawData, setRawData] = useState(null);
  const [procesando, setProcesando] = useState(false);
  const [sidebarOpen, setSidebarOpen] = useState(true);
  const [recalculando, setRecalculando] = useState(false);
  const [filtroGerenciaAlertas, setFiltroGerenciaAlertas] = useState("Todas");
  const [colabSolicitud, setColabSolicitud] = useState(null);

  const onDatosProcessados = useCallback((data, fecha) => {
    setColaboradores(data);
    setFechaCorteGlobal(fecha);
    setProcesando(false);
    setPagina("dashboard");
  }, []);

  // Guardar datos crudos para recalcular sin reimportar
  const onRawData = useCallback((raw) => {
    setRawData(raw);
  }, []);

  // Recalcular todo con una nueva fecha de corte
  const recalcularConFecha = useCallback(async (nuevaFecha) => {
    if (!rawData) return;
    setRecalculando(true);
    setFechaCorteGlobal(nuevaFecha);
    await new Promise((r) => setTimeout(r, 30));
    const resultados = [];
    const CHUNK = 100;
    for (let i = 0; i < rawData.empleados.length; i += CHUNK) {
      const chunk = rawData.empleados.slice(i, i + CHUNK);
      for (const emp of chunk) {
        const goces = rawData.gocesPorCod[emp.cod] || [];
        const compras = rawData.comprasPorCod[emp.cod] || [];
        const ajuste = (rawData.ajustesPorCod || {})[emp.cod] || null;
        const incapacidades = (rawData.incapacidadesPorCod || {})[emp.cod] || [];
        const acuerdosR = (rawData.acuerdosPorCod || {})[emp.cod] || (rawData.acuerdosPorCod || {})[String(parseInt(emp.cod))] || [];
        resultados.push(procesarColaborador(emp, goces, nuevaFecha, compras, ajuste, incapacidades, acuerdosR));
      }
      await new Promise((r) => setTimeout(r, 0));
    }
    setColaboradores(resultados);
    setRecalculando(false);
  }, [rawData]);

  // Convertir fechaCorteGlobal a string YYYY-MM-DD para el input date
  const fechaInputValue = fechaCorteGlobal instanceof Date
    ? `${fechaCorteGlobal.getFullYear()}-${String(fechaCorteGlobal.getMonth()+1).padStart(2,"0")}-${String(fechaCorteGlobal.getDate()).padStart(2,"0")}`
    : "";

  const colaboradoresFiltradosBP = useMemo(() => {
    if (!bpGerencias || bpGerencias.length === 0 || bpAdmin) return colaboradores;
    return colaboradores.filter(c => {
      const ger = (c.gerencia || "").toUpperCase().trim();
      return bpGerencias.some(g => { const bg = g.toUpperCase().trim(); return ger === bg || ger.includes(bg) || bg.includes(ger); });
    });
  }, [colaboradores, bpGerencias, bpAdmin]);
  const tieneData = colaboradoresFiltradosBP.length > 0 || colaboradores.length > 0;

  return (
    <div style={{
      display: "flex", height: "100vh", background: COLORS.bg,
      color: COLORS.texto, fontFamily: "'DM Sans', 'Segoe UI', sans-serif",
      overflow: "hidden", fontSize: 13,
    }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap');
        * { box-sizing: border-box; }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #F5F5F5; }
        ::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #9CA3AF; }
        @keyframes spin { to { transform: rotate(360deg); } }
        select option { background: #FFFFFF; color: #111827; }
        button:hover { opacity: 0.9; }
      `}</style>

      {/* Sidebar */}
      <div style={{
        width: sidebarOpen ? 220 : 64, minWidth: sidebarOpen ? 220 : 64,
        background: "#1A5C2E", borderRight: `1px solid #14472A`,
        display: "flex", flexDirection: "column", transition: "width 0.25s, min-width 0.25s",
        overflow: "hidden",
      }}>
        {/* Logo */}
        <div style={{
          padding: "16px 12px", borderBottom: `1px solid #14472A`,
          display: "flex", alignItems: "center", gap: 10, cursor: "pointer",
          background: "#12391F",
        }} onClick={() => setSidebarOpen((o) => !o)}>
          <div style={{ width: 36, height: 36, flexShrink: 0, borderRadius: 8, overflow: "hidden", background: "white", display: "flex", alignItems: "center", justifyContent: "center" }}>
            <svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg" style={{ width: 36, height: 36 }}>
              <rect width="36" height="36" rx="6" fill="#1A5C2E"/>
              <text x="10" y="28" fontFamily="Georgia, serif" fontSize="26" fontWeight="bold" fill="white">C</text>
              <g transform="translate(17, 3) scale(0.55)">
                <ellipse cx="8" cy="14" rx="6" ry="5" fill="white"/>
                <circle cx="8" cy="7" r="4" fill="white"/>
                <polygon points="12,7 15,6 12,9" fill="#F59E0B"/>
                <circle cx="10" cy="6" r="0.8" fill="#1E7C32"/>
                <ellipse cx="5" cy="13" rx="3" ry="2" fill="#e8f5e9" transform="rotate(-20 5 13)"/>
                <ellipse cx="2" cy="12" rx="2.5" ry="1.5" fill="white" transform="rotate(-40 2 12)"/>
              </g>
            </svg>
          </div>
          {sidebarOpen && (
            <div style={{ overflow: "hidden" }}>
              <svg viewBox="0 0 160 22" xmlns="http://www.w3.org/2000/svg" style={{ width: 148, height: 18, display: "block" }}>
                <text x="0" y="16" fontFamily="Georgia, 'Times New Roman', serif" fontSize="15" fontWeight="bold" fill="white" letterSpacing="0.5">NidoGestor</text>
              </svg>
              <svg viewBox="0 0 160 18" xmlns="http://www.w3.org/2000/svg" style={{ width: 148, height: 15, display: "block" }}>
                <text x="0" y="13" fontFamily="Georgia, 'Times New Roman', serif" fontSize="13" fontStyle="italic" fill="rgba(255,255,255,0.9)">Vacacional</text>
              </svg>
              <div style={{ fontSize: 10, color: "rgba(255,255,255,0.55)", marginTop: 1, letterSpacing: "0.06em" }}>GH - La Calera</div>
            </div>
          )}
        </div>

        {/* Nav */}
        <nav style={{ flex: 1, padding: "12px 8px", display: "flex", flexDirection: "column", gap: 2 }}>
          {MENU_ITEMS.map((item) => {
            const active = pagina === item.id;
            const disabled = !tieneData && item.id !== "importacion";
            return (
              <button key={item.id}
                onClick={() => !disabled && setPagina(item.id)}
                title={!sidebarOpen ? item.label : ""}
                style={{
                  display: "flex", alignItems: "center", gap: 12,
                  padding: "9px 12px", borderRadius: 8, border: "none",
                  background: active ? "rgba(255,255,255,0.12)" : "transparent",
                  color: active ? "white" : disabled ? "rgba(255,255,255,0.2)" : "rgba(255,255,255,0.6)",
                  cursor: disabled ? "not-allowed" : "pointer",
                  fontSize: 12.5, fontWeight: active ? 500 : 400,
                  borderLeft: active ? "3px solid rgba(255,255,255,0.7)" : "3px solid transparent",
                  width: "100%", textAlign: "left", transition: "all 0.15s",
                  whiteSpace: "nowrap", overflow: "hidden",
                }}>
                <span style={{ fontSize: 18, flexShrink: 0 }}>{item.icon}</span>
                {sidebarOpen && (
                  <span style={{ display: "flex", alignItems: "center", gap: 6, flex: 1 }}>
                    {item.label}
                    {item.badge && bpAdmin && solicitudesBadge > 0 && (
                      <span style={{ marginLeft: "auto", background: "#DC2626", color: "#fff", fontSize: 10, fontWeight: 700, borderRadius: 10, padding: "1px 7px", minWidth: 18, textAlign: "center" }}>{solicitudesBadge}</span>
                    )}
                  </span>
                )}
              </button>
            );
          })}
        </nav>

        {/* BP Session + Logout */}
        {sidebarOpen && bpGerencias && (
          <div style={{ padding: "12px 16px", borderTop: "1px solid rgba(255,255,255,0.1)" }}>
            <div style={{ fontSize: 10, color: "rgba(255,255,255,0.4)", fontWeight: 700, letterSpacing: 1, marginBottom: 6, textTransform: "uppercase" }}>{bpAdmin ? "👑 Administrador" : "Sesión activa"}</div>
            <div style={{ fontSize: 12, fontWeight: 600, color: "#fff", marginBottom: 4 }}>{bpNombre}</div>
            {!bpAdmin && bpGerencias && bpGerencias.length > 0 && (
              <div style={{ fontSize: 10, color: "rgba(255,255,255,0.5)", marginBottom: 10, lineHeight: 1.6 }}>
                {bpGerencias.map((g, i) => <div key={i}>· {g}</div>)}
              </div>
            )}
            {bpAdmin && <div style={{ fontSize: 10, color: "rgba(255,255,255,0.4)", marginBottom: 10 }}>· Todas las gerencias</div>}
            <button onClick={onLogout} style={{ width: "100%", padding: "7px 12px", background: "rgba(239,68,68,0.12)", border: "1px solid rgba(239,68,68,0.3)", color: "#FCA5A5", borderRadius: 8, fontSize: 11, fontWeight: 600, cursor: "pointer" }}>⎋ Cerrar sesión</button>
          </div>
        )}
        {/* Footer: fecha de corte con picker para recalcular */}
        {sidebarOpen && tieneData && (
          <div style={{ padding: "12px 16px", borderTop: "1px solid #14472A" }}>            <div style={{ fontSize: 11, color: "rgba(255,255,255,0.55)", marginBottom: 6 }}>
              Procesado · Fecha de Corte
            </div>
            <input
              type="date"
              value={fechaInputValue}
              onChange={(e) => {
                if (!e.target.value) return;
                const nueva = dateOnly(new Date(e.target.value + "T00:00:00"));
                if (!isNaN(nueva.getTime())) recalcularConFecha(nueva);
              }}
              title="Cambiar fecha de corte y recalcular"
              style={{
                width: "100%", background: "white",
                border: "0.5px solid rgba(255,255,255,0.25)",
                color: "#1A5C2E", borderRadius: 7,
                padding: "6px 10px", fontSize: 12, fontWeight: 600,
                outline: "none", cursor: "pointer", colorScheme: "light",
              }}
            />
            {recalculando && (
              <div style={{ fontSize: 11, color: "rgba(255,255,255,0.55)", marginTop: 4, textAlign: "center" }}>
                ⟳ Recalculando...
              </div>
            )}
            <div style={{ fontSize: 11, color: "rgba(255,255,255,0.5)", marginTop: 4 }}>
              {colaboradores.length.toLocaleString()} colaboradores
            </div>
          </div>
        )}
      </div>

      {/* Main content */}
      <main style={{ flex: 1, overflowY: "auto", padding: "28px 28px", background: "#F5F5F5" }}>
        {pagina === "importacion" && (
          <PaginaImportacion
            onDatosProcessados={onDatosProcessados}
            onRawData={onRawData}
            procesando={procesando}
            setProcesando={setProcesando}
          />
        )}
        {pagina === "dashboard" && tieneData && (
          <PaginaDashboard colaboradores={colaboradoresFiltradosBP} fechaCorteGlobal={fechaCorteGlobal} setPagina={setPagina} setFiltroGerenciaAlertas={setFiltroGerenciaAlertas} />
        )}
        {pagina === "colaboradores" && tieneData && <PaginaColaboradores colaboradores={colaboradoresFiltradosBP} setPagina={setPagina} setColabSolicitud={setColabSolicitud} />}
        {pagina === "alertas" && tieneData && (
          <PaginaAlertas colaboradores={colaboradoresFiltradosBP} fechaCorteGlobal={fechaCorteGlobal} filtroGerenciaExterno={filtroGerenciaAlertas} setFiltroGerenciaExterno={setFiltroGerenciaAlertas} />
        )}
        {pagina === "historial" && tieneData && (
          <PaginaHistorial colaboradores={colaboradoresFiltradosBP} fechaCorteGlobal={fechaCorteGlobal} />
        )}
        {pagina === "incapacidades" && tieneData && (
          <PaginaIncapacidades colaboradores={colaboradoresFiltradosBP} />
        )}
        {pagina === "convenios" && tieneData && (
          <PaginaConvenios colaboradores={colaboradoresFiltradosBP} rawData={rawData} />
        )}
        {pagina === "goces" && tieneData && (
          <PaginaGoces colaboradores={colaboradoresFiltradosBP} />
        )}
        {pagina === "compras" && tieneData && (
          <PaginaCompras colaboradores={colaboradoresFiltradosBP} />
        )}
        {pagina === "solicitud" && tieneData && (
          <PaginaSolicitud colaboradores={colaboradoresFiltradosBP} fechaCorteGlobal={fechaCorteGlobal} colabPreseleccionado={colabSolicitud} onColabUsado={() => setColabSolicitud(null)} />
        )}
        {pagina === "ficha" && tieneData && (
          <PaginaFicha colaboradores={colaboradoresFiltradosBP} fechaCorteGlobal={fechaCorteGlobal} todosColaboradores={colaboradores} />
        )}

        {!tieneData && pagina !== "importacion" && (
          <div style={{ textAlign: "center", padding: 80, color: COLORS.textoMuted }}>
            <div style={{ fontSize: 48, marginBottom: 16 }}>📂</div>
            <div style={{ fontSize: 18, fontWeight: 600, color: COLORS.textoSecundario }}>Sin datos cargados</div>
            <div style={{ fontSize: 14, marginTop: 8 }}>Ve a Importación para cargar los archivos Excel</div>
            <button onClick={() => setPagina("importacion")} style={{
              marginTop: 20, background: COLORS.accent, color: "#fff",
              border: "none", borderRadius: 10, padding: "10px 24px",
              cursor: "pointer", fontSize: 14, fontWeight: 600,
            }}>Ir a Importación</button>
          </div>
        )}

        {pagina === "usuarios-mgmt" && bpAdmin && <PanelGestionUsuarios />}
        {pagina === "solicitudes-fb" && (
          <PanelSolicitudesFirebase
            bpUsuario={bpGerencias ? (bpNombre || "").toLowerCase().replace(/ /g,"") : "admin"}
            bpNombre={bpNombre}
            bpAdmin={bpAdmin}
            bpGerencias={bpGerencias}
          />
        )}
        {procesando && <Spinner />}
      </main>
    </div>
  );
}


  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<AppWrapper />);
</script>
</body>
</html>
