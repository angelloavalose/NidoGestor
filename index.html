                        <span style={{ fontSize: 11, color: "#4338CA", lineHeight: 1.5 }}>
                          {(() => {
                            const gConvenio = p.goces.filter(g => g.acuerdoInfo?.porConvenio);
                            const diasConvenio = gConvenio.reduce((s, g) => s + g.dias, 0);
                            return <>Este período tiene <strong>{gConvenio.length} goce{gConvenio.length !== 1 ? "s" : ""}</strong> por convenio vacacional, totalizando <strong>{diasConvenio} días</strong> acumulados y gozados bajo acuerdo firmado.</>;
                          })()}
                        </span>
                      </div>
                    )}
                    {/* Nota: exceso propio */}
                    {p.diasBase > 0 && p.diasGozados > p.diasBase && (
                      <div style={{ padding: "8px 12px", background: "rgba(239,68,68,0.06)", border: "0.5px solid rgba(239,68,68,0.3)", borderRadius: 8, display: "flex", alignItems: "flex-start", gap: 8 }}>
                        <span style={{ fontSize: 14, flexShrink: 0 }}>ℹ️</span>
                        <span style={{ fontSize: 11, color: "#991B1B", lineHeight: 1.5 }}>
                          Este período tiene un <strong>exceso de goce de {(p.diasGozados - p.diasBase).toFixed(2)} días</strong> (gozó {p.diasGozados} de {p.diasBase} base).
                          El déficit fue cubierto por otros períodos con saldo disponible.
                        </span>
                      </div>
                    )}
                    {/* Nota: absorbió días de período más antiguo con exceso → no genera indem */}
                    {p.diasCedidosAntiguos > 0 && (
                      <div style={{ padding: "8px 12px", background: "rgba(249,115,22,0.07)", border: "0.5px solid rgba(249,115,22,0.3)", borderRadius: 8, display: "flex", alignItems: "flex-start", gap: 8 }}>
                        <span style={{ fontSize: 14, flexShrink: 0 }}>ℹ️</span>
                        <span style={{ fontSize: 11, color: "#92400E", lineHeight: 1.5 }}>
                          Este período absorbió <strong>{p.diasCedidosAntiguos.toFixed(2)} días</strong> del exceso gozado en el{" "}
                          <strong>Año {p.periodoExcesoRef}</strong>. Esos días ya fueron gozados anticipadamente,
                          por lo que <strong>no generan indemnización</strong>.
                        </span>
                      </div>
                    )}
                    {/* Nota: compensó días hacia períodos con exceso → indem se mantiene */}
                    {p.diasCedidosHaciaExceso > 0 && (
                      <div style={{ padding: "8px 12px", background: "rgba(234,179,8,0.07)", border: "0.5px solid rgba(234,179,8,0.35)", borderRadius: 8, display: "flex", alignItems: "flex-start", gap: 8 }}>
                        <span style={{ fontSize: 14, flexShrink: 0 }}>ℹ️</span>
                        <span style={{ fontSize: 11, color: "#78350F", lineHeight: 1.5 }}>
                          Este período compensó <strong>{p.diasCedidosHaciaExceso.toFixed(2)} días</strong> del exceso gozado en el{" "}
                          <strong>Año {p.periodoExcesoRefAntiguo?.join(", Año ")}</strong>. Al ser un período anterior al que generó el exceso,
                          la <strong>indemnización se mantiene</strong>.
                        </span>
                      </div>
                    )}
                  </div>
                )}
              </div>
            );
          })}
        </div>

        {/* Goces ignorados */}
        {colab.gocesIgnorados?.length > 0 && (
          <div style={{ marginTop: 20, padding: "14px 18px", background: "rgba(100,116,139,0.06)", borderRadius: 12, border: `0.5px solid ${COLORS.border}` }}>
            <div style={{ fontSize: 12, color: COLORS.textoMuted, fontWeight: 600 }}>
              📋 {colab.gocesIgnorados.length} día(s) ignorados — vínculo laboral anterior
            </div>
          </div>
        )}
      </div>
      <GoceModal goce={goceSeleccionado} onClose={() => setGoceSeleccionado(null)} />
      <CompraModal compra={compraSeleccionada} onClose={() => setCompraSeleccionada(null)} />
    </div>
  );
}

// Tabla de colaboradores
function TablaColaboradores({ data, onVerDetalle, onGenerarSolicitud, bpAdmin }) {
  const [pagina, setPagina] = useState(0);

  const total = data.length;
  const isMobile = useIsMobile();
  const slice = data.slice(pagina * POR_PAGINA, (pagina + 1) * POR_PAGINA);

    return (
      <div>

            const pendiente = c.periodos?.find(p => p.tipo === "PENDIENTE" && p.saldo > 0);
            const vencidas = Math.round(c.totalVencidas || 0);
            return (
              <div key={c.cod} style={{ background: "#fff", border: `1px solid ${vencidas > 0 ? "rgba(220,38,38,0.3)" : COLORS.border}`, borderRadius: 10, padding: "12px 14px" }}

                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 6 }}>

                    <div style={{ fontSize: 11, color: COLORS.textoMuted, marginTop: 1 }}>{c.gerencia} · Cód {c.cod}</div>
                  </div>
                  {vencidas > 0 && <span style={{ fontSize: 10, background: "rgba(220,38,38,0.1)", color: "#DC2626", borderRadius: 20, padding: "2px 8px", fontWeight: 700, whiteSpace: "nowrap", marginLeft: 8 }}>{vencidas} venc.</span>}

                  {[
                    { label: "Pendientes", val: Math.round(pendiente?.saldo || 0), color: COLORS.positivo },

                  ))}

          </div>
        )}

                {!bpAdmin && (

                <td style={{ padding: "12px 14px", color: COLORS.textoSecundario }}>{fmtDate(c.fechaCorte)}</td>
                {bpAdmin && (
                  <>
                    <td style={{ padding: "12px 14px" }}>
                      <span style={{ color: c.diasIndemnizacion > 0 ? "#F97316" : COLORS.textoMuted, fontWeight: 700 }}>
                        {(c.diasIndemnizacion || 0).toFixed(0)}

                    </td>
                    <td style={{ padding: "12px 14px" }}>

                <td style={{ padding: "12px 14px" }}>

                <td style={{ padding: "12px 14px" }}>

// Gráfico de barras simple (recharts-style con SVG)
function BarChart({ data, colorKey = "color" }) {
  const max = Math.max(...data.map((d) => d.value), 1);
  const H = 140;
  return (
    <div style={{ display: "flex", alignItems: "flex-end", gap: 8, height: H + 32, padding: "0 4px" }}>
      {data.map((d, i) => {
        const pct = d.value / max;
        const barH = Math.max(pct * H, d.value > 0 ? 4 : 0);
        return (
          <div key={i} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 4 }}>
            <div style={{ fontSize: 11, color: COLORS.textoSecundario, fontWeight: 600 }}>
              {d.value > 999 ? (d.value / 1000).toFixed(1) + "k" : d.value}
            </div>
            <div style={{ width: "100%", height: barH, background: d.color || COLORS.accent, borderRadius: "4px 4px 0 0", transition: "height 0.3s" }} />
            <div style={{ fontSize: 10, color: COLORS.textoMuted, textAlign: "center", whiteSpace: "nowrap" }}>{d.label}</div>
          </div>
        );
      })}
    </div>
  );
}

  crearEstiloExcel(filas, encabezados, "Vacaciones", `reporte_vacaciones_desglose_${new Date().toISOString().slice(0,10)}.xlsx`, { "Nombres": { wch: 30 }, "Gerencia": { wch: 28 }, "Unidad Org.": { wch: 28 } });
}

function FolderDropZone({ archivos, setArchivos }) {
  const [folderMsg, setFolderMsg] = useState("");
  const inputRef = useRef(null);

  const detectarArchivo = (file) => {
    const name = file.name.toLowerCase();
    if (name.includes("registro") || name.includes("personal") || name.includes("01")) return "base";
    if (name.includes("goce") || name.includes("02")) return "goces";
    if (name.includes("compens") || name.includes("03")) return "compras";
    if (name.includes("regulari") || name.includes("ajuste") || name.includes("04")) return "ajuste";
    if (name.includes("incapac") || name.includes("05")) return "incapacidades";
    if (name.includes("acuerdo") || name.includes("acumul") || name.includes("06")) return "acuerdo";
    if (name.includes("regimen") || name.includes("régimen") || name.includes("especial") || name.includes("07")) return "regimen";
    if (name.includes("licencia") || name.includes("lsg") || name.includes("08")) return "lsg";
    if (name.includes("cesado") || name.includes("09")) return "cesados";
    return null;
  };

  const procesarArchivos = (files) => {
    const xlsFiles = Array.from(files).filter(f => f.name.match(/\.(xlsx|xls)$/i));
    if (xlsFiles.length === 0) { setFolderMsg("⚠ No se encontraron archivos Excel en la carpeta"); return; }
    let detectados = 0;
    const nuevos = {};
    xlsFiles.forEach(file => {
      const key = detectarArchivo(file);
      if (key) { nuevos[key] = file; detectados++; }
    });
    if (detectados > 0) {
      setArchivos(prev => ({ ...prev, ...nuevos }));
      setFolderMsg("✅ " + detectados + " archivo(s) cargados automáticamente");
      setTimeout(() => setFolderMsg(""), 5000);
    } else {
      setFolderMsg("⚠ No se reconocieron los archivos. Verifica que los nombres incluyan: Registro, Goce, Compensación, Regularización, Incapacidades, Acuerdo");
    }
  };

  const handleInputChange = (e) => procesarArchivos(e.target.files);

  return (
    <div style={{ marginBottom: 20 }}>
      <input
        ref={inputRef}
        type="file"
        webkitdirectory=""
        multiple
        style={{ display: "none" }}
        onChange={handleInputChange}
      />
      <div
        onClick={() => inputRef.current?.click()}
        style={{
          border: "2px dashed " + COLORS.border,
          borderRadius: 14, padding: "32px 24px",
          background: COLORS.surfaceHigh,
          textAlign: "center", cursor: "pointer",
          transition: "all 0.2s",
        }}
        onMouseEnter={e => e.currentTarget.style.borderColor = COLORS.accent}
        onMouseLeave={e => e.currentTarget.style.borderColor = COLORS.border}
      >
        <div style={{ fontSize: 36, marginBottom: 10 }}>📁</div>
        <div style={{ fontSize: 15, fontWeight: 700, color: COLORS.texto, marginBottom: 6 }}>
          Seleccionar carpeta con los Excel
        </div>
        <div style={{ fontSize: 12, color: COLORS.textoMuted, marginBottom: 4 }}>
          Haz clic aquí y selecciona la carpeta <strong>NidoGestor Vacacional</strong>
        </div>
        <div style={{ fontSize: 11, color: COLORS.textoMuted }}>
          La app detecta automáticamente cada archivo por su nombre
        </div>
      </div>
      {folderMsg && (

// ─── PUBLICACIÓN DE DATOS A FIRESTORE (admin publica → BPs reciben automático) ──
// Estrategia: la colección "base_publicada" guarda:
//   - doc "meta": { fechaCorteGlobal (ISO string), totalColaboradores, publicadoEn (ISO), publicadoPor }
//   - docs "chunk_0", "chunk_1", ... : { colaboradores: [...] } — partidos en lotes para no exceder 1MB/doc
const BASE_PUBLICADA_COLLECTION = "base_publicada";
const CHUNK_SIZE_PUBLICACION = 40; // colaboradores por documento — conservador para no acercarse al límite de 1MB/doc de Firestore

// Serializa fechas (Date → {__isDate:true, iso}) para guardarlas anidadas en Firestore sin perder el tipo.
// IMPORTANTE: se recorre el objeto manualmente (no con JSON.stringify+replacer) porque Date tiene su propio
// toJSON() que JSON.stringify invoca ANTES de pasar el valor al replacer, así que el replacer nunca llega
// a ver la instancia de Date real — solo vería el string ISO ya convertido, y el marcador nunca se aplicaría.
function serializarParaFirestore(obj) {
  if (obj instanceof Date) return { __isDate: true, iso: obj.toISOString() };
  if (Array.isArray(obj)) return obj.map(serializarParaFirestore);
  if (obj && typeof obj === "object") {
    const out = {};
    for (const k in obj) { if (Object.prototype.hasOwnProperty.call(obj, k)) out[k] = serializarParaFirestore(obj[k]); }
    return out;
  }
  return obj;
}
// Reconstruye fechas ({__isDate:true, iso} → Date) al leer desde Firestore, recorriendo el objeto manualmente.
function deserializarDesdeFirestore(obj) {
  if (obj && typeof obj === "object" && obj.__isDate === true) return new Date(obj.iso);
  if (Array.isArray(obj)) return obj.map(deserializarDesdeFirestore);
  if (obj && typeof obj === "object") {
    const out = {};
    for (const k in obj) { if (Object.prototype.hasOwnProperty.call(obj, k)) out[k] = deserializarDesdeFirestore(obj[k]); }
    return out;
  }
  return obj;
}

// Envuelve una promesa con un timeout para que nunca se quede "colgada" sin avisar
function conTimeout(promesa, ms, mensaje) {
  return Promise.race([
    promesa,
    new Promise((_, reject) => setTimeout(() => reject(new Error(mensaje || `Tiempo de espera agotado (${ms / 1000}s)`)), ms)),
  ]);
}

async function publicarDatosBPs(colaboradores, fechaCorteGlobal, publicadoPor, onProgreso) {
  const fb = window._firebase;
  if (!fb?.db) throw new Error("Firestore no está listo todavía.");
  const { db, collection, doc } = fb;
  const reportar = (msg) => { if (onProgreso) onProgreso(msg); };

  // 1. Preparar datos (sin borrar — setDoc sobrescribe; chunks huérfanos ignorados por meta.totalChunks)
  reportar("Preparando datos...");
  const serializados = serializarParaFirestore(colaboradores);
  const totalChunks = Math.max(1, Math.ceil(serializados.length / CHUNK_SIZE_PUBLICACION));

  // Verificación de tamaño: si algún chunk supera ~900KB, avisar antes de seguir
  for (let i = 0; i < totalChunks; i++) {
    const lote = serializados.slice(i * CHUNK_SIZE_PUBLICACION, (i + 1) * CHUNK_SIZE_PUBLICACION);
    const pesoBytes = JSON.stringify(lote).length;
    if (pesoBytes > 900 * 1024) {
      throw new Error(`El lote ${i + 1} pesa ${(pesoBytes / 1024 / 1024).toFixed(2)} MB, muy cerca del límite de Firestore (1 MB). Reduce CHUNK_SIZE_PUBLICACION e inténtalo de nuevo.`);
    }
  }

  // 2. Escribir chunks secuencialmente con hasta 3 reintentos por chunk
  for (let i = 0; i < totalChunks; i++) {
    reportar(`Subiendo lote ${i + 1} de ${totalChunks}...`);
    const lote = serializados.slice(i * CHUNK_SIZE_PUBLICACION, (i + 1) * CHUNK_SIZE_PUBLICACION);
    const ref = doc(db, BASE_PUBLICADA_COLLECTION, `chunk_${i}`);
    let intentos = 0;
    while (true) {
      try {
        await conTimeout(fb.setDoc(ref, { colaboradores: lote, idx: i }), 30000, `Timeout lote ${i + 1}`);
        break;
      } catch (e) {
        intentos++;
        if (intentos >= 3) throw new Error(`No se pudo subir el lote ${i + 1} de ${totalChunks} tras 3 intentos. Revisa tu conexión.`);
        reportar(`Reintentando lote ${i + 1} (intento ${intentos + 1})...`);
        await new Promise(r => setTimeout(r, 2000));
      }
    }
  }

  // 3. Escribir meta ANTES de borrar huérfanos (dispara actualización en BPs)
  reportar("Finalizando publicación...");
  const metaRef = doc(db, BASE_PUBLICADA_COLLECTION, "meta");
  await conTimeout(fb.setDoc(metaRef, {
    fechaCorteGlobal: fechaCorteGlobal.toISOString(),
    totalColaboradores: colaboradores.length,
    totalChunks,
    publicadoEn: new Date().toISOString(),
    publicadoPor: publicadoPor || "admin",
  }), 20000, "Tiempo agotado al finalizar la publicación.");

  // 4. Borrar chunks huérfanos de publicaciones anteriores (best-effort, sin bloquear)
  try {
    const MAX_CHUNKS_POSIBLES = 300;
    if (totalChunks < MAX_CHUNKS_POSIBLES) {
      reportar("Limpiando chunks anteriores...");
      let batchBorrar = fb.batch();
      let ops = 0;
      for (let i = totalChunks; i < MAX_CHUNKS_POSIBLES; i++) {
        batchBorrar.delete(doc(db, BASE_PUBLICADA_COLLECTION, `chunk_${i}`));
        ops++;
        if (ops >= 400) {
          await conTimeout(batchBorrar.commit(), 15000, "Timeout limpieza");
          batchBorrar = fb.batch(); ops = 0;
        }
      }
      if (ops > 0) await conTimeout(batchBorrar.commit(), 15000, "Timeout limpieza");
    }
  } catch (e) {
    console.warn("Limpieza de chunks huérfanos falló (no crítico):", e.message);
  }
}

// Hook: escucha la publicación en Firestore y arma colaboradores + fechaCorteGlobal automáticamente
function useDatosPublicados() {
  const [colaboradores, setColaboradores] = React.useState([]);
  const [fechaCorteGlobal, setFechaCorteGlobal] = React.useState(null);
  const [meta, setMeta] = React.useState(null);
  const [cargando, setCargando] = React.useState(true);

  React.useEffect(() => {
    let activo = true;
    const checkFb = setInterval(() => {
      if (window._firebase?.db) {
        clearInterval(checkFb);
        const { db, collection, doc, onSnapshot } = window._firebase;
        const metaRef = doc(db, BASE_PUBLICADA_COLLECTION, "meta");
        onSnapshot(metaRef, async (metaSnap) => {
          if (!activo) return;
          if (!metaSnap.exists) { setCargando(false); return; }
          const metaData = metaSnap.data();
          setMeta(metaData);
          setCargando(true);
          try {
            const totalChunks = metaData.totalChunks || 1;
            const fb = window._firebase;
            // Leer todos los chunks en paralelo
            const lecturas = await Promise.all(
              Array.from({ length: totalChunks }, (_, i) => {
                const ref = fb.doc(db, BASE_PUBLICADA_COLLECTION, `chunk_${i}`);
                return ref.get();
              })
            );
            let todos = [];
            lecturas
              .filter(s => s.exists)
              .sort((a, b) => (a.data().idx || 0) - (b.data().idx || 0))
              .forEach(s => { todos = todos.concat(s.data().colaboradores || []); });
            const reconstruidos = deserializarDesdeFirestore(todos);
            if (activo) {
              setColaboradores(reconstruidos);
              setFechaCorteGlobal(new Date(metaData.fechaCorteGlobal));
            }
          } catch (e) {
            console.error("Error leyendo datos publicados:", e);
          }
          if (activo) setCargando(false);
        }, (err) => { console.error("Firebase meta error:", err); if (activo) setCargando(false); });
      }
    }, 400);
    return () => { activo = false; clearInterval(checkFb); };
  }, []);

  return { colaboradores, fechaCorteGlobal, meta, cargando };
}

    try {

        const bufCompras = await archivos.compras.arrayBuffer();
        comprasPorCod = parseVacacionesCompradas(bufCompras);
      }

        setProgreso("Leyendo Régimen Especial...");
        const bufRegimen = await archivos.regimen.arrayBuffer();
        regimenPorCod = parseRegimenEspecial(bufRegimen);
      }
      if (archivos.ajuste) {
        setProgreso("Leyendo Ajuste Vacacional...");
        const bufAjuste = await archivos.ajuste.arrayBuffer();
        ajustesPorCod = parseAjusteVacacional(bufAjuste);
      }

      let incapacidadesPorCod = {};
      if (archivos.incapacidades) {
        setProgreso("Leyendo Incapacidades Médicas...");
        const bufInc = await archivos.incapacidades.arrayBuffer();
        incapacidadesPorCod = parseIncapacidades(bufInc);
      }

      let acuerdosPorCod = {};
      let codsNoEncontrados = [];
      if (archivos.acuerdo) {
        setProgreso("Leyendo Acuerdo de Acumulación Vacacional...");
        const bufAcuerdo = await archivos.acuerdo.arrayBuffer();
        const resultado = parseAcuerdoAcumulacion(bufAcuerdo);

        console.log("Acuerdos cargados:", Object.keys(acuerdosPorCod).length, "códigos");

        codsNoEncontrados = Object.keys(acuerdosPorCod).filter(
          cod => !empleados.find(e => e.cod === cod)
        ).map(cod => ({ cod, nombres: acuerdosPorCod[cod][0]?.nombres || "" }));
        console.log("Cods no encontrados:", codsNoEncontrados.length);
      }
      setProgreso(`Procesando ${empleados.length} colaboradores...`);
      await new Promise((r) => setTimeout(r, 50));

      let lsgPorCod = {};
      if (archivos.lsg) {
        try {
          const bufLsg = await archivos.lsg.arrayBuffer();
          lsgPorCod = parseLSG(bufLsg);
        } catch(e) { console.warn("Error LSG:", e); }
      }

      let cesadosPorCod = {};
      if (archivos.cesados) {
        try {
          const bufCes = await archivos.cesados.arrayBuffer();
          cesadosPorCod = parseCesados(bufCes);
          console.log("[Cesados] Cargado:", Object.keys(cesadosPorCod).length, "colaboradores");
        } catch(e) { console.warn("Error Cesados:", e); }
      }

      onRawData({ empleados, gocesPorCod, comprasPorCod, ajustesPorCod, incapacidadesPorCod, acuerdosPorCod, codsNoEncontrados, regimenPorCod, lsgPorCod, cesadosPorCod });

      const resultados = [];
      const CHUNK = 100;
      const _gv = construirGocesVirtuales(window.__solicitudesAprobadas || [], gocesPorCod);
      const _gt = fusionarGoces(gocesPorCod, _gv);
      for (let i = 0; i < empleados.length; i += CHUNK) {
        const chunk = empleados.slice(i, i + CHUNK);
        for (const emp of chunk) {
          const goces = _gt[emp.cod] || [];
          const compras = comprasPorCod[emp.cod] || [];
          const ajuste = ajustesPorCod[emp.cod] || null;
          const incapacidades = incapacidadesPorCod[emp.cod] || [];
          const acuerdos = (acuerdosPorCod[emp.cod] || acuerdosPorCod[String(parseInt(emp.cod))] || []);
          const regimen = regimenPorCod[emp.cod] || regimenPorCod[String(parseInt(emp.cod))] || [];
          const lsg = lsgPorCod[emp.cod] || lsgPorCod[String(parseInt(emp.cod))] || [];
          const fechaCese = cesadosPorCod[emp.cod] || cesadosPorCod[String(parseInt(emp.cod))] || null;

          const esReingreso = fechaCese && feIngresoDate && feIngresoDate > fechaCese;

          const esCesadoReal = fechaCese !== null && !esReingreso && dateOnly(fechaCese) <= dateOnly(fechaCorteGlobal);
          // Si es cesado, calcular hasta la fecha de cese; si no, calcular hasta el corte global
          const fechaEfectiva = esCesadoReal ? fechaCese : fechaCorteGlobal;
          resultados.push(procesarColaborador(emp, goces, fechaEfectiva, compras, ajuste, incapacidades, acuerdos, regimen, lsg, esCesadoReal ? fechaCese : null));
        }
        setProgreso(`Procesando... ${Math.min(i + CHUNK, empleados.length)} / ${empleados.length}`);
        await new Promise((r) => setTimeout(r, 0));
      }

      onDatosProcessados(resultados, fechaCorteGlobal);
    } catch (e) {
      setError("Error: " + e.message);
      setProcesando(false);
    }

  const FileZone = ({ label, key_, accept, opcional }) => (

  return (
    <div style={{ maxWidth: 680, margin: "0 auto", padding: "40px 16px" }}>
      <div style={{ marginBottom: 32 }}>
        <div style={{ fontSize: 26, fontWeight: 700, color: COLORS.texto }}>Importar Datos</div>
        <div style={{ fontSize: 14, color: COLORS.textoMuted, marginTop: 4 }}>
          Carga los archivos Excel para iniciar el procesamiento
        </div>

      {/* Folder drag & drop zone */}
      <FolderDropZone archivos={archivos} setArchivos={setArchivos} />



      {error && (
        <div style={{ padding: "12px 16px", background: "rgba(239,68,68,0.1)", border: "1px solid #EF444444", borderRadius: 10, color: "#EF4444", fontSize: 13, marginBottom: 16 }}>
          {error}
        </div>
