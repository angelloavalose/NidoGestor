// ─── PÁGINAS ──────────────────────────────────────────────────────────────────

function PaginaImportacion({ onDatosProcessados, onRawData, procesando, setProcesando }) {
  const [archivos, setArchivos] = useState({ base: null, goces: null, compras: null, ajuste: null, incapacidades: null, acuerdo: null });
  const [error, setError] = useState(null);
  const [progreso, setProgreso] = useState("");

  const procesar = async () => {
    if (!archivos.base || !archivos.goces) {
      setError("Debes cargar al menos Base de Datos y Vacaciones Gozadas.");
      return;
    }
    setError(null);
    setProcesando(true);

    try {
      setProgreso("Leyendo Base de Datos...");
      const bufBase = await archivos.base.arrayBuffer();
      const { empleados, fechaCorteGlobal } = parseBasedatos(bufBase);

      setProgreso("Leyendo Vacaciones Gozadas...");
      const bufGoces = await archivos.goces.arrayBuffer();
      const gocesPorCod = parseVacacionesGozadas(bufGoces);

      let comprasPorCod = {};
      if (archivos.compras) {
        setProgreso("Leyendo Vacaciones Compradas...");
        const bufCompras = await archivos.compras.arrayBuffer();
        comprasPorCod = parseVacacionesCompradas(bufCompras);
      }

      let ajustesPorCod = {};
      if (archivos.ajuste) {
        setProgreso("Leyendo Ajuste Vacacional...");
        const bufAjuste = await archivos.ajuste.arrayBuffer();
        ajustesPorCod = parseAjusteVacacional(bufAjuste);
      }

      let incapacidadesPorCod = {};
      if (archivos.incapacidades) {
        setProgreso("Leyendo Incapacidades Médicas...");
        const bufInc = await archivos.incapacidades.arrayBuffer();
        incapacidadesPorCod = parseIncapacidades(bufInc);
      }

      let acuerdosPorCod = {};
      let codsNoEncontrados = [];
      if (archivos.acuerdo) {
        setProgreso("Leyendo Acuerdo de Acumulación Vacacional...");
        const bufAcuerdo = await archivos.acuerdo.arrayBuffer();
        const resultado = parseAcuerdoAcumulacion(bufAcuerdo);
        acuerdosPorCod = resultado.acuerdosPorCod;
        console.log("Acuerdos cargados:", Object.keys(acuerdosPorCod).length, "códigos");
        console.log("Keys de acuerdos:", Object.keys(acuerdosPorCod).slice(0, 5));
        console.log("Keys de empleados (sample):", empleados.slice(0, 5).map(e => e.cod));
        codsNoEncontrados = Object.keys(acuerdosPorCod).filter(
          cod => !empleados.find(e => e.cod === cod)
        ).map(cod => ({ cod, nombres: acuerdosPorCod[cod][0]?.nombres || "" }));
        console.log("Cods no encontrados:", codsNoEncontrados.length);
      }
      onRawData({ empleados, gocesPorCod, comprasPorCod, ajustesPorCod, incapacidadesPorCod, acuerdosPorCod, codsNoEncontrados });

      setProgreso(`Procesando ${empleados.length} colaboradores...`);
      await new Promise((r) => setTimeout(r, 50));

      const resultados = [];
      const CHUNK = 100;
      for (let i = 0; i < empleados.length; i += CHUNK) {
        const chunk = empleados.slice(i, i + CHUNK);
        for (const emp of chunk) {
          const goces = gocesPorCod[emp.cod] || [];
          const compras = comprasPorCod[emp.cod] || [];
          const ajuste = ajustesPorCod[emp.cod] || null;
          const incapacidades = incapacidadesPorCod[emp.cod] || [];
          const acuerdos = (acuerdosPorCod[emp.cod] || acuerdosPorCod[String(parseInt(emp.cod))] || []);
          resultados.push(procesarColaborador(emp, goces, fechaCorteGlobal, compras, ajuste, incapacidades, acuerdos));
        }
        setProgreso(`Procesando... ${Math.min(i + CHUNK, empleados.length)} / ${empleados.length}`);
        await new Promise((r) => setTimeout(r, 0));
      }

      onDatosProcessados(resultados, fechaCorteGlobal);
    } catch (e) {
      setError("Error: " + e.message);
      setProcesando(false);
    }
  };

  const FileZone = ({ label, key_, accept, opcional }) => (
    <label style={{
      display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
      gap: 12, padding: "32px 24px",
      background: archivos[key_] ? "rgba(26,92,46,0.04)" : COLORS.surfaceHigh,
      border: `1px dashed ${archivos[key_] ? COLORS.accent : COLORS.border}`,
      borderRadius: 16, cursor: "pointer", transition: "all 0.2s", position: "relative",
    }}>
      {opcional && (
        <span style={{ position: "absolute", top: 10, right: 14, fontSize: 11, color: COLORS.textoMuted, background: COLORS.bg, borderRadius: 4, padding: "2px 6px" }}>
          Opcional
        </span>
      )}
      <div style={{ fontSize: 32 }}>{archivos[key_] ? "✅" : "📂"}</div>
      <div style={{ fontSize: 14, fontWeight: 600, color: COLORS.texto }}>{label}</div>
      {archivos[key_]
        ? <div style={{ fontSize: 13, color: COLORS.positivo }}>✓ {archivos[key_].name}</div>
        : <div style={{ fontSize: 12, color: COLORS.textoMuted }}>Haz clic o arrastra el archivo .xlsx</div>
      }
      <input type="file" accept={accept} style={{ display: "none" }}
        onChange={(e) => setArchivos((prev) => ({ ...prev, [key_]: e.target.files[0] }))} />
    </label>
  );

  return (
    <div style={{ maxWidth: 680, margin: "0 auto", padding: "40px 16px" }}>
      <div style={{ marginBottom: 32 }}>
        <div style={{ fontSize: 26, fontWeight: 700, color: COLORS.texto }}>Importar Datos</div>
        <div style={{ fontSize: 14, color: COLORS.textoMuted, marginTop: 4 }}>
          Carga los archivos Excel para iniciar el procesamiento
        </div>
      </div>

      {/* Folder drag & drop zone */}
      {(() => {
        const [folderDrag, setFolderDrag] = useState(false);
        const [folderMsg, setFolderMsg] = useState("");

        const detectarArchivo = (file) => {
          const name = file.name.toLowerCase();
          if (name.includes("registro") || name.includes("personal") || name.includes("01.")) return "base";
          if (name.includes("goce") || name.includes("02.")) return "goces";
          if (name.includes("compens") || name.includes("03.")) return "compras";
          if (name.includes("regulari") || name.includes("ajuste") || name.includes("04.")) return "ajuste";
          if (name.includes("incapac") || name.includes("05.")) return "incapacidades";
          if (name.includes("acuerdo") || name.includes("acumul") || name.includes("06.")) return "acuerdo";
          return null;
        };

        const handleFolderDrop = (e) => {
          e.preventDefault();
          setFolderDrag(false);
          const items = Array.from(e.dataTransfer.items || []);
          const files = Array.from(e.dataTransfer.files || []);

          const allFiles = [...files];
          // Try to get files from directory entries
          items.forEach(item => {
            if (item.kind === "file") {
              const entry = item.webkitGetAsEntry?.();
              if (entry && !entry.isDirectory) {
                const f = item.getAsFile();
                if (f && !allFiles.find(x => x.name === f.name)) allFiles.push(f);
              }
            }
          });

          const xlsFiles = allFiles.filter(f => f.name.match(/\.(xlsx|xls)$/i));
          if (xlsFiles.length === 0) { setFolderMsg("No se encontraron archivos Excel en la carpeta"); return; }

          let detectados = 0;
          const nuevos = {};
          xlsFiles.forEach(file => {
            const key = detectarArchivo(file);
            if (key) { nuevos[key] = file; detectados++; }
          });

          if (detectados > 0) {
            setArchivos(prev => ({ ...prev, ...nuevos }));
            setFolderMsg("✅ " + detectados + " archivo(s) detectados automáticamente");
            setTimeout(() => setFolderMsg(""), 4000);
          } else {
            setFolderMsg("⚠ No se reconocieron los archivos. Verifica los nombres.");
          }
        };

        return (
          <div
            onDragOver={e => { e.preventDefault(); setFolderDrag(true); }}
            onDragLeave={() => setFolderDrag(false)}
            onDrop={handleFolderDrop}
            style={{
              border: `2px dashed ${folderDrag ? COLORS.accent : COLORS.border}`,
              borderRadius: 14, padding: "20px 24px", marginBottom: 20,
              background: folderDrag ? "rgba(13,92,42,0.04)" : COLORS.surfaceHigh,
              textAlign: "center", transition: "all 0.2s", cursor: "default",
            }}>
            <div style={{ fontSize: 28, marginBottom: 6 }}>📁</div>
            <div style={{ fontSize: 14, fontWeight: 600, color: COLORS.texto, marginBottom: 4 }}>
              Arrastra la carpeta con los 6 Excel aquí
            </div>
            <div style={{ fontSize: 12, color: COLORS.textoMuted }}>
              La app detecta automáticamente cada archivo por su nombre
            </div>
            {folderMsg && (
              <div style={{ marginTop: 10, fontSize: 13, fontWeight: 600, color: folderMsg.startsWith("✅") ? COLORS.positivo : "#D97706" }}>
                {folderMsg}
              </div>
            )}
          </div>
        );
      })()}



      {error && (
        <div style={{ padding: "12px 16px", background: "rgba(239,68,68,0.1)", border: "1px solid #EF444444", borderRadius: 10, color: "#EF4444", fontSize: 13, marginBottom: 16 }}>
          {error}
        </div>
      )}

      {procesando && (
        <div style={{ padding: "12px 16px", background: "rgba(59,130,246,0.08)", border: `1px solid ${COLORS.accent}33`, borderRadius: 10, color: COLORS.accentLight, fontSize: 13, marginBottom: 16 }}>
          ⏳ {progreso}
        </div>
      )}

      <button onClick={procesar} disabled={procesando || !archivos.base || !archivos.goces}
        style={{
          width: "100%", padding: "13px", background: COLORS.accent,
          color: "#fff", border: "none", borderRadius: 10,
          fontSize: 14, fontWeight: 600, cursor: "pointer",
          opacity: procesando || !archivos.base || !archivos.goces ? 0.5 : 1,
        }}>
        {procesando ? "Procesando..." : "🚀 Procesar y Calcular Vacaciones"}
      </button>

      <div style={{ marginTop: 24, padding: "16px 20px", background: COLORS.surfaceHigh, borderRadius: 12, border: `0.5px solid ${COLORS.border}` }}>
        <div style={{ fontSize: 12, fontWeight: 700, color: COLORS.textoMuted, marginBottom: 8, textTransform: "uppercase", letterSpacing: "0.04em" }}>Fecha de corte del sistema</div>
        <div style={{ fontSize: 20, fontWeight: 700, color: COLORS.texto }}>Se leerá automáticamente de la celda <span style={{ color: COLORS.accentLight }}>K1</span> del Excel "Base de Datos"</div>
        <div style={{ fontSize: 12, color: COLORS.textoMuted, marginTop: 6 }}>
          Coloca la fecha de cálculo en K1 (fila 1, columna K) antes de importar. Si K1 está vacía, se usará el fallback <strong style={{ color: COLORS.textoSecundario }}>30/04/2026</strong>.
        </div>
      </div>
    </div>
  );
}

// Mapa de abreviaciones de gerencias
const ABREV_GERENCIA = {
  "LOGÍSTICA": "LOG",
  "LOGISTICA": "LOG",
  "PRODUCCIÓN Y OPERACIONES EN GRANJA": "POG",
  "PRODUCCION Y OPERACIONES EN GRANJA": "POG",
  "PRODUCCIÓN Y OPERACI...": "POG",
  "OPERACIONES AVÍCOLAS": "GOA",
  "OPERACIONES AVICOLAS": "GOA",
  "OPERACIONES NO AVÍCOLAS": "GONA",
  "OPERACIONES NO AVICOLAS": "GONA",
  "CANAL TRADICIONAL": "CT",
  "CANAL MODERNO": "CM",
  "PLANTAS": "PLANTAS",
  "ADMINISTRACIÓN Y FINANZAS": "GAF",
  "ADMINISTRACION Y FINANZAS": "GAF",
  "GESTIÓN HUMANA": "GH",
  "GESTION HUMANA": "GH",
  "CALIDAD": "CALIDAD",
  "DIRECCIÓN": "DIR",
  "DIRECCION": "DIR",
};

function abrevGerencia(nombre) {
  const upper = nombre.toUpperCase();
  // Buscar coincidencia exacta primero
  if (ABREV_GERENCIA[upper]) return ABREV_GERENCIA[upper];
  // Buscar coincidencia parcial
  for (const [key, val] of Object.entries(ABREV_GERENCIA)) {
    if (upper.includes(key) || key.includes(upper)) return val;
  }
  // Fallback: primeras 5 letras
  return nombre.slice(0, 5).toUpperCase();
}

function GraficaVencidosPorGerencia({ colaboradores, fechaCorteGlobal }) {
  const hoy = dateOnly(fechaCorteGlobal);
  const MESES_CORTO = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  const [vistaActiva, setVistaActiva] = useState("barras"); // barras | linea | calor
  const [filtroAño, setFiltroAño] = useState("Todos");
  const [filtroMes, setFiltroMes] = useState("Todos");

  const añosDisponibles = useMemo(() => {
    const set = new Set();
    for (const c of colaboradores)
      for (const p of c.periodos)
        if (p.fechaVencimiento) { const v = new Date(p.fechaVencimiento.getTime()+86400000); if (v<=hoy) set.add(String(v.getFullYear())); }
    return ["Todos", ...Array.from(set).sort().reverse()];
  }, [colaboradores, hoy]);

  const mesesDisponibles = useMemo(() => {
    const set = new Set();
    for (const c of colaboradores)
      for (const p of c.periodos)
        if (p.fechaVencimiento) { const v = new Date(p.fechaVencimiento.getTime()+86400000); if (v<=hoy && (filtroAño==="Todos"||String(v.getFullYear())===filtroAño)) set.add(String(v.getMonth()+1).padStart(2,"0")); }
    return ["Todos", ...Array.from(set).filter(m=>m!=="Todos").sort()];
  }, [colaboradores, hoy, filtroAño]);

  // Datos para barras dobles (vencidos + pendientes en riesgo)
  const dataGerencia = useMemo(() => {
    const mapa = {};
    for (const c of colaboradores) {
      const abrev = abrevGerencia(c.gerencia);
      if (!mapa[abrev]) mapa[abrev] = { label: abrev, full: c.gerencia, vencidos: 0, enRiesgo: 0 };
      // Vencidos (histórico filtrado)
      for (const p of c.periodos) {
        if ((p.tipo==="INDEMNIZACION"||p.tipo==="VENCIDA") && p.fechaVencimiento) {
          const v = new Date(p.fechaVencimiento.getTime()+86400000);
          if (v>hoy) continue;
          if (filtroAño!=="Todos" && String(v.getFullYear())!==filtroAño) continue;
          if (filtroMes!=="Todos" && String(v.getMonth()+1).padStart(2,"0")!==filtroMes) continue;
          mapa[abrev].vencidos += Math.max(0, p.diasIndemnizacionBruta ?? p.diasBase-p.diasGozados-(p.diasComprados||0));
        }
      }
      // Pendientes en riesgo (≤90 días para vencer)
      const pendiente = c.periodos.find(p=>p.tipo==="PENDIENTE"&&p.saldo>0&&p.fechaVencimiento);
      if (pendiente && c.enRiesgo) mapa[abrev].enRiesgo += pendiente.saldo;
    }
    return Object.values(mapa)
      .map(d=>({...d, vencidos:Math.round(d.vencidos), enRiesgo:Math.round(d.enRiesgo)}))
      .filter(d=>d.vencidos>0||d.enRiesgo>0)
      .sort((a,b)=>b.vencidos-a.vencidos);
  }, [colaboradores, hoy, filtroAño, filtroMes]);

  // Datos para línea de evolución (últimos 12 meses)
  const dataLinea = useMemo(() => {
    const puntos = [];
    for (let i=11; i>=0; i--) {
      const fecha = new Date(hoy.getFullYear(), hoy.getMonth()-i, 1);
      const año = fecha.getFullYear(), mes = fecha.getMonth()+1;
      let dias = 0;
      for (const c of colaboradores)
        for (const p of c.periodos)
          if ((p.tipo==="INDEMNIZACION"||p.tipo==="VENCIDA") && p.fechaVencimiento) {
            const v = new Date(p.fechaVencimiento.getTime()+86400000);
            if (v.getFullYear()===año && v.getMonth()+1===mes && v<=hoy)
              dias += Math.max(0, p.diasIndemnizacionBruta ?? p.diasBase-p.diasGozados-(p.diasComprados||0));
          }
      puntos.push({ label: MESES_CORTO[mes-1], año, mes, dias: Math.round(dias) });
    }
    return puntos;
  }, [colaboradores, hoy]);

  // Datos para mapa de calor (gerencia x mes, últimos 12 meses)
  const { gerenciasCalor, mesesCalor, mapaCalor, maxCalor } = useMemo(() => {
    const gerSet = new Set(), mesSet = new Set();
    const mapa = {};
    for (let i=11; i>=0; i--) {
      const fecha = new Date(hoy.getFullYear(), hoy.getMonth()-i, 1);
      mesSet.add(`${fecha.getFullYear()}-${String(fecha.getMonth()+1).padStart(2,"0")}`);
    }
    for (const c of colaboradores) {
      const abrev = abrevGerencia(c.gerencia);
      for (const p of c.periodos) {
        if ((p.tipo==="INDEMNIZACION"||p.tipo==="VENCIDA") && p.fechaVencimiento) {
          const v = new Date(p.fechaVencimiento.getTime()+86400000);
          const key = `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,"0")}`;
          if (!mesSet.has(key)||v>hoy) continue;
          gerSet.add(abrev);
          const k = `${abrev}|${key}`;
          mapa[k] = (mapa[k]||0) + Math.max(0, p.diasIndemnizacionBruta ?? p.diasBase-p.diasGozados-(p.diasComprados||0));
        }
      }
    }
    const maxC = Math.max(...Object.values(mapa), 1);
    return { gerenciasCalor: Array.from(gerSet).sort(), mesesCalor: Array.from(mesSet).sort(), mapaCalor: mapa, maxCalor: maxC };
  }, [colaboradores, hoy]);

  const maxBarras = Math.max(...dataGerencia.map(d=>Math.max(d.vencidos, d.enRiesgo)), 1);
  const H = 150;

  const TabVista = ({id, label}) => (
    <button onClick={()=>setVistaActiva(id)} style={{ padding:"5px 12px", borderRadius:8, border:"none", background: vistaActiva===id ? COLORS.accent : COLORS.bg, color: vistaActiva===id ? "white" : COLORS.textoMuted, cursor:"pointer", fontSize:11, fontWeight:600 }}>{label}</button>
  );

  return (
    <div style={{ background: COLORS.surface, borderRadius: 12, padding: 24, border: `0.5px solid ${COLORS.border}` }}>
      {/* Header */}
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", flexWrap:"wrap", gap:12, marginBottom:16 }}>
        <div>
          <div style={{ fontSize:14, fontWeight:700, color:COLORS.texto }}>Análisis de vencimientos por gerencia</div>
          <div style={{ fontSize:11, color:COLORS.textoMuted, marginTop:2 }}>Histórico vencido + pendientes en riesgo</div>
        </div>
        <div style={{ display:"flex", gap:8, flexWrap:"wrap", alignItems:"center" }}>
          <div style={{ display:"flex", gap:4 }}>
            <TabVista id="barras" label="📊 Barras" />
            <TabVista id="linea" label="📈 Evolución" />
            <TabVista id="calor" label="🗓 Mapa de calor" />
          </div>
          {vistaActiva==="barras" && <>
            <select value={filtroAño} onChange={(e)=>{setFiltroAño(e.target.value);setFiltroMes("Todos");}}
              style={{ background:COLORS.bg, border:`1px solid ${COLORS.border}`, color:COLORS.texto, borderRadius:8, padding:"5px 10px", fontSize:12, outline:"none" }}>
              {añosDisponibles.map(a=><option key={a} value={a}>{a==="Todos"?"Todos los años":a}</option>)}
            </select>
            <select value={filtroMes} onChange={(e)=>setFiltroMes(e.target.value)}
              style={{ background:COLORS.bg, border:`1px solid ${COLORS.border}`, color:COLORS.texto, borderRadius:8, padding:"5px 10px", fontSize:12, outline:"none" }}>
              {mesesDisponibles.map(m=><option key={m} value={m}>{m==="Todos"?"Todos los meses":MESES[parseInt(m)-1]}</option>)}
            </select>
          </>}
        </div>
      </div>

      {/* ── VISTA BARRAS DOBLES ── */}
      {vistaActiva==="barras" && (
        <>
          <div style={{ display:"flex", gap:16, marginBottom:12 }}>
            <div style={{ display:"flex", alignItems:"center", gap:6, fontSize:11, color:COLORS.textoMuted }}>
              <div style={{ width:12, height:12, background:COLORS.vencida, borderRadius:2 }}/> Días vencidos
            </div>
            <div style={{ display:"flex", alignItems:"center", gap:6, fontSize:11, color:COLORS.textoMuted }}>
              <div style={{ width:12, height:12, background:COLORS.pendiente, borderRadius:2 }}/> Pendientes en riesgo (≤90d)
            </div>
          </div>
          {dataGerencia.length===0 ? (
            <div style={{ textAlign:"center", padding:32, color:COLORS.textoMuted, fontSize:13 }}>Sin datos para el período seleccionado</div>
          ) : (
            <div style={{ display:"flex", alignItems:"flex-end", gap:6, height: H+50 }}>
              {dataGerencia.map((d) => {
                const h1 = Math.max((d.vencidos/maxBarras)*H, d.vencidos>0?4:0);
                const h2 = Math.max((d.enRiesgo/maxBarras)*H, d.enRiesgo>0?4:0);
                return (
                  <div key={d.label} style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", gap:4 }} title={d.full}>
                    <div style={{ display:"flex", gap:2, alignItems:"flex-end", width:"100%" }}>
                      <div style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", gap:2 }}>
                        <div style={{ fontSize:9, fontWeight:700, color:COLORS.vencida }}>{d.vencidos>999?(d.vencidos/1000).toFixed(1)+"k":d.vencidos||""}</div>
                        <div style={{ width:"100%", height:h1, background:COLORS.vencida, borderRadius:"3px 3px 0 0" }} />
                      </div>
                      {d.enRiesgo>0 && <div style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", gap:2 }}>
                        <div style={{ fontSize:9, fontWeight:700, color:COLORS.pendiente }}>{d.enRiesgo>999?(d.enRiesgo/1000).toFixed(1)+"k":d.enRiesgo}</div>
                        <div style={{ width:"100%", height:h2, background:COLORS.pendiente, borderRadius:"3px 3px 0 0" }} />
                      </div>}
                    </div>
                    <div style={{ fontSize:10, color:COLORS.textoMuted, textAlign:"center", fontWeight:600 }}>{d.label}</div>
                  </div>
                );
              })}
            </div>
          )}
        </>
      )}

      {/* ── VISTA LÍNEA EVOLUCIÓN ── */}
      {vistaActiva==="linea" && (() => {
        const maxL = Math.max(...dataLinea.map(d=>d.dias), 1);
        const W = 100, PH = 160, PW = dataLinea.length * W;
        const pts = dataLinea.map((d,i) => ({ x: i*W + W/2, y: PH - Math.max((d.dias/maxL)*PH*0.85, d.dias>0?4:0), dias:d.dias, label:d.label }));
        const path = pts.map((p,i) => `${i===0?"M":"L"}${p.x},${p.y}`).join(" ");
        return (
          <div>
            <div style={{ fontSize:12, color:COLORS.textoMuted, marginBottom:10 }}>Días vencidos por mes — últimos 12 meses</div>
            <div style={{ overflowX:"auto" }}>
              <svg width={PW} height={PH+40} style={{ display:"block" }}>
                {/* Líneas guía */}
                {[0,25,50,75,100].map(pct => {
                  const y = PH - (pct/100)*PH*0.85;
                  return <line key={pct} x1={0} y1={y} x2={PW} y2={y} stroke={COLORS.border} strokeWidth={0.5} strokeDasharray="4,4"/>;
                })}
                {/* Área */}
                <path d={`${path} L${pts[pts.length-1].x},${PH} L${pts[0].x},${PH} Z`} fill={`${COLORS.vencida}18`}/>
                {/* Línea */}
                <path d={path} fill="none" stroke={COLORS.vencida} strokeWidth={2.5} strokeLinejoin="round" strokeLinecap="round"/>
                {/* Puntos */}
                {pts.map((p,i) => (
                  <g key={i}>
                    <circle cx={p.x} cy={p.y} r={5} fill={COLORS.vencida} stroke="white" strokeWidth={2}/>
                    {p.dias>0 && <text x={p.x} y={p.y-10} textAnchor="middle" fontSize={9} fill={COLORS.vencida} fontWeight="700">{p.dias}</text>}
                    <text x={p.x} y={PH+16} textAnchor="middle" fontSize={10} fill={COLORS.textoMuted}>{p.label}</text>
                    <text x={p.x} y={PH+28} textAnchor="middle" fontSize={9} fill={COLORS.textoMuted + "88"}>{dataLinea[i].año}</text>
                  </g>
                ))}
              </svg>
            </div>
          </div>
        );
      })()}

      {/* ── MAPA DE CALOR ── */}
      {vistaActiva==="calor" && (
        <div>
          <div style={{ fontSize:12, color:COLORS.textoMuted, marginBottom:10 }}>Intensidad de vencimientos por gerencia y mes — últimos 12 meses</div>
          <div style={{ overflowX:"auto" }}>
            <table style={{ borderCollapse:"collapse", fontSize:11 }}>
              <thead>
                <tr>
                  <th style={{ padding:"6px 10px", color:COLORS.textoMuted, textAlign:"left", whiteSpace:"nowrap", fontWeight:600 }}>Gerencia</th>
                  {mesesCalor.map(m => {
                    const [a, me] = m.split("-").map(Number);
                    return <th key={m} style={{ padding:"6px 8px", color:COLORS.textoMuted, fontWeight:600, textAlign:"center", whiteSpace:"nowrap" }}>{MESES_CORTO[me-1]}<br/><span style={{ fontSize:9, fontWeight:400 }}>{a}</span></th>;
                  })}
                  <th style={{ padding:"6px 10px", color:COLORS.textoMuted, fontWeight:600, textAlign:"center" }}>Total</th>
                </tr>
              </thead>
              <tbody>
                {gerenciasCalor.map(g => {
                  const total = mesesCalor.reduce((s,m) => s + (mapaCalor[`${g}|${m}`]||0), 0);
                  return (
                    <tr key={g}>
                      <td style={{ padding:"5px 10px", fontWeight:600, color:COLORS.texto, whiteSpace:"nowrap", borderBottom:`1px solid ${COLORS.border}15` }}>{g}</td>
                      {mesesCalor.map(m => {
                        const val = Math.round(mapaCalor[`${g}|${m}`]||0);
                        const pct = val/maxCalor;
                        const bg = val===0 ? COLORS.bg : `rgba(220,38,38,${0.1 + pct*0.85})`;
                        const txtColor = pct>0.5 ? "white" : val>0 ? COLORS.vencida : COLORS.textoMuted;
                        return (
                          <td key={m} style={{ padding:"5px 8px", textAlign:"center", background:bg, borderBottom:`1px solid ${COLORS.border}15`, fontWeight: val>0?700:400, color:txtColor, minWidth:42 }}>
                            {val||""}
                          </td>
                        );
                      })}
                      <td style={{ padding:"5px 10px", textAlign:"center", fontWeight:700, color:COLORS.vencida, borderBottom:`1px solid ${COLORS.border}15` }}>{Math.round(total)}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
          <div style={{ display:"flex", alignItems:"center", gap:8, marginTop:12 }}>
            <span style={{ fontSize:11, color:COLORS.textoMuted }}>Intensidad:</span>
            {[0,25,50,75,100].map(pct => (
              <div key={pct} style={{ display:"flex", alignItems:"center", gap:4 }}>
                <div style={{ width:20, height:12, borderRadius:3, background:pct===0?COLORS.bg:`rgba(220,38,38,${0.1+pct/100*0.85})` }}/>
                <span style={{ fontSize:10, color:COLORS.textoMuted }}>{pct===0?"0":pct===100?"Max":""}</span>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// ─── PANEL POR BUSINESS PARTNER ──────────────────────────────────────────────
function PanelBusinessPartners({ colaboradores, fechaCorteGlobal, setPagina, setFiltroGerenciaAlertas }) {
  const hoy = dateOnly(fechaCorteGlobal);

  const dataBP = useMemo(() => {
    const mapa = {};
    for (const c of colaboradores) {
      const abrev = abrevGerencia(c.gerencia);
      if (!mapa[abrev]) mapa[abrev] = {
        gerencia: abrev, full: c.gerencia,
        total: 0, enRiesgo: 0, criticos: 0, diasVencidos: 0,
        diasPendientesRiesgo: 0, sinRiesgo: 0,
      };
      const bp = mapa[abrev];
      bp.total++;
      bp.diasVencidos += c.diasVencidas || 0;
      const pendiente = c.periodos.find(p => p.tipo === "PENDIENTE" && p.saldo > 0 && p.fechaVencimiento);
      if (pendiente) {
        const fechaMin = dateOnly(new Date(pendiente.fechaVencimiento.getTime() - (pendiente.saldo - 1) * 86400000));
        const diasHastaTope = daysBetween(hoy, fechaMin);
        if (diasHastaTope <= 0) bp.criticos++;
        else if (diasHastaTope <= 90) bp.enRiesgo++;
        else bp.sinRiesgo++;
        if (c.enRiesgo) bp.diasPendientesRiesgo += pendiente.saldo;
      } else {
        bp.sinRiesgo++;
      }
    }
    return Object.values(mapa).sort((a, b) => b.criticos - a.criticos || b.enRiesgo - a.enRiesgo);
  }, [colaboradores, hoy]);

  return (
    <div style={{ background: COLORS.surface, borderRadius: 12, border: `0.5px solid ${COLORS.border}`, padding: 24 }}>
      <div style={{ fontSize: 14, fontWeight: 700, color: COLORS.texto, marginBottom: 4 }}>🏢 Panel por Business Partner</div>
      <div style={{ fontSize: 12, color: COLORS.textoMuted, marginBottom: 16 }}>Resumen de gestión vacacional por gerencia</div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(280px, 1fr))", gap: 12 }}>
        {dataBP.map((bp) => {
          const pctCriticos = bp.total > 0 ? Math.round((bp.criticos / bp.total) * 100) : 0;
          const pctRiesgo = bp.total > 0 ? Math.round((bp.enRiesgo / bp.total) * 100) : 0;
          const pctOk = bp.total > 0 ? Math.round((bp.sinRiesgo / bp.total) * 100) : 0;
          const semaforo = bp.criticos > 0 ? "#DC2626" : bp.enRiesgo > 0 ? "#F97316" : COLORS.positivo;

          return (
            <div key={bp.gerencia} style={{ background: COLORS.bg, borderRadius: 12, border: `1px solid ${semaforo}33`, borderLeft: `4px solid ${semaforo}`, padding: "14px 16px" }}>
              {/* Header */}
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 12 }}>
                <div>
                  <div style={{ fontSize: 16, fontWeight: 800, color: semaforo }}>{bp.gerencia}</div>
                  <div style={{ fontSize: 10, color: COLORS.textoMuted, marginTop: 1 }} title={bp.full}>{bp.full.length > 32 ? bp.full.slice(0, 32) + "…" : bp.full}</div>
                </div>
                <div style={{ fontSize: 13, fontWeight: 700, color: COLORS.textoMuted }}>{bp.total} colab.</div>
              </div>

              {/* Barra de estado */}
              <div style={{ height: 8, background: COLORS.surfaceHigh, borderRadius: 4, overflow: "hidden", display: "flex", marginBottom: 10 }}>
                <div style={{ width: `${pctCriticos}%`, background: "#DC2626", transition: "width 0.3s" }} title={`Críticos: ${bp.criticos}`} />
                <div style={{ width: `${pctRiesgo}%`, background: "#F97316", transition: "width 0.3s" }} title={`En riesgo: ${bp.enRiesgo}`} />
                <div style={{ width: `${pctOk}%`, background: COLORS.positivo, transition: "width 0.3s" }} title={`Sin riesgo: ${bp.sinRiesgo}`} />
              </div>

              {/* KPIs */}
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 6 }}>
                <div style={{ textAlign: "center", padding: "6px 4px", background: "rgba(220,38,38,0.08)", borderRadius: 8 }}>
                  <div style={{ fontSize: 18, fontWeight: 800, color: "#DC2626" }}>{bp.criticos}</div>
                  <div style={{ fontSize: 9, color: COLORS.textoMuted }}>🔴 Críticos</div>
                </div>
                <div style={{ textAlign: "center", padding: "6px 4px", background: "rgba(249,115,22,0.08)", borderRadius: 8 }}>
                  <div style={{ fontSize: 18, fontWeight: 800, color: "#F97316" }}>{bp.enRiesgo}</div>
                  <div style={{ fontSize: 9, color: COLORS.textoMuted }}>🟠 En riesgo</div>
                </div>
                <div style={{ textAlign: "center", padding: "6px 4px", background: "rgba(22,163,74,0.08)", borderRadius: 8 }}>
                  <div style={{ fontSize: 18, fontWeight: 800, color: COLORS.positivo }}>{bp.sinRiesgo}</div>
                  <div style={{ fontSize: 9, color: COLORS.textoMuted }}>🟢 OK</div>
                </div>
              </div>

              {/* Días */}
              <div style={{ display: "flex", justifyContent: "space-between", marginTop: 10, padding: "6px 0", borderTop: `1px solid ${COLORS.border}` }}>
                <div style={{ fontSize: 11, color: COLORS.textoMuted }}>
                  Días vencidos: <strong style={{ color: COLORS.vencida }}>{Math.round(bp.diasVencidos)}</strong>
                </div>
                <div style={{ fontSize: 11, color: COLORS.textoMuted }}>
                  En riesgo: <strong style={{ color: COLORS.pendiente }}>{Math.round(bp.diasPendientesRiesgo)}</strong>d
                </div>
              </div>

              {/* Botón de acción */}
              <button
                onClick={() => {
                  setFiltroGerenciaAlertas(bp.full);
                  setPagina("alertas");
                }}
                style={{
                  marginTop: 10, width: "100%", padding: "8px",
                  background: semaforo + "15", border: `1px solid ${semaforo}44`,
                  color: semaforo, borderRadius: 8, cursor: "pointer",
                  fontSize: 12, fontWeight: 700, display: "flex",
                  alignItems: "center", justifyContent: "center", gap: 6,
                }}>
                🔔 Ver alertas de {bp.gerencia} →
              </button>
            </div>
          );
        })}
      </div>

      {/* Leyenda */}
      <div style={{ display: "flex", gap: 16, marginTop: 14, flexWrap: "wrap" }}>
        {[["#DC2626","🔴 Críticos","Tope ya pasó"],["#F97316","🟠 En riesgo","Tope ≤ 90 días"],[COLORS.positivo,"🟢 OK","Tope > 90 días"]].map(([c, l, s]) => (
          <div key={l} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 11, color: COLORS.textoMuted }}>
            <div style={{ width: 10, height: 10, borderRadius: 2, background: c }} />
            <span><strong style={{ color: c }}>{l}</strong> — {s}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function PaginaDashboard({ colaboradores, fechaCorteGlobal, setPagina, setFiltroGerenciaAlertas }) {
  const hoy = dateOnly(fechaCorteGlobal);

  const stats = useMemo(() => {
    const total = colaboradores.length;
    const conVencidas = colaboradores.filter((c) => c.tieneVencidas).length;
    const conIndemnizacion = colaboradores.filter((c) => c.tieneIndemnizacion).length;
    const enRiesgo = colaboradores.filter((c) => c.enRiesgo).length;
    const diasVencidosTotal = colaboradores.reduce((s, c) => s + c.diasVencidas, 0);
    const diasPorGozarTotal = colaboradores.reduce((s, c) => s + c.totalPorGozar, 0);
    const consumoTruncas = colaboradores.filter((c) => c.consumoDesdeTracas).length;
    const sinRiesgo = colaboradores.filter((c) => c.diasPendientes > 0 && !c.enRiesgo).length;

    const porGerencia = {};
    for (const c of colaboradores) {
      if (!porGerencia[c.gerencia]) porGerencia[c.gerencia] = { vencidas: 0, pendientes: 0, total: 0, enRiesgo: 0, conPendientes: 0 };
      porGerencia[c.gerencia].vencidas += c.diasVencidas;
      porGerencia[c.gerencia].pendientes += c.diasPendientes;
      porGerencia[c.gerencia].total += 1;
      if (c.enRiesgo) porGerencia[c.gerencia].enRiesgo += 1;
      if (c.diasPendientes > 0) porGerencia[c.gerencia].conPendientes += 1;
    }
    return { total, conVencidas, conIndemnizacion, enRiesgo, diasVencidosTotal, diasPorGozarTotal, consumoTruncas, sinRiesgo, porGerencia };
  }, [colaboradores]);

  // Proyección de vencimientos próximos 6 meses
  // Muestra TODOS los períodos que vencen ese mes (ya vencidos + pendientes)
  // para que el número sea consistente independientemente de la fecha de corte
  const ACRONIMOS_GERENCIA = {
    "LOGÍSTICA": "LOG", "LOGISTICA": "LOG",
    "PRODUCCIÓN Y OPERACIONES EN GRANJA": "POG", "PRODUCCION Y OPERACIONES EN GRANJA": "POG",
    "GESTIÓN HUMANA": "GH", "GESTION HUMANA": "GH",
    "OPERACIONES AVÍCOLAS": "GOA", "OPERACIONES AVICOLAS": "GOA",
    "OPERACIONES NO AVÍCOLAS": "GONA", "OPERACIONES NO AVICOLAS": "GONA",
    "PLANTAS": "PLANTAS",
    "CALIDAD": "CAL",
    "DIRECCIÓN": "DIR", "DIRECCION": "DIR",
    "ADMINISTRACIÓN Y FINANZAS": "GAF", "ADMINISTRACION Y FINANZAS": "GAF",
    "CANAL MODERNO": "CM",
    "CANAL TRADICIONAL": "CT",
  };
  const getAcronimo = (gerencia) => {
    const upper = (gerencia || "").toUpperCase();
    for (const [key, val] of Object.entries(ACRONIMOS_GERENCIA)) {
      if (upper.includes(key)) return val;
    }
    return (gerencia || "").slice(0, 4).toUpperCase();
  };

  const proyeccion = useMemo(() => {
    const meses = [];
    for (let i = 0; i < 6; i++) {
      const mesDate = new Date(hoy.getFullYear(), hoy.getMonth() + i, 1);
      const año = mesDate.getFullYear();
      const mes = mesDate.getMonth() + 1;
      let diasQueVencen = 0;
      let colabsAfectados = 0;
      const porGerencia = {};
      for (const c of colaboradores) {
        for (const p of c.periodos) {
          if (!p.fechaVencimiento) continue;
          const venceEl = new Date(p.fechaVencimiento.getTime() + 86400000);
          if (venceEl.getFullYear() === año && venceEl.getMonth() + 1 === mes) {
            const diasVenc = p.tipo === "INDEMNIZACION" && p.diasIndemnizacionBruta !== null
              ? Math.max(0, p.diasIndemnizacionBruta)
              : p.tipo === "VENCIDA" && p.diasVencidosReales !== undefined
              ? p.diasVencidosReales
              : Math.max(0, p.diasBase - p.diasGozados - (p.diasComprados || 0));
            if (diasVenc > 0) {
              diasQueVencen += diasVenc;
              colabsAfectados++;
              const acr = getAcronimo(c.gerencia);
              if (!porGerencia[acr]) porGerencia[acr] = { dias: 0, colab: 0 };
              porGerencia[acr].dias += diasVenc;
              porGerencia[acr].colab++;
            }
          }
        }
      }
      meses.push({
        label: ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"][mes - 1],
        diasQueVencen: Math.round(diasQueVencen),
        colabsAfectados,
        porGerencia,
        yaPaso: mesDate < new Date(hoy.getFullYear(), hoy.getMonth(), 1),
      });
    }
    return meses;
  }, [colaboradores, hoy]);

  // Top 10 colaboradores con más días en riesgo
  const top10Riesgo = useMemo(() =>
    colaboradores
      .filter((c) => c.diasPendientes > 0)
      .map((c) => {
        const pendiente = c.periodos.find((p) => p.tipo === "PENDIENTE" && p.saldo > 0);
        if (!pendiente) return null;
        const fechaMinSalida = dateOnly(new Date(pendiente.fechaVencimiento.getTime() - (pendiente.saldo - 1) * 86400000));
        const diff = daysBetween(hoy, fechaMinSalida);
        // Si ya pasó, restamos 1 para incluir el día de inicio (consistente con calendario)
        const diasHastaTope = diff >= 0 ? diff : diff - 1;
        return { ...c, diasHastaTope };
      })
      .filter(Boolean)
      .sort((a, b) => a.diasHastaTope - b.diasHastaTope)
      .slice(0, 10),
    [colaboradores, hoy]
  );

  // Distribución por antigüedad
  const porAntiguedad = useMemo(() => {
    const grupos = { "1-3 años": 0, "4-7 años": 0, "8-12 años": 0, "13+ años": 0 };
    for (const c of colaboradores) {
      const años = Math.floor(daysBetween(dateOnly(c.fechaCorte), hoy) / 360);
      if (años <= 3) grupos["1-3 años"]++;
      else if (años <= 7) grupos["4-7 años"]++;
      else if (años <= 12) grupos["8-12 años"]++;
      else grupos["13+ años"]++;
    }
    return grupos;
  }, [colaboradores, hoy]);

  // Vencimientos este mes vs mes anterior
  const tendencia = useMemo(() => {
    const contarMes = (año, mes) => {
      let dias = 0;
      for (const c of colaboradores) {
        for (const p of c.periodos) {
          if ((p.tipo === "INDEMNIZACION" || p.tipo === "VENCIDA") && p.fechaVencimiento) {
            const v = new Date(p.fechaVencimiento.getTime() + 86400000);
            if (v.getFullYear() === año && v.getMonth() + 1 === mes && v <= hoy) {
              const diasVenc = p.tipo === "INDEMNIZACION" && p.diasIndemnizacionBruta !== null
                ? Math.max(0, p.diasIndemnizacionBruta)
                : p.tipo === "VENCIDA" && p.diasVencidosReales !== undefined
                ? p.diasVencidosReales
                : Math.max(0, p.diasBase - p.diasGozados - (p.diasComprados || 0));
              dias += diasVenc;
            }
          }
        }
      }
      return Math.round(dias);
    };
    const esteMes = contarMes(hoy.getFullYear(), hoy.getMonth() + 1);
    const mesAnterior = contarMes(
      hoy.getMonth() === 0 ? hoy.getFullYear() - 1 : hoy.getFullYear(),
      hoy.getMonth() === 0 ? 12 : hoy.getMonth()
    );
    const diff = esteMes - mesAnterior;
    const pct = mesAnterior > 0 ? Math.round((diff / mesAnterior) * 100) : 0;
    return { esteMes, mesAnterior, diff, pct, mejora: diff < 0 };
  }, [colaboradores, hoy]);

  const gerenciasChart = Object.entries(stats.porGerencia)
    .sort((a, b) => b[1].vencidas - a[1].vencidas).slice(0, 8)
    .map(([g, v]) => ({ label: g.length > 12 ? g.slice(0, 12) + "…" : g, value: Math.round(v.vencidas), color: COLORS.vencida }));

  const maxProyeccion = Math.max(...proyeccion.map((m) => m.diasQueVencen), 1);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 24 }}>

      {/* Header */}
      <div>
        <div style={{ fontSize: 20, fontWeight: 600, color: COLORS.texto }}>Dashboard</div>
        <div style={{ fontSize: 14, color: COLORS.textoMuted, marginTop: 2 }}>Resumen ejecutivo al {fmtDate(fechaCorteGlobal)}</div>
      </div>

      {/* KPIs principales */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(170px, 1fr))", gap: 14 }}>
        <KPICard label="Total colaboradores" value={stats.total.toLocaleString()} icon="👥" color={COLORS.texto} />
        <KPICard label="Con indemnización" value={stats.conIndemnizacion.toLocaleString()} icon="🟠" color="#F97316" sub="Períodos históricos vencidos" />
        <KPICard label="Con vencidas" value={stats.conVencidas.toLocaleString()} icon="⚠️" color={COLORS.vencida} sub="Requieren atención inmediata" />
        <KPICard label="En riesgo (90 días)" value={stats.enRiesgo.toLocaleString()} icon="🔔" color={COLORS.pendiente} sub="Próximas a vencer" />
        <KPICard label="Días vencidos total" value={Math.round(stats.diasVencidosTotal).toLocaleString()} icon="📅" color={COLORS.vencida} />
        <KPICard label="Días por gozar total" value={Math.round(stats.diasPorGozarTotal).toLocaleString()} icon="📊" color={COLORS.positivo} />
      </div>

      {/* Tendencia + Acciones rápidas */}
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>

        {/* Tendencia este mes vs anterior */}
        <div style={{ background: COLORS.surface, borderRadius: 12, padding: 24, border: `0.5px solid ${COLORS.border}`, boxShadow: "0 1px 3px rgba(0,0,0,0.04)" }}>
          <div style={{ fontSize: 14, fontWeight: 700, color: COLORS.texto, marginBottom: 16 }}>📈 Tendencia de vencimientos</div>
          <div style={{ display: "flex", gap: 16, marginBottom: 16 }}>
            <div style={{ flex: 1, textAlign: "center", padding: "12px", background: COLORS.bg, borderRadius: 10 }}>
              <div style={{ fontSize: 11, color: COLORS.textoMuted, marginBottom: 4 }}>Mes anterior</div>
              <div style={{ fontSize: 24, fontWeight: 700, color: COLORS.textoSecundario }}>{tendencia.mesAnterior}</div>
              <div style={{ fontSize: 10, color: COLORS.textoMuted }}>días vencidos</div>
            </div>
            <div style={{ display: "flex", alignItems: "center", fontSize: 24 }}>
              {tendencia.mejora ? "→" : "→"}
            </div>
            <div style={{ flex: 1, textAlign: "center", padding: "12px", background: tendencia.mejora ? "rgba(22,163,74,0.08)" : "rgba(239,68,68,0.08)", borderRadius: 10, border: `1px solid ${tendencia.mejora ? COLORS.positivo + "33" : COLORS.vencida + "33"}` }}>
              <div style={{ fontSize: 11, color: COLORS.textoMuted, marginBottom: 4 }}>Este mes</div>
              <div style={{ fontSize: 24, fontWeight: 700, color: tendencia.mejora ? COLORS.positivo : COLORS.vencida }}>{tendencia.esteMes}</div>
              <div style={{ fontSize: 10, color: COLORS.textoMuted }}>días vencidos</div>
            </div>
          </div>
          <div style={{ textAlign: "center", padding: "8px 12px", borderRadius: 8, background: tendencia.mejora ? "rgba(22,163,74,0.08)" : "rgba(239,68,68,0.08)", fontSize: 13, fontWeight: 700, color: tendencia.mejora ? COLORS.positivo : COLORS.vencida }}>
            {tendencia.mejora ? "✅" : "⚠"} {tendencia.mejora ? "Mejora" : "Aumento"} de {Math.abs(tendencia.pct)}% respecto al mes anterior
          </div>
        </div>

        {/* Acciones rápidas */}
        <div style={{ background: COLORS.surface, borderRadius: 12, padding: 24, border: `0.5px solid ${COLORS.border}`, boxShadow: "0 1px 3px rgba(0,0,0,0.04)" }}>
          <div style={{ fontSize: 14, fontWeight: 700, color: COLORS.texto, marginBottom: 16 }}>⚡ Acciones rápidas</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {[
              { icon: "🔥", label: "Ver críticos esta semana", sub: `${colaboradores.filter((c) => { const p = c.periodos.find((p) => p.tipo === "PENDIENTE" && p.saldo > 0); if (!p) return false; const tope = new Date(p.fechaVencimiento.getTime() - (p.saldo-1)*86400000); return daysBetween(hoy, tope) <= 7; }).length} colaboradores`, color: "#DC2626", pagina: "alertas" },
              { icon: "📄", label: "Generar solicitud vacacional", sub: "Autorización PDF", color: COLORS.accent, pagina: "solicitud" },
              { icon: "📆", label: "Historial del mes actual", sub: `${["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"][hoy.getMonth()]} ${hoy.getFullYear()}`, color: COLORS.trunca, pagina: "historial" },
            ].map(({ icon, label, sub, color, pagina: p }) => (
              <button key={label} onClick={() => setPagina(p)} style={{ background: color + "11", border: `1px solid ${color}33`, borderRadius: 10, padding: "12px 16px", cursor: "pointer", display: "flex", alignItems: "center", gap: 12, textAlign: "left" }}>
                <span style={{ fontSize: 22 }}>{icon}</span>
                <div>
                  <div style={{ fontSize: 13, fontWeight: 700, color }}>{label}</div>
                  <div style={{ fontSize: 11, color: COLORS.textoMuted }}>{sub}</div>
                </div>
              </button>
            ))}
          </div>
        </div>
      </div>

      {/* Proyección 6 meses */}
      <div style={{ background: COLORS.surface, borderRadius: 12, padding: 24, border: `0.5px solid ${COLORS.border}`, boxShadow: "0 1px 3px rgba(0,0,0,0.04)" }}>
        <div style={{ fontSize: 14, fontWeight: 600, color: COLORS.texto, marginBottom: 4 }}>📊 Proyección de vencimientos — próximos 6 meses</div>
        <div style={{ fontSize: 12, color: COLORS.textoMuted, marginBottom: 16 }}>Días que vencerán si ningún colaborador sale de vacaciones</div>
        {/* Barras */}
        <div style={{ display: "flex", gap: 12, alignItems: "flex-end", height: 140 }}>
          {proyeccion.map((m, i) => {
            const pct = m.diasQueVencen / maxProyeccion;
            const barH = Math.max(pct * 100, m.diasQueVencen > 0 ? 4 : 0);
            const color = i === 0 ? COLORS.vencida : i <= 2 ? "#F97316" : COLORS.pendiente;
            return (
              <div key={m.label} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 6 }}>
                <div style={{ fontSize: 11, fontWeight: 700, color }}>{m.diasQueVencen > 0 ? m.diasQueVencen : "—"}</div>
                <div style={{ width: "100%", height: barH, background: color, borderRadius: "4px 4px 0 0", transition: "height 0.3s", minHeight: 2, opacity: m.yaPaso ? 0.4 : 1 }} />
                <div style={{ fontSize: 11, color: COLORS.textoMuted, textAlign: "center" }}>{m.label}</div>
                {m.colabsAfectados > 0 && <div style={{ fontSize: 9, color: COLORS.textoMuted }}>{m.colabsAfectados} colab.</div>}
              </div>
            );
          })}
        </div>
        {/* Desglose por gerencia — siempre visible */}
        <div style={{ marginTop: 16, borderTop: `0.5px solid ${COLORS.border}`, paddingTop: 14 }}>
          <div style={{ display: "flex", gap: 12 }}>
            {proyeccion.map((m, i) => {
              const color = i === 0 ? COLORS.vencida : i <= 2 ? "#F97316" : COLORS.pendiente;
              const gerencias = Object.entries(m.porGerencia || {})
                .sort(([, a], [, b]) => b.dias - a.dias);
              return (
                <div key={m.label} style={{ flex: 1, display: "flex", flexDirection: "column", gap: 3 }}>
                  {gerencias.length === 0 ? (
                    <div style={{ fontSize: 9, color: COLORS.textoMuted, textAlign: "center" }}>—</div>
                  ) : gerencias.map(([acr, v]) => (
                    <div key={acr} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "2px 4px", background: color + "0D", borderRadius: 4 }}>
                      <span style={{ fontSize: 9, fontWeight: 600, color: color }}>{acr}</span>
                      <span style={{ fontSize: 8, color: COLORS.textoMuted }}>{v.colab} colab. · {Math.round(v.dias)}d</span>
                    </div>
                  ))}
                </div>
              );
            })}
          </div>
        </div>
      </div>

      {/* Top 10 + Antigüedad */}
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>

        {/* Top 10 en riesgo */}
        <div style={{ background: COLORS.surface, borderRadius: 12, padding: 24, border: `0.5px solid ${COLORS.border}`, boxShadow: "0 1px 3px rgba(0,0,0,0.04)" }}>
          <div style={{ fontSize: 14, fontWeight: 600, color: COLORS.texto, marginBottom: 16 }}>🏆 Top 10 — Mayor urgencia</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            {top10Riesgo.map((c, i) => {
              const color = c.diasHastaTope < 0 ? "#DC2626" : c.diasHastaTope <= 7 ? "#EF4444" : c.diasHastaTope <= 30 ? "#F97316" : COLORS.pendiente;
              return (
                <div key={c.cod} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 10px", background: COLORS.bg, borderRadius: 8, border: `1px solid ${color}22` }}>
                  <div style={{ width: 22, height: 22, borderRadius: "50%", background: color + "22", color, fontSize: 11, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>{i + 1}</div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 11, fontWeight: 600, color: COLORS.texto, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{c.nombres}</div>
                    <div style={{ fontSize: 10, color: COLORS.textoMuted }}>{c.gerencia.length > 20 ? c.gerencia.slice(0, 20) + "…" : c.gerencia}</div>
                  </div>
                  <div style={{ textAlign: "right", flexShrink: 0 }}>
                    <div style={{ fontSize: 12, fontWeight: 700, color }}>{c.diasHastaTope < 0 ? `−${Math.abs(c.diasHastaTope)}d` : `${c.diasHastaTope}d`}</div>
                    <div style={{ fontSize: 9, color: COLORS.textoMuted }}>{c.diasPendientes}d pend.</div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>

        {/* Distribución antigüedad + tasa riesgo gerencia */}
        <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>

          {/* Antigüedad */}
          <div style={{ background: COLORS.surface, borderRadius: 12, padding: 20, border: `0.5px solid ${COLORS.border}`, flex: 1 }}>
            <div style={{ fontSize: 14, fontWeight: 700, color: COLORS.texto, marginBottom: 14 }}>👥 Distribución por antigüedad</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {Object.entries(porAntiguedad).map(([label, value]) => {
                const pct = Math.round((value / stats.total) * 100);
                const colors = { "1-3 años": COLORS.positivo, "4-7 años": COLORS.pendiente, "8-12 años": "#F97316", "13+ años": COLORS.vencida };
                return (
                  <div key={label}>
                    <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, color: COLORS.textoSecundario, marginBottom: 4 }}>
                      <span>{label}</span>
                      <span style={{ fontWeight: 700, color: colors[label] }}>{value} ({pct}%)</span>
                    </div>
                    <div style={{ height: 6, background: COLORS.bg, borderRadius: 4, overflow: "hidden" }}>
                      <div style={{ width: `${pct}%`, height: "100%", background: colors[label], borderRadius: 4 }} />
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Tasa riesgo por gerencia */}
          <div style={{ background: COLORS.surface, borderRadius: 12, padding: 20, border: `0.5px solid ${COLORS.border}`, flex: 1 }}>
            <div style={{ fontSize: 14, fontWeight: 700, color: COLORS.texto, marginBottom: 14 }}>🎯 Tasa de riesgo por gerencia</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {Object.entries(stats.porGerencia)
                .filter(([, v]) => v.conPendientes > 0)
                .sort(([, a], [, b]) => (b.enRiesgo / b.conPendientes) - (a.enRiesgo / a.conPendientes))
                .slice(0, 6)
                .map(([g, v]) => {
                  const tasa = Math.round((v.enRiesgo / v.conPendientes) * 100);
                  const color = tasa >= 50 ? COLORS.vencida : tasa >= 25 ? "#F97316" : COLORS.positivo;
                  return (
                    <div key={g}>
                      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: COLORS.textoSecundario, marginBottom: 3 }}>
                        <span style={{ maxWidth: 140, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{g}</span>
                        <span style={{ fontWeight: 700, color }}>{tasa}%</span>
                      </div>
                      <div style={{ height: 5, background: COLORS.bg, borderRadius: 3, overflow: "hidden" }}>
                        <div style={{ width: `${tasa}%`, height: "100%", background: color, borderRadius: 3 }} />
                      </div>
                    </div>
                  );
                })
              }
            </div>
          </div>
        </div>
      </div>

      {/* Gráficos originales */}
      <GraficaVencidosPorGerencia colaboradores={colaboradores} fechaCorteGlobal={fechaCorteGlobal} />
      <div style={{ background: COLORS.surface, borderRadius: 12, padding: 24, border: `0.5px solid ${COLORS.border}` }}>
        <div style={{ fontSize: 14, fontWeight: 700, color: COLORS.texto, marginBottom: 16 }}>Distribución de estados</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          {[
            { label: "Con indemnización", value: stats.conIndemnizacion, total: stats.total, color: "#F97316" },
            { label: "Con vencidas", value: stats.conVencidas, total: stats.total, color: COLORS.vencida },
            { label: "En riesgo (90d)", value: stats.enRiesgo, total: stats.total, color: COLORS.pendiente },
            { label: "Consumo truncas", value: stats.consumoTruncas, total: stats.total, color: COLORS.trunca },
          ].map((item) => {
            const pct = Math.round((item.value / item.total) * 100);
            return (
              <div key={item.label}>
                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, color: COLORS.textoSecundario, marginBottom: 4 }}>
                  <span>{item.label}</span>
                  <span style={{ fontWeight: 700, color: item.color }}>{item.value} ({pct}%)</span>
                </div>
                <div style={{ height: 6, background: COLORS.bg, borderRadius: 4, overflow: "hidden" }}>
                  <div style={{ width: `${pct}%`, height: "100%", background: item.color, borderRadius: 4 }} />
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {/* Calendario de vencimientos */}
      <CalendarioVencimientos colaboradores={colaboradores} fechaCorteGlobal={fechaCorteGlobal} />

      {/* Panel Business Partners */}
      <PanelBusinessPartners colaboradores={colaboradores} fechaCorteGlobal={fechaCorteGlobal} setPagina={setPagina} setFiltroGerenciaAlertas={setFiltroGerenciaAlertas} />
    </div>
  );
}

// ─── CALENDARIO DE VENCIMIENTOS ───────────────────────────────────────────────
function CalendarioVencimientos({ colaboradores, fechaCorteGlobal }) {
  const hoy = dateOnly(fechaCorteGlobal);
  const [mesBase, setMesBase] = useState(() => new Date(hoy.getFullYear(), hoy.getMonth(), 1));
  const [diaSeleccionado, setDiaSeleccionado] = useState(null);

  const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

  // Calcular salidas por fecha tope (fecha mínima de salida para no perder días)
  const salidasPorFecha = useMemo(() => {
    const mapa = {};
    for (const c of colaboradores) {
      const pendiente = c.periodos.find((p) => p.tipo === "PENDIENTE" && p.fechaVencimiento && p.saldo > 0);
      if (!pendiente) continue;
      // Fecha tope de salida = fechaVencimiento - saldo + 1
      const fechaTope = dateOnly(new Date(pendiente.fechaVencimiento.getTime() - (pendiente.saldo - 1) * 86400000));
      const key = fechaTope.toISOString().slice(0, 10);
      if (!mapa[key]) mapa[key] = [];
      mapa[key].push({ ...c, fechaTope, pendiente, saldo: pendiente.saldo, fechaVenc: pendiente.fechaVencimiento });
    }
    return mapa;
  }, [colaboradores]);

  // Días del mes actual
  const diasDelMes = useMemo(() => {
    const año = mesBase.getFullYear();
    const mes = mesBase.getMonth();
    const primerDia = new Date(año, mes, 1).getDay();
    const totalDias = new Date(año, mes + 1, 0).getDate();
    return { primerDia, totalDias, año, mes };
  }, [mesBase]);

  const navMes = (delta) => setMesBase((m) => new Date(m.getFullYear(), m.getMonth() + delta, 1));

  const colaboradoresDiaSeleccionado = diaSeleccionado ? (salidasPorFecha[diaSeleccionado] || []) : [];

  const urgenciaColor = (fechaKey) => {
    const diff = daysBetween(hoy, new Date(fechaKey + "T12:00:00"));
    if (diff < 0) return "#DC2626";
    if (diff <= 7)  return "#EA580C";
    if (diff <= 30) return "#F59E0B";
    return COLORS.accent;
  };

  return (
    <div style={{ background: COLORS.surface, borderRadius: 12, border: `0.5px solid ${COLORS.border}`, padding: 24 }}>
      <div style={{ fontSize: 14, fontWeight: 700, color: COLORS.texto, marginBottom: 16 }}>
        📅 Calendario de Salidas
        <span style={{ fontSize: 12, fontWeight: 400, color: COLORS.textoMuted, marginLeft: 8 }}>
          Fecha tope en que cada colaborador debe salir de vacaciones
        </span>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 20 }}>

        {/* Calendario */}
        <div>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
            <button onClick={() => navMes(-1)} style={{ background: COLORS.bg, border: `0.5px solid ${COLORS.border}`, color: COLORS.textoSecundario, borderRadius: 8, padding: "4px 12px", cursor: "pointer", fontSize: 14 }}>←</button>
            <div style={{ fontSize: 14, fontWeight: 700, color: COLORS.texto }}>{MESES[diasDelMes.mes]} {diasDelMes.año}</div>
            <button onClick={() => navMes(1)} style={{ background: COLORS.bg, border: `0.5px solid ${COLORS.border}`, color: COLORS.textoSecundario, borderRadius: 8, padding: "4px 12px", cursor: "pointer", fontSize: 14 }}>→</button>
          </div>

          <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 3, marginBottom: 3 }}>
            {["Do","Lu","Ma","Mi","Ju","Vi","Sa"].map((d) => (
              <div key={d} style={{ textAlign: "center", fontSize: 11, fontWeight: 600, color: COLORS.textoMuted, padding: "4px 0" }}>{d}</div>
            ))}
          </div>

          <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 3 }}>
            {Array.from({ length: diasDelMes.primerDia }).map((_, i) => <div key={`empty-${i}`} />)}
            {Array.from({ length: diasDelMes.totalDias }).map((_, i) => {
              const dia = i + 1;
              const fecha = new Date(diasDelMes.año, diasDelMes.mes, dia);
              const key = fecha.toISOString().slice(0, 10);
              const tieneSalidas = salidasPorFecha[key];
              const cantidad = tieneSalidas ? tieneSalidas.length : 0;
              const esHoy = key === hoy.toISOString().slice(0, 10);
              const esSeleccionado = diaSeleccionado === key;
              const color = tieneSalidas ? urgenciaColor(key) : null;

              return (
                <div key={dia}
                  onClick={() => setDiaSeleccionado(esSeleccionado ? null : (tieneSalidas ? key : null))}
                  style={{
                    borderRadius: 8, padding: "6px 2px", textAlign: "center",
                    cursor: tieneSalidas ? "pointer" : "default",
                    background: esSeleccionado ? color + "33" : tieneSalidas ? color + "15" : "transparent",
                    border: esSeleccionado ? `2px solid ${color}` : esHoy ? `2px solid ${COLORS.accent}` : "2px solid transparent",
                    transition: "all 0.15s",
                  }}>
                  <div style={{ fontSize: 12, fontWeight: esHoy || esSeleccionado ? 700 : 400, color: tieneSalidas ? color : esHoy ? COLORS.accent : COLORS.textoSecundario }}>
                    {dia}
                  </div>
                  {cantidad > 0 && (
                    <div style={{ marginTop: 2, background: color, borderRadius: 10, color: "white", fontSize: 9, fontWeight: 700, padding: "0px 4px", display: "inline-block" }}>
                      {cantidad}
                    </div>
                  )}
                </div>
              );
            })}
          </div>

          {/* Leyenda */}
          <div style={{ display: "flex", gap: 12, marginTop: 14, flexWrap: "wrap" }}>
            {[
              { color: "#DC2626", label: "Ya pasó" },
              { color: "#EA580C", label: "≤ 7 días" },
              { color: "#F59E0B", label: "≤ 30 días" },
              { color: COLORS.accent, label: "> 30 días" },
            ].map(({ color, label }) => (
              <div key={label} style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 11, color: COLORS.textoMuted }}>
                <div style={{ width: 10, height: 10, borderRadius: 3, background: color }} />
                {label}
              </div>
            ))}
          </div>
        </div>

        {/* Panel derecho */}
        <div>
          {diaSeleccionado && colaboradoresDiaSeleccionado.length > 0 ? (
            <>
              <div style={{ fontSize: 13, fontWeight: 700, color: COLORS.texto, marginBottom: 10 }}>
                Deben salir el {fmtDate(new Date(diaSeleccionado + "T12:00:00"))}
                <span style={{ fontSize: 12, fontWeight: 400, color: COLORS.textoMuted, marginLeft: 6 }}>
                  ({colaboradoresDiaSeleccionado.length} colaboradores)
                </span>
              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: 6, maxHeight: 280, overflowY: "auto" }}>
                {colaboradoresDiaSeleccionado.map((c) => {
                  const diasHastaTope = daysBetween(hoy, c.fechaTope);
                  const diasSalvablesMañana = c.fechaVenc
                    ? Math.max(0, Math.min(c.saldo, daysBetween(new Date(hoy.getTime() + 86400000), c.fechaVenc) + 1))
                    : 0;
                  const diasVencidos = diasHastaTope < 0
                    ? Math.min(c.saldo, Math.abs(diasHastaTope))
                    : 0;

                  let comentario, comentarioColor, comentarioBg, comentarioBorder, comentarioIcon;
                  if (diasHastaTope < 0) {
                    comentarioColor = COLORS.vencida;
                    comentarioBg = "rgba(239,68,68,0.08)";
                    comentarioBorder = "#FCA5A5";
                    comentarioIcon = "⚠";
                    comentario = <>Debió salir el <strong>{fmtDate(c.fechaTope)}</strong> — lleva <strong>{diasVencidos} día{diasVencidos !== 1 ? "s" : ""} vencido{diasVencidos !== 1 ? "s" : ""}</strong>.{" "}
                      {diasSalvablesMañana > 0
                        ? <span style={{ color: COLORS.positivo }}>Aún se pueden salvar <strong>{diasSalvablesMañana} día{diasSalvablesMañana !== 1 ? "s" : ""}</strong> si sale mañana.</span>
                        : <span>Ya no hay días por salvar.</span>}
                    </>;
                  } else if (diasHastaTope === 0) {
                    comentarioColor = "#EA580C";
                    comentarioBg = "rgba(234,88,12,0.08)";
                    comentarioBorder = "#FCD34D";
                    comentarioIcon = "🚨";
                    comentario = <>Debe salir <strong>hoy</strong> para no perder sus {c.saldo} días pendientes.</>;
                  } else if (diasHastaTope <= 7) {
                    comentarioColor = "#EA580C";
                    comentarioBg = "rgba(234,88,12,0.08)";
                    comentarioBorder = "#FCD34D";
                    comentarioIcon = "⏰";
                    comentario = <>Debe salir máximo el <strong>{fmtDate(c.fechaTope)}</strong> — quedan <strong>{diasHastaTope} día{diasHastaTope !== 1 ? "s" : ""}</strong> para actuar.</>;
                  } else if (diasHastaTope <= 30) {
                    comentarioColor = "#D97706";
                    comentarioBg = "rgba(217,119,6,0.08)";
                    comentarioBorder = "#FCD34D";
                    comentarioIcon = "📅";
                    comentario = <>Debe salir antes del <strong>{fmtDate(c.fechaTope)}</strong> — quedan <strong>{diasHastaTope} días</strong> para coordinar.</>;
                  } else {
                    comentarioColor = COLORS.positivo;
                    comentarioBg = "rgba(22,163,74,0.08)";
                    comentarioBorder = "#86EFAC";
                    comentarioIcon = "✅";
                    comentario = <>Salida planificada para el <strong>{fmtDate(c.fechaTope)}</strong> — <strong>{diasHastaTope} días</strong> para coordinar.</>;
                  }

                  return (
                    <div key={c.cod} style={{ background: COLORS.bg, borderRadius: 8, padding: "10px 12px", border: `0.5px solid ${COLORS.border}` }}>
                      <div style={{ fontSize: 12, fontWeight: 700, color: COLORS.texto }}>{c.nombres}</div>
                      <div style={{ fontSize: 11, color: COLORS.textoMuted, marginTop: 2 }}>{c.gerencia}</div>
                      <div style={{ fontSize: 11, color: COLORS.textoMuted }}>Gozar hasta: <strong style={{ color: COLORS.accent }}>{fmtDate(c.fechaVenc)}</strong></div>
                      <div style={{ fontSize: 11, color: COLORS.textoMuted }}>Cód: {c.cod}</div>
                      <div style={{ fontSize: 12, fontWeight: 600, color: COLORS.pendiente, marginTop: 4 }}>{c.saldo} días pendientes</div>
                      <div style={{ marginTop: 8, padding: "8px 10px", borderRadius: 8, background: comentarioBg, border: `0.5px solid ${comentarioBorder}`, fontSize: 11, lineHeight: 1.6, color: comentarioColor }}>
                        {comentarioIcon} {comentario}
                      </div>
                    </div>
                  );
                })}
              </div>
            </>
          ) : (
            <>
              <div style={{ fontSize: 13, fontWeight: 700, color: COLORS.texto, marginBottom: 10 }}>
                Resumen — {MESES[diasDelMes.mes]} {diasDelMes.año}
              </div>
              {(() => {
                const mesStr = `${diasDelMes.año}-${String(diasDelMes.mes + 1).padStart(2, "0")}`;
                const enEsteMes = Object.entries(salidasPorFecha)
                  .filter(([k]) => k.startsWith(mesStr))
                  .sort(([a], [b]) => a.localeCompare(b));
                const totalColabs = enEsteMes.reduce((s, [, v]) => s + v.length, 0);

                if (enEsteMes.length === 0) return (
                  <div style={{ textAlign: "center", padding: "30px 0", color: COLORS.textoMuted, fontSize: 13 }}>
                    ✅ Ningún colaborador debe salir este mes
                  </div>
                );

                return (
                  <>
                    <div style={{ fontSize: 12, color: COLORS.textoMuted, marginBottom: 10 }}>
                      <strong style={{ color: COLORS.texto }}>{totalColabs} colaboradores</strong> deben salir en {enEsteMes.length} días distintos.
                      <span style={{ color: COLORS.textoMuted }}> Haz clic en un día para ver el detalle.</span>
                    </div>
                    <div style={{ display: "flex", flexDirection: "column", gap: 6, maxHeight: 280, overflowY: "auto" }}>
                      {enEsteMes.map(([fecha, colabs]) => {
                        const color = urgenciaColor(fecha);
                        return (
                          <div key={fecha}
                            onClick={() => setDiaSeleccionado(fecha)}
                            style={{
                              background: COLORS.bg, borderRadius: 8, padding: "8px 12px",
                              border: `1px solid ${color}33`, borderLeft: `3px solid ${color}`,
                              display: "flex", justifyContent: "space-between", alignItems: "center",
                              cursor: "pointer",
                            }}>
                            <div style={{ fontSize: 12, fontWeight: 600, color: COLORS.texto }}>
                              {fmtDate(new Date(fecha + "T12:00:00"))}
                            </div>
                            <div style={{ background: color + "22", color, borderRadius: 6, padding: "2px 8px", fontSize: 11, fontWeight: 700 }}>
                              {colabs.length} colab.
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </>
                );
              })()}
            </>
          )}
        </div>
      </div>
    </div>
  );
}

function PaginaColaboradores({ colaboradores, setPagina, setColabSolicitud }) {
  const [busqueda, setBusqueda] = useState("");
  const [filtroGerencia, setFiltroGerencia] = useState("Todas");
  const [filtroUnidad, setFiltroUnidad] = useState("Todas");
  const [filtroEstado, setFiltroEstado] = useState("Todos");
  const [detalle, setDetalle] = useState(null);

  const gerencias = useMemo(() => {
    const set = new Set(colaboradores.map((c) => c.gerencia));
    return ["Todas", ...Array.from(set).sort()];
  }, [colaboradores]);

  const unidades = useMemo(() => {
    const base = filtroGerencia === "Todas"
      ? colaboradores
      : colaboradores.filter((c) => c.gerencia === filtroGerencia);
    const set = new Set(base.map((c) => c.unidadOrg).filter(Boolean));
    return ["Todas", ...Array.from(set).sort()];
  }, [colaboradores, filtroGerencia]);

  const filtrados = useMemo(() => {
    const q = busqueda.toLowerCase();
    return colaboradores.filter((c) => {
      const matchBusqueda = !q || c.nombres.toLowerCase().includes(q) || c.cod.includes(q) || c.doc.includes(q) || c.gerencia.toLowerCase().includes(q);
      const matchGerencia = filtroGerencia === "Todas" || c.gerencia === filtroGerencia;
      const matchUnidad = filtroUnidad === "Todas" || c.unidadOrg === filtroUnidad;
      const matchEstado = filtroEstado === "Todos"
        || (filtroEstado === "Indemnización" && c.tieneIndemnizacion)
        || (filtroEstado === "Comprados" && (c.totalComprados || 0) > 0)
        || (filtroEstado === "Total Vencidas" && c.tieneTotalVencidas)
        || (filtroEstado === "Vencidas" && c.tieneVencidas)
        || (filtroEstado === "Pendientes" && c.diasPendientes > 0)
        || (filtroEstado === "Truncas" && c.consumoDesdeTracas)
        || (filtroEstado === "Riesgo" && c.enRiesgo);
      return matchBusqueda && matchGerencia && matchUnidad && matchEstado;
    });
  }, [colaboradores, busqueda, filtroGerencia, filtroUnidad, filtroEstado]);

  const inputStyle = {
    background: COLORS.surfaceHigh, border: `0.5px solid ${COLORS.border}`,
    color: COLORS.texto, borderRadius: 10, padding: "9px 14px", fontSize: 13,
    outline: "none",
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 12 }}>
        <div>
          <div style={{ fontSize: 20, fontWeight: 600, color: COLORS.texto }}>Colaboradores</div>
          <div style={{ fontSize: 14, color: COLORS.textoMuted }}>{filtrados.length} de {colaboradores.length} colaboradores</div>
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <button onClick={() => exportarExcel(filtrados)} style={{
            background: "#F0FDF4", border: "0.5px solid #86EFAC",
            color: COLORS.positivo, borderRadius: 10, padding: "9px 18px",
            cursor: "pointer", fontSize: 13, fontWeight: 600,
          }}>⬇ Exportar Excel</button>
          <button onClick={() => exportarExcelDesglose(filtrados)} style={{
            background: "#F0FDF4", border: "0.5px solid #86EFAC",
            color: COLORS.positivo, borderRadius: 10, padding: "9px 18px",
            cursor: "pointer", fontSize: 13, fontWeight: 600,
          }}>⬇ Exportar Excel + Vencidas</button>
        </div>
      </div>

      {/* Filtros */}
      <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
        <input placeholder="🔍 Buscar por nombre, código, DNI, gerencia..." value={busqueda}
          onChange={(e) => setBusqueda(e.target.value)}
          style={{ ...inputStyle, flex: "1 1 260px", minWidth: 200 }} />

// ─── HELPERS DE ALERTAS ──────────────────────────────────────────────────────

// Calcula los datos de alerta para un colaborador basándose en su período PENDIENTE.
//
// FÓRMULAS CLAVE:
//   fechaMinimaSalida  = fechaVenc − saldo + 1   (último día que puede salir sin perder ninguno)
//   diasSalvables      = min(saldo, (fechaVenc − hoy) + 1)   (cuántos puede salvar si sale HOY)
//   diasVencidosHoy    = saldo − diasSalvables
//   todoVencido        = hoy > fechaVenc   (ya pasó el último día para gozarlos)
//
// Ejemplo Esteban: saldo=7, fechaVenc=30/04/2026, hoy=30/04/2026
//   fechaMinimaSalida = 30/04 - 7 + 1 = 24/04/2026
//   diasSalvables = min(7, (30/04-30/04)+1) = min(7,1) = 1
//   diasVencidosHoy = 7 - 1 = 6
//
// Ejemplo 15 días: saldo=15, fechaVenc=15/05/2026, hoy=10/05/2026
//   fechaMinimaSalida = 15/05 - 15 + 1 = 01/05/2026
//   diasSalvables = min(15, (15/05-10/05)+1) = min(15,6) = 6
//   diasVencidosHoy = 15 - 6 = 9
function calcularAlertaColab(c, fechaCorteGlobal) {
  const hoy = dateOnly(fechaCorteGlobal);
  const pendiente = c.periodos.find((p) => p.tipo === "PENDIENTE");
  if (!pendiente || pendiente.saldo <= 0) return null;

  const saldo = pendiente.saldo;
  const fechaVenc = dateOnly(pendiente.fechaVencimiento); // último día para gozar sin que venzan

  // Días que faltan entre hoy y fechaVenc (puede ser negativo si ya pasó)
  const diasHastaVenc = daysBetween(hoy, fechaVenc);
  const mesesHastaVenc = diasHastaVenc >= 0 ? Math.floor(diasHastaVenc / 30) : 0;
  const diasRestHastaVenc = diasHastaVenc >= 0 ? diasHastaVenc % 30 : 0;

  // Fecha mínima de salida para no perder ningún día
  // = fechaVenc - saldo + 1
  const fechaMinimaSalida = dateOnly(new Date(fechaVenc.getTime() - (saldo - 1) * 86400000));

  // Días salvables si sale HOY = min(saldo, (fechaVenc - hoy) + 1)
  // Si fechaVenc < hoy → diasHastaVenc negativo → diasSalvables = 0
  const diasSalvablesHoy = Math.max(0, Math.min(saldo, diasHastaVenc + 1));
  const diasVencidosHoy = saldo - diasSalvablesHoy;

  // Días hasta la fecha mínima de salida (negativo = ya pasó)
  const diasHastaMinima = daysBetween(hoy, fechaMinimaSalida);

  // Estados
  const todoVencido = hoy > fechaVenc;           // ya pasó el último día → todos vencidos
  const enRiesgoHoy = diasHastaMinima < 0 && !todoVencido; // pasó la mínima pero aún hay salvables
  const aun_a_tiempo = diasHastaMinima >= 0;     // aún no llegó a la fecha mínima

  // Compatibilidad con Alerta 2 (fecha tope = fecha mínima)
  const fechaTope = fechaMinimaSalida;
  const diasHastaTope = diasHastaMinima;
  const topeYaPaso = diasHastaMinima < 0;

  return {
    cod: c.cod, nombres: c.nombres, gerencia: c.gerencia,
    saldoPendiente: saldo,
    fechaVenc,           // último día para gozar sin que venzan (ej: 30/04/2026)
    diasHastaVenc,
    mesesHastaVenc,
    diasRestHastaVenc,
    fechaMinimaSalida,   // debe salir como mínimo este día (= fechaVenc - saldo + 1)
    diasHastaMinima,
    diasSalvablesHoy,
    diasVencidosHoy,
    todoVencido,
    enRiesgoHoy,
    aun_a_tiempo,
    // Alias para compatibilidad con Alerta 2
    fechaTope,
    diasHastaTope,
    topeYaPaso,
    diasVencidosYa: diasVencidosHoy,
    diasSalvables: diasSalvablesHoy,
    colab: c,
  };
}

// Para la simulación de la Alerta 3: dado un colaborador y una fecha hipotética de salida,
// calcula cuántos días se salvan y cuántos se pierden
function simularSalidaEn(alerta, fechaSalida) {
  const tope = alerta.fechaTope;
  const saldo = alerta.saldoPendiente;
  if (fechaSalida >= tope) {
    const diasPerdidos = Math.min(daysBetween(tope, fechaSalida), saldo);
    const diasSalvados = Math.max(0, saldo - diasPerdidos);
    return { diasPerdidos, diasSalvados };
  }
  return { diasPerdidos: 0, diasSalvados: saldo };
}

    "Todos": alerta2.length,

              background: COLORS.surfaceHigh, borderRadius: 12,
