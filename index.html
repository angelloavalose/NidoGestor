// ─── Componente: Simulador ────────────────────────────────────────────────────
function TabSimulador({ alertas, fechaCorteGlobal }) {
  const initFecha = fechaCorteGlobal instanceof Date
    ? `${fechaCorteGlobal.getFullYear()}-${String(fechaCorteGlobal.getMonth() + 1).padStart(2, "0")}-${String(fechaCorteGlobal.getDate()).padStart(2, "0")}`
    : "";
  const [busqSim, setBusqSim] = useState("");
  const [fechaSimLocal, setFechaSimLocal] = useState(initFecha);

  const fechaSimDate = useMemo(() => {
    if (!fechaSimLocal) return null;
    const d = new Date(fechaSimLocal + "T00:00:00");
    return isNaN(d.getTime()) ? null : dateOnly(d);
  }, [fechaSimLocal]);

  const todosSimulados = useMemo(() => {
    return alertas.map((a) => {
      if (!fechaSimDate) return { ...a, diasPerdidos: 0, diasSalvados: a.saldoPendiente };
      const salvados = Math.max(0, Math.min(a.saldoPendiente, daysBetween(fechaSimDate, a.fechaVenc) + 1));
      const perdidos = a.saldoPendiente - salvados;
      return { ...a, diasPerdidos: perdidos, diasSalvados: salvados };
    }).sort((a, b) => b.diasPerdidos - a.diasPerdidos);
  }, [alertas, fechaSimDate]);

  const filtradosSim = useMemo(() => {
    const q = busqSim.toLowerCase();
    return !q ? todosSimulados : todosSimulados.filter((a) =>
      a.nombres.toLowerCase().includes(q) || a.cod.includes(q) || a.gerencia.toLowerCase().includes(q)
    );
  }, [todosSimulados, busqSim]);

  const totalPerdidos = filtradosSim.reduce((s, a) => s + a.diasPerdidos, 0);
  const afectados = filtradosSim.filter((a) => a.diasPerdidos > 0).length;

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ background: COLORS.surface, borderRadius: 10, border: `0.5px solid ${COLORS.border}`, padding: "20px 24px" }}>
        <div style={{ fontSize: 15, fontWeight: 700, color: COLORS.texto, marginBottom: 4 }}>
          🔮 Simulador: ¿Qué pasa si los colaboradores salen el...?
        </div>
        <div style={{ fontSize: 13, color: COLORS.textoMuted, marginBottom: 16 }}>
          Ingresa una fecha hipotética. Ver qué días se pierden y cuáles se salvan para cada colaborador con pendientes.
        </div>
        <div style={{ display: "flex", gap: 12, flexWrap: "wrap", alignItems: "flex-end" }}>
          <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
            <label style={{ fontSize: 12, color: COLORS.textoMuted }}>Fecha hipotética de salida</label>
            <input type="date" value={fechaSimLocal}
              onChange={(e) => setFechaSimLocal(e.target.value)}
              style={{ background: COLORS.bg, border: `0.5px solid ${COLORS.border}`, color: COLORS.texto, borderRadius: 10, padding: "8px 14px", fontSize: 13, outline: "none", colorScheme: "dark" }} />
          </div>
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
            {fechaSimDate && (
              <div style={{ padding: "10px 16px", background: "rgba(139,92,246,0.1)", borderRadius: 10, border: "1px solid #8B5CF633", textAlign: "center" }}>
                <div style={{ fontSize: 11, color: "#A78BFA" }}>Fecha simulada</div>
                <div style={{ fontSize: 15, fontWeight: 700, color: COLORS.texto }}>{fmtDate(fechaSimDate)}</div>
              </div>
            )}
            <div style={{ padding: "10px 16px", background: "rgba(239,68,68,0.08)", borderRadius: 10, border: "1px solid #EF444433", textAlign: "center" }}>
              <div style={{ fontSize: 11, color: "#EF4444" }}>Con pérdidas</div>
              <div style={{ fontSize: 15, fontWeight: 700, color: COLORS.texto }}>{afectados}</div>
            </div>
            <div style={{ padding: "10px 16px", background: "rgba(239,68,68,0.06)", borderRadius: 10, border: "1px solid #EF444422", textAlign: "center" }}>
              <div style={{ fontSize: 11, color: "#EF4444" }}>Días perdidos</div>
              <div style={{ fontSize: 15, fontWeight: 700, color: COLORS.texto }}>{totalPerdidos}</div>
            </div>
            <div style={{ padding: "10px 16px", background: "rgba(59,130,246,0.08)", borderRadius: 10, border: `1px solid ${COLORS.accent}33`, textAlign: "center" }}>
              <div style={{ fontSize: 11, color: COLORS.accentLight }}>Total con pendientes</div>
              <div style={{ fontSize: 15, fontWeight: 700, color: COLORS.texto }}>{alertas.length}</div>
            </div>
          </div>
        </div>
      </div>

      <input
        placeholder="🔍 Buscar colaborador por nombre, código o gerencia..."
        value={busqSim}
        onChange={(e) => setBusqSim(e.target.value)}
        style={{ background: COLORS.surfaceHigh, border: `0.5px solid ${COLORS.border}`, color: COLORS.texto, borderRadius: 10, padding: "10px 14px", fontSize: 13, outline: "none" }}
      />

      <div style={{ display: "flex", flexDirection: "column", gap: 6, maxHeight: 500, overflowY: "auto" }}>
        {filtradosSim.length === 0 && (
          <div style={{ textAlign: "center", padding: 32, color: COLORS.textoMuted, fontSize: 14 }}>Sin resultados</div>
        )}
        {filtradosSim.map((a) => {
          const pct = a.saldoPendiente > 0 ? (a.diasSalvados / a.saldoPendiente) * 100 : 100;
          const sinPerdida = a.diasPerdidos === 0;
          const borde = sinPerdida ? COLORS.positivo : "#EF4444";
          return (
            <div key={a.cod} style={{
              background: COLORS.surfaceHigh, borderRadius: 10,
              border: `1px solid ${borde}22`, padding: "12px 16px",
              borderLeft: `3px solid ${borde}`,
            }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 12 }}>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 13, fontWeight: 700, color: COLORS.texto, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{a.nombres}</div>
                  <div style={{ fontSize: 11, color: COLORS.textoMuted }}>{a.gerencia} · Cód: {a.cod}</div>
                  <div style={{ fontSize: 11, color: COLORS.textoSecundario, marginTop: 3 }}>
                    {a.saldoPendiente}d pendientes · Tope: {fmtDate(a.fechaMinimaSalida)} · Gozar hasta: {fmtDate(a.fechaVenc)} · Vence: {fmtDate(new Date(a.fechaVenc.getTime() + 86400000))}
                  </div>
                  <div style={{ height: 4, background: COLORS.bg, borderRadius: 2, overflow: "hidden", display: "flex", marginTop: 6 }}>
                    <div style={{ width: `${100 - pct}%`, background: "#EF4444" }} />
                    <div style={{ width: `${pct}%`, background: COLORS.positivo }} />
                  </div>
                </div>
                <div style={{ display: "flex", gap: 12, textAlign: "center", flexShrink: 0 }}>
                  <div>
                    <div style={{ fontSize: 18, fontWeight: 800, color: a.diasPerdidos > 0 ? "#EF4444" : COLORS.textoMuted }}>{a.diasPerdidos}</div>
                    <div style={{ fontSize: 10, color: COLORS.textoMuted }}>se pierden</div>
                  </div>
                  <div>
                    <div style={{ fontSize: 18, fontWeight: 800, color: COLORS.positivo }}>{a.diasSalvados}</div>
                    <div style={{ fontSize: 10, color: COLORS.textoMuted }}>se salvan</div>
                  </div>
                </div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function severidadAlerta(a) {
  // Crítica: vencido hace más de 1 año o más de 2 períodos vencidos
  if (a.todoVencido && a.diasHastaVenc < -365) return { nivel: "critica", label: "🔴 Crítica", color: "#DC2626", bg: "rgba(220,38,38,0.1)" };
  if (a.colab && a.colab.periodos && a.colab.periodos.filter(p => p.tipo === "VENCIDA" || p.tipo === "INDEMNIZACION").length > 2) return { nivel: "critica", label: "🔴 Crítica", color: "#DC2626", bg: "rgba(220,38,38,0.1)" };
  // Media: vencido reciente o convenio no procede
  if (a.todoVencido) return { nivel: "media", label: "🟡 Media", color: "#D97706", bg: "rgba(217,119,6,0.1)" };
  if (a.diasHastaVenc <= 90) return { nivel: "media", label: "🟡 Media", color: "#D97706", bg: "rgba(217,119,6,0.1)" };
  // Baja: vence en menos de 30 días o nunca ha gozado
  if (a.diasHastaVenc <= 180) return { nivel: "baja", label: "🟢 Baja", color: "#16A34A", bg: "rgba(22,163,74,0.1)" };
  return { nivel: "baja", label: "🟢 Baja", color: "#16A34A", bg: "rgba(22,163,74,0.1)" };
}

function PaginaAlertas({ colaboradores, fechaCorteGlobal, filtroGerenciaExterno = "Todas", setFiltroGerenciaExterno }) {
  const [tabActiva, setTabActiva] = useState("a1");
  const [filtroMeses, setFiltroMeses] = useState(12);
  const [filtroGerenciaAlertas, setFiltroGerenciaAlertasLocal] = useState(filtroGerenciaExterno);
  const [detalle, setDetalle] = useState(null);
  const [filtroGestion, setFiltroGestion] = useState("todas"); // todas / pendientes / gestionadas
  const [modalGestion, setModalGestion] = useState(null); // alerta seleccionada para gestionar
  const [gestionForm, setGestionForm] = useState({ fecha: "", comentario: "", gestor: "" });

  // Firebase para alertas gestionadas
  const [alertasGestionadas, setAlertasGestionadas] = useState({});

  useEffect(() => {
    const checkFb = setInterval(() => {
      if (window._firebase?.db) {
        clearInterval(checkFb);
        const { db, collection, onSnapshot } = window._firebase;
        onSnapshot(collection(db, "alertas_gestionadas"), snap => {
          const data = {};
          snap.docs.forEach(d => { data[d.id] = d.data(); });
          setAlertasGestionadas(data);
        });
      }
    }, 500);
  }, []);

  const guardarGestion = (alertaKey, datos) => {
    const docId = alertaKey.replace(/[^a-zA-Z0-9]/g, "_").slice(0, 100);
    // Optimistic update
    setAlertasGestionadas(prev => ({ ...prev, [alertaKey]: datos }));
    const checkFb = setInterval(async () => {
      if (window._firebase?.db) {
        clearInterval(checkFb);
        const fb = window._firebase;
        // Use setDoc if available, otherwise updateDoc/addDoc
        try {
          const { db } = fb;
          const ref = fb.doc(db, "alertas_gestionadas", docId);
          if (fb.setDoc) {
            await fb.setDoc(ref, { ...datos, alertaKey, bpUsuario: "" });
          } else {
            try { await fb.updateDoc(ref, { ...datos }); }
            catch { await fb.addDoc(fb.collection(db, "alertas_gestionadas"), { ...datos, alertaKey }); }
          }
        } catch(e) { console.error("Firebase alerta error:", e); }
      }
    }, 200);
  };

  const alertaKey = (a) => `${a.cod}_${a.fechaVenc?.getTime?.() ?? ""}`;

  // Sincronizar filtro externo al montar
  useEffect(() => {
    setFiltroGerenciaAlertasLocal(filtroGerenciaExterno);
  }, [filtroGerenciaExterno]);

  const setFiltroGerenciaAlertas = (val) => {
    setFiltroGerenciaAlertasLocal(val);
    if (setFiltroGerenciaExterno) setFiltroGerenciaExterno(val);
  };

  const gerenciasAlertas = useMemo(() => {
    const set = new Set(colaboradores.map((c) => c.gerencia));
    return ["Todas", ...Array.from(set).sort()];
  }, [colaboradores]);

  // Calcular alertas para todos los colaboradores con saldo pendiente
  const alertasTodas = useMemo(() => {
    return colaboradores
      .map((c) => calcularAlertaColab(c, fechaCorteGlobal))
      .filter(Boolean)
      .sort((a, b) => a.diasHastaVenc - b.diasHastaVenc);
  }, [colaboradores, fechaCorteGlobal]);

  // Filtrar por gerencia
  const alertas = useMemo(() =>
    filtroGerenciaAlertas === "Todas"
      ? alertasTodas
      : alertasTodas.filter((a) => a.gerencia === filtroGerenciaAlertas),
    [alertasTodas, filtroGerenciaAlertas]
  );

  // Alerta 1: filtrados por meses
  const alerta1 = useMemo(() =>
    alertas.filter((a) => a.todoVencido || a.diasHastaVenc <= filtroMeses * 30),
    [alertas, filtroMeses]
  );

  // Alerta 2: todos ordenados por proximidad del tope
  const alerta2 = useMemo(() =>
    alertas.slice().sort((a, b) => a.diasHastaTope - b.diasHastaTope),
    [alertas]
  );

  // Alerta 3: tope ya pasó
  const alerta3 = useMemo(() =>
    alertas.filter((a) => a.topeYaPaso || a.diasHastaTope <= 0)
      .sort((a, b) => b.diasVencidosYa - a.diasVencidosYa),
    [alertas]
  );

  // Críticos esta semana: tope en 7 días o ya pasó
  const criticosSemana = useMemo(() =>
    alertas.filter((a) => a.diasHastaTope <= 7)
      .sort((a, b) => a.diasHastaTope - b.diasHastaTope),
    [alertas]
  );

  // KPIs
  const vencen1mes = alertas.filter((a) => a.diasHastaVenc <= 30).length;
  const vencen3mes = alertas.filter((a) => a.diasHastaVenc <= 90).length;
  const topeProximo = alertas.filter((a) => a.diasHastaTope >= 0 && a.diasHastaTope <= 30).length;
  const topePasado = alertas.filter((a) => a.topeYaPaso).length;
  const diasEnRiesgoSemana = criticosSemana.reduce((s, a) => s + a.saldoPendiente, 0);
  const sinRiesgo = alertas.filter((a) => a.diasHastaTope > 90).length;

  const TabBtn = ({ id, label, badge, color }) => (
    <button onClick={() => setTabActiva(id)} style={{
      padding: "10px 20px", borderRadius: 10, border: "none",
      background: tabActiva === id ? (color || COLORS.accent) + "22" : "transparent",
      color: tabActiva === id ? (color || COLORS.accentLight) : COLORS.textoMuted,
      borderBottom: tabActiva === id ? `2px solid ${color || COLORS.accent}` : "2px solid transparent",
      cursor: "pointer", fontSize: 13, fontWeight: 600, display: "flex", alignItems: "center", gap: 8,
    }}>
      {label}
      {badge > 0 && (
        <span style={{
          background: color || COLORS.accent, color: "#fff",
          borderRadius: 10, padding: "1px 8px", fontSize: 11, fontWeight: 700,
        }}>{badge}</span>
      )}
    </button>
  );

  const MesesFilter = ({ value, onChange }) => (
    <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
      <span style={{ fontSize: 12, color: COLORS.textoMuted }}>Mostrar que vencen en:</span>
      {[1,2,3,4,6,9,12].map((m) => (
        <button key={m} onClick={() => onChange(m)} style={{
          background: value === m ? COLORS.accent : COLORS.surfaceHigh,
          border: `1px solid ${value === m ? COLORS.accent : COLORS.border}`,
          color: value === m ? "#fff" : COLORS.textoSecundario,
          borderRadius: 7, padding: "5px 12px", cursor: "pointer", fontSize: 12, fontWeight: 600,
        }}>{m} {m === 1 ? "mes" : "meses"}</button>
      ))}
    </div>
  );

  const urgenciaColor = (dias) => {
    if (dias <= 30) return "#EF4444";
    if (dias <= 90) return "#F59E0B";
    if (dias <= 180) return "#F97316";
    return COLORS.positivo;
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
      {/* Header */}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 12 }}>
        <div>
          <div style={{ fontSize: 20, fontWeight: 600, color: COLORS.texto }}>Alertas Vacacionales</div>
          <div style={{ fontSize: 14, color: COLORS.textoMuted, marginTop: 2 }}>
            Basado en saldo pendiente por colaborador · Corte {fmtDate(fechaCorteGlobal)}
          </div>
        </div>
        {/* Filtro gerencia */}
        <select value={filtroGerenciaAlertas} onChange={(e) => setFiltroGerenciaAlertas(e.target.value)}
          style={{ background: COLORS.surfaceHigh, border: `0.5px solid ${COLORS.border}`, color: COLORS.texto, borderRadius: 10, padding: "8px 14px", fontSize: 13, outline: "none", minWidth: 180 }}>
          {gerenciasAlertas.map((g) => (
            <option key={g} value={g}>{g === "Todas" ? "Todas las gerencias" : (g.length > 28 ? g.slice(0, 28) + "…" : g)}</option>
          ))}
        </select>
      </div>

      {/* Filtro gestión + exportar */}
      <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
        {["todas","pendientes","gestionadas"].map(f => (
          <button key={f} onClick={() => setFiltroGestion(f)} style={{
            padding: "7px 16px", borderRadius: 8, border: "none", cursor: "pointer", fontSize: 12, fontWeight: 600,
            background: filtroGestion === f ? COLORS.accent : COLORS.surfaceHigh,
            color: filtroGestion === f ? "#fff" : COLORS.textoMuted,
          }}>
            {f === "todas" ? "Todas" : f === "pendientes" ? "⏳ Pendientes" : "✅ Gestionadas"}
          </button>
        ))}
        <button onClick={() => {
          const encAlerta = ["Cód","Apellidos y Nombres","Gerencia","Días pendientes","Fecha tope salida","Días salvables","Gozar hasta","Severidad","Gestionada","Fecha gestión","Gestor","Comentario"];
          const filas = alertas.map(a => {
            const key = alertaKey(a);
            const g = alertasGestionadas[key];
            const sev = severidadAlerta(a);
            // Calcular fecha tope de salida = fechaVenc - saldo + 1
            const hoyCorte = dateOnly(fechaCorteGlobal);
            const fechaTope = a.fechaVenc && a.saldoPendiente > 0
              ? dateOnly(new Date(a.fechaVenc.getTime() - (a.saldoPendiente - 1) * 86400000))
              : null;
            // Días salvables = días que aún se pueden goзar si sale hoy
            const diasSalvables = a.fechaVenc
              ? Math.max(0, Math.min(a.saldoPendiente, daysBetween(hoyCorte, a.fechaVenc) + 1))
              : 0;
            return {
              "Cód": a.cod, "Apellidos y Nombres": a.nombres, "Gerencia": a.gerencia,
              "Días pendientes": a.saldoPendiente,
              "Fecha tope salida": fechaTope ? fmtDate(fechaTope) : "—",
              "Días salvables": diasSalvables,
              "Gozar hasta": fmtDate(a.fechaVenc),
              "Severidad": sev.label,
              "Gestionada": g ? "Sí" : "No",
              "Fecha gestión": g?.fecha || "",
              "Gestor": g?.gestor || "",
              "Comentario": g?.comentario || "",
            };
          });
          crearEstiloExcel(filas, encAlerta, "Alertas", "Alertas_Vacacionales.xlsx", { "Apellidos y Nombres": { wch: 30 }, "Gerencia": { wch: 28 }, "Comentario": { wch: 30 }, "Fecha tope salida": { wch: 18 } });
        }} style={{
          marginLeft: "auto", background: COLORS.accent, color: "#fff", border: "none",
          borderRadius: 8, padding: "7px 16px", cursor: "pointer", fontSize: 12, fontWeight: 700,
        }}>⬇ Exportar Excel</button>
      </div>

      {/* KPIs globales */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(150px, 1fr))", gap: 12 }}>
        <KPICard label="Vencen en 1 mes" value={vencen1mes} icon="🔴" color="#EF4444" />
        <KPICard label="Vencen en 3 meses" value={vencen3mes} icon="🟠" color="#F97316" />
        <KPICard label="Tope en 30 días" value={topeProximo} icon="⏰" color="#F59E0B" sub="Deben salir pronto" />
        <KPICard label="Tope ya pasó" value={topePasado} icon="🚨" color="#EF4444" sub="Días perdiéndose ahora" />
        <KPICard label="Críticos esta semana" value={criticosSemana.length} icon="🔥" color="#DC2626" sub={`${diasEnRiesgoSemana} días en riesgo`} />
        <KPICard label="Sin riesgo inmediato" value={sinRiesgo} icon="✅" color={COLORS.positivo} sub="Tope > 90 días" />
        <KPICard label="Con pendientes" value={alertas.length} icon="📋" color={COLORS.accentLight} />
      </div>

      {/* Tabs */}
      <div style={{
        display: "flex", gap: 4, borderBottom: `1px solid ${COLORS.border}`,
        background: COLORS.surface, borderRadius: "12px 12px 0 0", padding: "8px 8px 0",
        flexWrap: "wrap",
      }}>
        <TabBtn id="a1" label="⏳ Proximidad" badge={alerta1.length} />
        <TabBtn id="a2" label="📅 Fecha tope" badge={alerta2.length} color="#F97316" />
        <TabBtn id="a3" label="🚨 En riesgo" badge={alerta3.length} color="#EF4444" />
        <TabBtn id="criticos" label="🔥 Esta semana" badge={criticosSemana.length} color="#DC2626" />
        <TabBtn id="gerencia" label="🏢 Por gerencia" badge={0} color={COLORS.accent} />
        <TabBtn id="sim" label="🔮 Simulador" badge={0} color="#8B5CF6" />
      </div>

      {/* ── ALERTA 1: Proximidad de vencimiento ── */}
      {tabActiva === "a1" && (() => {
        const aun_a_tiempo = alerta1.filter((a) => a.aun_a_tiempo);
        const en_riesgo    = alerta1.filter((a) => a.enRiesgoHoy);
        const todo_vencido = alerta1.filter((a) => a.todoVencido);

        const CardA1 = ({ a, seccion }) => {
          const color = seccion === "vencido" ? "#DC2626"
            : seccion === "riesgo" ? "#F97316"
            : urgenciaColor(a.diasHastaVenc);

          return (
            <div style={{
              background: COLORS.surfaceHigh, borderRadius: 12,
              border: `1px solid ${color}33`, padding: "16px 18px",
              borderLeft: `4px solid ${color}`,
            }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 12 }}>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 14, fontWeight: 700, color: COLORS.texto }}>{a.nombres}</div>
                  <div style={{ fontSize: 12, color: COLORS.textoMuted, marginTop: 2 }}>{a.gerencia} · Cód: {a.cod}</div>

                  {/* Línea principal */}
                  <div style={{ fontSize: 12, color: COLORS.textoSecundario, marginTop: 8 }}>
                    Tiene <strong style={{ color: COLORS.accentLight }}>{a.saldoPendiente} días</strong> pendientes
                    · Gozar hasta: <strong style={{ color: color }}>{fmtDate(a.fechaVenc)}</strong>
                    {!a.todoVencido && (
                      <span> · Vence el: <strong style={{ color: "#F59E0B" }}>{fmtDate(new Date(a.fechaVenc.getTime() + 86400000))}</strong></span>
                    )}
                  </div>

                  {/* Envolse: fecha mínima de salida */}
                  {seccion === "tiempo" && (
                    <div style={{
                      marginTop: 8, padding: "8px 12px",
                      background: "rgba(59,130,246,0.08)", borderRadius: 8,
                      border: "1px solid rgba(59,130,246,0.2)",
                      fontSize: 12, color: COLORS.accentLight, fontWeight: 600,
                    }}>
                      📌 Debe salir como mínimo el <strong>{fmtDate(a.fechaMinimaSalida)}</strong> para que no se venzan sus vacaciones
                    </div>
                  )}

                  {/* Englose: en riesgo — ya pasó la mínima pero aún hay días salvables */}
                  {seccion === "riesgo" && (
                    <div style={{
                      marginTop: 8, padding: "8px 12px",
                      background: "rgba(249,115,22,0.08)", borderRadius: 8,
                      border: "1px solid rgba(249,115,22,0.25)",
                      fontSize: 12,
                    }}>
                      <div style={{ color: "#F97316", fontWeight: 700, marginBottom: 4 }}>
                        ⚠ Debió salir el {fmtDate(a.fechaMinimaSalida)}
                      </div>
                      <div style={{ color: COLORS.textoSecundario }}>
                        Si sale hoy ({fmtDate(a.colab.fechaCorte ? dateOnly(fechaCorteGlobal) : dateOnly(fechaCorteGlobal))}):
                        se vencen <strong style={{ color: "#EF4444" }}>{a.diasVencidosHoy} días</strong>
                        , se salvan <strong style={{ color: COLORS.positivo }}>{a.diasSalvablesHoy} días</strong>
                      </div>
                      {/* Barra */}
                      <div style={{ height: 5, background: COLORS.bg, borderRadius: 3, overflow: "hidden", display: "flex", marginTop: 8 }}>
                        <div style={{ width: `${(a.diasVencidosHoy/a.saldoPendiente)*100}%`, background: "#EF4444" }} />
                        <div style={{ width: `${(a.diasSalvablesHoy/a.saldoPendiente)*100}%`, background: COLORS.positivo }} />
                      </div>
                    </div>
                  )}

                  {/* Englose: todo vencido */}
                  {seccion === "vencido" && (
                    <div style={{
                      marginTop: 8, padding: "8px 12px",
                      background: "rgba(220,38,38,0.08)", borderRadius: 8,
                      border: "1px solid rgba(220,38,38,0.25)",
                      fontSize: 12, color: "#FCA5A5",
                    }}>
                      🚨 Venció el <strong>{fmtDate(new Date(a.fechaVenc.getTime() + 86400000))}</strong> (podía gozarse hasta el <strong>{fmtDate(a.fechaVenc)}</strong>).
                      Los <strong>{a.saldoPendiente} días</strong> pasaron a <strong>Vencidas</strong>.
                    </div>
                  )}
                </div>

                {/* Badge derecho */}
                <div style={{ textAlign: "right", flexShrink: 0 }}>
                  {!a.todoVencido && a.diasHastaVenc >= 0 ? (
                    <>
                      <div style={{ fontSize: 22, fontWeight: 800, color }}>
                        {a.mesesHastaVenc}m {a.diasRestHastaVenc}d
                      </div>
                      <div style={{ fontSize: 11, color: COLORS.textoMuted }}>restantes</div>
                    </>
                  ) : (
                    <>
                      <div style={{ fontSize: 22, fontWeight: 800, color: "#DC2626" }}>VENCIDO</div>
                      <div style={{ fontSize: 11, color: COLORS.textoMuted }}>{a.saldoPendiente} días</div>
                    </>
                  )}
                </div>
              </div>
              <button onClick={() => setDetalle(a.colab)} style={{
                marginTop: 10, background: "transparent", border: `0.5px solid ${COLORS.border}`,
                color: COLORS.textoSecundario, borderRadius: 7, padding: "4px 12px",
                cursor: "pointer", fontSize: 12,
              }}>Ver períodos →</button>
            </div>
          );
        };

        return (
          <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
            <MesesFilter value={filtroMeses} onChange={setFiltroMeses} />

            {/* Sección: En riesgo — pasó la fecha mínima pero aún hay días salvables */}
            {en_riesgo.length > 0 && (
              <div>
                <div style={{ fontSize: 12, fontWeight: 700, color: "#F97316", letterSpacing: "0.06em", textTransform: "uppercase", marginBottom: 10 }}>
                  ⚠ En riesgo — {en_riesgo.length} colaboradores con días perdiéndose
                </div>
                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  {en_riesgo.map((a) => <CardA1 key={a.cod} a={a} seccion="riesgo" />)}
                </div>
              </div>
            )}

            {/* Sección: A tiempo */}
            {aun_a_tiempo.length > 0 && (
              <div>
                <div style={{ fontSize: 12, fontWeight: 700, color: COLORS.accentLight, letterSpacing: "0.06em", textTransform: "uppercase", marginBottom: 10 }}>
                  ✅ A tiempo — {aun_a_tiempo.length} colaboradores
                </div>
                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  {aun_a_tiempo.map((a) => <CardA1 key={a.cod} a={a} seccion="tiempo" />)}
                </div>
              </div>
            )}

            {/* Sección: Todo vencido — Vacaciones vencidas recientes */}
            {todo_vencido.length > 0 && (
              <div>
                <div style={{ fontSize: 12, fontWeight: 700, color: "#DC2626", letterSpacing: "0.06em", textTransform: "uppercase", marginBottom: 10 }}>
                  🚨 Vacaciones vencidas recientes — {todo_vencido.length} colaboradores
                </div>
                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  {todo_vencido.map((a) => <CardA1 key={a.cod} a={a} seccion="vencido" />)}
                </div>
              </div>
            )}

            {alerta1.length === 0 && (
              <div style={{ textAlign: "center", padding: 40, color: COLORS.textoMuted, fontSize: 14 }}>
                ✅ Ningún colaborador con pendientes que venzan en este período
              </div>
            )}
          </div>
        );
      })()}

      {/* ── ALERTA 2: Fecha tope de salida ── */}
      {tabActiva === "a2" && (
        <TabFechaTope alerta2={alerta2} setDetalle={setDetalle} fechaCorteGlobal={fechaCorteGlobal} alertaKey={alertaKey} alertasGestionadas={alertasGestionadas} setModalGestion={setModalGestion} setGestionForm={setGestionForm} />
      )}

      {/* ── ALERTA 3: Días perdiéndose ahora ── */}
      {tabActiva === "a3" && (
        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          <div style={{ padding: "12px 16px", background: "rgba(239,68,68,0.06)", borderRadius: 10, border: "1px solid #EF444433" }}>
            <div style={{ fontSize: 13, color: "#EF4444", fontWeight: 600 }}>
              🚨 Estos colaboradores ya superaron su fecha tope de salida. Cada día que pasa pierden un día de vacaciones.
            </div>
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 8, maxHeight: 560, overflowY: "auto" }}>
            {alerta3.length === 0 && (
              <div style={{ textAlign: "center", padding: 40, color: COLORS.textoMuted, fontSize: 14 }}>
                ✅ Ningún colaborador ha superado su fecha tope
              </div>
            )}
            {alerta3.map((a) => {
              const pctSalvado = a.saldoPendiente > 0 ? (a.diasSalvables / a.saldoPendiente) * 100 : 0;
              return (
                <div key={a.cod} style={{
                  background: COLORS.surfaceHigh, borderRadius: 12,
                  border: "1px solid #EF444433", padding: "16px 18px",
                  borderLeft: "4px solid #EF4444",
                }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 12 }}>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontSize: 14, fontWeight: 700, color: COLORS.texto }}>{a.nombres}</div>
                      <div style={{ fontSize: 12, color: COLORS.textoMuted, marginTop: 2 }}>{a.gerencia} · Cód: {a.cod}</div>
                      <div style={{ fontSize: 12, color: COLORS.textoSecundario, marginTop: 6 }}>

      {/* ── CRÍTICOS ESTA SEMANA ── */}
      {tabActiva === "criticos" && (
        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>

        for (const a of alertasTodas) {
          if (!porGerencia[a.gerencia]) porGerencia[a.gerencia] = { nombre: a.gerencia, total: 0, criticos: 0, riesgo: 0, aTiempo: 0, diasRiesgo: 0 };

          onClick={() => setModalGestion(null)}>
          <div style={{ background: COLORS.surface, borderRadius: 16, padding: 28, width: 420, maxWidth: "90vw", boxShadow: "0 20px 60px rgba(0,0,0,0.4)" }}

            <div style={{ fontSize: 12, color: COLORS.textoMuted, marginBottom: 20 }}>{modalGestion.nombres} · {modalGestion.gerencia}</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
              <div>
                <label style={{ fontSize: 12, color: COLORS.textoMuted, fontWeight: 600, display: "block", marginBottom: 4 }}>Fecha de gestión</label>
                <input type="date" value={gestionForm.fecha} onChange={e => setGestionForm(f => ({ ...f, fecha: e.target.value }))}
                  style={{ width: "100%", padding: "8px 12px", borderRadius: 8, border: `0.5px solid ${COLORS.border}`, background: COLORS.surfaceHigh, color: COLORS.texto, fontSize: 13, boxSizing: "border-box", colorScheme: "light" }} />
              </div>
              <div>
                <label style={{ fontSize: 12, color: COLORS.textoMuted, fontWeight: 600, display: "block", marginBottom: 4 }}>Nombre del gestor</label>

                  style={{ width: "100%", padding: "8px 12px", borderRadius: 8, border: `0.5px solid ${COLORS.border}`, background: COLORS.surfaceHigh, color: COLORS.texto, fontSize: 13, boxSizing: "border-box" }} />
              </div>

                <label style={{ fontSize: 12, color: COLORS.textoMuted, fontWeight: 600, display: "block", marginBottom: 4 }}>Comentario</label>

              </div>
              <div style={{ display: "flex", gap: 10, justifyContent: "flex-end", marginTop: 4 }}>
                <button onClick={() => setModalGestion(null)} style={{ padding: "8px 18px", borderRadius: 8, border: `0.5px solid ${COLORS.border}`, background: "transparent", color: COLORS.textoMuted, cursor: "pointer", fontSize: 13 }}>Cancelar</button>
                <button onClick={() => { guardarGestion(alertaKey(modalGestion), gestionForm); setModalGestion(null); }}
                  style={{ padding: "8px 18px", borderRadius: 8, border: "none", background: COLORS.accent, color: "#fff", cursor: "pointer", fontSize: 13, fontWeight: 700 }}>✅ Guardar</button>
              </div>

          </div>
        </div>
      )}
    </div>
  );
}

function PaginaSimulacion({ colaboradores, fechaCorteGlobal }) {
  const [mesesExtra, setMesesExtra] = useState(6);

  const simulados = useMemo(() => {
    const fechaFutura = new Date(fechaCorteGlobal);
    fechaFutura.setMonth(fechaFutura.getMonth() + mesesExtra);

    return colaboradores.map((c) => {
      const periodosF = calcularPeriodos(c.fechaCorte, fechaFutura);
      const vencidasF = periodosF.filter((p) => p.tipo === "VENCIDA");
      const nuevasVencidas = vencidasF.length - c.periodos.filter((p) => p.tipo === "VENCIDA").length;
      return { ...c, periodosSimulados: periodosF, nuevasVencidas: Math.max(0, nuevasVencidas) };
    }).filter((c) => c.nuevasVencidas > 0).slice(0, 100);
  }, [colaboradores, mesesExtra, fechaCorteGlobal]);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
      <div>
        <div style={{ fontSize: 20, fontWeight: 600, color: COLORS.texto }}>Simulación de Vencimientos</div>
        <div style={{ fontSize: 14, color: COLORS.textoMuted }}>Proyecta futuros vencimientos en el tiempo</div>
      </div>

      <div style={{ display: "flex", alignItems: "center", gap: 16, background: COLORS.surfaceHigh, padding: "16px 20px", borderRadius: 12, border: `0.5px solid ${COLORS.border}` }}>
        <span style={{ fontSize: 14, color: COLORS.textoSecundario }}>Proyectar</span>
        <input type="range" min={1} max={24} value={mesesExtra} onChange={(e) => setMesesExtra(+e.target.value)}
          style={{ flex: 1, accentColor: COLORS.accent }} />
        <span style={{ fontSize: 16, fontWeight: 700, color: COLORS.texto, minWidth: 100 }}>+{mesesExtra} meses</span>
        <span style={{ fontSize: 13, color: COLORS.textoMuted }}>({simulados.length} nuevas vencidas)</span>
      </div>

      <div style={{ background: COLORS.surface, borderRadius: 12, border: `0.5px solid ${COLORS.border}`, padding: 20 }}>
        <div style={{ fontSize: 13, color: COLORS.textoMuted, marginBottom: 12 }}>
          Colaboradores que generarán nuevas vencidas en los próximos {mesesExtra} meses (primeros 100)
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 8, maxHeight: 480, overflowY: "auto" }}>
          {simulados.map((c) => (
            <div key={c.cod} style={{
              display: "flex", justifyContent: "space-between", alignItems: "center",
              padding: "10px 14px", background: COLORS.bg, borderRadius: 8,
              border: `0.5px solid ${COLORS.border}`,
            }}>
              <div>
                <div style={{ fontSize: 13, color: COLORS.texto, fontWeight: 500 }}>{c.nombres}</div>
                <div style={{ fontSize: 11, color: COLORS.textoMuted }}>{c.gerencia}</div>
              </div>
              <span style={{ background: "rgba(239,68,68,0.1)", color: "#EF4444", borderRadius: 6, padding: "3px 10px", fontSize: 12, fontWeight: 700 }}>
                +{c.nuevasVencidas} período{c.nuevasVencidas > 1 ? "s" : ""}
              </span>
            </div>
          ))}
          {simulados.length === 0 && (
            <div style={{ textAlign: "center", color: COLORS.textoMuted, padding: 24, fontSize: 14 }}>
              ✅ Ningún colaborador generará nuevas vencidas en ese período
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ─── APP PRINCIPAL ───────────────────────────────────────────────────────────
// ─── PÁGINA: SOLICITUD DE VACACIONES ─────────────────────────────────────────
function PaginaSolicitud({ colaboradores, fechaCorteGlobal, colabPreseleccionado = null, onColabUsado }) {
  const [modo, setModo] = useState("individual");
  const [busqueda, setBusqueda] = useState("");
  const [colabSeleccionado, setColabSeleccionado] = useState(colabPreseleccionado);
  const [fechaInicio, setFechaInicio] = useState("");
  const [fechaFin, setFechaFin] = useState("");
  const [error, setError] = useState("");
  const [exito, setExito] = useState(false);
  const [filasMasivo, setFilasMasivo] = useState(null);
  const [procesandoMasivo, setProcesandoMasivo] = useState(false);
  const [exitoMasivo, setExitoMasivo] = useState(false);

  // Si llega un colaborador preseleccionado desde Colaboradores, usarlo
  useEffect(() => {
    if (colabPreseleccionado) {
      setColabSeleccionado(colabPreseleccionado);
      setBusqueda("");
      setFechaInicio("");
      setFechaFin("");
      setError("");
      if (onColabUsado) onColabUsado();
    }
  }, [colabPreseleccionado]);

  const inputStyle = {
    background: COLORS.surfaceHigh, border: `0.5px solid ${COLORS.border}`,
    color: COLORS.texto, borderRadius: 10, padding: "9px 14px",
    fontSize: 13, outline: "none", width: "100%",
  };

  // Filtrar colaboradores por búsqueda
  const sugerencias = useMemo(() => {
    if (!busqueda || busqueda.length < 2) return [];
    const q = busqueda.toLowerCase();
    return colaboradores
      .filter((c) => c.nombres.toLowerCase().includes(q) || c.cod.includes(q) || c.doc.includes(q))
      .slice(0, 8);
  }, [colaboradores, busqueda]);

  // Período PENDIENTE actual
  const pendiente = colabSeleccionado
    ? colabSeleccionado.periodos.find((p) => p.tipo === "PENDIENTE" && p.saldo > 0)
    : null;

  // Calcular próximo período pendiente proyectado a una fecha futura
  const calcularSaldoProyectado = (colabSel, fechaIniStr) => {
    if (!colabSel || !fechaIniStr) return null;
    const truncaPeriodo = colabSel.periodos.find((p) => p.tipo === "TRUNCA");
    if (!truncaPeriodo) return null;
    const finAnioLaboral = dateOnly(new Date(addYears(truncaPeriodo.inicio, 1).getTime() - 86400000));
    const inicioProximo = dateOnly(new Date(finAnioLaboral.getTime() + 86400000));
    const fechaIni = dateOnly(new Date(fechaIniStr + "T12:00:00"));
    if (fechaIni < inicioProximo) return null; // fecha antes del aniversario, no aplica
    // Proyectar saldo trunco a la fecha de inicio elegida (usando la misma fórmula del motor)
    const diasTranscurridos = daysBetween(truncaPeriodo.inicio, fechaIni);
    const mesesCompletos = Math.floor(diasTranscurridos / 30);
    const diasExtra = diasTranscurridos % 30;
    const saldoProyectado = Math.round(((mesesCompletos * 30 + diasExtra) / 360) * 30 * 100) / 100;
    const finProximo = dateOnly(new Date(addYears(inicioProximo, 1).getTime() - 86400000));
    return {
      inicio: inicioProximo,
      fin: finProximo,
      fechaVencimiento: dateOnly(addYears(finProximo, 1)),
      saldo: saldoProyectado,
      tipo: "PENDIENTE",
      esAnticipada: true,
    };
  };

  // Período TRUNCA actual (para solicitud anticipada)
  const trunca = colabSeleccionado
    ? colabSeleccionado.periodos.find((p) => p.tipo === "TRUNCA" && p.saldo > 0)
    : null;

  // Próximo período (inicio del aniversario) — para mostrar el aviso
  const proximoPeriodo = useMemo(() => {
    if (!colabSeleccionado || pendiente) return null;
    const truncaPeriodo = colabSeleccionado.periodos.find((p) => p.tipo === "TRUNCA");
    if (!truncaPeriodo) return null;
    const finAnioLaboral = dateOnly(new Date(addYears(truncaPeriodo.inicio, 1).getTime() - 86400000));
    const inicioProximo = dateOnly(new Date(finAnioLaboral.getTime() + 86400000));
    return inicioProximo;
  }, [colabSeleccionado, pendiente]);

  // Período a usar: actual si existe, proyectado si la fecha de inicio lo permite
  const periodoEfectivo = useMemo(() => {
    if (pendiente) return { ...pendiente, esAnticipada: false };
    if (!trunca || !fechaInicio) return null;
    return calcularSaldoProyectado(colabSeleccionado, fechaInicio);
  }, [pendiente, trunca, fechaInicio, colabSeleccionado]);

  // Calcular días solicitados
  const calcularDias = () => {
    if (!fechaInicio || !fechaFin) return 0;
    const ini = new Date(fechaInicio + "T12:00:00");
    const fin = new Date(fechaFin + "T12:00:00");
    if (fin < ini) return 0;
    return daysBetween(ini, fin) + 1;
  };
  const diasSolicitados = calcularDias();
  const fechaRetorno = fechaFin
    ? (() => { const d = new Date(fechaFin + "T12:00:00"); d.setDate(d.getDate() + 1); return d; })()
    : null;

  // Validar
  const validar = () => {
    if (!colabSeleccionado) return "Selecciona un colaborador.";
    if (!fechaInicio || !fechaFin) return "Ingresa las fechas de inicio y fin.";
    const ini = new Date(fechaInicio + "T12:00:00");
    const fin = new Date(fechaFin + "T12:00:00");
    if (fin < ini) return "La fecha de fin debe ser posterior a la de inicio.";
    if (!periodoEfectivo) {
      if (proximoPeriodo) {
        return "La fecha de inicio debe ser a partir del " + fmtDate(proximoPeriodo.inicio) + " (inicio del próximo período pendiente).";
      }
      return "El colaborador no tiene saldo de vacaciones pendientes.";
    }
    if (diasSolicitados > periodoEfectivo.saldo) return "Solo tiene " + periodoEfectivo.saldo + " días disponibles.";
    const minimoRequerido = periodoEfectivo.saldo >= 7 ? 7 : Math.ceil(periodoEfectivo.saldo);
    if (diasSolicitados < minimoRequerido) {
      if (periodoEfectivo.saldo >= 7) return "Debe solicitar como mínimo 7 días de vacaciones.";
      else return "Debe solicitar todos sus días disponibles (" + minimoRequerido + " días).";
    }
    const limiteVenc = new Date(periodoEfectivo.fechaVencimiento.getTime() - 86400000);
    if (ini > limiteVenc) return "Las fechas deben ser antes del " + fmtDate(periodoEfectivo.fechaVencimiento) + " (vencimiento del período).";
    return "";
  };

  // Generar PDF usando ventana de impresión del navegador
  // ── Generador HTML (individual) ───────────────────────────────────────────
  const buildHTML = (c, pend, dias, fIni, fFin) => {
    const ini = new Date(fIni + "T12:00:00");
    const fin = new Date(fFin + "T12:00:00");
    const retorno = new Date(fin.getTime() + 86400000);
    const ciudad = c.nom === "MC" ? "Chincha" : "Lima";
    const hoy = fmtDate(dateOnly(new Date()));
    const css = "* { margin:0;padding:0;box-sizing:border-box; } body{font-family:Arial,sans-serif;font-size:10pt;color:#1a1a1a;padding:20mm 20mm 15mm 20mm;} .logo-text{color:#1A5C2E;font-size:22pt;font-weight:bold;letter-spacing:2px;font-family:Georgia,serif;} .logo-sub{color:#1A5C2E;font-size:8pt;letter-spacing:4px;margin-top:2px;} .header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6mm;} .divider{border:none;border-top:1.5px solid #1A5C2E;margin:4mm 0 6mm 0;} .title{text-align:center;font-size:13pt;font-weight:bold;margin-bottom:6mm;text-transform:uppercase;} .fecha-nom{text-align:right;font-size:9pt;color:#444;margin-bottom:5mm;} .datos{margin-bottom:5mm;line-height:1.8;} .intro{margin-bottom:5mm;font-size:9.5pt;line-height:1.5;} table{width:100%;border-collapse:collapse;margin-bottom:5mm;font-size:8.5pt;} th{background:#EBF7ED;color:#1A5C2E;font-weight:bold;text-align:center;padding:4px 3px;border:1px solid #1A5C2E;} td{text-align:center;padding:5px 3px;border:1px solid #aaa;} .td-r{text-align:left;padding:5px 6px;border:1px solid #aaa;font-size:8pt;} .anot{margin-bottom:10mm;} .anot strong{display:block;margin-bottom:3mm;font-size:9.5pt;} .anot p{font-size:8.5pt;line-height:1.5;margin-bottom:2.5mm;} .anot p strong{display:inline;font-size:inherit;margin:0;} .firmas{display:flex;justify-content:space-between;margin-top:15mm;} .firma{text-align:center;width:45%;} .fl{border-top:1px solid #333;padding-top:4px;margin-bottom:2px;} .fn{font-weight:bold;font-size:9pt;} .fd{font-size:8.5pt;color:#444;} @media print{body{padding:15mm 18mm 12mm 18mm;}}";
    const partes = [
      "<!DOCTYPE html><html><head><meta charset='UTF-8'/>",
      "<title>Autorizacion - " + c.nombres + "</title>",
      "<style>" + css + "</style></head><body>",
      "<div class='header'><div>",
      "<div class='logo-text'>LA CALERA</div>",
      "<div class='logo-sub'>— 1 9 7 0 —</div>",
      "</div><div style='width:42px;height:42px;background:#1A5C2E;border-radius:7px;display:flex;align-items:center;justify-content:center'>",
      "<span style='color:white;font-size:22pt;font-family:Georgia,serif;font-weight:bold;line-height:1'>C</span>",
      "</div></div><hr class='divider'/>",
      "<div class='title'>Autorizacion de Salida de Vacaciones</div>",

      "<div class='datos'><strong>Sr. (a) " + c.nombres + "</strong><br/>",
      "DNI: " + c.doc + "<br/>Gerencia: " + c.gerencia + "<br/>Unidad Organizativa: " + c.unidadOrg + "</div>",
      "<div class='intro'>Mediante el presente documento, autorizo el goce de su descanso vacacional:</div>",
      "<table><thead><tr>",
      "<th colspan='2'>Periodo Vacacional</th>",

      "<th rowspan='2'>Inicio descanso</th>",
      "<th rowspan='2'>Termino descanso</th>",
      "</tr><tr><th>Del</th><th>Al</th></tr></thead><tbody><tr>",
      "<td>" + fmtDate(dateOnly(pend.inicio)) + "</td>",
      "<td>" + fmtDate(dateOnly(pend.fin)) + "</td>",
      "<td><strong>" + dias + "</strong></td>",
      "<td>" + fmtDate(ini) + "</td>",
      "<td>" + fmtDate(fin) + "</td>",
      "</tr><tr><td class='td-r' colspan='4'>Fecha programada para el retorno del trabajador.</td>",
      "<td><strong>" + fmtDate(retorno) + "</strong></td></tr></tbody></table>",
      "<div class='anot'><strong>Anotaciones:</strong>",
      "<p>- El pago adelantado se realizara a mas tardar un dia antes del inicio del periodo vacacional.</p>",
      "<p>- El colaborador debera entregar todos los bienes a su cargo antes de salir de vacaciones.</p>",
      "<p>- Saldo: <strong>" + Math.round(c.totalVencidas) + "</strong> dias vencidos, ",
      "<strong>" + (Math.round(c.diasPendientes) - dias) + "</strong> dias pendientes, ",
      "<strong>" + Math.round(c.diasTrunca) + "</strong> dias truncos.</p></div>",
      "<div class='firmas'>",
      "<div class='firma'><div class='fl'></div><div class='fn'>Sanchez Arce Maria Graciela</div><div class='fd'>DNI: 27437598</div></div>",
      "<div class='firma'><div class='fl'></div><div class='fn'>" + c.nombres + "</div><div class='fd'>DNI: " + c.doc + "</div></div>",
      "</div>",
      "<scr" + "ipt>window.onload=function(){window.print();}<" + "/scr" + "ipt>",
      "</body></html>",
    ];
    return partes.join("");
  };

  const descargarHTML = (html, nombre) => {
    const blob = new Blob([html], { type: "text/html;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = nombre;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
  };

  // ── Generador plantilla Excel ─────────────────────────────────────────────
  const generarPlantilla = () => {
    const wb = XLSX.utils.book_new();

    // Hoja principal con estilo
    const encPlantilla = ["Codigo", "DNI", "F. Inicio (DD/MM/AAAA)", "F. Fin (DD/MM/AAAA)"];
    const aoa = [
      encPlantilla,
      ["(Ej: 00124)", "(Ej: 74521836)", "(Ej: 01/06/2026)", "(Ej: 15/06/2026)"],
      ["00124", "74521836", "01/06/2026", "15/06/2026"],
      ["00215", "61234789", "10/06/2026", "25/06/2026"],
    ];
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws["!cols"] = [{ wch: 14 }, { wch: 16 }, { wch: 26 }, { wch: 26 }];
    ws["!rows"] = [{ hpt: 28 }, { hpt: 18 }, { hpt: 20 }, { hpt: 20 }];

    // Estilos encabezado
    encPlantilla.forEach((_, c) => {
      const addr = XLSX.utils.encode_cell({ r: 0, c });
      ws[addr].s = {
        fill: { fgColor: { rgb: "1A5C2E" } },
        font: { bold: true, color: { rgb: "FFFFFF" }, sz: 11, name: "Calibri" },
        alignment: { horizontal: "center", vertical: "center" },
      };
    });
    // Fila de instrucciones (gris)
    encPlantilla.forEach((_, c) => {
      const addr = XLSX.utils.encode_cell({ r: 1, c });
      if (ws[addr]) ws[addr].s = {
        fill: { fgColor: { rgb: "F3F4F6" } },
        font: { italic: true, color: { rgb: "6B7280" }, sz: 10, name: "Calibri" },
        alignment: { horizontal: "center" },
      };
    });
    // Filas de ejemplo (verde muy suave)
    [2, 3].forEach((r) => {
      encPlantilla.forEach((_, c) => {
        const addr = XLSX.utils.encode_cell({ r, c });
        if (ws[addr]) ws[addr].s = {
          fill: { fgColor: { rgb: "F0FDF4" } },
          font: { color: { rgb: "6B7280" }, sz: 11, name: "Calibri" },
          alignment: { horizontal: "center" },
          border: { bottom: { style: "thin", color: { rgb: "E5E7EB" } } },
        };
      });
    });

    XLSX.utils.book_append_sheet(wb, ws, "Solicitudes");

    // Hoja instrucciones con estilo
    const inst = [
      ["INSTRUCCIONES DE USO", "", ""],
      ["", "", ""],
      ["Campo", "Descripcion", "Ejemplo"],
      ["Codigo", "Codigo de empleado (tal como aparece en el sistema)", "00124"],
      ["DNI", "Documento de identidad del colaborador", "74521836"],
      ["F. Inicio", "Fecha de inicio de vacaciones en formato DD/MM/AAAA", "01/06/2026"],
      ["F. Fin", "Fecha de fin de vacaciones en formato DD/MM/AAAA", "15/06/2026"],
      ["", "", ""],
      ["NOTAS IMPORTANTES:", "", ""],
      ["- Solo se pueden solicitar dias PENDIENTES (no vencidos ni truncos)", "", ""],
      ["- Minimo 7 dias (o todos los disponibles si son menos de 7)", "", ""],
      ["- El sistema valida cada fila antes de generar los PDFs", "", ""],
      ["- Las filas con errores se muestran en rojo antes de confirmar", "", ""],
    ];
    const ws2 = XLSX.utils.aoa_to_sheet(inst);
    ws2["!cols"] = [{ wch: 18 }, { wch: 55 }, { wch: 16 }];
    ws2["!rows"] = [{ hpt: 28 }, { hpt: 10 }, { hpt: 24 }, ...inst.slice(3).map(() => ({ hpt: 20 }))];

    // Estilo título
    const tAddr = XLSX.utils.encode_cell({ r: 0, c: 0 });
    ws2[tAddr].s = { font: { bold: true, sz: 14, color: { rgb: "1A5C2E" }, name: "Calibri" } };

    // Estilo encabezados tabla instrucciones
    ["Campo","Descripcion","Ejemplo"].forEach((_, c) => {
      const addr = XLSX.utils.encode_cell({ r: 2, c });
      if (ws2[addr]) ws2[addr].s = {
        fill: { fgColor: { rgb: "1A5C2E" } },
        font: { bold: true, color: { rgb: "FFFFFF" }, sz: 11, name: "Calibri" },
        alignment: { horizontal: "center", vertical: "center" },
      };
    });
    // Filas de datos instrucciones
    [3,4,5,6].forEach((r) => {
      [0,1,2].forEach((c) => {
        const addr = XLSX.utils.encode_cell({ r, c });
        if (ws2[addr]) ws2[addr].s = {
          font: { sz: 11, name: "Calibri", color: { rgb: "111827" } },
          border: { bottom: { style: "thin", color: { rgb: "E5E7EB" } } },
        };
      });
    });
    // Notas en naranja suave
    [8,9,10,11,12].forEach((r) => {
      const addr = XLSX.utils.encode_cell({ r, c: 0 });
      if (ws2[addr] && ws2[addr].v) ws2[addr].s = {
        font: { sz: 11, name: "Calibri", color: { rgb: "92400E" }, bold: r === 8 },
      };
    });

    XLSX.utils.book_append_sheet(wb, ws2, "Instrucciones");
    XLSX.writeFile(wb, "Plantilla_Solicitudes_Vacaciones.xlsx");
  };

  // ── Carga Excel masivo ────────────────────────────────────────────────────
  const cargarExcelMasivo = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const wb = XLSX.read(ev.target.result, { type: "array" });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });
      const filas = rows.slice(1).filter((r) => r[0] || r[1]);
      const parseDMY = (s) => {
        const p = String(s).split("/");
        if (p.length !== 3) return null;
        const d = new Date(p[2] + "-" + p[1].padStart(2,"0") + "-" + p[0].padStart(2,"0") + "T12:00:00");
        return isNaN(d.getTime()) ? null : d;
      };
      const validadas = filas.map((r, idx) => {
        const cod = String(r[0] || "").trim();
        const dni = String(r[1] || "").trim();
        const ini = parseDMY(r[2]);
        const fin = parseDMY(r[3]);
        const fIniStr = String(r[2] || "").trim();
        const fFinStr = String(r[3] || "").trim();
        const colab = colaboradores.find((c) => c.cod === cod || c.doc === dni);
        let estado = "OK", motivo = "", pend = null, diasSol = 0, esAnticipada = false;
        if (!colab) { estado = "ERROR"; motivo = "Colaborador no encontrado"; }
        else {
          pend = colab.periodos.find((p) => p.tipo === "PENDIENTE" && p.saldo > 0);
          // Lógica anticipada: si no tiene pendiente pero tiene trunca y fecha futura
          if (!pend) {
            const truncaP = colab.periodos.find((p) => p.tipo === "TRUNCA" && p.saldo > 0);
            if (truncaP && ini) {
              const finAnio = dateOnly(new Date(addYears(truncaP.inicio, 1).getTime() - 86400000));
              const inicioProx = dateOnly(new Date(finAnio.getTime() + 86400000));
              if (dateOnly(ini) >= inicioProx) {
                // Proyectar saldo a la fecha de inicio exacta
                const diasT = daysBetween(truncaP.inicio, dateOnly(ini));
                const mesesC = Math.floor(diasT / 30);
                const diasE = diasT % 30;
                const saldoProy = Math.round(((mesesC * 30 + diasE) / 360) * 30 * 100) / 100;
                const finProx = dateOnly(new Date(addYears(inicioProx, 1).getTime() - 86400000));
                pend = { inicio: inicioProx, fin: finProx, fechaVencimiento: dateOnly(addYears(finProx, 1)), saldo: saldoProy, tipo: "PENDIENTE", esAnticipada: true };
                esAnticipada = true;
              }
            }
          }
          if (!pend) { estado = "ERROR"; motivo = "Sin días pendientes disponibles"; }
          else if (!ini) { estado = "ERROR"; motivo = "Fecha inicio invalida (DD/MM/AAAA)"; }
          else if (!fin) { estado = "ERROR"; motivo = "Fecha fin invalida (DD/MM/AAAA)"; }
          else if (fin < ini) { estado = "ERROR"; motivo = "Fin anterior a inicio"; }
          else {
            diasSol = daysBetween(ini, fin) + 1;
            const minReq = pend.saldo >= 7 ? 7 : Math.ceil(pend.saldo);
            if (diasSol > pend.saldo) { estado = "ALERTA"; motivo = "Excede saldo (" + diasSol + "d solicitados, " + pend.saldo + "d disponibles)"; }
            else if (diasSol < minReq) { estado = "ALERTA"; motivo = "Minimo requerido: " + minReq + " dias"; }
            else if (esAnticipada) { motivo = "Solicitud anticipada desde " + fmtDate(pend.inicio); }
          }
        }
        return { idx: idx+2, cod, dni, colab, pend, ini, fin, fIniStr, fFinStr, diasSol, estado, motivo, esAnticipada };
      });
      setFilasMasivo(validadas);
      setExitoMasivo(false);
    };
    reader.readAsArrayBuffer(file);
    e.target.value = "";
  };

  const generarMasivo = (soloOK) => {
    const filas = (soloOK ? filasMasivo.filter((f) => f.estado === "OK") : filasMasivo.filter((f) => f.estado !== "ERROR"));
    if (!filas.length) return;
    setProcesandoMasivo(true);
    setTimeout(() => {
      filas.forEach((f) => {
        const fIni = f.ini.getFullYear() + "-" + String(f.ini.getMonth()+1).padStart(2,"0") + "-" + String(f.ini.getDate()).padStart(2,"0");
        const fFin = f.fin.getFullYear() + "-" + String(f.fin.getMonth()+1).padStart(2,"0") + "-" + String(f.fin.getDate()).padStart(2,"0");
        descargarHTML(buildHTML(f.colab, f.pend, f.diasSol, fIni, fFin), "Autorizacion_" + f.colab.nombres.replace(/ /g,"_") + ".html");
      });
      setProcesandoMasivo(false);
      setExitoMasivo(true);
      setTimeout(() => setExitoMasivo(false), 5000);
    }, 100);
  };

  const EC = { OK: COLORS.positivo, ALERTA: COLORS.pendiente, ERROR: COLORS.vencida };
  const EI = { OK: "OK", ALERTA: "ALERTA", ERROR: "ERROR" };

  const generarPDF = () => {
    const err = validar();
    if (err) { setError(err); return; }
    setError("");
    const c = colabSeleccionado;
    const html = buildHTML(c, periodoEfectivo, diasSolicitados, fechaInicio, fechaFin);
    descargarHTML(html, "Autorizacion_Vacaciones_" + c.nombres.replace(/ /g,"_") + ".html");
    setExito(true);
    setTimeout(() => setExito(false), 4000);
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 20, maxWidth: 780 }}>
      <div>
        <div style={{ fontSize: 20, fontWeight: 600, color: COLORS.texto }}>Solicitud de Vacaciones</div>
        <div style={{ fontSize: 13, color: COLORS.textoMuted, marginTop: 2 }}>Genera autorizaciones individuales o masivas desde Excel</div>
      </div>

      {/* Tabs */}
      <div style={{ display: "flex", background: COLORS.bg, borderRadius: 10, border: `0.5px solid ${COLORS.border}`, padding: 4, width: "fit-content" }}>
        {[["individual","📄 Individual"],["masivo","📋 Masivo desde Excel"]].map(([id, label]) => (
          <button key={id} onClick={() => setModo(id)} style={{
            background: modo === id ? COLORS.surface : "transparent",
            border: modo === id ? `0.5px solid ${COLORS.border}` : "none",
            borderRadius: 8, padding: "7px 18px", fontSize: 12.5,
            fontWeight: modo === id ? 500 : 400,
            color: modo === id ? COLORS.texto : COLORS.textoMuted,
            cursor: "pointer", boxShadow: modo === id ? "0 1px 3px rgba(0,0,0,0.06)" : "none",
          }}>{label}</button>
        ))}
      </div>

      {/* Aviso */}
      <div style={{ padding: "12px 16px", background: "rgba(26,92,46,0.06)", border: `0.5px solid ${COLORS.accent}33`, borderRadius: 10, display: "flex", gap: 10, alignItems: "flex-start" }}>
        <div style={{ fontSize: 18, flexShrink: 0 }}>💬</div>
        <div style={{ fontSize: 12, color: COLORS.textoSecundario, lineHeight: 1.6 }}>
          Esta solicitud aplica únicamente para vacaciones <strong style={{ color: COLORS.accent }}>pendientes</strong>.
          Para vencidas o truncas, coordinar con <strong style={{ color: COLORS.texto }}>Gestión Humana</strong>.
        </div>
      </div>

      {/* ── INDIVIDUAL ── */}
      {modo === "individual" && (
        <>
          <div style={{ background: COLORS.surface, borderRadius: 12, border: `0.5px solid ${COLORS.border}`, padding: 24 }}>
            <div style={{ fontSize: 13, fontWeight: 600, color: COLORS.texto, marginBottom: 12 }}>1. Selecciona el colaborador</div>
            <div style={{ position: "relative" }}>
              <input placeholder="🔍 Buscar por nombre, código o DNI..."
                value={colabSeleccionado ? colabSeleccionado.nombres : busqueda}
                onChange={(e) => { setBusqueda(e.target.value); setColabSeleccionado(null); setExito(false); setError(""); }}
                style={inputStyle} />
              {sugerencias.length > 0 && !colabSeleccionado && (
                <div style={{ position: "absolute", top: "100%", left: 0, right: 0, background: COLORS.surface, border: `0.5px solid ${COLORS.border}`, borderRadius: 10, zIndex: 10, boxShadow: "0 4px 20px rgba(0,0,0,0.1)", marginTop: 4, overflow: "hidden" }}>
                  {sugerencias.map((c) => (
                    <div key={c.cod} onClick={() => { setColabSeleccionado(c); setBusqueda(""); setFechaInicio(""); setFechaFin(""); setError(""); }}
                      style={{ padding: "10px 14px", cursor: "pointer", borderBottom: `0.5px solid ${COLORS.border}`, display: "flex", justifyContent: "space-between", alignItems: "center" }}
                      onMouseEnter={(e) => e.currentTarget.style.background = COLORS.surfaceHigh}
                      onMouseLeave={(e) => e.currentTarget.style.background = "transparent"}>
                      <div>
                        <div style={{ fontSize: 13, fontWeight: 500, color: COLORS.texto }}>{c.nombres}</div>
                        <div style={{ fontSize: 11, color: COLORS.textoMuted }}>{c.gerencia} · DNI: {c.doc}</div>
                      </div>
                      <div style={{ fontSize: 11, color: COLORS.textoSecundario }}>Cód: {c.cod}</div>
                    </div>
                  ))}
                </div>
              )}
            </div>
            {colabSeleccionado && (
              <div style={{ marginTop: 14, padding: "14px 16px", background: COLORS.bg, borderRadius: 10, border: `0.5px solid ${COLORS.border}` }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                  <div>
                    <div style={{ fontSize: 14, fontWeight: 600, color: COLORS.texto }}>{colabSeleccionado.nombres}</div>
                    <div style={{ fontSize: 12, color: COLORS.textoMuted, marginTop: 2 }}>{colabSeleccionado.gerencia} · {colabSeleccionado.unidadOrg}</div>
                    <div style={{ fontSize: 12, color: COLORS.textoMuted }}>DNI: {colabSeleccionado.doc} · Cód: {colabSeleccionado.cod}</div>
                  </div>
                  <button onClick={() => { setColabSeleccionado(null); setBusqueda(""); setError(""); }}
                    style={{ background: "transparent", border: `0.5px solid ${COLORS.border}`, color: COLORS.textoMuted, borderRadius: 6, padding: "3px 10px", cursor: "pointer", fontSize: 12 }}>Cambiar</button>
                </div>
                <div style={{ display: "flex", gap: 10, marginTop: 12, flexWrap: "wrap" }}>
                  {[
                    { label: "Vencidas", value: colabSeleccionado.totalVencidas || 0, color: COLORS.vencida },
                    { label: "Pendientes", value: colabSeleccionado.diasPendientes, color: COLORS.accent, disponible: true },
                    { label: "Truncas", value: colabSeleccionado.diasTrunca, color: COLORS.trunca },
                  ].map(({ label, value, color, disponible }) => (
                    <div key={label} style={{ padding: "8px 14px", background: color + "11", border: `0.5px solid ${color}44`, borderRadius: 8, textAlign: "center" }}>
                      <div style={{ fontSize: 10, color: COLORS.textoMuted, marginBottom: 2 }}>{label}</div>
                      <div style={{ fontSize: 16, fontWeight: 600, color }}>{Math.round(value * 100) / 100}</div>
                      {disponible && <div style={{ fontSize: 9, color: COLORS.positivo }}>✓ Disponibles</div>}
                    </div>
                  ))}
                </div>
                {!pendiente && !trunca && <div style={{ marginTop: 10, padding: "8px 12px", background: "rgba(239,68,68,0.08)", borderRadius: 8, border: "0.5px solid #FCA5A5", fontSize: 12, color: COLORS.vencida }}>⚠ Sin días pendientes ni truncos disponibles.</div>}
                {!pendiente && trunca && (
                  <div style={{ marginTop: 10, padding: "10px 14px", background: "rgba(234,179,8,0.08)", borderRadius: 8, border: "0.5px solid #FCD34D", fontSize: 12, color: "#92400E" }}>
                    📅 Sin pendientes HOY — el <strong>{proximoPeriodo ? fmtDate(proximoPeriodo) : "—"}</strong> sus truncos pasan a pendientes.                    {fechaInicio && periodoEfectivo
                      ? <span> Al <strong>{fmtDate(new Date(fechaInicio + "T12:00:00"))}</strong> tendrá <strong>{periodoEfectivo.saldo} días</strong> disponibles.</span>
                      : <span> Elige una fecha de inicio desde ese día para programar vacaciones.</span>
                    }
                  </div>
                )}
                {pendiente && <div style={{ marginTop: 10, fontSize: 11, color: COLORS.textoMuted }}>Período: <strong style={{ color: COLORS.texto }}>{fmtDate(pendiente.inicio)} al {fmtDate(pendiente.fin)}</strong> · Vence: <strong style={{ color: COLORS.accent }}>{fmtDate(pendiente.fechaVencimiento)}</strong></div>}
              </div>

          {colabSeleccionado && (pendiente || trunca) && (
            <div style={{ background: COLORS.surface, borderRadius: 12, border: `0.5px solid ${COLORS.border}`, padding: 24 }}>
              {periodoEfectivo?.esAnticipada && (
                <div style={{ marginBottom: 16, padding: "10px 14px", background: "rgba(234,179,8,0.08)", border: "0.5px solid #FCD34D", borderRadius: 8, fontSize: 12, color: "#92400E" }}>
                  ⏰ <strong>Solicitud anticipada</strong> — Al <strong>{fmtDate(new Date(fechaInicio + "T12:00:00"))}</strong> tendrá <strong>{periodoEfectivo.saldo} días</strong> pendientes disponibles (proyectado desde sus truncos actuales).
                </div>
              )}
              <div style={{ fontSize: 13, fontWeight: 600, color: COLORS.texto, marginBottom: 16 }}>
