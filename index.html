      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 12 }}>
        <div>
          <div style={{ fontSize: 20, fontWeight: 600, color: COLORS.texto }}>Alertas Vacacionales</div>
          <div style={{ fontSize: 14, color: COLORS.textoMuted, marginTop: 2 }}>
            Basado en saldo pendiente por colaborador · Corte {fmtDate(fechaCorteGlobal)}
          </div>
        </div>
        {/* Búsqueda colaborador */}
        <input placeholder="🔍 Buscar colaborador, código o DNI..." value={busquedaAlerta}
          onChange={e => setBusquedaAlerta(e.target.value)}
          style={{ background: COLORS.surfaceHigh, border: `0.5px solid ${COLORS.border}`, color: COLORS.texto, borderRadius: 10, padding: "8px 14px", fontSize: 13, outline: "none", minWidth: 220, flex: 1 }} />
        {/* Filtro gerencia */}
        <select value={filtroGerenciaAlertas} onChange={(e) => setFiltroGerenciaAlertas(e.target.value)}
          style={{ background: COLORS.surfaceHigh, border: `0.5px solid ${COLORS.border}`, color: COLORS.texto, borderRadius: 10, padding: "8px 14px", fontSize: 13, outline: "none", minWidth: 180 }}>
          {gerenciasAlertas.map((g) => (
            <option key={g} value={g}>{g === "Todas" ? "Todas las gerencias" : (g.length > 28 ? g.slice(0, 28) + "…" : g)}</option>
          ))}
        </select>
      </div>

      {/* Filtro gestión + exportar */}
      <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>

        <button onClick={() => {
          const encAlerta = ["Cód","Apellidos y Nombres","Gerencia","Días pendientes","Fecha tope salida","Días salvables","Gozar hasta","Severidad"];
          const filas = alertas.map(a => {
            const sev = severidadAlerta(a);
            // Calcular fecha tope de salida = fechaVenc - saldo + 1
            const hoyCorte = dateOnly(fechaCorteGlobal);
            const fechaTope = a.fechaVenc && a.saldoPendiente > 0
              ? dateOnly(new Date(a.fechaVenc.getTime() - (a.saldoPendiente - 1) * 86400000))
              : null;
            // Días salvables = días que aún se pueden goзar si sale hoy
            const diasSalvables = a.fechaVenc
              ? Math.max(0, Math.min(a.saldoPendiente, daysBetween(hoyCorte, a.fechaVenc) + 1))
              : 0;
            return {
              "Cód": a.cod, "Apellidos y Nombres": a.nombres, "Gerencia": a.gerencia,
              "Días pendientes": a.saldoPendiente,
              "Fecha tope salida": fechaTope ? fmtDate(fechaTope) : "—",
              "Días salvables": diasSalvables,
              "Gozar hasta": fmtDate(a.fechaVenc),
              "Severidad": sev.label,
            };
          });
          crearEstiloExcel(filas, encAlerta, "Alertas", "Alertas_Vacacionales.xlsx", { "Apellidos y Nombres": { wch: 30 }, "Gerencia": { wch: 28 }, "Fecha tope salida": { wch: 18 } });
        }} style={{
          marginLeft: "auto", background: COLORS.accent, color: "#fff", border: "none",
          borderRadius: 8, padding: "7px 16px", cursor: "pointer", fontSize: 12, fontWeight: 700,
        }}>⬇ Exportar Excel</button>
      </div>

      {/* KPIs globales — clickeables para filtrar */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(150px, 1fr))", gap: 12 }}>
        {[
          { id: "vencen1mes", label: "Vencen en 1 mes", value: vencen1mes, icon: "🔴", color: "#EF4444" },
          { id: "vencen3mes", label: "Vencen en 3 meses", value: vencen3mes, icon: "🟠", color: "#F97316" },
          { id: "tope30", label: "Tope en 30 días", value: topeProximo, icon: "⏰", color: "#F59E0B", sub: "Deben salir pronto" },
          { id: "topePasado", label: "Tope ya pasó", value: topePasado, icon: "🚨", color: "#EF4444", sub: "Días perdiéndose ahora" },
          { id: "criticos", label: "Críticos esta semana", value: criticosSemana.length, icon: "🔥", color: "#DC2626", sub: `${diasEnRiesgoSemana} días en riesgo` },
          { id: "sinRiesgo", label: "Sin riesgo inmediato", value: sinRiesgo, icon: "✅", color: COLORS.positivo, sub: "Tope > 90 días" },
          { id: null, label: "Con pendientes", value: alertas.length, icon: "📋", color: COLORS.accentLight },
        ].map(k => (
          <div key={k.label} onClick={() => { if (k.id) { setFiltroKPI(filtroKPI === k.id ? null : k.id); setTabActiva("a1"); } }}
            style={{ cursor: k.id ? "pointer" : "default", border: filtroKPI === k.id ? `2px solid ${k.color}` : "0.5px solid " + COLORS.border, borderRadius: 12, padding: "14px 16px", background: filtroKPI === k.id ? k.color + "15" : COLORS.surface, transition: "all 0.15s" }}>
            <div style={{ fontSize: 11, color: COLORS.textoMuted, marginBottom: 4 }}>{k.label.toUpperCase()}{filtroKPI === k.id ? " ✕" : ""}</div>
            <div style={{ fontSize: 24, fontWeight: 700, color: k.color }}>{k.value}</div>
            {k.sub && <div style={{ fontSize: 11, color: COLORS.textoMuted, marginTop: 2 }}>{k.sub}</div>}
          </div>
        ))}
      </div>

      {/* Tabs */}
      <div style={{
        display: "flex", gap: 4, borderBottom: `1px solid ${COLORS.border}`,
        background: COLORS.surface, borderRadius: "12px 12px 0 0", padding: "8px 8px 0",
        flexWrap: "wrap",
      }}>
        <TabBtn id="a1" label="⏳ Proximidad" badge={alerta1.length} />
        <TabBtn id="a2" label="📅 Fecha tope" badge={alerta2.length} color="#F97316" />
        <TabBtn id="a3" label="🚨 En riesgo" badge={alerta3.length} color="#EF4444" />
        <TabBtn id="criticos" label="🔥 Esta semana" badge={criticosSemana.length} color="#DC2626" />
        <TabBtn id="gerencia" label="🏢 Por gerencia" badge={0} color={COLORS.accent} />

      </div>

      {/* ── ALERTA 1: Proximidad de vencimiento ── */}
      {tabActiva === "a1" && (() => {
        const alerta1 = alerta1Render;
        const aun_a_tiempo = alerta1.filter((a) => a.aun_a_tiempo);
        const en_riesgo    = alerta1.filter((a) => a.enRiesgoHoy);
        const todo_vencido = alerta1.filter((a) => a.todoVencido);

        const CardA1 = ({ a, seccion }) => {
          const color = seccion === "vencido" ? "#DC2626"
            : seccion === "riesgo" ? "#F97316"
            : urgenciaColor(a.diasHastaVenc);

          return (
            <div style={{
              background: COLORS.surfaceHigh, borderRadius: 12,
              border: `1px solid ${color}33`, padding: "16px 18px",
              borderLeft: `4px solid ${color}`,
            }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 12 }}>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 14, fontWeight: 700, color: COLORS.texto }}>{a.nombres}</div>
                  <div style={{ fontSize: 12, color: COLORS.textoMuted, marginTop: 2 }}>{a.gerencia} · Cód: {a.cod}</div>

                  {/* Línea principal */}
                  <div style={{ fontSize: 12, color: COLORS.textoSecundario, marginTop: 8 }}>
                    Tiene <strong style={{ color: COLORS.accentLight }}>{a.saldoPendiente} días</strong> pendientes
                    · Gozar hasta: <strong style={{ color: color }}>{fmtDate(a.fechaVenc)}</strong>
                    {!a.todoVencido && (
                      <span> · Vence el: <strong style={{ color: "#F59E0B" }}>{fmtDate(new Date(a.fechaVenc.getTime() + 86400000))}</strong></span>
                    )}
                  </div>

                  {/* Envolse: fecha mínima de salida */}
                  {seccion === "tiempo" && (
                    <div style={{
                      marginTop: 8, padding: "8px 12px",
                      background: "rgba(59,130,246,0.08)", borderRadius: 8,
                      border: "1px solid rgba(59,130,246,0.2)",
                      fontSize: 12, color: COLORS.accentLight, fontWeight: 600,
                    }}>
                      📌 Debe salir como mínimo el <strong>{fmtDate(a.fechaMinimaSalida)}</strong> para que no se venzan sus vacaciones
                    </div>
                  )}

                  {/* Englose: en riesgo — ya pasó la mínima pero aún hay días salvables */}
                  {seccion === "riesgo" && (
                    <div style={{
                      marginTop: 8, padding: "8px 12px",
                      background: "rgba(249,115,22,0.08)", borderRadius: 8,
                      border: "1px solid rgba(249,115,22,0.25)",
                      fontSize: 12,
                    }}>
                      <div style={{ color: "#F97316", fontWeight: 700, marginBottom: 4 }}>
                        ⚠ Debió salir el {fmtDate(a.fechaMinimaSalida)}
                      </div>
                      <div style={{ color: COLORS.textoSecundario }}>
                        Si sale hoy ({fmtDate(a.colab.fechaCorte ? dateOnly(fechaCorteGlobal) : dateOnly(fechaCorteGlobal))}):
                        se vencen <strong style={{ color: "#EF4444" }}>{a.diasVencidosHoy} días</strong>
                        , se salvan <strong style={{ color: COLORS.positivo }}>{a.diasSalvablesHoy} días</strong>
                      </div>
                      {/* Barra */}
                      <div style={{ height: 5, background: COLORS.bg, borderRadius: 3, overflow: "hidden", display: "flex", marginTop: 8 }}>
                        <div style={{ width: `${(a.diasVencidosHoy/a.saldoPendiente)*100}%`, background: "#EF4444" }} />
                        <div style={{ width: `${(a.diasSalvablesHoy/a.saldoPendiente)*100}%`, background: COLORS.positivo }} />
                      </div>
                    </div>
                  )}

                  {/* Englose: todo vencido */}
                  {seccion === "vencido" && (
                    <div style={{
                      marginTop: 8, padding: "8px 12px",
                      background: "rgba(220,38,38,0.08)", borderRadius: 8,
                      border: "1px solid rgba(220,38,38,0.25)",
                      fontSize: 12, color: "#FCA5A5",
                    }}>
                      🚨 Venció el <strong>{fmtDate(new Date(a.fechaVenc.getTime() + 86400000))}</strong> (podía gozarse hasta el <strong>{fmtDate(a.fechaVenc)}</strong>).
                      Los <strong>{a.saldoPendiente} días</strong> pasaron a <strong>Vencidas</strong>.
                    </div>
                  )}
                </div>

                {/* Badge derecho */}
                <div style={{ textAlign: "right", flexShrink: 0 }}>
                  {!a.todoVencido && a.diasHastaVenc >= 0 ? (
                    <>
                      <div style={{ fontSize: 22, fontWeight: 800, color }}>
                        {a.mesesHastaVenc}m {a.diasRestHastaVenc}d
                      </div>
                      <div style={{ fontSize: 11, color: COLORS.textoMuted }}>restantes</div>
                    </>
                  ) : (
                    <>
                      <div style={{ fontSize: 22, fontWeight: 800, color: "#DC2626" }}>VENCIDO</div>
                      <div style={{ fontSize: 11, color: COLORS.textoMuted }}>{a.saldoPendiente} días</div>
                    </>
                  )}
                </div>
              </div>
              <button onClick={() => setDetalle(a.colab)} style={{
                marginTop: 10, background: "transparent", border: `0.5px solid ${COLORS.border}`,
                color: COLORS.textoSecundario, borderRadius: 7, padding: "4px 12px",
                cursor: "pointer", fontSize: 12,
              }}>Ver períodos →</button>
              {onGenerarSolicitud && (
                <button onClick={() => onGenerarSolicitud(a.colab)} style={{ background: COLORS.accent, color: "#fff", border: "none", borderRadius: 7, padding: "4px 10px", cursor: "pointer", fontSize: 11, fontWeight: 600 }}>📄 Generar solicitud</button>
              )}
            </div>
          );
        };

        return (
          <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
            <MesesFilter value={filtroMeses} onChange={setFiltroMeses} />

            {/* Sección: En riesgo — pasó la fecha mínima pero aún hay días salvables */}
            {en_riesgo.length > 0 && (
              <div>
                <div style={{ fontSize: 12, fontWeight: 700, color: "#F97316", letterSpacing: "0.06em", textTransform: "uppercase", marginBottom: 10 }}>
                  ⚠ En riesgo — {en_riesgo.length} colaboradores con días perdiéndose
                </div>
                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  {en_riesgo.map((a) => <CardA1 key={a.cod} a={a} seccion="riesgo" />)}
                </div>
              </div>
            )}

            {/* Sección: A tiempo */}
            {aun_a_tiempo.length > 0 && (
              <div>
                <div style={{ fontSize: 12, fontWeight: 700, color: COLORS.accentLight, letterSpacing: "0.06em", textTransform: "uppercase", marginBottom: 10 }}>
                  ✅ A tiempo — {aun_a_tiempo.length} colaboradores
                </div>
                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  {aun_a_tiempo.map((a) => <CardA1 key={a.cod} a={a} seccion="tiempo" />)}
                </div>
              </div>
            )}

            {/* Sección: Todo vencido — Vacaciones vencidas recientes */}
            {todo_vencido.length > 0 && (
              <div>
                <div style={{ fontSize: 12, fontWeight: 700, color: "#DC2626", letterSpacing: "0.06em", textTransform: "uppercase", marginBottom: 10 }}>
                  🚨 Vacaciones vencidas recientes — {todo_vencido.length} colaboradores
                </div>
                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  {todo_vencido.map((a) => <CardA1 key={a.cod} a={a} seccion="vencido" />)}
                </div>
              </div>
            )}

            {alerta1.length === 0 && (
              <div style={{ textAlign: "center", padding: 40, color: COLORS.textoMuted, fontSize: 14 }}>
                ✅ Ningún colaborador con pendientes que venzan en este período
              </div>
            )}
          </div>
        );
      })()}

      {/* ── ALERTA 2: Fecha tope de salida ── */}
      {tabActiva === "a2" && (
        <TabFechaTope alerta2={alerta2} setDetalle={setDetalle} fechaCorteGlobal={fechaCorteGlobal} onGenerarSolicitud={onGenerarSolicitud} />
      )}

      {/* ── ALERTA 3: Días perdiéndose ahora ── */}
      {tabActiva === "a3" && (
        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          <div style={{ padding: "12px 16px", background: "rgba(239,68,68,0.06)", borderRadius: 10, border: "1px solid #EF444433" }}>
            <div style={{ fontSize: 13, color: "#EF4444", fontWeight: 600 }}>
              🚨 Estos colaboradores ya superaron su fecha tope de salida. Cada día que pasa pierden un día de vacaciones.
            </div>
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 8, maxHeight: 560, overflowY: "auto" }}>
            {alerta3.length === 0 && (
              <div style={{ textAlign: "center", padding: 40, color: COLORS.textoMuted, fontSize: 14 }}>
                ✅ Ningún colaborador ha superado su fecha tope
              </div>
            )}
            {alerta3.map((a) => {
              const pctSalvado = a.saldoPendiente > 0 ? (a.diasSalvables / a.saldoPendiente) * 100 : 0;
              return (
                <div key={a.cod} style={{
                  background: COLORS.surfaceHigh, borderRadius: 12,
                  border: "1px solid #EF444433", padding: "16px 18px",
                  borderLeft: "4px solid #EF4444",
                }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 12 }}>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontSize: 14, fontWeight: 700, color: COLORS.texto }}>{a.nombres}</div>
                      <div style={{ fontSize: 12, color: COLORS.textoMuted, marginTop: 2 }}>{a.gerencia} · Cód: {a.cod}</div>
                      <div style={{ fontSize: 12, color: COLORS.textoSecundario, marginTop: 6 }}>
                        Tenía <strong style={{ color: COLORS.accentLight }}>{a.saldoPendiente} días</strong> pendientes
                        · Gozar hasta: <strong>{fmtDate(a.fechaVenc)}</strong>
                        · Vence el: <strong style={{ color: "#EF4444" }}>{fmtDate(new Date(a.fechaVenc.getTime() + 86400000))}</strong>
                        · Tope era: <strong style={{ color: "#EF4444" }}>{fmtDate(a.fechaTope)}</strong>
                      </div>
                      <div style={{ marginTop: 10 }}>
                        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: COLORS.textoMuted, marginBottom: 4 }}>
                          <span>Se pierden: <strong style={{ color: "#EF4444" }}>{a.diasVencidosYa} días</strong></span>
                          <span>Se salvan: <strong style={{ color: COLORS.positivo }}>{a.diasSalvables} días</strong></span>
                        </div>
                        <div style={{ height: 8, background: COLORS.bg, borderRadius: 4, overflow: "hidden", display: "flex" }}>
                          <div style={{ width: `${100 - pctSalvado}%`, background: "#EF4444", transition: "width 0.3s" }} />
                          <div style={{ width: `${pctSalvado}%`, background: COLORS.positivo, transition: "width 0.3s" }} />
                        </div>
                      </div>
                      <div style={{ fontSize: 12, color: "#F59E0B", fontWeight: 600, marginTop: 8 }}>
                        ⚡ Si sale HOY ({fmtDate(fechaCorteGlobal)}): se pierden {a.diasVencidosYa} días, se salvan {a.diasSalvables} días
                      </div>
                    </div>
                    <div style={{ textAlign: "right", flexShrink: 0 }}>
                      <div style={{ fontSize: 26, fontWeight: 800, color: "#EF4444" }}>{a.diasVencidosYa}</div>
                      <div style={{ fontSize: 11, color: COLORS.textoMuted }}>días perdidos</div>
                      <div style={{ fontSize: 20, fontWeight: 700, color: COLORS.positivo, marginTop: 4 }}>{a.diasSalvables}</div>
                      <div style={{ fontSize: 11, color: COLORS.textoMuted }}>días salvables</div>
                    </div>
                  </div>
                  <button onClick={() => setDetalle(a.colab)} style={{
                    marginTop: 10, background: "transparent", border: `0.5px solid ${COLORS.border}`,
                    color: COLORS.textoSecundario, borderRadius: 7, padding: "4px 12px",
                    cursor: "pointer", fontSize: 12,
                  }}>Ver períodos →</button>
              {onGenerarSolicitud && (
                <button onClick={() => onGenerarSolicitud(a.colab)} style={{ background: COLORS.accent, color: "#fff", border: "none", borderRadius: 7, padding: "4px 10px", cursor: "pointer", fontSize: 11, fontWeight: 600 }}>📄 Generar solicitud</button>
              )}
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* ── CRÍTICOS ESTA SEMANA ── */}
      {tabActiva === "criticos" && (
        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          <div style={{ padding: "12px 16px", background: "rgba(220,38,38,0.06)", borderRadius: 10, border: "1px solid #DC262633" }}>
            <div style={{ fontSize: 13, color: "#DC2626", fontWeight: 600 }}>
              🔥 Colaboradores con tope en los próximos 7 días o ya vencido. Requieren acción inmediata.
            </div>
          </div>
          {criticosSemana.length === 0 && (
            <div style={{ textAlign: "center", padding: 40, color: COLORS.positivo, fontSize: 14 }}>
              ✅ Ningún colaborador en estado crítico esta semana
            </div>
          )}
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {criticosSemana.map((a) => {
              const yaVencio = a.topeYaPaso;
              const color = yaVencio ? "#DC2626" : "#F97316";
              return (
                <div key={a.cod} style={{ background: COLORS.surfaceHigh, borderRadius: 12, border: `1px solid ${color}33`, padding: "14px 18px", borderLeft: `4px solid ${color}` }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 12 }}>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontSize: 14, fontWeight: 700, color: COLORS.texto }}>{a.nombres}</div>
                      <div style={{ fontSize: 12, color: COLORS.textoMuted, marginTop: 2 }}>{a.gerencia} · Cód: {a.cod}</div>
                      <div style={{ fontSize: 12, color: COLORS.textoSecundario, marginTop: 6 }}>
                        <strong style={{ color: COLORS.accentLight }}>{a.saldoPendiente} días</strong> pendientes
                        · Gozar hasta: <strong>{fmtDate(a.fechaVenc)}</strong>
                        · Vence el: <strong style={{ color }}>{fmtDate(new Date(a.fechaVenc.getTime() + 86400000))}</strong>
                      </div>
                      <div style={{ fontSize: 13, color, fontWeight: 700, marginTop: 6 }}>
                        {yaVencio
                          ? `✕ Debió salir el ${fmtDate(a.fechaTope)} — hace ${Math.abs(a.diasHastaTope)} días`
                          : `⚠ Debe salir como máximo el ${fmtDate(a.fechaTope)}`}
                      </div>
                    </div>
                    <div style={{ display: "flex", flexDirection: "column", gap: 6, alignItems: "flex-end", flexShrink: 0 }}>
                      <div style={{ textAlign: "right" }}>
                        <div style={{ fontSize: 20, fontWeight: 800, color }}>{yaVencio ? `-${Math.abs(a.diasHastaTope)}d` : `${a.diasHastaTope}d`}</div>
                        <div style={{ fontSize: 10, color: COLORS.textoMuted }}>{yaVencio ? "días desde tope" : "días hasta tope"}</div>
                      </div>
                      <button onClick={() => setDetalle(a.colab)} style={{ background: "transparent", border: `0.5px solid ${COLORS.border}`, color: COLORS.textoSecundario, borderRadius: 7, padding: "4px 10px", cursor: "pointer", fontSize: 11 }}>Ver períodos →</button>
                      {onGenerarSolicitud && (
                        <button onClick={() => onGenerarSolicitud(a.colab)} style={{ background: COLORS.accent, color: "#fff", border: "none", borderRadius: 7, padding: "4px 10px", cursor: "pointer", fontSize: 11, fontWeight: 600 }}>📄 Generar solicitud</button>
                      )}
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* ── POR GERENCIA ── */}
      {tabActiva === "gerencia" && (() => {
        const porGerencia = {};
        for (const a of alertasTodas) {
          if (!porGerencia[a.gerencia]) porGerencia[a.gerencia] = { nombre: a.gerencia, total: 0, criticos: 0, riesgo: 0, aTiempo: 0, diasRiesgo: 0 };
          const g = porGerencia[a.gerencia];
          g.total++;
          if (a.diasHastaTope <= 0) { g.criticos++; g.diasRiesgo += a.saldoPendiente; }
          else if (a.diasHastaTope <= 30) g.riesgo++;
          else g.aTiempo++;
        }
        const lista = Object.values(porGerencia).sort((a, b) => b.criticos - a.criticos || b.riesgo - a.riesgo);

        return (
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            <div style={{ display: "grid", gridTemplateColumns: "2fr 1fr 1fr 1fr 1fr", gap: 0, background: COLORS.surfaceHigh, borderRadius: 10, overflow: "hidden", border: `0.5px solid ${COLORS.border}` }}>
              {["Gerencia", "Total", "🔴 Críticos", "🟠 En riesgo", "🟢 A tiempo"].map((h) => (
                <div key={h} style={{ padding: "10px 14px", fontSize: 11, fontWeight: 700, color: COLORS.textoMuted, textTransform: "uppercase", letterSpacing: "0.04em", borderBottom: `1px solid ${COLORS.border}` }}>{h}</div>
              ))}
              {lista.map((g) => (
                <>
                  <div key={g.nombre + "n"} style={{ padding: "12px 14px", fontSize: 12, fontWeight: 600, color: COLORS.texto, borderBottom: `1px solid ${COLORS.border}15` }}>
                    <div>{g.nombre.length > 35 ? g.nombre.slice(0, 35) + "…" : g.nombre}</div>
                    {g.criticos > 0 && <div style={{ fontSize: 10, color: "#DC2626", marginTop: 2 }}>{g.diasRiesgo} días perdiéndose</div>}
                  </div>
                  <div key={g.nombre + "t"} style={{ padding: "12px 14px", fontSize: 13, fontWeight: 700, color: COLORS.texto, borderBottom: `1px solid ${COLORS.border}15`, textAlign: "center" }}>{g.total}</div>
                  <div key={g.nombre + "c"} style={{ padding: "12px 14px", fontSize: 13, fontWeight: 700, color: g.criticos > 0 ? "#DC2626" : COLORS.textoMuted, borderBottom: `1px solid ${COLORS.border}15`, textAlign: "center" }}>{g.criticos}</div>
                  <div key={g.nombre + "r"} style={{ padding: "12px 14px", fontSize: 13, fontWeight: 700, color: g.riesgo > 0 ? "#F97316" : COLORS.textoMuted, borderBottom: `1px solid ${COLORS.border}15`, textAlign: "center" }}>{g.riesgo}</div>
                  <div key={g.nombre + "a"} style={{ padding: "12px 14px", fontSize: 13, fontWeight: 700, color: g.aTiempo > 0 ? COLORS.positivo : COLORS.textoMuted, borderBottom: `1px solid ${COLORS.border}15`, textAlign: "center" }}>{g.aTiempo}</div>
                </>
              ))}
            </div>
          </div>
        );
      })()}

      {/* ── SIMULADOR ── */}
      {false && (
        <TabSimulador alertas={alertas} fechaCorteGlobal={fechaCorteGlobal} />
      )}

      {detalle && <PeriodosDetalle colab={detalle} onClose={() => setDetalle(null)} />}

      {/* Modal gestión */}
      
    </div>
  );
}

function PaginaSimulacion({ colaboradores, fechaCorteGlobal }) {
  const [mesesExtra, setMesesExtra] = useState(6);

  const simulados = useMemo(() => {
    const fechaFutura = new Date(fechaCorteGlobal);
    fechaFutura.setMonth(fechaFutura.getMonth() + mesesExtra);

    return colaboradores.map((c) => {
      const periodosF = calcularPeriodos(c.fechaCorte, fechaFutura);
      const vencidasF = periodosF.filter((p) => p.tipo === "VENCIDA");
      const nuevasVencidas = vencidasF.length - c.periodos.filter((p) => p.tipo === "VENCIDA").length;
      return { ...c, periodosSimulados: periodosF, nuevasVencidas: Math.max(0, nuevasVencidas) };
    }).filter((c) => c.nuevasVencidas > 0).slice(0, 100);
  }, [colaboradores, mesesExtra, fechaCorteGlobal]);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
      <div>
        <div style={{ fontSize: 20, fontWeight: 600, color: COLORS.texto }}>Simulación de Vencimientos</div>
        <div style={{ fontSize: 14, color: COLORS.textoMuted }}>Proyecta futuros vencimientos en el tiempo</div>
      </div>

      <div style={{ display: "flex", alignItems: "center", gap: 16, background: COLORS.surfaceHigh, padding: "16px 20px", borderRadius: 12, border: `0.5px solid ${COLORS.border}` }}>
        <span style={{ fontSize: 14, color: COLORS.textoSecundario }}>Proyectar</span>
        <input type="range" min={1} max={24} value={mesesExtra} onChange={(e) => setMesesExtra(+e.target.value)}
          style={{ flex: 1, accentColor: COLORS.accent }} />
        <span style={{ fontSize: 16, fontWeight: 700, color: COLORS.texto, minWidth: 100 }}>+{mesesExtra} meses</span>
        <span style={{ fontSize: 13, color: COLORS.textoMuted }}>({simulados.length} nuevas vencidas)</span>
      </div>

      <div style={{ background: COLORS.surface, borderRadius: 12, border: `0.5px solid ${COLORS.border}`, padding: 20 }}>
        <div style={{ fontSize: 13, color: COLORS.textoMuted, marginBottom: 12 }}>
          Colaboradores que generarán nuevas vencidas en los próximos {mesesExtra} meses (primeros 100)
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 8, maxHeight: 480, overflowY: "auto" }}>
          {simulados.map((c) => (
            <div key={c.cod} style={{
              display: "flex", justifyContent: "space-between", alignItems: "center",
              padding: "10px 14px", background: COLORS.bg, borderRadius: 8,
              border: `0.5px solid ${COLORS.border}`,
            }}>
              <div>
                <div style={{ fontSize: 13, color: COLORS.texto, fontWeight: 500 }}>{c.nombres}</div>
                <div style={{ fontSize: 11, color: COLORS.textoMuted }}>{c.gerencia}</div>
              </div>
              <span style={{ background: "rgba(239,68,68,0.1)", color: "#EF4444", borderRadius: 6, padding: "3px 10px", fontSize: 12, fontWeight: 700 }}>
                +{c.nuevasVencidas} período{c.nuevasVencidas > 1 ? "s" : ""}
              </span>
            </div>
          ))}
          {simulados.length === 0 && (
            <div style={{ textAlign: "center", color: COLORS.textoMuted, padding: 24, fontSize: 14 }}>
              ✅ Ningún colaborador generará nuevas vencidas en ese período
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ─── APP PRINCIPAL ───────────────────────────────────────────────────────────
// ─── PÁGINA: SOLICITUD DE VACACIONES ─────────────────────────────────────────
function PaginaSolicitud({ colaboradores, fechaCorteGlobal, colabPreseleccionado = null, onColabUsado, bpUsuario = "admin", bpNombre = "", bpGerencias = null, bpAdmin = false }) {
  const [modo, setModo] = useState("individual");
  const [busqueda, setBusqueda] = useState("");
  const [colabSeleccionado, setColabSeleccionado] = useState(colabPreseleccionado);
  const [fechaInicio, setFechaInicio] = useState("");
  const [fechaFin, setFechaFin] = useState("");
  const [error, setError] = useState("");
  const [exito, setExito] = useState(false);
  const [filasMasivo, setFilasMasivo] = useState(null);
  const [procesandoMasivo, setProcesandoMasivo] = useState(false);
  const [exitoMasivo, setExitoMasivo] = useState(false);
  const [tipoSeleccionado, setTipoSeleccionado] = useState(null);
  const [periodoVencidoSeleccionado, setPeriodoVencidoSeleccionado] = useState(null);
  // Adelanto de remuneración vacacional (obligatorio) y tipo de PDF (solo admin)
  const [adelantoRemun, setAdelantoRemun] = useState(null); // true | false | null
  const [tipoPDF, setTipoPDF] = useState("COMPLETO"); // COMPLETO (4 líneas) | SIMPLE (1 línea)
  // Estados para Convenio
  const [busquedaConvenio, setBusquedaConvenio] = useState("");
  const [colabConvenio, setColabConvenio] = useState(null);
  // Estados para Compra
  const [busquedaCompra, setBusquedaCompra] = useState("");
  const [colabCompra, setColabCompra] = useState(null);
  const [tipoCompra, setTipoCompra] = useState(null);
  const [periodoVencidoCompra, setPeriodoVencidoCompra] = useState(null);
  const [diasCompra, setDiasCompra] = useState("");
  const [direccionCompra, setDireccionCompra] = useState("");
  const hoyConvenio = new Date();
  const [fechaConvenio, setFechaConvenio] = useState(`${hoyConvenio.getFullYear()}-${String(hoyConvenio.getMonth()+1).padStart(2,'0')}-${String(hoyConvenio.getDate()).padStart(2,'0')}`);

  // Si llega un colaborador preseleccionado desde Colaboradores, usarlo
  useEffect(() => {
    if (colabPreseleccionado) {
      setColabSeleccionado(colabPreseleccionado);
      setBusqueda("");
      setFechaInicio("");
      setFechaFin("");
      setError("");
      setTipoSeleccionado("PENDIENTE");
      setPeriodoVencidoSeleccionado(null);
      if (onColabUsado) onColabUsado();
    }
  }, [colabPreseleccionado]);

  const inputStyle = {
    background: COLORS.surfaceHigh, border: `0.5px solid ${COLORS.border}`,
    color: COLORS.texto, borderRadius: 10, padding: "9px 14px",
    fontSize: 13, outline: "none", width: "100%",
  };

  // Filtrar colaboradores por búsqueda
  const sugerencias = useMemo(() => {
    if (!busqueda || busqueda.length < 2) return [];
    const q = busqueda.toLowerCase();
    return colaboradores
      .filter((c) => c.nombres.toLowerCase().includes(q) || c.cod.includes(q) || c.doc.includes(q))
      .slice(0, 8);
  }, [colaboradores, busqueda]);

  // Período PENDIENTE actual
  const pendiente = colabSeleccionado
    ? colabSeleccionado.periodos.find((p) => p.tipo === "PENDIENTE" && p.saldo > 0)
    : null;

  // Período TRUNCA actual
  const trunca = colabSeleccionado
    ? colabSeleccionado.periodos.find((p) => p.tipo === "TRUNCA" && p.saldo > 0)
    : null;

  // Períodos VENCIDOS con días reales > 0 (para admin)
  const periodosVencidos = colabSeleccionado
    ? colabSeleccionado.periodos.filter((p) => (p.tipo === "VENCIDA" && (p.diasVencidosReales || 0) > 0) || (p.tipo === "INDEMNIZACION" && p.saldo > 0))
    : [];

  // Calcular próximo período pendiente proyectado a una fecha futura
  const calcularSaldoProyectado = (colabSel, fechaIniStr) => {
    if (!colabSel || !fechaIniStr) return null;
    const truncaPeriodo = colabSel.periodos.find((p) => p.tipo === "TRUNCA");
    if (!truncaPeriodo) return null;
    const finAnioLaboral = dateOnly(new Date(addYears(truncaPeriodo.inicio, 1).getTime() - 86400000));
    const inicioProximo = dateOnly(new Date(finAnioLaboral.getTime() + 86400000));
    const fechaIni = dateOnly(new Date(fechaIniStr + "T12:00:00"));
    if (fechaIni < inicioProximo) return null; // fecha antes del aniversario, no aplica
    // Proyectar saldo trunco a la fecha de inicio elegida (usando la misma fórmula del motor)
    const diasTranscurridos = daysBetween(truncaPeriodo.inicio, fechaIni);
    const mesesCompletos = Math.floor(diasTranscurridos / 30);
    const diasExtra = diasTranscurridos % 30;
    const saldoProyectado = Math.round(((mesesCompletos * 30 + diasExtra) / 360) * 30 * 100) / 100;
    const finProximo = dateOnly(new Date(addYears(inicioProximo, 1).getTime() - 86400000));
    return {
      inicio: inicioProximo,
      fin: finProximo,
      fechaVencimiento: dateOnly(addYears(finProximo, 1)),
      saldo: saldoProyectado,
      tipo: "PENDIENTE",
      esAnticipada: true,
    };
  };

  // Próximo período (inicio del aniversario) — para mostrar el aviso
  const proximoPeriodo = useMemo(() => {
    if (!colabSeleccionado || pendiente) return null;
    const truncaPeriodo = colabSeleccionado.periodos.find((p) => p.tipo === "TRUNCA");
    if (!truncaPeriodo) return null;
    const finAnioLaboral = dateOnly(new Date(addYears(truncaPeriodo.inicio, 1).getTime() - 86400000));
    const inicioProximo = dateOnly(new Date(finAnioLaboral.getTime() + 86400000));
    return inicioProximo;
  }, [colabSeleccionado, pendiente]);

  // Período efectivo según tipo seleccionado
  const periodoEfectivo = useMemo(() => {
    if (!colabSeleccionado) return null;
    if (tipoSeleccionado === "VENCIDA") {
      if (!periodoVencidoSeleccionado) return null;
      return {
        ...periodoVencidoSeleccionado,
        saldo: periodoVencidoSeleccionado.diasVencidosReales || 0,
        esTipoVencida: true,
      };
    }
    if (tipoSeleccionado === "TRUNCA") {
      if (!trunca) return null;
      return { ...trunca, esTipoTrunca: true };
    }
    // PENDIENTE (default para BPs y admin cuando selecciona pendiente)
    if (pendiente) return { ...pendiente, esAnticipada: false };
    if (!trunca || !fechaInicio) return null;
    return calcularSaldoProyectado(colabSeleccionado, fechaInicio);
  }, [tipoSeleccionado, periodoVencidoSeleccionado, pendiente, trunca, fechaInicio, colabSeleccionado]);

  // Calcular días solicitados
  const calcularDias = () => {
    if (!fechaInicio || !fechaFin) return 0;
    const ini = new Date(fechaInicio + "T12:00:00");
    const fin = new Date(fechaFin + "T12:00:00");
    if (fin < ini) return 0;
    return daysBetween(ini, fin) + 1;
  };
  const diasSolicitados = calcularDias();
  const fechaRetorno = fechaFin
    ? (() => { const d = new Date(fechaFin + "T12:00:00"); d.setDate(d.getDate() + 1); return d; })()
    : null;

  // ─── Anti-cruce: solicitudes activas del colaborador (SIN_PDF, CON_PDF, APROBADA) ───
  const [solicitudesActivas, setSolicitudesActivas] = useState([]);
  useEffect(() => {
    let vivo = true;
    const iv = setInterval(() => {
      if (window._firebase?.db) {
        clearInterval(iv);
        const { db, collection, onSnapshot, query, where } = window._firebase;
        try {
          const q = query(collection(db, "solicitudes"), where("estado", "in", ["SIN_PDF", "CON_PDF", "APROBADA"]));
          const unsub = onSnapshot(q, snap => {
            if (vivo) setSolicitudesActivas(snap.docs.map(d => ({ id: d.id, ...d.data() })));
          }, err => console.warn("Solicitudes activas:", err.message));
          if (!vivo) unsub();
        } catch (e) { console.warn("Solicitudes activas:", e.message); }
      }
    }, 500);
    return () => { vivo = false; clearInterval(iv); };
  }, []);

  // Devuelve un texto describiendo el cruce, o null si no hay conflicto
  const buscarCruceFechas = (colab, iniStr, finStr) => {
    if (!colab || !iniStr || !finStr) return null;
    const ini = dateOnly(new Date(iniStr + "T12:00:00"));
    const fin = dateOnly(new Date(finStr + "T12:00:00"));
    if (isNaN(ini.getTime()) || isNaN(fin.getTime())) return null;
    const seCruzan = (a1, a2) => a1 <= fin && a2 >= ini;

    const norm = (v) => {
      if (!v) return null;
      if (v instanceof Date) return isNaN(v.getTime()) ? null : dateOnly(v);
      if (typeof v.toDate === "function") { const d = v.toDate(); return isNaN(d.getTime()) ? null : dateOnly(d); }
      const s = String(v).trim();
      let d = null;
      if (/^\d{4}-\d{2}-\d{2}/.test(s)) d = new Date(s.slice(0,10) + "T12:00:00");
      else if (/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(s)) {
        const p = s.split("/");
        d = new Date(p[2] + "-" + String(p[1]).padStart(2,"0") + "-" + String(p[0]).padStart(2,"0") + "T12:00:00");
      } else d = new Date(s);
      return (d && !isNaN(d.getTime())) ? dateOnly(d) : null;
    };

    // 1) Goces ya registrados (Excel de SAP + los del sistema ya aprobados)
    const periodos = colab.periodos || [];
    for (const p of periodos) {
      for (const g of (p.goces || [])) {
        const gi = norm(g.inicio), gf = norm(g.finReal || g.fin);
        if (!gi || !gf) continue;
        if (seCruzan(gi, gf)) {
          return "Ya tiene vacaciones registradas del " + fmtDate(gi) + " al " + fmtDate(gf) +
                 ", que se cruzan con las fechas solicitadas.";
        }
      }
    }

    // 2) Solicitudes activas (excluye compras y convenios, que no ocupan días de calendario)
    const cod = String(colab.cod || "").trim();
    for (const s of solicitudesActivas) {
      const t = String(s.tipo || "").toUpperCase();
      if (t === "COMPRA" || t === "CONVENIO") continue;
      if (String(s.colaboradorCod || s.cod || "").trim() !== cod) continue;
      const si = norm(s.fechaInicio), sf = norm(s.fechaFin);
      if (!si || !sf) continue;
      if (seCruzan(si, sf)) {
        const et = s.estado === "APROBADA" ? "aprobada"
                 : s.estado === "CON_PDF" ? "con PDF adjunto" : "pendiente de PDF";
        return "Ya existe una solicitud " + et + " del " + fmtDate(si) + " al " + fmtDate(sf) +
               ", que se cruza con las fechas solicitadas.";
      }
    }
    return null;
  };

  // Validar
  const validar = () => {
    if (!colabSeleccionado) return "Selecciona un colaborador.";
    if (bpAdmin && !tipoSeleccionado) return "Selecciona el tipo de días a solicitar.";
    if (!fechaInicio || !fechaFin) return "Ingresa las fechas de inicio y fin.";
    if (adelantoRemun === null) return "Indica si corresponde el adelanto de remuneracion vacacional.";
    const ini = new Date(fechaInicio + "T12:00:00");
    const fin = new Date(fechaFin + "T12:00:00");
    if (fin < ini) return "La fecha de fin debe ser posterior a la de inicio.";
    const cruce = buscarCruceFechas(colabSeleccionado, fechaInicio, fechaFin);
    if (cruce) return cruce;
    if (!periodoEfectivo) {
      if (tipoSeleccionado === "TRUNCA") return "El colaborador no tiene días truncos disponibles.";
      if (tipoSeleccionado === "VENCIDA") return "Selecciona un período vencido.";
      if (proximoPeriodo) return "La fecha de inicio debe ser a partir del " + fmtDate(proximoPeriodo) + " (inicio del próximo período pendiente).";
      return "El colaborador no tiene saldo de vacaciones pendientes.";
    }
    if (diasSolicitados > periodoEfectivo.saldo) return "Solo tiene " + periodoEfectivo.saldo + " días disponibles.";
    {
      if (!bpAdmin) {
        const minimoRequerido = periodoEfectivo.saldo >= 7 ? 7 : Math.ceil(periodoEfectivo.saldo);
        if (diasSolicitados < minimoRequerido) {
          if (periodoEfectivo.saldo >= 7) return "Debe solicitar como mínimo 7 días de vacaciones.";
          else return "Debe solicitar todos sus días disponibles (" + minimoRequerido + " días).";
        }
      }
      if (periodoEfectivo.fechaVencimiento) {
        const limiteVenc = new Date(periodoEfectivo.fechaVencimiento.getTime() - 86400000);
        if (ini > limiteVenc) return "Las fechas deben ser antes del " + fmtDate(periodoEfectivo.fechaVencimiento) + " (vencimiento del período).";
      }
    }
    return "";
  };

  // Generar PDF usando ventana de impresión del navegador
  // ── Generador HTML (individual) ───────────────────────────────────────────
  const buildHTML = (c, pend, dias, fIni, fFin, tipo = "PENDIENTE", adelanto = null, modoPDF = "COMPLETO") => {
    const ini = new Date(fIni + "T12:00:00");
    const fin = new Date(fFin + "T12:00:00");
    const retorno = new Date(fin.getTime() + 86400000);
    const ciudad = c.nom === "MC" ? "Chincha" : "Lima";
    const MESES_LARGO = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
    const _hd = new Date();
    const hoy = String(_hd.getDate()).padStart(2, "0") + " de " + MESES_LARGO[_hd.getMonth()] + " del " + _hd.getFullYear();
    const css = "* { margin:0;padding:0;box-sizing:border-box; } body{font-family:Arial,sans-serif;font-size:10pt;color:#1a1a1a;padding:20mm 20mm 15mm 20mm;} .logo-text{color:#1A5C2E;font-size:22pt;font-weight:bold;letter-spacing:2px;font-family:Georgia,serif;} .logo-sub{color:#1A5C2E;font-size:8pt;letter-spacing:4px;margin-top:2px;} .header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6mm;} .divider{border:none;border-top:1.5px solid #1A5C2E;margin:4mm 0 6mm 0;} .title{text-align:center;font-size:13pt;font-weight:bold;margin-bottom:6mm;text-transform:uppercase;} .fecha-nom{text-align:right;font-size:9pt;color:#444;margin-bottom:5mm;} .datos{margin-bottom:5mm;line-height:1.8;} .intro{margin-bottom:5mm;font-size:9.5pt;line-height:1.5;} table{width:100%;border-collapse:collapse;margin-bottom:5mm;font-size:8.5pt;} th{background:#EBF7ED;color:#1A5C2E;font-weight:bold;text-align:center;padding:4px 3px;border:1px solid #1A5C2E;} td{text-align:center;padding:5px 3px;border:1px solid #aaa;} .td-r{text-align:left;padding:5px 6px;border:1px solid #aaa;font-size:8pt;} .anot{margin-bottom:10mm;} .anot strong{display:block;margin-bottom:3mm;font-size:9.5pt;} .anot p{font-size:8.5pt;line-height:1.5;margin-bottom:2.5mm;} .anot p strong{display:inline;font-size:inherit;margin:0;} .firmas{display:flex;justify-content:space-between;margin-top:35mm;} .firma{text-align:center;width:45%;} .fl{border-top:1px solid #333;padding-top:4px;margin-bottom:2px;} .fn{font-weight:bold;font-size:9pt;} .fd{font-size:8.5pt;color:#444;} .firma-img{max-width:180px;max-height:62px;display:block;margin:0 auto 2px;} @media print{body{padding:15mm 18mm 12mm 18mm;}}";

    // Etiqueta del tipo de período en el PDF
    const labelTipo = tipo === "VENCIDA" ? "Período Vencido" : tipo === "TRUNCA" ? "Período Trunco" : "Periodo Vacacional";

    // Saldo restante según tipo
    const saldoRestante = Math.round((pend.saldo - dias) * 100) / 100;
    const lineaSaldo = tipo === "VENCIDA"
      ? "<strong>" + Math.round(c.totalVencidas - dias) + "</strong> días vencidos, <strong>" + Math.round(c.diasPendientes) + "</strong> días pendientes, <strong>" + Math.round(c.diasTrunca) + "</strong> días truncos."
      : tipo === "TRUNCA"
      ? "<strong>" + Math.round(c.totalVencidas) + "</strong> días vencidos, <strong>" + Math.round(c.diasPendientes) + "</strong> días pendientes, <strong>" + saldoRestante + "</strong> días truncos restantes."
      : "<strong>" + Math.round(c.totalVencidas) + "</strong> días vencidos, <strong>" + (Math.round(c.diasPendientes) - dias) + "</strong> días pendientes, <strong>" + Math.round(c.diasTrunca) + "</strong> días truncos.";

    // Línea de adelanto de remuneración vacacional (siempre primera)
    const lineaAdelanto = adelanto === true
      ? "<p>- El colaborador solicita el adelanto de su remuneracion vacacional.</p>"
      : "<p>- El colaborador no solicita el adelanto de su remuneracion vacacional.</p>";

    const partes = [
      "<!DOCTYPE html><html><head><meta charset='UTF-8'/>",
      "<title>Autorizacion - " + c.nombres + "</title>",
      "<style>" + css + "</style></head><body>",
      "<div class='header'><div>",
      "<div class='logo-text'>LA CALERA</div>",
      "<div class='logo-sub'>— 1 9 7 0 —</div>",
      "</div><div style='width:42px;height:42px;background:#1A5C2E;border-radius:7px;display:flex;align-items:center;justify-content:center'>",

  const descargarHTML = (html, nombre) => {
    const blob = new Blob([html], { type: "text/html;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = nombre;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
  };

  // Buscar el BP responsable de una gerencia en Firestore
  const buscarBPPorGerencia = async (gerencia) => {
    const fb = window._firebase;
    if (!fb?.db) return null;
    const { db, collection } = fb;
    const snap = await fb.getDocs(collection(db, "usuarios"));
    const bp = snap.docs
      .map(d => ({ id: d.id, ...d.data() }))
      .find(u => !u.admin && u.activo !== false && Array.isArray(u.g) && u.g.includes(gerencia));
    return bp || null;
  };

  // Crea la solicitud en Firestore en estado SIN_PDF.
  // Si es admin generando, busca el BP responsable del colaborador por gerencia.
  const migrarSolicitudAFirestore = async (c, fIni, fFin, dias, tipo, adelantoParam) => {
    try {
      let bpUsuarioFinal = bpUsuario;
      let bpNombreFinal = bpNombre;
      let bpGerenciaFinal = c.gerencia || (bpGerencias ? bpGerencias[0] : "") || "";

      // Si es admin generando, buscar el BP responsable de la gerencia del colaborador
      if (bpAdmin && c.gerencia) {
        const bp = await buscarBPPorGerencia(c.gerencia);
        if (bp) {
          bpUsuarioFinal = bp.u || bp.id;
          bpNombreFinal = bp.n || bp.u;
          bpGerenciaFinal = c.gerencia;
        }
      }

      const tipoPeriodoVal = tipo === "GOCE_VENCIDA" ? "VENCIDA" : tipo === "GOCE_TRUNCA" ? "TRUNCA" : tipo === "GOCE" ? "PENDIENTE" : null;
      await enviarSolicitud({
        colaboradorNombre: c.nombres,
        colaboradorCod: c.cod,
        colaboradorDni: c.doc || "",
        gerencia: c.gerencia,
        fechaInicio: fIni,
        fechaFin: fFin,
        dias,
        motivo: bpAdmin ? `Generada por GH (${tipo})` : "Generada desde Solicitud Vacac.",
        tipo: "GOCE",
        tipoPeriodo: tipoPeriodoVal,
        bpUsuario: bpUsuarioFinal,
        bpNombre: bpNombreFinal,
        bpGerencia: bpGerenciaFinal,
        colaboradorUnidadOrg: c.unidadOrg || "",
        creadoPorAdmin: bpAdmin === true,
        creadoPorNombre: bpNombre || (bpAdmin ? "Administrador" : ""),
        adelantoRemun: adelantoParam !== undefined ? adelantoParam : adelantoRemun,
      });
    } catch (e) {
      console.error("No se pudo migrar la solicitud a Solicitudes Online:", e);
    }
  };

  // ── Generador plantilla Excel ─────────────────────────────────────────────
  const generarPlantilla = () => {
    const wb = XLSX.utils.book_new();

    // Hoja principal con estilo
    const encPlantilla = ["Codigo", "DNI", "F. Inicio (DD/MM/AAAA)", "F. Fin (DD/MM/AAAA)", "Adelanto (SI/NO)"];
    const aoa = [
      encPlantilla,
      ["(Ej: 00124)", "(Ej: 74521836)", "(Ej: 01/06/2026)", "(Ej: 15/06/2026)", "(SI o NO)"],
      ["00124", "74521836", "01/06/2026", "15/06/2026", "SI"],
      ["00215", "61234789", "10/06/2026", "25/06/2026", "NO"],
    ];
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws["!cols"] = [{ wch: 14 }, { wch: 16 }, { wch: 26 }, { wch: 26 }, { wch: 18 }];
    ws["!rows"] = [{ hpt: 28 }, { hpt: 18 }, { hpt: 20 }, { hpt: 20 }];

    // Estilos encabezado
    encPlantilla.forEach((_, c) => {
      const addr = XLSX.utils.encode_cell({ r: 0, c });
      ws[addr].s = {
        fill: { fgColor: { rgb: "1A5C2E" } },
        font: { bold: true, color: { rgb: "FFFFFF" }, sz: 11, name: "Calibri" },
        alignment: { horizontal: "center", vertical: "center" },
      };
    });
    // Fila de instrucciones (gris)
    encPlantilla.forEach((_, c) => {
      const addr = XLSX.utils.encode_cell({ r: 1, c });
      if (ws[addr]) ws[addr].s = {
        fill: { fgColor: { rgb: "F3F4F6" } },
        font: { italic: true, color: { rgb: "6B7280" }, sz: 10, name: "Calibri" },
        alignment: { horizontal: "center" },
      };
    });
    // Filas de ejemplo (verde muy suave)
    [2, 3].forEach((r) => {
      encPlantilla.forEach((_, c) => {
        const addr = XLSX.utils.encode_cell({ r, c });
        if (ws[addr]) ws[addr].s = {
          fill: { fgColor: { rgb: "F0FDF4" } },
          font: { color: { rgb: "6B7280" }, sz: 11, name: "Calibri" },
          alignment: { horizontal: "center" },
          border: { bottom: { style: "thin", color: { rgb: "E5E7EB" } } },
        };
      });
    });

    XLSX.utils.book_append_sheet(wb, ws, "Solicitudes");

    // Hoja instrucciones con estilo
    const inst = [
      ["INSTRUCCIONES DE USO", "", ""],
      ["", "", ""],
      ["Campo", "Descripcion", "Ejemplo"],
      ["Codigo", "Codigo de empleado (tal como aparece en el sistema)", "00124"],
      ["DNI", "Documento de identidad del colaborador", "74521836"],
      ["F. Inicio", "Fecha de inicio de vacaciones en formato DD/MM/AAAA", "01/06/2026"],
      ["F. Fin", "Fecha de fin de vacaciones en formato DD/MM/AAAA", "15/06/2026"],
      ["", "", ""],
      ["NOTAS IMPORTANTES:", "", ""],
      ["- Solo se pueden solicitar dias PENDIENTES (no vencidos ni truncos)", "", ""],
      ["- Minimo 7 dias (o todos los disponibles si son menos de 7)", "", ""],
      ["- El sistema valida cada fila antes de generar los PDFs", "", ""],
      ["- Las filas con errores se muestran en rojo antes de confirmar", "", ""],
    ];
    const ws2 = XLSX.utils.aoa_to_sheet(inst);
    ws2["!cols"] = [{ wch: 18 }, { wch: 55 }, { wch: 16 }];
    ws2["!rows"] = [{ hpt: 28 }, { hpt: 10 }, { hpt: 24 }, ...inst.slice(3).map(() => ({ hpt: 20 }))];

    // Estilo título
    const tAddr = XLSX.utils.encode_cell({ r: 0, c: 0 });
    ws2[tAddr].s = { font: { bold: true, sz: 14, color: { rgb: "1A5C2E" }, name: "Calibri" } };

    // Estilo encabezados tabla instrucciones
    ["Campo","Descripcion","Ejemplo"].forEach((_, c) => {
      const addr = XLSX.utils.encode_cell({ r: 2, c });
      if (ws2[addr]) ws2[addr].s = {
        fill: { fgColor: { rgb: "1A5C2E" } },
        font: { bold: true, color: { rgb: "FFFFFF" }, sz: 11, name: "Calibri" },
        alignment: { horizontal: "center", vertical: "center" },
      };
    });
    // Filas de datos instrucciones
    [3,4,5,6].forEach((r) => {
      [0,1,2].forEach((c) => {
        const addr = XLSX.utils.encode_cell({ r, c });
        if (ws2[addr]) ws2[addr].s = {
          font: { sz: 11, name: "Calibri", color: { rgb: "111827" } },
          border: { bottom: { style: "thin", color: { rgb: "E5E7EB" } } },
        };
      });
    });
    // Notas en naranja suave
    [8,9,10,11,12].forEach((r) => {
      const addr = XLSX.utils.encode_cell({ r, c: 0 });
      if (ws2[addr] && ws2[addr].v) ws2[addr].s = {
        font: { sz: 11, name: "Calibri", color: { rgb: "92400E" }, bold: r === 8 },
      };
    });

    XLSX.utils.book_append_sheet(wb, ws2, "Instrucciones");
    XLSX.writeFile(wb, "Plantilla_Solicitudes_Vacaciones.xlsx");
  };

  // ── Carga Excel masivo ────────────────────────────────────────────────────
  const cargarExcelMasivo = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const wb = XLSX.read(ev.target.result, { type: "array" });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });
      const filas = rows.slice(1).filter((r) => r[0] || r[1]);
      const parseDMY = (s) => {
        if (s === null || s === undefined || s === "") return null;
        // Objeto Date nativo (XLSX con cellDates)
        if (s instanceof Date) return isNaN(s.getTime()) ? null : new Date(s.getFullYear(), s.getMonth(), s.getDate(), 12, 0, 0);
        // Número serial de Excel (días desde 30/12/1899)
        if (typeof s === "number" || (/^\d+(\.\d+)?$/.test(String(s).trim()) && Number(s) > 1000)) {
          const serial = Number(s);
          const d = new Date(Date.UTC(1899, 11, 30) + Math.floor(serial) * 86400000);
          if (isNaN(d.getTime())) return null;
          return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), 12, 0, 0);
        }
        // Texto DD/MM/AAAA o DD-MM-AAAA
        const p = String(s).trim().split(/[\/\-\.]/);
        if (p.length !== 3) return null;
        let dd = p[0], mm = p[1], yy = p[2];
        if (yy.length === 4 && dd.length <= 2) {
          const d = new Date(yy + "-" + String(mm).padStart(2,"0") + "-" + String(dd).padStart(2,"0") + "T12:00:00");
          return isNaN(d.getTime()) ? null : d;
        }
        // Formato AAAA-MM-DD
        if (dd.length === 4) {
          const d = new Date(dd + "-" + String(mm).padStart(2,"0") + "-" + String(yy).padStart(2,"0") + "T12:00:00");
          return isNaN(d.getTime()) ? null : d;
        }
        return null;
      };
      const parseAdelanto = (v) => {
        const s = String(v || "").trim().toUpperCase();
        if (!s) return null;
        if (["SI", "SÍ", "S", "X", "1", "TRUE", "VERDADERO"].includes(s)) return true;
        if (["NO", "N", "0", "FALSE", "FALSO"].includes(s)) return false;
        return null;
      };
      const validadas = filas.map((r, idx) => {
        const cod = String(r[0] || "").trim();
        const dni = String(r[1] || "").trim();
        const ini = parseDMY(r[2]);
        const fin = parseDMY(r[3]);
        const fIniStr = ini ? fmtDate(dateOnly(ini)) : String(r[2] || "").trim();
        const fFinStr = fin ? fmtDate(dateOnly(fin)) : String(r[3] || "").trim();
        const adelantoFila = parseAdelanto(r[4]);
        const colab = colaboradores.find((c) => c.cod === cod || c.doc === dni);
        let estado = "OK", motivo = "", pend = null, diasSol = 0, esAnticipada = false;
        if (!colab) { estado = "ERROR"; motivo = "Colaborador no encontrado"; }
        else {
          pend = colab.periodos.find((p) => p.tipo === "PENDIENTE" && p.saldo > 0);
          // Lógica anticipada: si no tiene pendiente pero tiene trunca y fecha futura
          if (!pend) {
            const truncaP = colab.periodos.find((p) => p.tipo === "TRUNCA" && p.saldo > 0);
            if (truncaP && ini) {
              const finAnio = dateOnly(new Date(addYears(truncaP.inicio, 1).getTime() - 86400000));
              const inicioProx = dateOnly(new Date(finAnio.getTime() + 86400000));
              if (dateOnly(ini) >= inicioProx) {
                // Proyectar saldo a la fecha de inicio exacta
                const diasT = daysBetween(truncaP.inicio, dateOnly(ini));
                const mesesC = Math.floor(diasT / 30);
                const diasE = diasT % 30;
                const saldoProy = Math.round(((mesesC * 30 + diasE) / 360) * 30 * 100) / 100;
                const finProx = dateOnly(new Date(addYears(inicioProx, 1).getTime() - 86400000));
                pend = { inicio: inicioProx, fin: finProx, fechaVencimiento: dateOnly(addYears(finProx, 1)), saldo: saldoProy, tipo: "PENDIENTE", esAnticipada: true };
                esAnticipada = true;
              }
            }
          }
          if (!pend) { estado = "ERROR"; motivo = "Sin días pendientes disponibles"; }
          else if (!ini) { estado = "ERROR"; motivo = "Fecha inicio invalida (DD/MM/AAAA)"; }
          else if (!fin) { estado = "ERROR"; motivo = "Fecha fin invalida (DD/MM/AAAA)"; }
          else if (fin < ini) { estado = "ERROR"; motivo = "Fin anterior a inicio"; }
          else {
            diasSol = daysBetween(ini, fin) + 1;
            const minReq = pend.saldo >= 7 ? 7 : Math.ceil(pend.saldo);
            if (diasSol > pend.saldo) { estado = "ALERTA"; motivo = "Excede saldo (" + diasSol + "d solicitados, " + pend.saldo + "d disponibles)"; }
            else if (diasSol < minReq) { estado = "ALERTA"; motivo = "Minimo requerido: " + minReq + " dias"; }
            else if (esAnticipada) { motivo = "Solicitud anticipada desde " + fmtDate(pend.inicio); }
            // Anti-cruce: no puede solapar con goces registrados ni con solicitudes activas
            if (estado !== "ERROR") {
              const _cr = buscarCruceFechas(colab, ini.toISOString().slice(0,10), fin.toISOString().slice(0,10));
              if (_cr) { estado = "ERROR"; motivo = _cr; }
            }
          }
        }
        return { idx: idx+2, cod, dni, colab, pend, ini, fin, fIniStr, fFinStr, diasSol, estado, motivo, esAnticipada, adelantoFila };
      });
      setFilasMasivo(validadas);
      setExitoMasivo(false);
    };
    reader.readAsArrayBuffer(file);
    e.target.value = "";
  };

  const generarMasivo = (soloOK) => {
    const _filasChk = (soloOK ? filasMasivo.filter((f) => f.estado === "OK") : filasMasivo.filter((f) => f.estado !== "ERROR"));
    if (adelantoRemun === null && _filasChk.some(f => f.adelantoFila === null || f.adelantoFila === undefined)) {
      alert("Hay filas sin la columna 'Adelanto' llena en el Excel.\n\nIndica el valor por defecto arriba (Sí / No) o completa la columna en el archivo.");
      return;
    }
    const filas = (soloOK ? filasMasivo.filter((f) => f.estado === "OK") : filasMasivo.filter((f) => f.estado !== "ERROR"));
    if (!filas.length) return;
    setProcesandoMasivo(true);
    setTimeout(async () => {
      filas.forEach((f) => {
        const fIni = f.ini.getFullYear() + "-" + String(f.ini.getMonth()+1).padStart(2,"0") + "-" + String(f.ini.getDate()).padStart(2,"0");
        const fFin = f.fin.getFullYear() + "-" + String(f.fin.getMonth()+1).padStart(2,"0") + "-" + String(f.fin.getDate()).padStart(2,"0");
        descargarHTML(buildHTML(f.colab, f.pend, f.diasSol, fIni, fFin, "PENDIENTE", (f.adelantoFila !== null && f.adelantoFila !== undefined) ? f.adelantoFila : adelantoRemun, bpAdmin ? tipoPDF : "SIMPLE"), "Autorizacion_" + f.colab.nombres.replace(/ /g,"_") + ".html");
      });
      // Migrar cada solicitud a Firestore (Solicitudes Online), en paralelo, sin bloquear las descargas
      try {
        await Promise.all(filas.map((f) => {
          const fIni = f.ini.getFullYear() + "-" + String(f.ini.getMonth()+1).padStart(2,"0") + "-" + String(f.ini.getDate()).padStart(2,"0");
          const fFin = f.fin.getFullYear() + "-" + String(f.fin.getMonth()+1).padStart(2,"0") + "-" + String(f.fin.getDate()).padStart(2,"0");
          return migrarSolicitudAFirestore(f.colab, fIni, fFin, f.diasSol, "GOCE", (f.adelantoFila !== null && f.adelantoFila !== undefined) ? f.adelantoFila : adelantoRemun);
        }));
      } catch (e) {
        console.error("Error migrando solicitudes masivas a Solicitudes Online:", e);
      }
      setProcesandoMasivo(false);
      setExitoMasivo(true);
      setTimeout(() => setExitoMasivo(false), 5000);
    }, 100);
  };

  const EC = { OK: COLORS.positivo, ALERTA: COLORS.pendiente, ERROR: COLORS.vencida };
  const EI = { OK: "OK", ALERTA: "ALERTA", ERROR: "ERROR" };

  const generarPDF = () => {
    const err = validar();
    if (err) { setError(err); return; }
    setError("");
    const c = colabSeleccionado;
    const tipo = tipoSeleccionado || "PENDIENTE";
    const html = buildHTML(c, periodoEfectivo, diasSolicitados, fechaInicio, fechaFin, tipo, adelantoRemun, bpAdmin ? tipoPDF : "SIMPLE");
    descargarHTML(html, "Autorizacion_Vacaciones_" + c.nombres.replace(/ /g,"_") + ".html");
    migrarSolicitudAFirestore(c, fechaInicio, fechaFin, diasSolicitados, tipo === "VENCIDA" ? "GOCE_VENCIDA" : tipo === "TRUNCA" ? "GOCE_TRUNCA" : "GOCE");
    setExito(true);
    setTimeout(() => setExito(false), 4000);
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 20, maxWidth: 780 }}>
      <div>
        <div style={{ fontSize: 20, fontWeight: 600, color: COLORS.texto }}>Solicitud de Vacaciones</div>
        <div style={{ fontSize: 13, color: COLORS.textoMuted, marginTop: 2 }}>Genera autorizaciones individuales o masivas desde Excel</div>
      </div>

      {/* Tabs */}
      <div style={{ display: "flex", background: COLORS.bg, borderRadius: 10, border: `0.5px solid ${COLORS.border}`, padding: 4, width: "fit-content" }}>
        {[["individual","📄 Individual"],["masivo","📋 Masivo desde Excel"],["convenio","📝 Convenio"],["compra","🛒 Compra"]].map(([id, label]) => (
          <button key={id} onClick={() => setModo(id)} style={{
            background: modo === id ? COLORS.surface : "transparent",
            border: modo === id ? `0.5px solid ${COLORS.border}` : "none",
            borderRadius: 8, padding: "7px 18px", fontSize: 12.5,
            fontWeight: modo === id ? 500 : 400,
            color: modo === id ? COLORS.texto : COLORS.textoMuted,
            cursor: "pointer", boxShadow: modo === id ? "0 1px 3px rgba(0,0,0,0.06)" : "none",
          }}>{label}</button>
        ))}
      </div>

      {/* Aviso — solo en Individual y Masivo, solo para BPs */}
      {!bpAdmin && (modo === "individual" || modo === "masivo") && (
        <div style={{ padding: "12px 16px", background: "rgba(26,92,46,0.06)", border: `0.5px solid ${COLORS.accent}33`, borderRadius: 10, display: "flex", gap: 10, alignItems: "flex-start" }}>
          <div style={{ fontSize: 18, flexShrink: 0 }}>💬</div>
          <div style={{ fontSize: 12, color: COLORS.textoSecundario, lineHeight: 1.6 }}>
            El mínimo a solicitar es <strong style={{ color: COLORS.accent }}>7 días</strong>. Si el saldo disponible es menor a 7 días, se permite solicitar el total disponible. Para consultas comunícate con <strong style={{ color: COLORS.texto }}>Gestión Humana</strong>.
          </div>
        </div>
      )}

      {/* ── INDIVIDUAL ── */}
      {modo === "individual" && (
        <>
          <div style={{ background: COLORS.surface, borderRadius: 12, border: `0.5px solid ${COLORS.border}`, padding: 24 }}>
            <div style={{ fontSize: 13, fontWeight: 600, color: COLORS.texto, marginBottom: 12 }}>1. Selecciona el colaborador</div>
            <div style={{ position: "relative" }}>
              <input placeholder="🔍 Buscar por nombre, código o DNI..."
                value={colabSeleccionado ? colabSeleccionado.nombres : busqueda}
                onChange={(e) => { setBusqueda(e.target.value); setColabSeleccionado(null); setExito(false); setError(""); }}
                style={inputStyle} />
              {sugerencias.length > 0 && !colabSeleccionado && (
                <div style={{ position: "absolute", top: "100%", left: 0, right: 0, background: COLORS.surface, border: `0.5px solid ${COLORS.border}`, borderRadius: 10, zIndex: 10, boxShadow: "0 4px 20px rgba(0,0,0,0.1)", marginTop: 4, overflow: "hidden" }}>
                  {sugerencias.map((c) => (
                    <div key={c.cod} onClick={() => { setColabSeleccionado(c); setBusqueda(""); setFechaInicio(""); setFechaFin(""); setError(""); setTipoSeleccionado("PENDIENTE"); setPeriodoVencidoSeleccionado(null); }}
                      style={{ padding: "10px 14px", cursor: "pointer", borderBottom: `0.5px solid ${COLORS.border}`, display: "flex", justifyContent: "space-between", alignItems: "center" }}
                      onMouseEnter={(e) => e.currentTarget.style.background = COLORS.surfaceHigh}
                      onMouseLeave={(e) => e.currentTarget.style.background = "transparent"}>
                      <div>
                        <div style={{ fontSize: 13, fontWeight: 500, color: COLORS.texto }}>{c.nombres}</div>
                        <div style={{ fontSize: 11, color: COLORS.textoMuted }}>{c.gerencia} · DNI: {c.doc}</div>
                      </div>
                      <div style={{ fontSize: 11, color: COLORS.textoSecundario }}>Cód: {c.cod}</div>
                    </div>
                  ))}
                </div>
              )}
            </div>
            {colabSeleccionado && (
              <div style={{ marginTop: 14, padding: "14px 16px", background: COLORS.bg, borderRadius: 10, border: `0.5px solid ${COLORS.border}` }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                  <div>
                    <div style={{ fontSize: 14, fontWeight: 600, color: COLORS.texto }}>{colabSeleccionado.nombres}</div>
                    <div style={{ fontSize: 12, color: COLORS.textoMuted, marginTop: 2 }}>{colabSeleccionado.gerencia} · {colabSeleccionado.unidadOrg}</div>
                    <div style={{ fontSize: 12, color: COLORS.textoMuted }}>DNI: {colabSeleccionado.doc} · Cód: {colabSeleccionado.cod}</div>
                  </div>
                  <button onClick={() => { setColabSeleccionado(null); setBusqueda(""); setError(""); }}
                    style={{ background: "transparent", border: `0.5px solid ${COLORS.border}`, color: COLORS.textoMuted, borderRadius: 6, padding: "3px 10px", cursor: "pointer", fontSize: 12 }}>Cambiar</button>
                </div>
                <div style={{ display: "flex", gap: 10, marginTop: 12, flexWrap: "wrap" }}>
                  {[
                    { label: "Vencidas", value: colabSeleccionado.totalVencidas || 0, color: COLORS.vencida, tipo: "VENCIDA" },
                    { label: "Pendientes", value: colabSeleccionado.diasPendientes, color: COLORS.accent, tipo: "PENDIENTE", disponible: colabSeleccionado.diasPendientes > 0 },
                    { label: "Truncas", value: colabSeleccionado.diasTrunca, color: COLORS.trunca, tipo: "TRUNCA" },
                  ].map(({ label, value, color, tipo, disponible }) => {
                    const clickable = value > 0;
                    const selected = tipoSeleccionado === tipo;
                    return (
                      <div key={label}
                        onClick={() => {
                          if (!clickable) return;
                          if (selected) { setTipoSeleccionado(null); setPeriodoVencidoSeleccionado(null); setFechaInicio(""); setFechaFin(""); return; }
                          setTipoSeleccionado(tipo);
                          setPeriodoVencidoSeleccionado(null);
                          setFechaInicio(""); setFechaFin(""); setError("");
                        }}
                        style={{
                          padding: "8px 14px", background: selected ? color + "22" : color + "11",
                          border: selected ? `2px solid ${color}` : `0.5px solid ${color}44`,
                          borderRadius: 8, textAlign: "center",
                          cursor: clickable ? "pointer" : "default",
                          opacity: !clickable ? 0.5 : 1,
                          transition: "all 0.15s",
                        }}>
                        <div style={{ fontSize: 10, color: COLORS.textoMuted, marginBottom: 2 }}>{label}</div>
                        <div style={{ fontSize: 16, fontWeight: 600, color }}>{Math.round(value * 100) / 100}</div>
                        {disponible && <div style={{ fontSize: 9, color: COLORS.positivo }}>✓ Disponibles</div>}
                        {clickable && !selected && <div style={{ fontSize: 9, color }}>↓ Seleccionar</div>}
                        {selected && <div style={{ fontSize: 9, color, fontWeight: 700 }}>✓ Seleccionado</div>}
                      </div>
                    );
                  })}
                </div>

                {/* Lista de períodos vencidos (solo admin, solo cuando se selecciona VENCIDA) */}
                {(tipoSeleccionado === "VENCIDA" || tipoSeleccionado === "TRUNCA") && colabSeleccionado && colabSeleccionado.diasPendientes > 0 && (
                  <div style={{ marginTop: 8, padding: "10px 14px", background: "rgba(217,119,6,0.08)", border: "1px solid rgba(217,119,6,0.3)", borderRadius: 8, fontSize: 12, color: "#92400E" }}>
                    ⚠ Este colaborador tiene <strong>{Math.round(colabSeleccionado.diasPendientes * 100) / 100} días pendientes</strong> sin gestionar. ¿Deseas continuar con {tipoSeleccionado === "VENCIDA" ? "vencidas" : "truncas"}?
                  </div>
                )}
                {tipoSeleccionado === "VENCIDA" && (
                  <div style={{ marginTop: 12 }}>
                    <div style={{ fontSize: 12, fontWeight: 600, color: COLORS.vencida, marginBottom: 8 }}>Selecciona el período vencido:</div>
                    <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                      {periodosVencidos.length === 0 ? (
                        <div style={{ fontSize: 12, color: COLORS.textoMuted }}>No hay períodos vencidos con días disponibles.</div>
                      ) : periodosVencidos.map((p, i) => (
                        <div key={i}
                          onClick={() => { setPeriodoVencidoSeleccionado(p); setFechaInicio(""); setFechaFin(""); setError(""); }}
                          style={{
                            padding: "10px 14px", borderRadius: 8, cursor: "pointer",
                            background: periodoVencidoSeleccionado === p ? "rgba(220,38,38,0.1)" : COLORS.bg,
                            border: periodoVencidoSeleccionado === p ? "1.5px solid #DC2626" : `0.5px solid ${COLORS.border}`,
                            display: "flex", justifyContent: "space-between", alignItems: "center",
                          }}>
                          <div>
                            <div style={{ fontSize: 12, fontWeight: 600, color: COLORS.texto }}>Año {p.anio} — {fmtDate(p.inicio)} al {fmtDate(p.fin)}</div>
                            <div style={{ fontSize: 11, color: COLORS.textoMuted, marginTop: 2 }}>Venció: {fmtDate(p.fechaVencimiento)}</div>
                          </div>
                          <div style={{ fontSize: 14, fontWeight: 700, color: COLORS.vencida }}>{p.tipo === "INDEMNIZACION" ? p.saldo : p.diasVencidosReales} días</div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
                {!pendiente && !trunca && <div style={{ marginTop: 10, padding: "8px 12px", background: "rgba(239,68,68,0.08)", borderRadius: 8, border: "0.5px solid #FCA5A5", fontSize: 12, color: COLORS.vencida }}>⚠ Sin días pendientes ni truncos disponibles.</div>}
                {!pendiente && trunca && (
                  <div style={{ marginTop: 10, padding: "10px 14px", background: "rgba(234,179,8,0.08)", borderRadius: 8, border: "0.5px solid #FCD34D", fontSize: 12, color: "#92400E" }}>
                    📅 Sin pendientes HOY — el <strong>{proximoPeriodo ? fmtDate(proximoPeriodo) : "—"}</strong> sus truncos pasan a pendientes.                    {fechaInicio && periodoEfectivo
                      ? <span> Al <strong>{fmtDate(new Date(fechaInicio + "T12:00:00"))}</strong> tendrá <strong>{periodoEfectivo.saldo} días</strong> disponibles.</span>
                      : <span> Elige una fecha de inicio desde ese día para programar vacaciones.</span>
                    }
                  </div>
                )}
                {pendiente && <div style={{ marginTop: 10, fontSize: 11, color: COLORS.textoMuted }}>Período: <strong style={{ color: COLORS.texto }}>{fmtDate(pendiente.inicio)} al {fmtDate(pendiente.fin)}</strong> · Vence: <strong style={{ color: COLORS.accent }}>{fmtDate(pendiente.fechaVencimiento)}</strong></div>}
              </div>
            )}
          </div>

          {colabSeleccionado && (
            (tipoSeleccionado === "PENDIENTE" && (pendiente || trunca)) ||
            (tipoSeleccionado === "TRUNCA" && trunca) ||
            (tipoSeleccionado === "VENCIDA" && periodoVencidoSeleccionado)
          ) && (
            <div style={{ background: COLORS.surface, borderRadius: 12, border: `0.5px solid ${COLORS.border}`, padding: 24 }}>
              {periodoEfectivo?.esAnticipada && (
                <div style={{ marginBottom: 16, padding: "10px 14px", background: "rgba(234,179,8,0.08)", border: "0.5px solid #FCD34D", borderRadius: 8, fontSize: 12, color: "#92400E" }}>
                  ⏰ <strong>Solicitud anticipada</strong> — Al <strong>{fmtDate(new Date(fechaInicio + "T12:00:00"))}</strong> tendrá <strong>{periodoEfectivo.saldo} días</strong> pendientes disponibles (proyectado desde sus truncos actuales).
                </div>
              )}
              <div style={{ fontSize: 13, fontWeight: 600, color: COLORS.texto, marginBottom: 16 }}>
                2. Fechas de vacaciones
                {periodoEfectivo && (
                  <span style={{ fontSize: 11, fontWeight: 400, color: COLORS.textoMuted, marginLeft: 8 }}>
                    {!bpAdmin && <span>Mínimo: <strong style={{ color: COLORS.accent }}>{periodoEfectivo.saldo >= 7 ? "7 días" : Math.ceil(periodoEfectivo.saldo) + " días"}</strong></span>}
                  </span>
                )}
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(200px, 1fr))", gap: 14 }}>
                <div>
                  <label style={{ fontSize: 12, color: COLORS.textoMuted, display: "block", marginBottom: 6 }}>Fecha de inicio</label>
                  <input type="date" value={fechaInicio}
                    min={proximoPeriodo && !pendiente ? proximoPeriodo.toISOString().split("T")[0] : undefined}
                    onChange={(e) => { setFechaInicio(e.target.value); setError(""); }}
                    style={{ ...inputStyle, colorScheme: "light" }} />
                </div>
                <div>
                  <label style={{ fontSize: 12, color: COLORS.textoMuted, display: "block", marginBottom: 6 }}>Fecha de fin</label>

                </div>
              </div>

                </div>
                <div style={{ display: "flex", gap: 10 }}>
                  {[{ v: true, l: "Sí" }, { v: false, l: "No" }].map(o => (
                    <div key={o.l}
                      onClick={() => { setAdelantoRemun(o.v); setError(""); }}
                      style={{
                        padding: "9px 22px", borderRadius: 8, cursor: "pointer",

                        border: adelantoRemun === o.v ? "2px solid " + COLORS.accent : "0.5px solid " + COLORS.border,
                        fontSize: 13, fontWeight: adelantoRemun === o.v ? 700 : 500,
                        color: adelantoRemun === o.v ? COLORS.accent : COLORS.textoMuted,
                      }}>{o.l}</div>
                  ))}
                </div>
              </div>

              {/* Tipo de PDF (solo admin) */}
              {bpAdmin && (
                <div style={{ marginTop: 16 }}>
                  <div style={{ fontSize: 12, fontWeight: 600, color: COLORS.texto, marginBottom: 8 }}>Tipo de documento</div>
                  <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
                    {[
                      { v: "COMPLETO", l: "Completo", d: "4 anotaciones" },
                      { v: "SIMPLE", l: "Simple", d: "solo adelanto" },
                    ].map(o => (
                      <div key={o.v}
                        onClick={() => setTipoPDF(o.v)}
                        style={{
                          padding: "9px 18px", borderRadius: 8, cursor: "pointer", textAlign: "center",
                          background: tipoPDF === o.v ? COLORS.accent + "22" : COLORS.bg,
                          border: tipoPDF === o.v ? "2px solid " + COLORS.accent : "0.5px solid " + COLORS.border,
                        }}>
                        <div style={{ fontSize: 13, fontWeight: tipoPDF === o.v ? 700 : 500, color: tipoPDF === o.v ? COLORS.accent : COLORS.textoMuted }}>{o.l}</div>
                        <div style={{ fontSize: 10, color: COLORS.textoMuted, marginTop: 2 }}>{o.d}</div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {fechaInicio && fechaFin && diasSolicitados > 0 && periodoEfectivo && (
                <div style={{ marginTop: 16, display: "flex", gap: 10, flexWrap: "wrap" }}>
                  {[
                    { label: "Días solicitados", value: diasSolicitados, color: COLORS.accent },
                    { label: "Saldo disponible", value: periodoEfectivo.saldo, color: COLORS.positivo },
                    { label: "Saldo restante", value: Math.round((periodoEfectivo.saldo - diasSolicitados) * 100) / 100, color: periodoEfectivo.saldo - diasSolicitados >= 0 ? COLORS.positivo : COLORS.vencida },
                    { label: "Fecha retorno", value: fechaRetorno ? fmtDate(fechaRetorno) : "—", color: COLORS.texto },
                  ].map(({ label, value, color }) => (
                    <div key={label} style={{ padding: "8px 14px", background: COLORS.bg, border: `0.5px solid ${COLORS.border}`, borderRadius: 8, textAlign: "center" }}>
                      <div style={{ fontSize: 10, color: COLORS.textoMuted, marginBottom: 2 }}>{label}</div>
                      <div style={{ fontSize: 15, fontWeight: 600, color }}>{value}</div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {error && <div style={{ padding: "12px 16px", background: "rgba(239,68,68,0.08)", border: "0.5px solid #FCA5A5", borderRadius: 10, color: COLORS.vencida, fontSize: 13 }}>⚠ {error}</div>}

            <button onClick={generarPDF} style={{ background: COLORS.accent, color: "white", border: "none", borderRadius: 10, padding: "13px", fontSize: 14, fontWeight: 600, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}>

            </button>
          )}
          {exito && (
            <div style={{ padding: "12px 16px", background: "rgba(22,163,74,0.1)", border: `1px solid ${COLORS.positivo}44`, borderRadius: 10, color: COLORS.positivo, fontSize: 13, fontWeight: 600, textAlign: "center" }}>
              ✅ Archivo descargado. Ábrelo en el navegador y usa <strong>Ctrl+P → Guardar como PDF</strong>
              <div style={{ fontWeight: 400, marginTop: 6, fontSize: 12 }}>
                La solicitud ya quedó registrada en <strong>🔥 Solicitudes Online</strong>. Una vez que la firmes, ve allá y adjunta el PDF firmado.
              </div>
            </div>
          )}
        </>
      )}
