        const q = query(collection(db, "solicitudes"), orderBy("fechaCreacion", "desc"));
        onSnapshot(q, snap => {
          setSolicitudesBadge(snap.docs.length);
        });
      }
    }, 500);
  }, [bpAdmin]);
  // Solicitudes APROBADAS de tipo GOCE → se inyectan al cálculo como goces virtuales
  const [solicitudesAprobadas, setSolicitudesAprobadas] = React.useState([]);
  useEffect(() => {
    if (!bpAdmin) return;
    const iv = setInterval(() => {
      if (window._firebase?.db) {
        clearInterval(iv);
        const { db, collection, onSnapshot, query, where } = window._firebase;
        try {
          const q = query(collection(db, "solicitudes"), where("estado", "==", "APROBADA"));
          onSnapshot(q, snap => {
            const arr = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            window.__solicitudesAprobadas = arr;
            setSolicitudesAprobadas(arr);
          }, err => console.warn("Solicitudes aprobadas:", err.message));
        } catch (e) { console.warn("Solicitudes aprobadas:", e.message); }
      }
    }, 500);
    return () => clearInterval(iv);
  }, [bpAdmin]);

  const [pagina, setPagina] = useState(bpAdmin ? "importacion" : "dashboard");
  const [colaboradoresLocal, setColaboradoresLocal] = useState([]);
  const [fechaCorteGlobalLocal, setFechaCorteGlobalLocal] = useState(null);
  const [rawData, setRawData] = useState(null);
  const [procesando, setProcesando] = useState(false);
  const [sidebarOpen, setSidebarOpen] = useState(true);
  const [sidebarMobileOpen, setSidebarMobileOpen] = useState(false);
  const isMobile = useIsMobile();
  const [recalculando, setRecalculando] = useState(false);
  const [filtroGerenciaAlertas, setFiltroGerenciaAlertas] = useState("Todas");
  const [tabAlertaInicial, setTabAlertaInicial] = useState("a1");
  const [tabAlertaTrigger, setTabAlertaTrigger] = useState(0);
  const [colabSolicitud, setColabSolicitud] = useState(null);
  const [publicando, setPublicando] = useState(false);
  const [publicadoOk, setPublicadoOk] = useState(false);
  const [progresoPublicacion, setProgresoPublicacion] = useState("");

  // BPs (no admin) reciben los datos publicados por el admin automáticamente vía Firestore.
  // Admins trabajan con su propia importación local (colaboradoresLocal) y deciden cuándo publicar.
  const datosPublicados = useDatosPublicados();

  const colaboradores = bpAdmin ? colaboradoresLocal : datosPublicados.colaboradores;
  const fechaCorteGlobal = bpAdmin ? fechaCorteGlobalLocal : datosPublicados.fechaCorteGlobal;

  const onDatosProcessados = useCallback((data, fecha) => {
    setColaboradoresLocal(data);
    setFechaCorteGlobalLocal(fecha);
    setProcesando(false);
    setPagina("dashboard");
  }, []);

  // Guardar datos crudos para recalcular sin reimportar
  const onRawData = useCallback((raw) => {
    setRawData(raw);
  }, []);

  // Recalcular todo con una nueva fecha de corte (solo vista local del admin, no afecta a BPs hasta publicar)
  const recalcularConFecha = useCallback(async (nuevaFecha) => {
    if (!rawData) return;
    setRecalculando(true);
    setFechaCorteGlobalLocal(nuevaFecha);
    await new Promise((r) => setTimeout(r, 30));
    const resultados = [];
    const CHUNK = 100;
    const _gocesVirt = construirGocesVirtuales(solicitudesAprobadas, rawData.gocesPorCod);
    const _gocesTot = fusionarGoces(rawData.gocesPorCod, _gocesVirt);
    for (let i = 0; i < rawData.empleados.length; i += CHUNK) {
      const chunk = rawData.empleados.slice(i, i + CHUNK);
      for (const emp of chunk) {
        const goces = _gocesTot[emp.cod] || [];
        const compras = rawData.comprasPorCod[emp.cod] || [];
        const ajuste = (rawData.ajustesPorCod || {})[emp.cod] || null;
        const incapacidades = (rawData.incapacidadesPorCod || {})[emp.cod] || [];
        const acuerdosR = (rawData.acuerdosPorCod || {})[emp.cod] || (rawData.acuerdosPorCod || {})[String(parseInt(emp.cod))] || [];
        const regimenR = (rawData.regimenPorCod || {})[emp.cod] || (rawData.regimenPorCod || {})[String(parseInt(emp.cod))] || [];
        const lsgR = (rawData.lsgPorCod || {})[emp.cod] || (rawData.lsgPorCod || {})[String(parseInt(emp.cod))] || [];
        const fechaCeseR = (rawData.cesadosPorCod || {})[emp.cod] || (rawData.cesadosPorCod || {})[String(parseInt(emp.cod))] || null;
        const feIngresoDateR = emp.feIngreso ? (typeof emp.feIngreso.toDate === "function" ? emp.feIngreso.toDate() : new Date(emp.feIngreso)) : null;
        const esReingresoR = fechaCeseR && feIngresoDateR && feIngresoDateR > fechaCeseR;
        const esCesadoRealR = fechaCeseR !== null && !esReingresoR && dateOnly(fechaCeseR) <= dateOnly(nuevaFecha);
        const fechaEfectivaR = esCesadoRealR ? fechaCeseR : nuevaFecha;
        resultados.push(procesarColaborador(emp, goces, fechaEfectivaR, compras, ajuste, incapacidades, acuerdosR, regimenR, lsgR, esCesadoRealR ? fechaCeseR : null));
      }
      await new Promise((r) => setTimeout(r, 0));
    }
    setColaboradoresLocal(resultados);
    setRecalculando(false);
  }, [rawData, solicitudesAprobadas]);

  // Al aprobar/desaprobar una solicitud, recalcular para reflejar el goce virtual
  const _firstAprobRef = React.useRef(true);
  useEffect(() => {
    if (_firstAprobRef.current) { _firstAprobRef.current = false; return; }
    if (!rawData || !fechaCorteGlobalLocal) return;
    recalcularConFecha(fechaCorteGlobalLocal);
  }, [solicitudesAprobadas]);

  // Publicar la base local (admin) a Firestore para que todos los BPs la reciban en tiempo real
  const publicarABPs = useCallback(async () => {
    if (!colaboradoresLocal.length || !fechaCorteGlobalLocal) return;
    setPublicando(true);
    setPublicadoOk(false);
    setProgresoPublicacion("Iniciando...");
    try {
      await publicarDatosBPs(colaboradoresLocal, fechaCorteGlobalLocal, bpNombre || "admin", (msg) => setProgresoPublicacion(msg));
      setPublicadoOk(true);
      setTimeout(() => setPublicadoOk(false), 5000);
    } catch (e) {
      console.error(e);
      alert("⚠️ No se pudo publicar:\n\n" + e.message + "\n\nIntenta de nuevo. Si el problema persiste, revisa tu conexión a internet.");
    }
    setPublicando(false);
    setProgresoPublicacion("");
  }, [colaboradoresLocal, fechaCorteGlobalLocal, bpNombre]);

  // Convertir fechaCorteGlobal a string YYYY-MM-DD para el input date
  const fechaInputValue = fechaCorteGlobal instanceof Date
    ? `${fechaCorteGlobal.getFullYear()}-${String(fechaCorteGlobal.getMonth()+1).padStart(2,"0")}-${String(fechaCorteGlobal.getDate()).padStart(2,"0")}`
    : "";

  const colaboradoresFiltradosBP = useMemo(() => {
    if (!bpGerencias || bpGerencias.length === 0 || bpAdmin) return colaboradores;
    return colaboradores.filter(c => {
      const ger = (c.gerencia || "").toUpperCase().trim();
      return bpGerencias.some(g => { const bg = g.toUpperCase().trim(); return ger === bg || ger.includes(bg) || bg.includes(ger); });
    });
  }, [colaboradores, bpGerencias, bpAdmin]);
  const tieneData = colaboradoresFiltradosBP.length > 0 || colaboradores.length > 0;

  return (

        @keyframes spin { to { transform: rotate(360deg); } }
        select option { background: #FFFFFF; color: #111827; }
        button:hover { opacity: 0.9; }
        .mobile-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; }

        }
        @media (min-width: 768px) {
          .sidebar-mobile-drawer { display: none !important; }
          .mobile-topbar { display: none !important; }
        }
      `}</style>

        background: "#1A5C2E", padding: "10px 16px",
        alignItems: "center", justifyContent: "space-between",
        height: 56, paddingTop: "max(10px, env(safe-area-inset-top))",
        borderBottom: "1px solid #14472A",
      }}>
        <button onClick={() => setSidebarMobileOpen(true)} style={{
          background: "transparent", border: "none", color: "#fff", cursor: "pointer",
          fontSize: 22, lineHeight: 1, padding: 0,
        }}>☰</button>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <svg viewBox="0 0 36 36" style={{ width: 28, height: 28 }}>
            <rect width="36" height="36" rx="6" fill="#12391F"/>
            <text x="10" y="28" fontFamily="Georgia, serif" fontSize="26" fontWeight="bold" fill="white">C</text>
          </svg>
          <span style={{ color: "#fff", fontWeight: 700, fontSize: 15, fontFamily: "Georgia, serif" }}>NidoGestor</span>
        </div>
        <div style={{ width: 32 }} />
      </div>

      {/* Mobile overlay */}
      <div className={`mobile-overlay${sidebarMobileOpen ? " open" : ""}`} onClick={() => setSidebarMobileOpen(false)} />

      {/* Sidebar desktop (siempre visible en escritorio) */}
      <div className="sidebar-desktop" style={{
        width: sidebarOpen ? 220 : 64, minWidth: sidebarOpen ? 220 : 64,
        background: "#1A5C2E", borderRight: `1px solid #14472A`,
        display: "flex", flexDirection: "column", transition: "width 0.25s, min-width 0.25s",
        overflow: "hidden", overflowY: "auto",
      }}>
        {/* Logo */}
        <div style={{
          padding: "16px 12px", borderBottom: `1px solid #14472A`,

          <div style={{ width: 36, height: 36, flexShrink: 0, borderRadius: 8, overflow: "hidden", background: "white", display: "flex", alignItems: "center", justifyContent: "center" }}>
            <svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg" style={{ width: 36, height: 36 }}>
              <rect width="36" height="36" rx="6" fill="#1A5C2E"/>
              <text x="10" y="28" fontFamily="Georgia, serif" fontSize="26" fontWeight="bold" fill="white">C</text>
              <g transform="translate(17, 3) scale(0.55)">

          {sidebarOpen && (
            <div style={{ overflow: "hidden" }}>
              <svg viewBox="0 0 160 22" xmlns="http://www.w3.org/2000/svg" style={{ width: 148, height: 18, display: "block" }}>
                <text x="0" y="16" fontFamily="Georgia, 'Times New Roman', serif" fontSize="15" fontWeight="bold" fill="white" letterSpacing="0.5">NidoGestor</text>
              </svg>
              <svg viewBox="0 0 160 18" xmlns="http://www.w3.org/2000/svg" style={{ width: 148, height: 15, display: "block" }}>
                <text x="0" y="13" fontFamily="Georgia, 'Times New Roman', serif" fontSize="13" fontStyle="italic" fill="rgba(255,255,255,0.9)">Vacacional</text>
              </svg>
              <div style={{ fontSize: 10, color: "rgba(255,255,255,0.55)", marginTop: 1, letterSpacing: "0.06em" }}>GH - La Calera</div>
            </div>
          )}
        </div>

        {/* Nav */}
        <nav style={{ flex: 1, padding: "12px 8px", display: "flex", flexDirection: "column", gap: 2 }}>
          {MENU_ITEMS.filter(item => !item.adminOnly || bpAdmin).map((item) => {
            const active = pagina === item.id;
            const disabled = !tieneData && item.id !== "importacion";
            return (
              <button key={item.id}
                onClick={() => !disabled && setPagina(item.id)}
                title={!sidebarOpen ? item.label : ""}
                style={{
                  display: "flex", alignItems: "center", gap: 12,
                  padding: "9px 12px", borderRadius: 8, border: "none",
                  background: active ? "rgba(255,255,255,0.12)" : "transparent",
                  color: active ? "white" : disabled ? "rgba(255,255,255,0.2)" : "rgba(255,255,255,0.6)",
                  cursor: disabled ? "not-allowed" : "pointer",
                  fontSize: 12.5, fontWeight: active ? 500 : 400,
                  borderLeft: active ? "3px solid rgba(255,255,255,0.7)" : "3px solid transparent",
                  width: "100%", textAlign: "left", transition: "all 0.15s",
                  whiteSpace: "nowrap", overflow: "hidden",
                }}>
                <span style={{ fontSize: 18, flexShrink: 0 }}>{item.icon}</span>
                {sidebarOpen && (
                  <span style={{ display: "flex", alignItems: "center", gap: 6, flex: 1 }}>
                    {item.label}
                    {item.badge && bpAdmin && solicitudesBadge > 0 && (
                      <span style={{ marginLeft: "auto", background: "#DC2626", color: "#fff", fontSize: 10, fontWeight: 700, borderRadius: 10, padding: "1px 7px", minWidth: 18, textAlign: "center" }}>{solicitudesBadge}</span>
                    )}
                  </span>
                )}
              </button>
            );
          })}
        </nav>

        {/* BP Session + Logout */}
        {sidebarOpen && bpGerencias && (
          <div style={{ padding: "12px 16px", borderTop: "1px solid rgba(255,255,255,0.1)" }}>
            <div style={{ fontSize: 10, color: "rgba(255,255,255,0.4)", fontWeight: 700, letterSpacing: 1, marginBottom: 6, textTransform: "uppercase" }}>{bpAdmin ? "👑 Administrador" : "Sesión activa"}</div>
            <div style={{ fontSize: 12, fontWeight: 600, color: "#fff", marginBottom: 4 }}>{bpNombre}</div>
            {!bpAdmin && bpGerencias && bpGerencias.length > 0 && (
              <div style={{ fontSize: 10, color: "rgba(255,255,255,0.5)", marginBottom: 10, lineHeight: 1.6 }}>
                {bpGerencias.map((g, i) => <div key={i}>· {g}</div>)}
              </div>
            )}
            {bpAdmin && <div style={{ fontSize: 10, color: "rgba(255,255,255,0.4)", marginBottom: 10 }}>· Todas las gerencias</div>}
            <button onClick={onLogout} style={{ width: "100%", padding: "7px 12px", background: "rgba(239,68,68,0.12)", border: "1px solid rgba(239,68,68,0.3)", color: "#FCA5A5", borderRadius: 8, fontSize: 11, fontWeight: 600, cursor: "pointer" }}>⎋ Cerrar sesión</button>
          </div>
        )}
        {/* Footer: fecha de corte. Admin ve selector + botón publicar (privado hasta publicar). BP ve solo info de la última publicación. */}
        {sidebarOpen && bpAdmin && tieneData && (
          <div style={{ padding: "12px 16px", borderTop: "1px solid #14472A" }}>
            <div style={{ fontSize: 11, color: "rgba(255,255,255,0.55)", marginBottom: 6 }}>
              Procesado (vista local) · Fecha de Corte
            </div>
            <input
              type="date"
              value={fechaInputValue}
              onChange={(e) => {
                if (!e.target.value) return;
                const nueva = dateOnly(new Date(e.target.value + "T00:00:00"));
                if (!isNaN(nueva.getTime())) recalcularConFecha(nueva);
              }}
              title="Cambiar fecha de corte y recalcular (solo vista local, los BPs no lo ven hasta publicar)"
              style={{
                width: "100%", background: "white",
                border: "0.5px solid rgba(255,255,255,0.25)",
                color: "#1A5C2E", borderRadius: 7,
                padding: "6px 10px", fontSize: 12, fontWeight: 600,
                outline: "none", cursor: "pointer", colorScheme: "light",
              }}
            />
            {recalculando && (
              <div style={{ fontSize: 11, color: "rgba(255,255,255,0.55)", marginTop: 4, textAlign: "center" }}>
                ⟳ Recalculando...
              </div>
            )}
            <div style={{ fontSize: 11, color: "rgba(255,255,255,0.5)", marginTop: 4, marginBottom: 10 }}>
              {colaboradoresLocal.length.toLocaleString()} colaboradores (sin publicar a BPs)
            </div>
            <button
              onClick={publicarABPs}
              disabled={publicando}
              title="Sube esta versión a Firestore. Todos los BPs la verán al instante."
              style={{
                width: "100%", padding: "8px 12px",
                background: publicadoOk ? "rgba(34,197,94,0.25)" : "#fff",
                border: "1px solid rgba(255,255,255,0.25)",
                color: publicadoOk ? "#86EFAC" : "#1A5C2E",
                borderRadius: 7, fontSize: 12, fontWeight: 700,
                cursor: publicando ? "wait" : "pointer",
              }}
            >
              {publicando ? `⏳ ${progresoPublicacion || "Publicando..."}` : publicadoOk ? "✅ Publicado a BPs" : "📡 Publicar a BPs"}
            </button>
            {datosPublicados.meta && (
              <div style={{ fontSize: 10, color: "rgba(255,255,255,0.45)", marginTop: 6, lineHeight: 1.5 }}>
                BPs ven: {datosPublicados.meta.totalColaboradores?.toLocaleString()} colab. ·
                {" "}corte {fmtDate(new Date(datosPublicados.meta.fechaCorteGlobal))} ·
                {" "}publicado {new Date(datosPublicados.meta.publicadoEn).toLocaleString("es-PE")}
              </div>
            )}
          </div>
        )}
        {sidebarOpen && !bpAdmin && (
          <div style={{ padding: "12px 16px", borderTop: "1px solid #14472A" }}>
            <div style={{ fontSize: 11, color: "rgba(255,255,255,0.55)", marginBottom: 4 }}>
              Datos actualizados por GH
            </div>
            {datosPublicados.cargando && colaboradores.length === 0 ? (
              <div style={{ fontSize: 11, color: "rgba(255,255,255,0.5)" }}>⟳ Cargando datos...</div>
            ) : fechaCorteGlobal ? (
              <>
                <div style={{ fontSize: 12, fontWeight: 600, color: "#fff" }}>Corte: {fmtDate(fechaCorteGlobal)}</div>
                <div style={{ fontSize: 11, color: "rgba(255,255,255,0.5)", marginTop: 2 }}>
                  {colaboradoresFiltradosBP.length.toLocaleString()} colaboradores
                </div>
              </>
            ) : (
              <div style={{ fontSize: 11, color: "rgba(255,255,255,0.5)" }}>Aún sin datos publicados</div>
            )}
          </div>
        )}
      </div>

      {/* Sidebar móvil (drawer lateral, solo visible en celular) */}
      <div className="sidebar-mobile-drawer" style={{
        position: "fixed", top: 0, left: sidebarMobileOpen ? 0 : -260, bottom: 0,
        width: 250, background: "#1A5C2E", zIndex: 300,
        display: "flex", flexDirection: "column", overflowY: "auto",
        transition: "left 0.25s ease",
        borderRight: "1px solid #14472A",
      }}>
        <div style={{ padding: "14px 12px", borderBottom: "1px solid #14472A", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <svg viewBox="0 0 36 36" style={{ width: 32, height: 32 }}>
              <rect width="36" height="36" rx="6" fill="#12391F"/>
              <text x="10" y="28" fontFamily="Georgia, serif" fontSize="26" fontWeight="bold" fill="white">C</text>
            </svg>
            <div>
              <div style={{ color: "#fff", fontWeight: 700, fontSize: 14, fontFamily: "Georgia, serif" }}>NidoGestor</div>
              <div style={{ color: "rgba(255,255,255,0.7)", fontSize: 11, fontStyle: "italic" }}>Vacacional</div>
            </div>
          </div>
          <button onClick={() => setSidebarMobileOpen(false)} style={{ background: "transparent", border: "none", color: "rgba(255,255,255,0.7)", fontSize: 20, cursor: "pointer", padding: 4 }}>✕</button>
        </div>
        {/* Info sesión */}
        <div style={{ padding: "10px 14px", borderBottom: "1px solid #14472A" }}>
          <div style={{ fontSize: 10, color: "rgba(255,255,255,0.5)", textTransform: "uppercase", letterSpacing: "0.05em", marginBottom: 4 }}>Sesión activa</div>
          <div style={{ fontSize: 13, fontWeight: 700, color: "#fff" }}>{bpNombre}</div>
          {bpGerencias && bpGerencias.map((g, i) => <div key={i} style={{ fontSize: 11, color: "rgba(255,255,255,0.6)" }}>· {g}</div>)}
        </div>
        {/* Nav */}
        <nav style={{ flex: 1, padding: "10px 8px", display: "flex", flexDirection: "column", gap: 2 }}>
          {MENU_ITEMS.filter(item => !item.adminOnly || bpAdmin).map(item => {
            const active = pagina === item.id;
            const disabled = !tieneData && item.id !== "importacion";
            return (
              <button key={item.id} onClick={() => { if (!disabled) { setPagina(item.id); setSidebarMobileOpen(false); } }} style={{
                display: "flex", alignItems: "center", gap: 10,
                padding: "9px 12px", borderRadius: 8, border: "none", cursor: disabled ? "not-allowed" : "pointer",
                background: active ? "rgba(255,255,255,0.15)" : "transparent",
                color: disabled ? "rgba(255,255,255,0.3)" : active ? "#fff" : "rgba(255,255,255,0.75)",
                textAlign: "left", fontSize: 13, fontWeight: active ? 700 : 400,
              }}>
                <span style={{ fontSize: 16 }}>{item.icon}</span>
                <span>{item.label}</span>
                {item.badge && solicitudesBadge > 0 && <span style={{ marginLeft: "auto", background: "#EF4444", color: "#fff", borderRadius: 10, padding: "1px 7px", fontSize: 10, fontWeight: 700 }}>{solicitudesBadge}</span>}
              </button>
            );
          })}
        </nav>
        <div style={{ padding: "12px 14px", borderTop: "1px solid #14472A" }}>
          <button onClick={onLogout} style={{ width: "100%", background: "rgba(239,68,68,0.15)", border: "1px solid rgba(239,68,68,0.3)", color: "#FCA5A5", borderRadius: 8, padding: "8px", fontSize: 12, cursor: "pointer", fontWeight: 600 }}>

          <PaginaImportacion

        )}
        {pagina === "dashboard" && tieneData && (
          <PaginaDashboard colaboradores={colaboradoresFiltradosBP} fechaCorteGlobal={fechaCorteGlobal} setPagina={setPagina} setFiltroGerenciaAlertas={setFiltroGerenciaAlertas} />
        )}
        {pagina === "colaboradores" && tieneData && <PaginaColaboradores colaboradores={colaboradoresFiltradosBP} setPagina={setPagina} setColabSolicitud={setColabSolicitud} bpAdmin={bpAdmin} />}
        {pagina === "alertas" && tieneData && (
          <PaginaAlertas colaboradores={colaboradoresFiltradosBP} fechaCorteGlobal={fechaCorteGlobal} filtroGerenciaExterno={filtroGerenciaAlertas} setFiltroGerenciaExterno={setFiltroGerenciaAlertas} onGenerarSolicitud={(c) => { setColabSolicitud(c); setPagina("solicitud"); }} tabInicialExterno={tabAlertaInicial} tabTrigger={tabAlertaTrigger} onTabUsado={() => setTabAlertaInicial("a1")} />
        )}
        {pagina === "historial" && tieneData && (
          <PaginaHistorial colaboradores={colaboradoresFiltradosBP} fechaCorteGlobal={fechaCorteGlobal} />
        )}
        {pagina === "incapacidades" && tieneData && (
          <PaginaIncapacidades colaboradores={colaboradoresFiltradosBP} />
        )}
        {pagina === "convenios" && tieneData && (
          <PaginaConvenios colaboradores={colaboradoresFiltradosBP} rawData={rawData} bpAdmin={bpAdmin} />
        )}
        {pagina === "goces" && tieneData && (
          <PaginaGoces colaboradores={colaboradoresFiltradosBP} bpAdmin={bpAdmin} />
        )}
        {pagina === "compras" && tieneData && (
          <PaginaCompras colaboradores={colaboradoresFiltradosBP} bpAdmin={bpAdmin} />
        )}
        {pagina === "solicitud" && tieneData && (
          <PaginaSolicitud
            colaboradores={colaboradoresFiltradosBP}
            fechaCorteGlobal={fechaCorteGlobal}
            colabPreseleccionado={colabSolicitud}
            onColabUsado={() => setColabSolicitud(null)}
            bpUsuario={bpGerencias ? (bpNombre || "").toLowerCase().replace(/ /g,"") : "admin"}
            bpNombre={bpNombre}
            bpGerencias={bpGerencias}
            bpAdmin={bpAdmin}
          />
        )}
        {pagina === "ficha" && tieneData && (
          <PaginaFicha colaboradores={colaboradoresFiltradosBP} fechaCorteGlobal={fechaCorteGlobal} todosColaboradores={colaboradores} />
        )}

        {!tieneData && pagina !== "importacion" && (
          <div style={{ textAlign: "center", padding: 80, color: COLORS.textoMuted }}>
            <div style={{ fontSize: 48, marginBottom: 16 }}>{bpAdmin ? "📂" : "⏳"}</div>
            <div style={{ fontSize: 18, fontWeight: 600, color: COLORS.textoSecundario }}>
              {bpAdmin ? "Sin datos cargados" : "Aún no hay datos publicados"}
            </div>
            <div style={{ fontSize: 14, marginTop: 8 }}>
              {bpAdmin ? "Ve a Importación para cargar los archivos Excel" : "Gestión Humana está actualizando la información. Vuelve a intentarlo en unos minutos."}
            </div>
            {bpAdmin && (
              <button onClick={() => setPagina("importacion")} style={{
                marginTop: 20, background: COLORS.accent, color: "#fff",
                border: "none", borderRadius: 10, padding: "10px 24px",
                cursor: "pointer", fontSize: 14, fontWeight: 600,
              }}>Ir a Importación</button>
            )}
          </div>
        )}

        {pagina === "control" && tieneData && <PaginaControlVacacional colaboradores={colaboradoresFiltradosBP} fechaCorteGlobal={fechaCorteGlobal} bpAdmin={bpAdmin} />}
        {pagina === "registros-mes" && tieneData && <PaginaRegistrosMes gocesPorCod={rawData ? rawData.gocesPorCod : null} colaboradores={colaboradores} fechaCorteGlobal={fechaCorteGlobal} bpAdmin={bpAdmin} bpGerencias={bpGerencias} />}
        {pagina === "lsg" && tieneData && <PaginaLSG colaboradores={colaboradores} bpAdmin={bpAdmin} bpGerencias={bpGerencias} />}
        {pagina === "cesados" && tieneData && <PaginaCesados colaboradores={colaboradores} fechaCorteGlobal={fechaCorteGlobal} />}
        {pagina === "usuarios-mgmt" && bpAdmin && <PanelGestionUsuarios />}
        {pagina === "solicitudes-fb" && (
          <PanelSolicitudesFirebase
            bpUsuario={bpGerencias ? (bpNombre || "").toLowerCase().replace(/ /g,"") : "admin"}
            bpNombre={bpNombre}
            bpAdmin={bpAdmin}
            bpGerencias={bpGerencias}
          />
        )}
        {procesando && <Spinner />}
      </main>
    </div>
  );
}


  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<AppWrapper />);
</script>
</body>
</html>
