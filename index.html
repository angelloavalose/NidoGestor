                {periodoEfectivo && (
                  <span style={{ fontSize: 11, fontWeight: 400, color: COLORS.textoMuted, marginLeft: 8 }}>
                    Mínimo: <strong style={{ color: COLORS.accent }}>{periodoEfectivo.saldo >= 7 ? "7 días" : Math.ceil(periodoEfectivo.saldo) + " días"}</strong>
                  </span>
                )}
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
                <div>
                  <label style={{ fontSize: 12, color: COLORS.textoMuted, display: "block", marginBottom: 6 }}>Fecha de inicio</label>
                  <input type="date" value={fechaInicio}
                    min={proximoPeriodo && !pendiente ? proximoPeriodo.toISOString().split("T")[0] : undefined}
                    onChange={(e) => { setFechaInicio(e.target.value); setError(""); }}
                    style={{ ...inputStyle, colorScheme: "light" }} />
                </div>
                <div>
                  <label style={{ fontSize: 12, color: COLORS.textoMuted, display: "block", marginBottom: 6 }}>Fecha de fin</label>
                  <input type="date" value={fechaFin} onChange={(e) => { setFechaFin(e.target.value); setError(""); }} min={fechaInicio || undefined} style={{ ...inputStyle, colorScheme: "light" }} />
                </div>
              </div>
              {fechaInicio && fechaFin && diasSolicitados > 0 && periodoEfectivo && (
                <div style={{ marginTop: 16, display: "flex", gap: 10, flexWrap: "wrap" }}>
                  {[
                    { label: "Días solicitados", value: diasSolicitados, color: COLORS.accent },
                    { label: "Saldo disponible", value: periodoEfectivo.saldo, color: COLORS.positivo },
                    { label: "Saldo restante", value: Math.round((periodoEfectivo.saldo - diasSolicitados) * 100) / 100, color: periodoEfectivo.saldo - diasSolicitados >= 0 ? COLORS.positivo : COLORS.vencida },
                    { label: "Fecha retorno", value: fechaRetorno ? fmtDate(fechaRetorno) : "—", color: COLORS.texto },
                  ].map(({ label, value, color }) => (
                    <div key={label} style={{ padding: "8px 14px", background: COLORS.bg, border: `0.5px solid ${COLORS.border}`, borderRadius: 8, textAlign: "center" }}>
                      <div style={{ fontSize: 10, color: COLORS.textoMuted, marginBottom: 2 }}>{label}</div>
                      <div style={{ fontSize: 15, fontWeight: 600, color }}>{value}</div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {error && <div style={{ padding: "12px 16px", background: "rgba(239,68,68,0.08)", border: "0.5px solid #FCA5A5", borderRadius: 10, color: COLORS.vencida, fontSize: 13 }}>⚠ {error}</div>}
          {colabSeleccionado && periodoEfectivo && (
            <button onClick={generarPDF} style={{ background: COLORS.accent, color: "white", border: "none", borderRadius: 10, padding: "13px", fontSize: 14, fontWeight: 600, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
              📄 Generar PDF — Autorización de Vacaciones {periodoEfectivo.esAnticipada ? "(Anticipada)" : ""}
            </button>
          )}
          {exito && (
            <div style={{ padding: "12px 16px", background: "rgba(22,163,74,0.1)", border: `1px solid ${COLORS.positivo}44`, borderRadius: 10, color: COLORS.positivo, fontSize: 13, fontWeight: 600, textAlign: "center" }}>
              ✅ Archivo descargado. Ábrelo en el navegador y usa <strong>Ctrl+P → Guardar como PDF</strong>
            </div>
          )}
        </>
      )}

      {/* ── MASIVO ── */}
      {modo === "masivo" && (
        <>
          <div style={{ background: COLORS.surface, borderRadius: 12, border: `0.5px solid ${COLORS.border}`, padding: 24 }}>
            <div style={{ fontSize: 13, fontWeight: 600, color: COLORS.texto, marginBottom: 8 }}>1. Descarga la plantilla Excel</div>
            <div style={{ fontSize: 12, color: COLORS.textoMuted, marginBottom: 14 }}>Columnas: Código · DNI · F. Inicio (DD/MM/AAAA) · F. Fin (DD/MM/AAAA)</div>
            <button onClick={generarPlantilla} style={{ background: "#F0FDF4", border: `0.5px solid #86EFAC`, color: COLORS.positivo, borderRadius: 8, padding: "9px 18px", fontSize: 13, fontWeight: 500, cursor: "pointer" }}>
              ⬇️ Descargar Plantilla_Solicitudes_Vacaciones.xlsx
            </button>
          </div>

          <div style={{ background: COLORS.surface, borderRadius: 12, border: `0.5px solid ${COLORS.border}`, padding: 24 }}>
            <div style={{ fontSize: 13, fontWeight: 600, color: COLORS.texto, marginBottom: 14 }}>2. Carga el Excel con las solicitudes</div>
            <label style={{ display: "inline-flex", alignItems: "center", gap: 8, background: COLORS.accent, color: "white", borderRadius: 8, padding: "9px 18px", fontSize: 13, fontWeight: 500, cursor: "pointer" }}>
              📂 Seleccionar archivo Excel
              <input type="file" accept=".xlsx,.xls" onChange={cargarExcelMasivo} style={{ display: "none" }} />
            </label>
          </div>

          {filasMasivo && (
            <div style={{ background: COLORS.surface, borderRadius: 12, border: `0.5px solid ${COLORS.border}`, padding: 24 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
                <div>
                  <div style={{ fontSize: 13, fontWeight: 600, color: COLORS.texto }}>3. Resultado de validación</div>
                  <div style={{ fontSize: 11, color: COLORS.textoMuted, marginTop: 2 }}>
                    {filasMasivo.filter((f) => f.estado === "OK").length} OK · {filasMasivo.filter((f) => f.estado === "ALERTA").length} alerta · {filasMasivo.filter((f) => f.estado === "ERROR").length} error
                  </div>
                </div>
                <button onClick={() => setFilasMasivo(null)} style={{ background: "transparent", border: `0.5px solid ${COLORS.border}`, color: COLORS.textoMuted, borderRadius: 6, padding: "4px 10px", fontSize: 11, cursor: "pointer" }}>✕ Limpiar</button>
              </div>
              <div style={{ overflowX: "auto" }}>
                <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12 }}>
                  <thead>
                    <tr style={{ background: "#F9FAFB" }}>
                      {["Fila","Cód","Colaborador","F. Inicio","F. Fin","Días","Disponible","Estado","Detalle"].map((h) => (
                        <th key={h} style={{ padding: "9px 10px", color: COLORS.textoMuted, fontWeight: 500, textAlign: "left", borderBottom: `0.5px solid ${COLORS.border}`, fontSize: 11, textTransform: "uppercase", whiteSpace: "nowrap" }}>{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {filasMasivo.map((f) => (
                      <tr key={f.idx} style={{ borderBottom: `0.5px solid ${COLORS.border}`, background: f.estado === "ERROR" ? "#FEF2F2" : f.estado === "ALERTA" ? "#FFFBEB" : "transparent" }}>
                        <td style={{ padding: "9px 10px", color: COLORS.textoMuted }}>{f.idx}</td>
                        <td style={{ padding: "9px 10px", color: COLORS.textoSecundario }}>{f.cod}</td>
                        <td style={{ padding: "9px 10px", fontWeight: 500, color: COLORS.texto }}>{f.colab ? f.colab.nombres : f.cod || f.dni}</td>
                        <td style={{ padding: "9px 10px", color: COLORS.textoSecundario }}>{f.fIniStr}</td>
                        <td style={{ padding: "9px 10px", color: COLORS.textoSecundario }}>{f.fFinStr}</td>
                        <td style={{ padding: "9px 10px", fontWeight: 500, color: COLORS.texto }}>{f.diasSol > 0 ? f.diasSol : "—"}</td>
                        <td style={{ padding: "9px 10px", color: COLORS.positivo, fontWeight: 500 }}>{f.pend ? Math.round(f.pend.saldo * 100) / 100 : "—"}</td>
                        <td style={{ padding: "9px 10px" }}>
                          <span style={{ background: EC[f.estado] + "15", color: EC[f.estado], border: `0.5px solid ${EC[f.estado]}44`, borderRadius: 5, padding: "2px 8px", fontSize: 11, fontWeight: 500 }}>
                            {EI[f.estado]}
                          </span>
                        </td>
                        <td style={{ padding: "9px 10px", fontSize: 11, color: f.estado === "ERROR" ? COLORS.vencida : COLORS.pendiente }}>{f.motivo || "—"}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
              <div style={{ display: "flex", gap: 10, marginTop: 20, flexWrap: "wrap" }}>
                {filasMasivo.filter((f) => f.estado === "OK").length > 0 && (
                  <button onClick={() => generarMasivo(true)} disabled={procesandoMasivo}
                    style={{ background: COLORS.accent, color: "white", border: "none", borderRadius: 8, padding: "10px 20px", fontSize: 13, fontWeight: 500, cursor: "pointer", opacity: procesandoMasivo ? 0.6 : 1 }}>
                    {procesandoMasivo ? "Generando..." : "✅ Generar solo OK (" + filasMasivo.filter((f) => f.estado === "OK").length + ")"}
                  </button>
                )}
                {filasMasivo.filter((f) => f.estado === "ALERTA").length > 0 && (
                  <button onClick={() => generarMasivo(false)} disabled={procesandoMasivo}
                    style={{ background: "#FFFBEB", color: COLORS.pendiente, border: `0.5px solid #FCD34D`, borderRadius: 8, padding: "10px 20px", fontSize: 13, fontWeight: 500, cursor: "pointer", opacity: procesandoMasivo ? 0.6 : 1 }}>
                    {"Generar OK + Alertas (" + filasMasivo.filter((f) => f.estado !== "ERROR").length + ")"}
                  </button>
                )}
              </div>
              {exitoMasivo && (
                <div style={{ marginTop: 14, padding: "12px 16px", background: "rgba(22,163,74,0.08)", border: `0.5px solid #86EFAC`, borderRadius: 10, color: COLORS.positivo, fontSize: 13, fontWeight: 500 }}>
                  ✅ Archivos descargados. Ábrelos en el navegador y usa <strong>Ctrl+P → Guardar como PDF</strong>
                </div>
              )}
            </div>
          )}
        </>
      )}
    </div>
  );
}

// ─── PÁGINA: HISTORIAL DE VENCIMIENTOS ───────────────────────────────────────
function PaginaHistorial({ colaboradores, fechaCorteGlobal }) {
  const hoy = dateOnly(fechaCorteGlobal);
  const [mesSeleccionado, setMesSeleccionado] = useState(() => {
    return `${hoy.getFullYear()}-${String(hoy.getMonth() + 1).padStart(2, "0")}`;
  });
  const [busqueda, setBusqueda] = useState("");

  const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

  // Generar lista de meses disponibles (desde el más antiguo hasta hoy)
  const mesesDisponibles = useMemo(() => {
    const set = new Set();
    for (const c of colaboradores) {
      for (const p of c.periodos) {
        if (p.tipo === "INDEMNIZACION" || p.tipo === "VENCIDA") {
          // La fecha en que venció = fechaVencimiento + 1 día
          if (p.fechaVencimiento) {
            const venceEl = new Date(p.fechaVencimiento.getTime() + 86400000);
            if (venceEl <= hoy) {
              set.add(`${venceEl.getFullYear()}-${String(venceEl.getMonth() + 1).padStart(2, "0")}`);
            }
          }
        }
      }
    }
    return Array.from(set).sort().reverse(); // más reciente primero
  }, [colaboradores, hoy]);

  // Colaboradores con vencimientos en el mes seleccionado
  const vencidosMes = useMemo(() => {
    if (!mesSeleccionado) return [];
    const [año, mes] = mesSeleccionado.split("-").map(Number);
    const resultados = [];

    for (const c of colaboradores) {
      let diasVencidosMes = 0;
      const periodosVencidosMes = [];

      for (const p of c.periodos) {
        if ((p.tipo === "INDEMNIZACION" || p.tipo === "VENCIDA") && p.fechaVencimiento) {
          const venceEl = new Date(p.fechaVencimiento.getTime() + 86400000);
          if (venceEl.getFullYear() === año && venceEl.getMonth() + 1 === mes && venceEl <= hoy) {
            // Usar diasIndemnizacionBruta (INDEMNIZACION) o diasVencidosReales (VENCIDA)
            // ambos ajustados por la redistribución — si fueron cubiertos por exceso anterior = 0
            const diasVenc = p.tipo === "INDEMNIZACION" && p.diasIndemnizacionBruta !== null
              ? Math.max(0, p.diasIndemnizacionBruta)
              : p.tipo === "VENCIDA" && p.diasVencidosReales !== undefined
              ? p.diasVencidosReales
              : Math.max(0, p.diasBase - p.diasGozados - (p.diasComprados || 0));
            if (diasVenc > 0) {
              diasVencidosMes += diasVenc;
              periodosVencidosMes.push({
                id: p.id,
                anio: p.anio,
                inicio: p.inicio,
                fin: p.fin,
                fechaVencioEl: venceEl,
                diasVencidos: diasVenc,
                diasGozados: p.diasGozados,
                diasBase: p.diasBase,
              });
            }
          }
        }
      }

      if (diasVencidosMes > 0) {
        resultados.push({ ...c, diasVencidosMes, periodosVencidosMes });
      }
    }

    return resultados.sort((a, b) => b.diasVencidosMes - a.diasVencidosMes);
  }, [colaboradores, mesSeleccionado, hoy]);

  const filtrados = useMemo(() => {
    const q = busqueda.toLowerCase();
    return !q ? vencidosMes : vencidosMes.filter((c) =>
      c.nombres.toLowerCase().includes(q) || c.cod.includes(q) || c.gerencia.toLowerCase().includes(q)
    );
  }, [vencidosMes, busqueda]);

  const totalDiasVencidosMes = filtrados.reduce((s, c) => s + c.diasVencidosMes, 0);
  // Años disponibles
  const añosDisponibles = useMemo(() => {
    const set = new Set(mesesDisponibles.map((m) => m.split("-")[0]));
    return Array.from(set).sort().reverse();
  }, [mesesDisponibles]);

  const [añoSeleccionado, setAñoSeleccionado] = useState(() => {
    return hoy.getFullYear().toString();
  });

  // Meses del año seleccionado
  const mesesDelAño = useMemo(() => {
    return mesesDisponibles.filter((m) => m.startsWith(añoSeleccionado));
  }, [mesesDisponibles, añoSeleccionado]);

  const exportar = () => {
    const encHistorial = ["Código","DNI","Nombres","Gerencia","Unidad Org.","Días Vencidos en el Mes","Períodos"];
    const filas = filtrados.map((c) => ({
      "Código": c.cod, "DNI": c.doc, "Nombres": c.nombres,
      "Gerencia": c.gerencia, "Unidad Org.": c.unidadOrg,
      "Días Vencidos en el Mes": c.diasVencidosMes,
      "Períodos": c.periodosVencidosMes.map(p => `Año ${p.anio} (${p.diasVencidos}d)`).join(", "),
    }));
    crearEstiloExcel(filas, encHistorial, "Historial", `Historial_Vencimientos_${mesSeleccionado}.xlsx`, { "Nombres": { wch: 30 }, "Gerencia": { wch: 28 }, "Períodos": { wch: 35 } });
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
      {/* Header */}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 12 }}>
        <div>
          <div style={{ fontSize: 20, fontWeight: 600, color: COLORS.texto }}>Historial de Vencimientos</div>
          <div style={{ fontSize: 14, color: COLORS.textoMuted, marginTop: 2 }}>
            Días pendientes que pasaron a vencidos por mes
          </div>
        </div>
        {filtrados.length > 0 && (
          <button onClick={exportar} style={{ background: "#F0FDF4", border: "0.5px solid #86EFAC", color: COLORS.positivo, borderRadius: 10, padding: "9px 18px", cursor: "pointer", fontSize: 13, fontWeight: 600 }}>
            ⬇ Exportar Excel
          </button>
        )}
      </div>

      {/* Selector de mes */}
      <div style={{ background: COLORS.surface, borderRadius: 10, border: `0.5px solid ${COLORS.border}`, padding: "20px 24px", display: "flex", flexDirection: "column", gap: 16 }}>

        {/* Selector de año */}
        <div>
          <div style={{ fontSize: 12, fontWeight: 600, color: COLORS.textoMuted, marginBottom: 10, textTransform: "uppercase", letterSpacing: "0.04em" }}>Año</div>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            {añosDisponibles.map((a) => (
              <button key={a} onClick={() => {
                setAñoSeleccionado(a);
                // Seleccionar el primer mes disponible de ese año
                const primero = mesesDisponibles.find((m) => m.startsWith(a));
                if (primero) setMesSeleccionado(primero);
                setBusqueda("");
              }} style={{
                background: añoSeleccionado === a ? COLORS.accent : COLORS.bg,
                border: `1px solid ${añoSeleccionado === a ? COLORS.accent : COLORS.border}`,
                color: añoSeleccionado === a ? "white" : COLORS.textoSecundario,
                borderRadius: 8, padding: "7px 18px", cursor: "pointer",
                fontSize: 13, fontWeight: añoSeleccionado === a ? 700 : 400,
              }}>{a}</button>
            ))}
          </div>
        </div>

        {/* Selector de mes */}
        {añoSeleccionado && (
          <div>
            <div style={{ fontSize: 12, fontWeight: 600, color: COLORS.textoMuted, marginBottom: 10, textTransform: "uppercase", letterSpacing: "0.04em" }}>Mes</div>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              {mesesDelAño.length === 0 && (
                <div style={{ fontSize: 13, color: COLORS.textoMuted }}>Sin vencimientos en {añoSeleccionado}</div>
              )}
              {mesesDelAño.map((m) => {
                const me = parseInt(m.split("-")[1]);
                const activo = m === mesSeleccionado;
                return (
                  <button key={m} onClick={() => { setMesSeleccionado(m); setBusqueda(""); }} style={{
                    background: activo ? COLORS.vencida : COLORS.bg,
                    border: `1px solid ${activo ? COLORS.vencida : COLORS.border}`,
                    color: activo ? "white" : COLORS.textoSecundario,
                    borderRadius: 8, padding: "7px 16px", cursor: "pointer",
                    fontSize: 12, fontWeight: activo ? 700 : 400,
                  }}>{MESES[me - 1]}</button>
                );
              })}
            </div>
          </div>
        )}
      </div>

      {/* ── GRÁFICO DE BARRAS DOBLE: períodos y días vencidos por mes ── */}
      {añoSeleccionado && (() => {
        const mesesDelAñoTodos = Array.from({ length: 12 }, (_, i) => {
          const m = String(i + 1).padStart(2, "0");
          return `${añoSeleccionado}-${m}`;
        });
        const datosGrafico = mesesDelAñoTodos.map(mes => {
          const [a, me] = mes.split("-").map(Number);
          let periodos = 0, dias = 0;
          for (const c of colaboradores) {
            for (const p of c.periodos) {
              if ((p.tipo === "INDEMNIZACION" || p.tipo === "VENCIDA") && p.fechaVencimiento) {
                const venceEl = new Date(p.fechaVencimiento.getTime() + 86400000);
                if (venceEl.getFullYear() === a && venceEl.getMonth() + 1 === me && venceEl <= hoy) {
                  const dv = p.diasIndemnizacionBruta !== null ? Math.max(0, p.diasIndemnizacionBruta) : Math.max(0, p.diasBase - p.diasGozados - (p.diasComprados || 0));
                  if (dv > 0) { periodos++; dias += dv; }
                }
              }
            }
          }
          return { mes, label: MESES[me - 1].slice(0, 3), periodos, dias };
        });
        const maxDias = Math.max(...datosGrafico.map(d => d.dias), 1);
        const maxPeriodos = Math.max(...datosGrafico.map(d => d.periodos), 1);
        const barH = 100;
        return (
          <div style={{ background: COLORS.surface, borderRadius: 10, border: `0.5px solid ${COLORS.border}`, padding: "20px 24px" }}>
            <div style={{ fontSize: 13, fontWeight: 700, color: COLORS.texto, marginBottom: 16 }}>
              📊 Vencimientos por mes — {añoSeleccionado}
              <span style={{ fontSize: 11, fontWeight: 400, color: COLORS.textoMuted, marginLeft: 12 }}>
                Clic en un mes para ver el detalle
              </span>
            </div>
            <div style={{ display: "flex", gap: 16, marginBottom: 10 }}>
              <span style={{ fontSize: 11, display: "flex", alignItems: "center", gap: 4 }}><span style={{ width: 12, height: 12, background: "#EF4444", borderRadius: 2, display: "inline-block" }} />Períodos vencidos</span>
              <span style={{ fontSize: 11, display: "flex", alignItems: "center", gap: 4 }}><span style={{ width: 12, height: 12, background: "#F97316", borderRadius: 2, display: "inline-block" }} />Días vencidos</span>
            </div>
            <div style={{ display: "flex", gap: 4, alignItems: "flex-end", height: barH + 30 }}>
              {datosGrafico.map(d => {
                const hDias = d.dias > 0 ? Math.max(4, (d.dias / maxDias) * barH) : 0;
                const hPer = d.periodos > 0 ? Math.max(4, (d.periodos / maxPeriodos) * barH) : 0;
                const activo = d.mes === mesSeleccionado;
                return (
                  <div key={d.mes} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 2, cursor: "pointer" }}
                    onClick={() => { setMesSeleccionado(d.mes); setBusqueda(""); }}>
                    <div style={{ display: "flex", gap: 2, alignItems: "flex-end", height: barH }}>
                      <div style={{ width: 10, height: hPer, background: activo ? "#DC2626" : "#EF4444", borderRadius: "3px 3px 0 0", transition: "height 0.3s" }} title={`${d.periodos} períodos`} />
                      <div style={{ width: 10, height: hDias, background: activo ? "#EA580C" : "#F97316", borderRadius: "3px 3px 0 0", transition: "height 0.3s" }} title={`${d.dias} días`} />
                    </div>
                    <div style={{ fontSize: 9, color: activo ? COLORS.texto : COLORS.textoMuted, fontWeight: activo ? 700 : 400 }}>{d.label}</div>
                  </div>
                );
              })}
            </div>
          </div>
        );
      })()}

      {/* KPIs del mes */}
      {mesSeleccionado && (
        <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 12 }}>
          <div style={{ background: COLORS.surfaceHigh, borderRadius: 12, border: `0.5px solid ${COLORS.border}`, padding: "16px 20px" }}>
            <div style={{ fontSize: 12, color: COLORS.textoMuted, marginBottom: 4 }}>Colaboradores afectados</div>
            <div style={{ fontSize: 28, fontWeight: 700, color: COLORS.vencida }}>{filtrados.length}</div>
          </div>

        ))}
      </div>
    </div>
  );
}

// ─── PÁGINA: INCAPACIDADES MÉDICAS ───────────────────────────────────────────
function PaginaIncapacidades({ colaboradores }) {
  const [busqueda, setBusqueda] = useState("");
  const [filtroGerencia, setFiltroGerencia] = useState("Todas");
  const [filtroTipo, setFiltroTipo] = useState("Todos");

  const gerencias = useMemo(() => ["Todas", ...Array.from(new Set(colaboradores.map(c => c.gerencia))).sort()], [colaboradores]);

  const afectados = useMemo(() => {
    return colaboradores
      .filter(c => c.tieneExtension || (c.eventosSubsidio && c.eventosSubsidio.length > 0))
      .filter(c => filtroGerencia === "Todas" || c.gerencia === filtroGerencia)
      .filter(c => {
        if (filtroTipo === "Todos") return true;
        if (filtroTipo === "Con extensión") return c.tieneExtension;
        if (filtroTipo === "Sin extensión") return !c.tieneExtension;
        return true;
      })
      .filter(c => {
        if (!busqueda) return true;
        const q = busqueda.toLowerCase();
        return c.nombres.toLowerCase().includes(q) || c.cod.includes(q) || c.gerencia.toLowerCase().includes(q);
      })
      .sort((a, b) => (b.diasExtension || 0) - (a.diasExtension || 0));
  }, [colaboradores, filtroGerencia, filtroTipo, busqueda]);

  const totalExtension = afectados.reduce((s, c) => s + (c.diasExtension || 0), 0);
  const conExtension = afectados.filter(c => c.tieneExtension).length;

  const inputStyle = { background: COLORS.surfaceHigh, border: `0.5px solid ${COLORS.border}`, color: COLORS.texto, borderRadius: 10, padding: "9px 14px", fontSize: 13, outline: "none" };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
      <div>
        <div style={{ fontSize: 20, fontWeight: 600, color: COLORS.texto }}>Incapacidades Médicas</div>
        <div style={{ fontSize: 14, color: COLORS.textoMuted, marginTop: 2 }}>Impacto en el año laboral por Subsidio Enfermedad — D.L. 713</div>
      </div>

      {/* KPIs */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(170px, 1fr))", gap: 14 }}>
        <KPICard label="Colaboradores con incapacidad" value={afectados.length} icon="🏥" color={COLORS.texto} />
        <KPICard label="Con extensión de año" value={conExtension} icon="📅" color={COLORS.pendiente} sub="Subsidio Enfermedad > 60 días" />
        <KPICard label="Total días de extensión" value={totalExtension} icon="⏳" color={COLORS.pendiente} sub="Días añadidos al año laboral" />
        <KPICard label="Sin extensión" value={afectados.length - conExtension} icon="✅" color={COLORS.positivo} sub="Subsidio ≤ 60 días o accidente" />
      </div>

      {/* Filtros */}
      <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
        <input placeholder="🔍 Buscar por nombre, código o gerencia..." value={busqueda} onChange={e => setBusqueda(e.target.value)} style={{ ...inputStyle, flex: "1 1 260px" }} />
        <select value={filtroGerencia} onChange={e => setFiltroGerencia(e.target.value)} style={{ ...inputStyle, minWidth: 160 }}>
          {gerencias.map(g => <option key={g} value={g}>{g === "Todas" ? "Gerencias" : (g.length > 24 ? g.slice(0,24)+"…" : g)}</option>)}
        </select>
        <select value={filtroTipo} onChange={e => setFiltroTipo(e.target.value)} style={{ ...inputStyle }}>
          {["Todos", "Con extensión", "Sin extensión"].map(t => <option key={t} value={t}>{t}</option>)}
        </select>
      </div>

      {/* Lista */}
      {afectados.length === 0 && (
        <div style={{ textAlign: "center", padding: 60, color: COLORS.textoMuted, fontSize: 14 }}>
          {colaboradores.filter(c => c.tieneExtension).length === 0
            ? "📂 Carga el archivo de Incapacidades Médicas en Importación para ver los datos"
            : "✅ Ningún colaborador cumple los filtros seleccionados"}
        </div>
      )}

      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {afectados.map(c => {
          const color = c.tieneExtension ? COLORS.pendiente : COLORS.positivo;
          return (
            <div key={c.cod} style={{ background: COLORS.surfaceHigh, borderRadius: 12, border: `1px solid ${color}33`, borderLeft: `4px solid ${color}`, padding: "16px 18px" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 12 }}>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 14, fontWeight: 700, color: COLORS.texto }}>{c.nombres}</div>
                  <div style={{ fontSize: 12, color: COLORS.textoMuted, marginTop: 2 }}>{c.gerencia} · Cód: {c.cod} · DNI: {c.doc}</div>

                  {/* Eventos de subsidio */}
                  {c.eventosSubsidio && c.eventosSubsidio.length > 0 && (
                    <div style={{ marginTop: 10, display: "flex", flexDirection: "column", gap: 6 }}>
                      {c.eventosSubsidio.map((ev, i) => (
                        <div key={i} style={{ padding: "8px 12px", background: COLORS.bg, borderRadius: 8, border: `0.5px solid ${COLORS.border}`, fontSize: 12 }}>
                          <div style={{ display: "flex", gap: 16, flexWrap: "wrap" }}>
                            <span style={{ color: COLORS.textoMuted }}>Evento {i + 1}</span>
                            {ev.inicioDM && (
                              <span style={{ color: COLORS.textoMuted }}>
                                DM: <strong style={{ color: COLORS.texto }}>
                                  {fmtDate(ev.inicioDM)}{ev.finDM && ev.finDM.getTime() !== ev.inicioDM.getTime() ? ` al ${fmtDate(ev.finDM)}` : ""} ({ev.diasDM} {ev.diasDM === 1 ? "día" : "días"})
                                </strong>
                              </span>
                            )}
                            <span style={{ color: COLORS.textoMuted }}>Subsidio Enfermedad: <strong style={{ color: COLORS.texto }}>{ev.diasSubsidio} días</strong></span>
                            {ev.diasExtension > 0
                              ? <span style={{ color: COLORS.pendiente, fontWeight: 700 }}>⏳ Extensión: +{ev.diasExtension} días al año laboral</span>
                              : <span style={{ color: COLORS.positivo, fontWeight: 600 }}>✅ Sin extensión (≤ 60 días)</span>
                            }
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                {/* Badge derecho */}
                <div style={{ textAlign: "right", flexShrink: 0 }}>
                  {c.tieneExtension ? (
                    <>
                      <div style={{ fontSize: 24, fontWeight: 800, color: COLORS.pendiente }}>+{c.diasExtension}d</div>
                      <div style={{ fontSize: 11, color: COLORS.textoMuted }}>extensión año laboral</div>
                    </>
                  ) : (
                    <>
                      <div style={{ fontSize: 16, fontWeight: 700, color: COLORS.positivo }}>Sin extensión</div>
                      <div style={{ fontSize: 11, color: COLORS.textoMuted }}>subsidio ≤ 60 días</div>
                    </>
                  )}
                </div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─── PÁGINA: CONVENIOS VACACIONALES ──────────────────────────────────────────
function PaginaConvenios({ colaboradores, rawData }) {
  const [busqueda, setBusqueda] = useState("");
  const [filtroGerencia, setFiltroGerencia] = useState("Todas");
  const [filtroEstado, setFiltroEstado] = useState("Todos");
  const [filtroFirma, setFiltroFirma] = useState("Todos");

  const gerencias = useMemo(() => ["Todas", ...Array.from(new Set(colaboradores.map(c => c.gerencia))).sort()], [colaboradores]);

  const conAcuerdo = useMemo(() => {
    return colaboradores
      .filter(c => c.tieneAcuerdo)
      .map(c => {
        const acuerdos = c.acuerdosVacacionales || [];
        return {
          ...c,
          acuerdosDetalle: acuerdos.map(a => {
            const periodoReal = c.periodos.find(p => acuerdoMatchPeriodo(a, p));
            const saldoReal = periodoReal?.diasBase || 0;

            // Días gozados por convenio = goces con porConvenio:true en el período del acuerdo
            const diasGozadosPorAcuerdo = periodoReal
              ? periodoReal.goces
                  .filter(g => g.porAcuerdo && g.acuerdoInfo?.porConvenio === true)
                  .reduce((s, g) => s + g.dias, 0)
              : 0;

            // Saldo vencido = saldo del período antes de aplicar el convenio (pasada 1)
            const saldoVencido = periodoReal?.saldoPreConvenio ?? 0;

            // Días aplicables = min(firmados, saldo vencido)
            const diasAplicables2 = Math.min(a.diasAcordados, saldoVencido);

            const tieneInconsistencia = a.diasAcordados > saldoReal;

            // Días vencidos reales = saldo del período que matchea el acuerdo (el período acordado)
            // Ej: Donny firmó por 2024-2025 → saldo real del Año 2 después de sus goces
            const diasVencidosReales = periodoReal
              ? Math.max(0, Math.round((periodoReal.diasBase - periodoReal.diasGozados - (periodoReal.diasComprados || 0)) * 100) / 100)
              : 0;

            // Los días firmados que realmente aplican = min(firmados, vencidos reales del período)
            const diasContraVencidos = Math.min(a.diasAcordados, diasVencidosReales);
            const diasContraPendientes = Math.max(0, a.diasAcordados - diasContraVencidos);
            const diasAplicables = a.procede ? diasContraVencidos : 0;

            // Advertencias
            const diasFirmadosSuperanVencidosCero = a.procede && diasVencidosReales === 0;
            const diasFirmadosSuperanVencidos = a.procede && !diasFirmadosSuperanVencidosCero && a.diasAcordados > diasVencidosReales;
            // Estado basado en diasAplicables (min firmados, saldo vencido)
            const estado = diasGozadosPorAcuerdo >= diasAplicables2 ? "saldado"
              : diasGozadosPorAcuerdo > 0 ? "en_curso" : "sin_goce";

            // Estado del período EN LA FECHA DE FIRMA
            // Reglas:
            //   - firma < inicio del período → TRUNCA (el año laboral ni siquiera empezó)
            //   - firma >= inicio y firma <= fin año laboral → TRUNCA (año en curso, no completado)
            //   - firma > fin año laboral y firma <= fechaVencimiento → PENDIENTE (año completo, dentro del plazo de goce)
            //   - firma > fechaVencimiento → VENCIDA
            let estadoAlFirmar = null;
            let diasParaVencerAlFirmar = null; // días que faltaban para vencer al momento de firma
            if (a.fechaFirma && periodoReal) {
              const firma = dateOnly(a.fechaFirma);
              const inicio = periodoReal.inicio;
              const finNatural = periodoReal.fin;
              const fechaVenc = periodoReal.fechaVencimiento;
              if (!inicio) {
                estadoAlFirmar = null;
              } else if (firma < inicio) {
                estadoAlFirmar = "TRUNCA";
                // faltaban desde la firma hasta que termine el año laboral
                diasParaVencerAlFirmar = daysBetween(firma, finNatural);
              } else if (firma <= finNatural) {
                estadoAlFirmar = "TRUNCA";
                // faltaban desde la firma hasta que termine el año laboral
                diasParaVencerAlFirmar = daysBetween(firma, finNatural);
              } else if (fechaVenc && firma <= fechaVenc) {
                estadoAlFirmar = "PENDIENTE";
                // faltaban desde la firma hasta el vencimiento del plazo de goce
                diasParaVencerAlFirmar = daysBetween(firma, fechaVenc);
              } else if (fechaVenc && firma > fechaVenc) {
                estadoAlFirmar = "VENCIDA";
                diasParaVencerAlFirmar = 0;
              } else {
                estadoAlFirmar = "PENDIENTE";
                diasParaVencerAlFirmar = null;
              }
            }
            // Para TRUNCA: calcular días totales hasta la fechaVencimiento (no solo hasta fin año laboral)
            let diasTotalesParaVencer = diasParaVencerAlFirmar;
            if (estadoAlFirmar === "TRUNCA" && a.fechaFirma && periodoReal?.fechaVencimiento) {
              diasTotalesParaVencer = daysBetween(dateOnly(a.fechaFirma), periodoReal.fechaVencimiento);
            }
            // Convertir días totales a años, meses y días restantes
            const anosParaVencer = diasTotalesParaVencer !== null ? Math.floor(diasTotalesParaVencer / 360) : null;
            const mesesParaVencer = diasTotalesParaVencer !== null ? Math.floor((diasTotalesParaVencer % 360) / 30) : null;
            const diasRestParaVencer = diasTotalesParaVencer !== null ? diasTotalesParaVencer % 30 : null;

            // Regla de procedencia del convenio:
            // Nueva lógica de procede — 4 puntos:
            // 1. VENCIDA al firmar → NO procede
            // 2. TRUNCA al firmar → NO procede
            // 3. Firmó con > 30 días antes del vencimiento → NO procede
            // 4. Al vencerse tenía > 23 días pendientes → NO procede / ≤ 23 → SÍ procede
            let procede = null;
            let motivoNoProcede = null;
            if (estadoAlFirmar) {
              if (estadoAlFirmar === "VENCIDA") {
                procede = false;
                motivoNoProcede = "Período ya vencido al momento de la firma";
              } else if (estadoAlFirmar === "TRUNCA") {
                procede = false;
                motivoNoProcede = "El año laboral no había terminado al momento de la firma";
              } else if (estadoAlFirmar === "PENDIENTE") {
                const diasTotales = diasParaVencerAlFirmar ?? 0;
                if (diasTotales > 30) {
                  procede = false;
                  motivoNoProcede = "Período pendiente con más de 1 mes para vencer al momento de la firma";
                } else if (saldoVencido > 23) {
                  procede = false;
                  motivoNoProcede = "Al vencerse el período tenía " + saldoVencido + " días pendientes (más de 23)";
                } else {
                  procede = true;
                }
              }
            }
            return { ...a, diasGozados: diasGozadosPorAcuerdo, diasPendientes: Math.max(0, diasAplicables2 - diasGozadosPorAcuerdo), saldoReal, saldoVencido, diasAplicables: diasAplicables2, tieneInconsistencia, inconsistenciaDias: tieneInconsistencia ? a.diasAcordados - saldoReal : 0, estado, periodoReal, estadoAlFirmar, diasParaVencerAlFirmar, anosParaVencer, mesesParaVencer, diasRestParaVencer, procede, motivoNoProcede, diasVencidosReales, diasContraVencidos, diasContraPendientes, diasFirmadosSuperanVencidos, diasFirmadosSuperanVencidosCero };
          }),
        };
      })
      .filter(c => {
        const q = busqueda.toLowerCase();
        const matchBusqueda = !q || c.nombres.toLowerCase().includes(q) || c.cod.includes(q);
        const matchGerencia = filtroGerencia === "Todas" || c.gerencia === filtroGerencia;
        const matchEstado = filtroEstado === "Todos" || c.acuerdosDetalle.some(a => {
          if (filtroEstado === "Saldado") return a.estado === "saldado";
          if (filtroEstado === "En curso") return a.estado === "en_curso";
          if (filtroEstado === "Sin goce") return a.estado === "sin_goce";
          if (filtroEstado === "Procede") return a.procede === true;
          if (filtroEstado === "No procede") return a.procede === false;
          if (filtroEstado === "Inconsistencia") return a.tieneInconsistencia;
          return true;
        });
        const matchFirma = filtroFirma === "Todos" || c.acuerdosDetalle.some(a => {
          if (filtroFirma === "Pendiente al firmar") return a.estadoAlFirmar === "PENDIENTE";
          if (filtroFirma === "Trunco al firmar") return a.estadoAlFirmar === "TRUNCA";
          if (filtroFirma === "Vencido al firmar") return a.estadoAlFirmar === "VENCIDA";
          return true;
        });
        return matchBusqueda && matchGerencia && matchEstado && matchFirma;
      });
  }, [colaboradores, busqueda, filtroGerencia, filtroEstado, filtroFirma]);

  const totalConvenios = conAcuerdo.reduce((s, c) => s + c.acuerdosDetalle.length, 0);
  const saldados = conAcuerdo.reduce((s, c) => s + c.acuerdosDetalle.filter(a => a.estado === "saldado").length, 0);
  const enCurso = conAcuerdo.reduce((s, c) => s + c.acuerdosDetalle.filter(a => a.estado === "en_curso").length, 0);
  const sinGoce = conAcuerdo.reduce((s, c) => s + c.acuerdosDetalle.filter(a => a.estado === "sin_goce").length, 0);
  const inconsistencias = conAcuerdo.reduce((s, c) => s + c.acuerdosDetalle.filter(a => a.tieneInconsistencia).length, 0);
  const proceden = conAcuerdo.reduce((s, c) => s + c.acuerdosDetalle.filter(a => a.procede === true).length, 0);
  const noProceden = conAcuerdo.reduce((s, c) => s + c.acuerdosDetalle.filter(a => a.procede === false).length, 0);
  const sinEvaluar = conAcuerdo.reduce((s, c) => s + c.acuerdosDetalle.filter(a => a.procede === null).length, 0);
  const codsNoEncontrados = rawData?.codsNoEncontrados || [];

  const estadoConfig = {
    saldado:  { label: "✅ Saldado",  color: COLORS.positivo,  bg: "rgba(22,163,74,0.08)" },
    en_curso: { label: "🟡 En curso", color: COLORS.pendiente, bg: "rgba(217,119,6,0.08)" },
    sin_goce: { label: "❌ Sin goce", color: COLORS.vencida,   bg: "rgba(220,38,38,0.08)" },
  };

  const inputStyle = { background: COLORS.surfaceHigh, border: `0.5px solid ${COLORS.border}`, color: COLORS.texto, borderRadius: 10, padding: "9px 14px", fontSize: 13, outline: "none" };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
      <div>
        <div style={{ fontSize: 20, fontWeight: 600, color: COLORS.texto }}>Convenios Vacacionales</div>
        <div style={{ fontSize: 14, color: COLORS.textoMuted, marginTop: 2 }}>Acuerdo de Acumulación Vacacional — D.L. 713 Art. 10</div>
      </div>

      {codsNoEncontrados.length > 0 && (
        <div style={{ padding: "14px 18px", background: "rgba(217,119,6,0.08)", border: `1px solid ${COLORS.pendiente}33`, borderRadius: 12 }}>
          <div style={{ fontSize: 13, fontWeight: 700, color: COLORS.pendiente, marginBottom: 8 }}>
            ⚠ {codsNoEncontrados.length} código{codsNoEncontrados.length > 1 ? "s" : ""} no encontrado{codsNoEncontrados.length > 1 ? "s" : ""} en el Registro de Personal
          </div>
          <div style={{ fontSize: 12, color: COLORS.textoMuted, marginBottom: 6 }}>Es posible que sean colaboradores cesados:</div>
          {codsNoEncontrados.map(({ cod, nombres }) => (
            <div key={cod} style={{ fontSize: 12, color: COLORS.textoSecundario }}>• Cód: <strong>{cod}</strong> — {nombres}</div>
          ))}
          <div style={{ fontSize: 11, color: COLORS.textoMuted, marginTop: 6 }}>Verifica si fueron retirados del Registro de Personal.</div>
        </div>
      )}

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(150px, 1fr))", gap: 12 }}>
        <KPICard label="Total convenios" value={totalConvenios} icon="📋" color={COLORS.texto} />
        <KPICard label="Saldados" value={saldados} icon="✅" color={COLORS.positivo} />
        <KPICard label="En curso" value={enCurso} icon="🟡" color={COLORS.pendiente} sub="Gozando parcialmente" />
        <KPICard label="Sin goce" value={sinGoce} icon="❌" color={COLORS.vencida} sub="Aún no han salido" />
        <KPICard label="Inconsistencias" value={inconsistencias} icon="⚠" color={COLORS.pendiente} sub="Días firmados > saldo real" />
        <KPICard label="Proceden" value={proceden} icon="✅" color={COLORS.positivo} sub="Cumplen regla de aplicación" />
        <KPICard label="No proceden" value={noProceden} icon="❌" color={COLORS.vencida} sub="Trunco o pendiente > 1 mes" />
        {sinEvaluar > 0 && <KPICard label="Sin evaluar" value={sinEvaluar} icon="ℹ" color={COLORS.textoMuted} sub="Sin fecha de firma" />}
      </div>

      <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
        <input placeholder="🔍 Buscar por nombre o código..." value={busqueda} onChange={e => setBusqueda(e.target.value)} style={{ ...inputStyle, flex: "1 1 260px" }} />
        <select value={filtroGerencia} onChange={e => setFiltroGerencia(e.target.value)} style={{ ...inputStyle, minWidth: 160 }}>
          {gerencias.map(g => <option key={g} value={g}>{g === "Todas" ? "Gerencias" : (g.length > 24 ? g.slice(0,24)+"…" : g)}</option>)}
        </select>
        <select value={filtroEstado} onChange={e => setFiltroEstado(e.target.value)} style={{ ...inputStyle }}>
          {["Todos", "Saldado", "En curso", "Sin goce", "Procede", "No procede", "Inconsistencia"].map(e => <option key={e} value={e}>{e}</option>)}
        </select>
        <select value={filtroFirma} onChange={e => setFiltroFirma(e.target.value)} style={{ ...inputStyle }}>
          {["Todos", "Pendiente al firmar", "Trunco al firmar", "Vencido al firmar"].map(e => <option key={e} value={e}>{e}</option>)}
        </select>
        <button onClick={() => {
          const encConv = ["Cód","DNI","Apellidos y Nombres","Gerencia","Unid. Org.","Período convenio","Días firmados","Saldo vencido","Días aplicables","Días gozados","Días pendientes","Estado","Procede","Motivo no procede","Fecha firma","Estado al firmar","Inconsistencia"];
          const filas = conAcuerdo.flatMap(c => c.acuerdosDetalle.map(a => ({
            "Cód": c.cod, "DNI": c.doc, "Apellidos y Nombres": c.nombres, "Gerencia": c.gerencia, "Unid. Org.": c.unidadOrg,
            "Período convenio": a.periodo,
            "Días firmados": a.diasAcordados,
            "Saldo vencido": a.saldoVencido,
            "Días aplicables": a.diasAplicables,
            "Días gozados": a.diasGozados,
            "Días pendientes": a.diasPendientes,
            "Estado": a.estado === "saldado" ? "Saldado" : a.estado === "en_curso" ? "En curso" : "Sin goce",
            "Procede": a.procede === true ? "Sí" : a.procede === false ? "No" : "Sin evaluar",
            "Motivo no procede": a.motivoNoProcede || "",
            "Fecha firma": a.fechaFirma ? fmtDate(a.fechaFirma) : "",
            "Estado al firmar": a.estadoAlFirmar || "",
            "Inconsistencia": a.tieneInconsistencia ? `${a.inconsistenciaDias}d de diferencia` : "",
          })));
          crearEstiloExcel(filas, encConv, "Convenios", "Convenios_Vacacionales.xlsx", { "Apellidos y Nombres": { wch: 30 }, "Gerencia": { wch: 28 }, "Motivo no procede": { wch: 30 } });
        }} style={{ background: COLORS.accent, color: "#fff", border: "none", borderRadius: 10, padding: "9px 18px", cursor: "pointer", fontSize: 13, fontWeight: 700 }}>
          ⬇ Exportar Excel
        </button>
      </div>

      {/* Gráfico por gerencia: proceden vs no proceden */}
      {(() => {
        const gerenciasData = {};
        for (const c of conAcuerdo) {
          if (!gerenciasData[c.gerencia]) gerenciasData[c.gerencia] = { proceden: 0, noProceden: 0 };
          for (const a of c.acuerdosDetalle) {
            if (a.procede === true) gerenciasData[c.gerencia].proceden++;
            else if (a.procede === false) gerenciasData[c.gerencia].noProceden++;
          }
        }
        const entries = Object.entries(gerenciasData).filter(([, d]) => d.proceden + d.noProceden > 0);
        if (entries.length === 0) return null;
        const maxVal = Math.max(...entries.map(([, d]) => d.proceden + d.noProceden), 1);
        return (
          <div style={{ background: COLORS.surface, borderRadius: 10, border: `0.5px solid ${COLORS.border}`, padding: "20px 24px" }}>
            <div style={{ fontSize: 13, fontWeight: 700, color: COLORS.texto, marginBottom: 16 }}>📊 Convenios por gerencia — Proceden vs No proceden</div>
            <div style={{ display: "flex", gap: 12, marginBottom: 10 }}>
              <span style={{ fontSize: 11, display: "flex", alignItems: "center", gap: 4 }}><span style={{ width: 12, height: 12, background: COLORS.positivo, borderRadius: 2, display: "inline-block" }} />Proceden</span>
              <span style={{ fontSize: 11, display: "flex", alignItems: "center", gap: 4 }}><span style={{ width: 12, height: 12, background: "#EF4444", borderRadius: 2, display: "inline-block" }} />No proceden</span>
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {entries.sort(([, a], [, b]) => (b.proceden + b.noProceden) - (a.proceden + a.noProceden)).map(([ger, d]) => {
                const total = d.proceden + d.noProceden;
                const pctP = (d.proceden / maxVal) * 100;
                const pctN = (d.noProceden / maxVal) * 100;
                return (
                  <div key={ger}>
                    <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 3 }}>
                      <span style={{ fontSize: 11, color: COLORS.textoMuted }}>{ger.length > 35 ? ger.slice(0,35)+"…" : ger}</span>
                      <span style={{ fontSize: 11, color: COLORS.textoMuted }}>{total} total</span>
                    </div>
                    <div style={{ display: "flex", gap: 3, height: 14 }}>
                      {d.proceden > 0 && <div style={{ width: `${pctP}%`, background: COLORS.positivo, borderRadius: 3, display: "flex", alignItems: "center", justifyContent: "center" }}>
                        <span style={{ fontSize: 9, color: "#fff", fontWeight: 700 }}>{d.proceden}</span>
                      </div>}
                      {d.noProceden > 0 && <div style={{ width: `${pctN}%`, background: "#EF4444", borderRadius: 3, display: "flex", alignItems: "center", justifyContent: "center" }}>
                        <span style={{ fontSize: 9, color: "#fff", fontWeight: 700 }}>{d.noProceden}</span>
                      </div>}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        );
      })()}

      {conAcuerdo.length === 0 && (
        <div style={{ textAlign: "center", padding: 60, color: COLORS.textoMuted, fontSize: 14 }}>
          {totalConvenios === 0
            ? "📂 Carga el archivo de Acuerdo de Acumulación Vacacional en Importación"
            : "✅ Ningún colaborador cumple los filtros seleccionados"}
        </div>
      )}

      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {conAcuerdo.map(c => (
          <div key={c.cod} style={{ background: COLORS.surfaceHigh, borderRadius: 12, border: `0.5px solid ${COLORS.border}`, padding: "16px 18px" }}>
            <div style={{ fontSize: 14, fontWeight: 700, color: COLORS.texto, marginBottom: 2 }}>{c.nombres}</div>
            <div style={{ fontSize: 12, color: COLORS.textoMuted, marginBottom: 12 }}>{c.gerencia} · Cód: {c.cod} · DNI: {c.doc}</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {c.acuerdosDetalle.map((a, i) => {
                const cfg = estadoConfig[a.estado];
                return (
                  <div key={i} style={{ background: cfg.bg, border: `1px solid ${cfg.color}33`, borderRadius: 10, padding: "12px 14px", borderLeft: `3px solid ${cfg.color}` }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 8 }}>
                      <div>
                        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6, flexWrap: "wrap" }}>
                          <div style={{ fontSize: 13, fontWeight: 700, color: COLORS.texto }}>Período {a.periodo}</div>
                          {/* Estado al momento de la firma */}
                          {a.estadoAlFirmar && (() => {
                            const cfgFirma = {
                              TRUNCA:    { bg: "rgba(139,92,246,0.12)", color: "#8B5CF6", border: "#8B5CF633", label: "Trunca al firmar" },
                              PENDIENTE: { bg: "rgba(245,158,11,0.12)", color: "#D97706", border: "#D9770633", label: "Pendiente al firmar" },
                              VENCIDA:   { bg: "rgba(239,68,68,0.12)",  color: "#EF4444", border: "#EF444433", label: "Vencida al firmar" },
                            }[a.estadoAlFirmar];
                            // Texto de tiempo restante para vencer
                            const fmtTiempo = (a) => {
                              const partes = [];
                              if (a.anosParaVencer > 0) partes.push(`${a.anosParaVencer}a`);
                              if (a.mesesParaVencer > 0) partes.push(`${a.mesesParaVencer}m`);
                              partes.push(`${a.diasRestParaVencer}d`);
                              return partes.join(" ");
                            };
                            let tiempoLabel = null;
                            if (a.estadoAlFirmar === "VENCIDA") {
                              tiempoLabel = "ya vencida al firmar";
                            } else if (a.anosParaVencer !== null) {
                              tiempoLabel = `${fmtTiempo(a)} para vencer`;
                            }
                            return cfgFirma ? (
                              <span style={{
                                fontSize: 11, fontWeight: 700, borderRadius: 6,
                                padding: "2px 9px",
                                background: cfgFirma.bg,
                                color: cfgFirma.color,
                                border: `1px solid ${cfgFirma.border}`,
                                display: "inline-flex", alignItems: "center", gap: 5,
                              }}>
                                {cfgFirma.label}
                                {tiempoLabel && (
                                  <span style={{ fontWeight: 400, opacity: 0.85 }}>· {tiempoLabel}</span>
                                )}
                              </span>
                            ) : null;
                          })()}
                          {/* Estado actual del período */}
                          {a.periodoReal && <Badge tipo={a.periodoReal.tipo} small />}
                          {a.fechaFirma && (
                            <span style={{ fontSize: 11, color: COLORS.textoMuted }}>
                              📅 Firmado: <strong style={{ color: COLORS.textoSecundario }}>{fmtDate(a.fechaFirma)}</strong>
                            </span>
                          )}
                        </div>
                        <div style={{ display: "flex", gap: 16, flexWrap: "wrap", fontSize: 12 }}>
                          <span style={{ color: COLORS.textoMuted }}>Días firmados: <strong style={{ color: COLORS.texto }}>{a.diasAcordados}</strong></span>
                          <span style={{ color: COLORS.textoMuted }}>Saldo vencido: <strong style={{ color: a.saldoVencido > 0 ? COLORS.vencida : COLORS.textoMuted }}>{a.saldoVencido}</strong></span>
                          <span style={{ color: COLORS.textoMuted }}>Aplicables: <strong style={{ color: COLORS.accentLight }}>{a.diasAplicables}</strong></span>
                          <span style={{ color: COLORS.textoMuted }}>Gozados: <strong style={{ color: COLORS.accentLight }}>{a.diasGozados}</strong></span>
                          <span style={{ color: COLORS.textoMuted }}>Pendientes: <strong style={{ color: a.diasPendientes > 0 ? COLORS.pendiente : COLORS.positivo }}>{a.diasPendientes}</strong></span>
                        </div>
                        {a.periodoReal && a.periodoReal.inicio && (
                          <div style={{ marginTop: 6, fontSize: 11, color: COLORS.textoMuted, display: "flex", gap: 12, flexWrap: "wrap" }}>
                            <span>Inicio año laboral: <strong style={{ color: COLORS.textoSecundario }}>{fmtDate(a.periodoReal.inicio)}</strong></span>
                            <span>Fin año laboral: <strong style={{ color: COLORS.textoSecundario }}>{fmtDate(a.periodoReal.fin)}</strong></span>
                            {a.periodoReal.fechaVencimiento && (
                              <span>Gozar hasta: <strong style={{ color: a.periodoReal.tipo === "VENCIDA" ? "#EF4444" : COLORS.accentLight }}>{fmtDate(a.periodoReal.fechaVencimiento)}</strong></span>
                            )}
                          </div>
                        )}
                        {a.tieneInconsistencia && (
                          <div style={{ marginTop: 6, fontSize: 11, color: COLORS.pendiente, fontWeight: 600 }}>
                            ⚠ Inconsistencia: firmó {a.diasAcordados} días pero el saldo real es {a.saldoReal} días ({a.inconsistenciaDias} días de diferencia)
                          </div>
                        )}
                        {/* Cuadro de procedencia del convenio */}
                        {a.procede === true && !a.diasFirmadosSuperanVencidos && !a.diasFirmadosSuperanVencidosCero && (
                          <div style={{
                            marginTop: 8, padding: "7px 12px",
                            background: "rgba(22,163,74,0.08)",
                            border: "1px solid rgba(22,163,74,0.3)",
                            borderRadius: 8, fontSize: 11,
                            color: COLORS.positivo, fontWeight: 600,
                            display: "flex", alignItems: "center", gap: 6,
                          }}>
                            ✅ Procede — el período cumple la regla de aplicación del convenio
                          </div>
                        )}
                        {a.procede === true && a.diasFirmadosSuperanVencidosCero && (
                          <div style={{
                            marginTop: 8, padding: "7px 12px",
                            background: "rgba(239,68,68,0.07)",
                            border: "1px solid rgba(239,68,68,0.3)",
                            borderRadius: 8, fontSize: 11,
                            color: COLORS.vencida, fontWeight: 600,
                          }}>
                            ❌ No aplica — firmó {a.diasAcordados} días pero este período no tiene días vencidos (saldo = 0). El convenio no tiene efecto.
                          </div>
                        )}
                        {a.procede === true && a.diasFirmadosSuperanVencidos && (
                          <div style={{
                            marginTop: 8, padding: "8px 12px",
                            background: "rgba(245,158,11,0.08)",
                            border: "1px solid rgba(245,158,11,0.3)",
                            borderRadius: 8, fontSize: 11,
                            color: "#D97706", fontWeight: 600,
                            lineHeight: 1.6,
                          }}>
                            ⚠ Aplicación parcial — firmó <strong>{a.diasAcordados} días</strong> pero solo tenía <strong>{a.diasVencidosReales} día{a.diasVencidosReales !== 1 ? "s" : ""} vencidos</strong> al momento de la firma.
                            <div style={{ marginTop: 4, display: "flex", gap: 16, flexWrap: "wrap" }}>
                              <span>Contra vencidos: <strong>{a.diasContraVencidos}d</strong></span>
                              {a.diasContraPendientes > 0 && (
                                <span>Contra pendientes: <strong>{a.diasContraPendientes}d</strong></span>
                              )}
                              <span style={{ color: COLORS.positivo }}>Total aplicable: <strong>{a.diasAplicables}d</strong></span>
                            </div>
                          </div>
                        )}
                        {a.procede === false && (
                          <div style={{
                            marginTop: 8, padding: "7px 12px",
                            background: "rgba(239,68,68,0.07)",
                            border: "1px solid rgba(239,68,68,0.3)",
                            borderRadius: 8, fontSize: 11,
                            color: COLORS.vencida, fontWeight: 600,
                            display: "flex", alignItems: "center", gap: 6,
                          }}>
                            ❌ No procede — {a.motivoNoProcede}
                          </div>
                        )}
                        {a.procede === null && a.fechaFirma === null && (
                          <div style={{
                            marginTop: 8, padding: "7px 12px",
                            background: "rgba(100,116,139,0.07)",
                            border: "1px solid rgba(100,116,139,0.2)",
                            borderRadius: 8, fontSize: 11,
                            color: COLORS.textoMuted, fontWeight: 500,
                            display: "flex", alignItems: "center", gap: 6,
                          }}>
                            ℹ Sin fecha de firma — no se puede evaluar la procedencia
                          </div>
                        )}
                      </div>
                      <div style={{ padding: "4px 12px", background: cfg.color + "22", borderRadius: 8, fontSize: 12, fontWeight: 700, color: cfg.color, flexShrink: 0 }}>
                        {cfg.label}
                      </div>
                    </div>
                    {a.diasAcordados > 0 && (
                      <div style={{ marginTop: 10, height: 6, background: COLORS.bg, borderRadius: 3, overflow: "hidden" }}>
                        <div style={{ width: `${Math.min(100, (a.diasGozados / a.diasAcordados) * 100)}%`, height: "100%", background: cfg.color, borderRadius: 3, transition: "width 0.3s" }} />
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}



function PaginaGoces({ colaboradores }) {
  const [busqueda, setBusqueda] = useState("");
  const [filtroGerencia, setFiltroGerencia] = useState("Todas");
  const [filtroUnidadOrg, setFiltroUnidadOrg] = useState("Todas");
  const [filtroAnio, setFiltroAnio] = useState("Todos");
  const [filtroFechaDesde, setFiltroFechaDesde] = useState("");
  const [filtroFechaHasta, setFiltroFechaHasta] = useState("");
  const [mesSeleccionado, setMesSeleccionado] = useState(null);

  const todosGoces = useMemo(() => {
    const rows = [];
    for (const c of colaboradores) {
      for (const p of c.periodos) {
        if (!p.goces || p.goces.length === 0) continue;
        for (const g of p.goces) {
          rows.push({
            cod: c.cod,
            nombres: c.nombres,
            gerencia: c.gerencia || "—",
            unidadOrg: c.unidadOrg || "—",
            dni: c.dni,
            inicio: g.inicio,
            fin: g.fin,
            dias: g.dias,
            anioNum: p.anio,
            anioInicio: p.inicio,
            anioFin: p.fin,
            registrado: g.obs ? g.obs.toLowerCase().includes("con registro") : false,
            porConvenio: g.acuerdoInfo?.porConvenio === true,
          });
        }
      }
    }
    return rows.sort((a, b) => (a.cod || "").localeCompare(b.cod || ""));
  }, [colaboradores]);

  const gerencias = useMemo(() => ["Todas", ...Array.from(new Set(todosGoces.map(r => r.gerencia))).filter(Boolean).sort()], [todosGoces]);
  const unidadesOrg = useMemo(() => {
    const base = filtroGerencia === "Todas" ? todosGoces : todosGoces.filter(r => r.gerencia === filtroGerencia);
    return ["Todas", ...Array.from(new Set(base.map(r => r.unidadOrg))).filter(Boolean).sort()];
  }, [todosGoces, filtroGerencia]);

  const aniosDisponibles = useMemo(() => {
    const set = new Set(todosGoces.map(r => r.anioNum).filter(Boolean));
    return ["Todos", ...Array.from(set).sort((a,b)=>a-b).map(n=>`Año ${n}`)];
  }, [todosGoces]);

  const gocesFiltrados = useMemo(() => {
    const q = busqueda.toLowerCase().trim();
    return todosGoces.filter(r => {
      const matchBusqueda = !q || r.nombres.toLowerCase().includes(q) || String(r.cod).includes(q);
      const matchGerencia = filtroGerencia === "Todas" || r.gerencia === filtroGerencia;
      const matchUnidad = filtroUnidadOrg === "Todas" || r.unidadOrg === filtroUnidadOrg;
      const matchAnio = filtroAnio === "Todos" || `Año ${r.anioNum}` === filtroAnio;
      const matchDesde = !filtroFechaDesde || (r.inicio && r.inicio >= dateOnly(new Date(filtroFechaDesde + "T12:00:00")));
      const matchHasta = !filtroFechaHasta || (r.inicio && r.inicio <= dateOnly(new Date(filtroFechaHasta + "T12:00:00")));
      const matchMes = !mesSeleccionado || (r.inicio && `${r.inicio.getFullYear()}-${String(r.inicio.getMonth()+1).padStart(2,"0")}` === mesSeleccionado);
      return matchBusqueda && matchGerencia && matchUnidad && matchAnio && matchDesde && matchHasta && matchMes;
    });
  }, [todosGoces, busqueda, filtroGerencia, filtroUnidadOrg, filtroAnio, filtroFechaDesde, filtroFechaHasta, mesSeleccionado]);

  // KPIs
  const totalGoces = gocesFiltrados.length;
  const totalDias = gocesFiltrados.reduce((s, r) => s + r.dias, 0);
  const colaboradoresConGoces = new Set(gocesFiltrados.map(r => r.cod)).size;
  const promedioDias = totalGoces > 0 ? Math.round((totalDias / totalGoces) * 10) / 10 : 0;
  const maxGoce = gocesFiltrados.reduce((max, r) => r.dias > (max?.dias ?? 0) ? r : max, null);
  const porConvenioCount = gocesFiltrados.filter(r => r.porConvenio).length;
  const referencialesCount = gocesFiltrados.filter(r => !r.registrado).length;

  const exportarExcel = () => {
    const encGoces = ["Cód","Apellidos y Nombres","Gerencia","Unid. Org.","Año","Inicio año laboral","Fin año laboral","Fecha Inicio","Fecha Fin","Días","Estado","Por convenio"];
    const filas = gocesFiltrados.map(r => ({
      "Cód": r.cod, "Apellidos y Nombres": r.nombres, "Gerencia": r.gerencia,
      "Unid. Org.": r.unidadOrg, "Año": `Año ${r.anioNum}`,
      "Inicio año laboral": fmtDate(r.anioInicio), "Fin año laboral": fmtDate(r.anioFin),
      "Fecha Inicio": fmtDate(r.inicio), "Fecha Fin": fmtDate(r.fin),
      "Días": r.dias,
      "Estado": r.registrado ? "Registrado" : "No registrado",
      "Por convenio": r.porConvenio ? "Sí" : "No",
    }));
    crearEstiloExcel(filas, encGoces, "Goces Vacaciones", "Goces_Vacaciones.xlsx", { "Apellidos y Nombres": { wch: 30 }, "Gerencia": { wch: 28 } });
  };

  return (
    <div style={{ padding: "28px 32px", maxWidth: 1300, margin: "0 auto" }}>
      {/* Header */}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 24 }}>
        <div>
          <div style={{ fontSize: 22, fontWeight: 800, color: COLORS.texto }}>🏖 Vacaciones Gozadas</div>
          <div style={{ fontSize: 13, color: COLORS.textoMuted, marginTop: 4 }}>Registro de goces vacacionales por colaborador</div>
        </div>
        <button onClick={exportarExcel} style={{
          background: COLORS.accent, color: "#fff", border: "none",
          borderRadius: 10, padding: "10px 20px", cursor: "pointer",
          fontSize: 13, fontWeight: 700, display: "flex", alignItems: "center", gap: 8,
        }}>
          ⬇ Exportar Excel
        </button>
      </div>

      {/* KPIs */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(150px, 1fr))", gap: 14, marginBottom: 24 }}>
        {[
          { label: "Total goces", value: totalGoces, icon: "🏖", color: COLORS.texto },
          { label: "Total días gozados", value: totalDias, icon: "📅", color: COLORS.accentLight },
          { label: "Colaboradores", value: colaboradoresConGoces, icon: "👥", color: COLORS.positivo },
          { label: "Promedio días/goce", value: promedioDias, icon: "📊", color: COLORS.pendiente },

      <div style={{ display: "flex", gap: 12, marginBottom: 12, flexWrap: "wrap" }}>

        <select value={filtroGerencia} onChange={e => { setFiltroGerencia(e.target.value); setFiltroUnidadOrg("Todas"); }}

      <div style={{ display: "flex", gap: 12, marginBottom: 20, flexWrap: "wrap", alignItems: "center" }}>

        <input type="date" value={filtroFechaDesde} onChange={e => setFiltroFechaDesde(e.target.value)}

        <label style={{ fontSize: 12, color: COLORS.textoMuted }}>Hasta:</label>
        <input type="date" value={filtroFechaHasta} onChange={e => setFiltroFechaHasta(e.target.value)}
          style={{ padding: "7px 12px", borderRadius: 8, border: `0.5px solid ${COLORS.border}`, background: COLORS.surface, color: COLORS.texto, fontSize: 12, colorScheme: "light" }} />
        {(filtroFechaDesde || filtroFechaHasta || mesSeleccionado || filtroAnio !== "Todos") && (
          <button onClick={() => { setFiltroFechaDesde(""); setFiltroFechaHasta(""); setMesSeleccionado(null); setFiltroAnio("Todos"); }}
            style={{ padding: "7px 12px", borderRadius: 8, border: `0.5px solid ${COLORS.border}`, background: "transparent", color: COLORS.textoMuted, cursor: "pointer", fontSize: 12 }}>
            ✕ Limpiar filtros
          </button>
        )}
      </div>

      {/* Gráfico de concentración por mes (interactivo) */}
      {(() => {
        const porMes = {};
        for (const r of todosGoces) {
          if (!r.inicio) continue;
          const k = `${r.inicio.getFullYear()}-${String(r.inicio.getMonth()+1).padStart(2,"0")}`;
          if (!porMes[k]) porMes[k] = { goces: 0, dias: 0 };
          porMes[k].goces++;
          porMes[k].dias += r.dias;
        }
        const entries = Object.entries(porMes).sort(([a],[b]) => a.localeCompare(b));
        if (entries.length === 0) return null;
        const maxDias = Math.max(...entries.map(([,d])=>d.dias), 1);
        return (
          <div style={{ background: COLORS.surface, borderRadius: 10, border: `0.5px solid ${COLORS.border}`, padding: "20px 24px", marginBottom: 8 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
              <div style={{ fontSize: 13, fontWeight: 700, color: COLORS.texto }}>
                📊 Concentración de goces por mes
                <span style={{ fontSize: 11, fontWeight: 400, color: COLORS.textoMuted, marginLeft: 10 }}>Clic para filtrar tabla</span>
              </div>
              {mesSeleccionado && <button onClick={() => setMesSeleccionado(null)} style={{ fontSize: 11, color: COLORS.textoMuted, background: "transparent", border: `0.5px solid ${COLORS.border}`, borderRadius: 6, padding: "3px 10px", cursor: "pointer" }}>✕ {MESES[parseInt(mesSeleccionado.split("-")[1])-1]} {mesSeleccionado.split("-")[0]}</button>}
            </div>
            <div style={{ overflowX: "auto" }}>
              <div style={{ display: "flex", gap: 6, alignItems: "flex-end", minWidth: entries.length * 40, height: 110 }}>
                {entries.map(([mes, d]) => {
                  const h = Math.max(4, (d.dias / maxDias) * 90);
                  const activo = mes === mesSeleccionado;
                  const [y, m] = mes.split("-");
                  return (
                    <div key={mes} style={{ flex: "0 0 36px", display: "flex", flexDirection: "column", alignItems: "center", cursor: "pointer" }}
                      onClick={() => setMesSeleccionado(mes === mesSeleccionado ? null : mes)} title={`${MESES[parseInt(m)-1]} ${y}: ${d.dias} días, ${d.goces} goces`}>
                      <div style={{ fontSize: 9, color: activo ? COLORS.texto : COLORS.textoMuted, marginBottom: 2, fontWeight: activo ? 700 : 400 }}>{d.dias}d</div>
                      <div style={{ width: 28, height: h, background: activo ? COLORS.accent : COLORS.accentLight + "88", borderRadius: "4px 4px 0 0", transition: "all 0.2s" }} />
                      <div style={{ fontSize: 8, color: activo ? COLORS.texto : COLORS.textoMuted, marginTop: 3, textAlign: "center", fontWeight: activo ? 700 : 400 }}>
                        {MESES[parseInt(m)-1].slice(0,3)}<br/>{y.slice(2)}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        );
      })()}

      {/* Tabla */}
      {gocesFiltrados.length === 0 ? (
        <div style={{ textAlign: "center", padding: 60, color: COLORS.textoMuted }}>
          <div style={{ fontSize: 40, marginBottom: 12 }}>🏖</div>
          <div style={{ fontSize: 16, fontWeight: 600 }}>No hay goces registrados{mesSeleccionado ? ` en ${MESES[parseInt(mesSeleccionado.split("-")[1])-1]} ${mesSeleccionado.split("-")[0]}` : ""}</div>
        </div>
      ) : (
        <div style={{ background: COLORS.surface, borderRadius: 16, border: `0.5px solid ${COLORS.border}`, overflow: "hidden" }}>
          {/* Cabecera */}
          <div style={{
            display: "grid",
            gridTemplateColumns: "70px 1fr 110px 90px 90px 55px 110px",
            padding: "12px 18px", background: COLORS.surfaceHigh,
            borderBottom: `1px solid ${COLORS.border}`,
            fontSize: 11, fontWeight: 700, color: COLORS.textoMuted, gap: 8,
          }}>
            <span>Cód</span>
            <span>Apellidos y Nombres</span>
            <span>Año que impacta</span>
            <span>Fecha inicio</span>
            <span>Fecha fin</span>
            <span>Días</span>
            <span>Estado</span>
          </div>
          {/* Filas */}
          {gocesFiltrados.map((r, i) => (
            <div key={i} style={{
              display: "grid",
              gridTemplateColumns: "70px 1fr 110px 90px 90px 55px 110px",
              padding: "11px 18px", gap: 8,
              borderBottom: i < gocesFiltrados.length - 1 ? `1px solid ${COLORS.border}` : "none",
              background: i % 2 === 0 ? COLORS.surface : COLORS.bg,
              fontSize: 12, alignItems: "center",
            }}>
              <span style={{ fontWeight: 700, color: COLORS.accentLight }}>{r.cod}</span>
              <div>
                <div style={{ fontWeight: 600, color: COLORS.texto }}>{r.nombres}</div>
                <div style={{ fontSize: 10, color: COLORS.textoMuted }}>{r.gerencia} · {r.unidadOrg}</div>
              </div>
              <div style={{ fontSize: 11, lineHeight: 1.5 }}>
                <div style={{ fontWeight: 700, color: COLORS.accentLight }}>Año {r.anioNum}</div>
                <div style={{ color: "#F97316", fontWeight: 500 }}>{fmtDate(r.anioInicio)}</div>
                <div style={{ color: COLORS.textoMuted }}>al {fmtDate(r.anioFin)}</div>
              </div>
              <span style={{ color: COLORS.textoSecundario }}>{fmtDate(r.inicio)}</span>
              <span style={{ color: COLORS.textoSecundario }}>{fmtDate(r.fin)}</span>
              <span style={{ fontWeight: 800, color: COLORS.accentLight, fontSize: 13 }}>{r.dias}d</span>
              <div style={{ display: "flex", flexDirection: "column", gap: 3 }}>
                <span style={{
                  fontSize: 10, fontWeight: 700, borderRadius: 5, padding: "2px 7px",
                  background: r.registrado ? "rgba(22,163,74,0.1)" : "rgba(220,38,38,0.1)",
                  color: r.registrado ? COLORS.positivo : "#DC2626",
                  border: `1px solid ${r.registrado ? "rgba(22,163,74,0.25)" : "rgba(220,38,38,0.25)"}`,
                  display: "inline-block",
                }}>
                  {r.registrado ? "✅ Registrado" : "❌ No registrado"}
                </span>
                {r.porConvenio && (
                  <span style={{
                    fontSize: 10, fontWeight: 700, borderRadius: 5, padding: "2px 7px",
                    background: "rgba(99,102,241,0.1)", color: "#6366F1",
                    border: "1px solid rgba(99,102,241,0.25)", display: "inline-block",
                  }}>
                    📋 Por convenio
                  </span>
                )}
              </div>
            </div>
          ))}
        </div>
      )}

      <div style={{ marginTop: 12, fontSize: 12, color: COLORS.textoMuted, textAlign: "right" }}>
        {gocesFiltrados.length} registro{gocesFiltrados.length !== 1 ? "s" : ""} · {totalDias} días totales
      </div>
    </div>
  );
}

function PaginaCompras({ colaboradores }) {
  const [busqueda, setBusqueda] = useState("");
  const [filtroGerencia, setFiltroGerencia] = useState("Todas");
  const [filtroUnidadOrg, setFiltroUnidadOrg] = useState("Todas");
  const [filtroAnio, setFiltroAnio] = useState("Todos");
  const [filtroFechaDesde, setFiltroFechaDesde] = useState("");
  const [filtroFechaHasta, setFiltroFechaHasta] = useState("");
  const [mesSeleccionado, setMesSeleccionado] = useState(null);

  // Extraer todas las compras de todos los colaboradores
  const todasCompras = useMemo(() => {
    const rows = [];
    for (const c of colaboradores) {
      for (const p of c.periodos) {
        if (!p.compras || p.compras.length === 0) continue;
        for (const compra of p.compras) {
          rows.push({
            cod: c.cod,
            nombres: c.nombres,
            gerencia: c.gerencia || "—",
            unidadOrg: c.unidadOrg || "—",
            dni: c.dni,
            inicio: compra.inicio,
            fin: compra.fin,
            dias: compra.dias,
            anioLabel: `${fmtDate(p.inicio)} al ${fmtDate(p.fin)}`,
            anioInicio: p.inicio,
            anioFin: p.fin,
            anioVencimiento: p.fechaVencimiento || null,
            registrado: compra.obs ? compra.obs.toLowerCase().includes("con registro") : false,
            estadoAlComprar: (() => {
              if (!compra.inicio || !p.inicio) return null;
              if (compra.inicio <= p.fin) return "TRUNCA";
              if (p.fechaVencimiento && compra.inicio <= p.fechaVencimiento) return "PENDIENTE";
              if (p.fechaVencimiento && compra.inicio > p.fechaVencimiento) return "VENCIDA";
              return null;
            })(),
            periodoAnio: p.anio,
          });
        }
      }
    }
    return rows.sort((a, b) => (a.cod || "").localeCompare(b.cod || ""));
  }, [colaboradores]);

  // Opciones de filtros
  const gerencias = useMemo(() => ["Todas", ...Array.from(new Set(todasCompras.map(r => r.gerencia))).filter(Boolean).sort()], [todasCompras]);
  const unidadesOrg = useMemo(() => {
    const base = filtroGerencia === "Todas" ? todasCompras : todasCompras.filter(r => r.gerencia === filtroGerencia);
    return ["Todas", ...Array.from(new Set(base.map(r => r.unidadOrg))).filter(Boolean).sort()];
  }, [todasCompras, filtroGerencia]);

  // Filtrar
  const aniosDisponibles = useMemo(() => {
    const set = new Set(todasCompras.map(r => r.periodoAnio).filter(Boolean));
    return ["Todos", ...Array.from(set).sort((a,b)=>a-b).map(n=>`Año ${n}`)];
  }, [todasCompras]);

  const comprasFiltradas = useMemo(() => {
    const q = busqueda.toLowerCase().trim();
    return todasCompras.filter(r => {
      const matchBusqueda = !q || r.nombres.toLowerCase().includes(q) || String(r.cod).includes(q);
      const matchGerencia = filtroGerencia === "Todas" || r.gerencia === filtroGerencia;
      const matchUnidad = filtroUnidadOrg === "Todas" || r.unidadOrg === filtroUnidadOrg;
      const matchAnio = filtroAnio === "Todos" || `Año ${r.periodoAnio}` === filtroAnio;
      const matchDesde = !filtroFechaDesde || (r.inicio && r.inicio >= dateOnly(new Date(filtroFechaDesde + "T12:00:00")));
      const matchHasta = !filtroFechaHasta || (r.inicio && r.inicio <= dateOnly(new Date(filtroFechaHasta + "T12:00:00")));
      const matchMes = !mesSeleccionado || (r.inicio && `${r.inicio.getFullYear()}-${String(r.inicio.getMonth()+1).padStart(2,"0")}` === mesSeleccionado);
      // Alerta: compra en período ya vencido
      // Solo es "vencido" si la fecha de compra supera la fechaVencimiento (plazo de goce)
      // Si está dentro del plazo de goce → es Pendiente, no vencido
      r.enPeriodoVencido = r.anioVencimiento && r.inicio && r.inicio > r.anioVencimiento;
      return matchBusqueda && matchGerencia && matchUnidad && matchAnio && matchDesde && matchHasta && matchMes;
    });
  }, [todasCompras, busqueda, filtroGerencia, filtroUnidadOrg, filtroAnio, filtroFechaDesde, filtroFechaHasta, mesSeleccionado]);

  // KPIs
  const totalCompras = comprasFiltradas.length;
  const totalDias = comprasFiltradas.reduce((s, r) => s + r.dias, 0);
  const colaboradoresConCompras = new Set(comprasFiltradas.map(r => r.cod)).size;
  const promedioDias = totalCompras > 0 ? Math.round((totalDias / totalCompras) * 10) / 10 : 0;
  const maxCompra = comprasFiltradas.reduce((max, r) => r.dias > (max?.dias ?? 0) ? r : max, null);

  // Exportar Excel
  const exportarExcel = () => {
    const encCompras = ["Cód","Apellidos y Nombres","Gerencia","Unid. Org.","Mes de compra","Estado","Días","Año que impacta"];
    const filas = comprasFiltradas.map(r => ({
      "Cód": r.cod, "Apellidos y Nombres": r.nombres, "Gerencia": r.gerencia,
