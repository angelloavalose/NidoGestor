      "Unid. Org.": r.unidadOrg, "Mes de compra": fmtMesAnio(r.inicio),
      "Estado": r.registrado ? "Registrado" : "No registrado",
      "Días": r.dias, "Año que impacta": r.anioLabel,
    }));
    crearEstiloExcel(filas, encCompras, "Compras Vacaciones", "Compras_Vacaciones.xlsx", { "Apellidos y Nombres": { wch: 30 }, "Gerencia": { wch: 28 } });
  };

  return (
    <div style={{ padding: "28px 32px", maxWidth: 1200, margin: "0 auto" }}>
      {/* Header */}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 24 }}>
        <div>
          <div style={{ fontSize: 22, fontWeight: 800, color: COLORS.texto }}>🛒 Compras de Vacaciones</div>
          <div style={{ fontSize: 13, color: COLORS.textoMuted, marginTop: 4 }}>Registro de días de vacaciones comprados por colaborador</div>
        </div>
        <button onClick={exportarExcel} style={{
          background: COLORS.accent, color: "#fff", border: "none",
          borderRadius: 10, padding: "10px 20px", cursor: "pointer",
          fontSize: 13, fontWeight: 700, display: "flex", alignItems: "center", gap: 8,
        }}>
          ⬇ Exportar Excel
        </button>
      </div>

      {/* KPIs */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(160px, 1fr))", gap: 14, marginBottom: 24 }}>
        {[
          { label: "Total compras", value: totalCompras, icon: "🛒", color: COLORS.texto },
          { label: "Total días comprados", value: totalDias, icon: "📅", color: COLORS.accentLight },
          { label: "Colaboradores", value: colaboradoresConCompras, icon: "👥", color: COLORS.positivo },
          { label: "Promedio días/compra", value: promedioDias, icon: "📊", color: COLORS.pendiente },
          { label: "Compra más alta", value: maxCompra ? `${maxCompra.dias}d` : "—", icon: "🏆", color: "#F97316", sub: maxCompra?.nombres?.split(" ").slice(0,2).join(" ") },
        ].map((k, i) => (
          <div key={i} style={{
            background: COLORS.surface, borderRadius: 14, padding: "16px 18px",
            border: `0.5px solid ${COLORS.border}`,
          }}>
            <div style={{ fontSize: 11, color: COLORS.textoMuted, fontWeight: 600, marginBottom: 4 }}>{k.icon} {k.label}</div>
            <div style={{ fontSize: 24, fontWeight: 800, color: k.color }}>{k.value}</div>
            {k.sub && <div style={{ fontSize: 10, color: COLORS.textoMuted, marginTop: 2 }}>{k.sub}</div>}
          </div>
        ))}
      </div>

      {/* Filtros */}
      <div style={{ display: "flex", gap: 12, marginBottom: 12, flexWrap: "wrap" }}>
        <input value={busqueda} onChange={e => setBusqueda(e.target.value)} placeholder="🔍 Buscar por nombre o código..."
          style={{ flex: 1, minWidth: 220, padding: "9px 14px", borderRadius: 10, border: `0.5px solid ${COLORS.border}`, background: COLORS.surface, color: COLORS.texto, fontSize: 13, outline: "none" }} />
        <select value={filtroGerencia} onChange={e => { setFiltroGerencia(e.target.value); setFiltroUnidadOrg("Todas"); }}
          style={{ padding: "9px 14px", borderRadius: 10, border: `0.5px solid ${COLORS.border}`, background: COLORS.surface, color: COLORS.texto, fontSize: 13, cursor: "pointer" }}>
          {gerencias.map(g => <option key={g}>{g}</option>)}
        </select>
        <select value={filtroUnidadOrg} onChange={e => setFiltroUnidadOrg(e.target.value)}
          style={{ padding: "9px 14px", borderRadius: 10, border: `0.5px solid ${COLORS.border}`, background: COLORS.surface, color: COLORS.texto, fontSize: 13, cursor: "pointer" }}>
          {unidadesOrg.map(u => <option key={u}>{u}</option>)}
        </select>
        <select value={filtroAnio} onChange={e => setFiltroAnio(e.target.value)}
          style={{ padding: "9px 14px", borderRadius: 10, border: `0.5px solid ${COLORS.border}`, background: COLORS.surface, color: COLORS.texto, fontSize: 13, cursor: "pointer" }}>
          {aniosDisponibles.map(a => <option key={a}>{a}</option>)}
        </select>
      </div>
      <div style={{ display: "flex", gap: 12, marginBottom: 20, flexWrap: "wrap", alignItems: "center" }}>
        <label style={{ fontSize: 12, color: COLORS.textoMuted }}>Desde:</label>
        <input type="date" value={filtroFechaDesde} onChange={e => setFiltroFechaDesde(e.target.value)}
          style={{ padding: "7px 12px", borderRadius: 8, border: `0.5px solid ${COLORS.border}`, background: COLORS.surface, color: COLORS.texto, fontSize: 12, colorScheme: "light" }} />
        <label style={{ fontSize: 12, color: COLORS.textoMuted }}>Hasta:</label>
        <input type="date" value={filtroFechaHasta} onChange={e => setFiltroFechaHasta(e.target.value)}
          style={{ padding: "7px 12px", borderRadius: 8, border: `0.5px solid ${COLORS.border}`, background: COLORS.surface, color: COLORS.texto, fontSize: 12, colorScheme: "light" }} />
        {(filtroFechaDesde || filtroFechaHasta || mesSeleccionado || filtroAnio !== "Todos") && (
          <button onClick={() => { setFiltroFechaDesde(""); setFiltroFechaHasta(""); setMesSeleccionado(null); setFiltroAnio("Todos"); }}
            style={{ padding: "7px 12px", borderRadius: 8, border: `0.5px solid ${COLORS.border}`, background: "transparent", color: COLORS.textoMuted, cursor: "pointer", fontSize: 12 }}>
            ✕ Limpiar filtros
          </button>
        )}
      </div>

      {/* Gráfico interactivo por mes */}
      {(() => {
        const porMes = {};
        for (const r of todasCompras) {
          if (!r.inicio) continue;
          const k = `${r.inicio.getFullYear()}-${String(r.inicio.getMonth()+1).padStart(2,"0")}`;
          if (!porMes[k]) porMes[k] = { compras: 0, dias: 0 };
          porMes[k].compras++;
          porMes[k].dias += r.dias;
        }
        const entries = Object.entries(porMes).sort(([a],[b]) => a.localeCompare(b));
        if (entries.length === 0) return null;
        const maxDias = Math.max(...entries.map(([,d])=>d.dias), 1);
        return (
          <div style={{ background: COLORS.surface, borderRadius: 10, border: `0.5px solid ${COLORS.border}`, padding: "20px 24px", marginBottom: 8 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
              <div style={{ fontSize: 13, fontWeight: 700, color: COLORS.texto }}>
                📊 Concentración de compras por mes
                <span style={{ fontSize: 11, fontWeight: 400, color: COLORS.textoMuted, marginLeft: 10 }}>Clic para filtrar tabla</span>
              </div>
              {mesSeleccionado && <button onClick={() => setMesSeleccionado(null)} style={{ fontSize: 11, color: COLORS.textoMuted, background: "transparent", border: `0.5px solid ${COLORS.border}`, borderRadius: 6, padding: "3px 10px", cursor: "pointer" }}>✕ Limpiar mes</button>}
            </div>
            <div style={{ overflowX: "auto" }}>
              <div style={{ display: "flex", gap: 6, alignItems: "flex-end", minWidth: entries.length * 40, height: 110 }}>
                {entries.map(([mes, d]) => {
                  const h = Math.max(4, (d.dias / maxDias) * 90);
                  const activo = mes === mesSeleccionado;
                  const [y, m] = mes.split("-");
                  return (
                    <div key={mes} style={{ flex: "0 0 36px", display: "flex", flexDirection: "column", alignItems: "center", cursor: "pointer" }}
                      onClick={() => setMesSeleccionado(mes === mesSeleccionado ? null : mes)} title={`${MESES[parseInt(m)-1]} ${y}: ${d.dias} días, ${d.compras} compras`}>
                      <div style={{ fontSize: 9, color: activo ? COLORS.texto : COLORS.textoMuted, marginBottom: 2, fontWeight: activo ? 700 : 400 }}>{d.dias}d</div>
                      <div style={{ width: 28, height: h, background: activo ? "#EA580C" : "#F97316aa", borderRadius: "4px 4px 0 0", transition: "all 0.2s" }} />
                      <div style={{ fontSize: 8, color: activo ? COLORS.texto : COLORS.textoMuted, marginTop: 3, textAlign: "center", fontWeight: activo ? 700 : 400 }}>
                        {MESES[parseInt(m)-1].slice(0,3)}<br/>{y.slice(2)}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        );
      })()}

      {/* Tabla */}
      {comprasFiltradas.length === 0 ? (
        <div style={{ textAlign: "center", padding: 60, color: COLORS.textoMuted }}>
          <div style={{ fontSize: 40, marginBottom: 12 }}>🛒</div>
          <div style={{ fontSize: 16, fontWeight: 600 }}>No hay compras registradas</div>
        </div>
      ) : (
        <div style={{ background: COLORS.surface, borderRadius: 16, border: `0.5px solid ${COLORS.border}`, overflow: "hidden" }}>
          {/* Cabecera */}
          <div style={{
            display: "grid",
            gridTemplateColumns: "80px 1fr 130px 60px 130px 100px 110px",
            padding: "12px 18px", background: COLORS.surfaceHigh,
            borderBottom: `1px solid ${COLORS.border}`,
            fontSize: 11, fontWeight: 700, color: COLORS.textoMuted, gap: 8,
          }}>
            <span>Cód</span>
            <span>Apellidos y Nombres</span>
            <span>Año que impacta</span>
            <span>Días</span>
            <span>Mes de compra</span>
            <span>Gerencia</span>
            <span>Estado</span>
          </div>
          {/* Filas */}
          {comprasFiltradas.map((r, i) => (
            <div key={i} style={{
              display: "grid",
              gridTemplateColumns: "80px 1fr 130px 60px 130px 100px 110px",
              padding: "11px 18px", gap: 8,
              borderBottom: i < comprasFiltradas.length - 1 ? `1px solid ${COLORS.border}` : "none",
              background: i % 2 === 0 ? COLORS.surface : COLORS.bg,
              fontSize: 12, alignItems: "center",
            }}>
              <span style={{ fontWeight: 700, color: COLORS.accentLight }}>{r.cod}</span>
              <div>
                <div style={{ fontWeight: 600, color: COLORS.texto }}>{r.nombres}</div>
                <div style={{ fontSize: 10, color: COLORS.textoMuted }}>{r.gerencia} · {r.unidadOrg}</div>
              </div>
              <div style={{ fontSize: 11, color: "#F97316", fontWeight: 600, lineHeight: 1.5 }}>
                <div>{fmtDate(r.anioInicio)}</div>
                <div style={{ color: COLORS.textoMuted, fontWeight: 400 }}>al {fmtDate(r.anioFin)}</div>
              </div>
              <span style={{ fontWeight: 800, color: "#F97316", fontSize: 14 }}>{r.dias}d</span>
              <span style={{ color: COLORS.textoSecundario, fontWeight: 500 }}>{fmtMesAnio(r.inicio)}</span>
              <span style={{ fontSize: 10, color: COLORS.textoMuted }}>{r.gerencia}</span>
              <div style={{ display: "flex", flexDirection: "column", gap: 3 }}>
                <span style={{
                  fontSize: 11, fontWeight: 700, borderRadius: 6, padding: "2px 8px",
                  background: r.registrado ? "rgba(22,163,74,0.1)" : "rgba(220,38,38,0.1)",
                  color: r.registrado ? COLORS.positivo : "#DC2626",
                  border: `1px solid ${r.registrado ? "rgba(22,163,74,0.25)" : "rgba(220,38,38,0.25)"}`,
                  display: "inline-block",
                }}>
                  {r.registrado ? "✅ Registrado" : "❌ No registrado"}
                </span>
                {r.estadoAlComprar && (() => {
                  const cfg = {
                    TRUNCA:   { label: "Trunco al comprar",   bg: "rgba(139,92,246,0.1)", color: "#8B5CF6", border: "rgba(139,92,246,0.25)" },
                    PENDIENTE:{ label: "Pendiente al comprar",bg: "rgba(245,158,11,0.1)", color: "#D97706", border: "rgba(245,158,11,0.25)" },
                    VENCIDA:  { label: "Vencido al comprar",  bg: "rgba(220,38,38,0.1)",  color: "#DC2626", border: "rgba(220,38,38,0.25)" },
                  }[r.estadoAlComprar];
                  return cfg ? (
                    <span style={{ fontSize: 10, fontWeight: 700, borderRadius: 5, padding: "2px 7px", background: cfg.bg, color: cfg.color, border: `1px solid ${cfg.border}`, display: "inline-block" }}>
                      {cfg.label}
                    </span>
                  ) : null;
                })()}
              </div>
            </div>
          ))}
        </div>
      )}

      <div style={{ marginTop: 12, fontSize: 12, color: COLORS.textoMuted, textAlign: "right" }}>
        {comprasFiltradas.length} registro{comprasFiltradas.length !== 1 ? "s" : ""} · {totalDias} días totales
      </div>
    </div>
  );
}


// ─── MÓDULO: DETALLE DEL COLABORADOR (igual al modal PeriodosDetalle) ────────
function DetalleColaborador({ colab }) {
  const [goceSeleccionado, setGoceSeleccionado] = useState(null);
  const [compraSeleccionada, setCompraSeleccionada] = useState(null);

  // Exportar Excel con detalle completo del colaborador
  const exportarDetalleExcel = () => {
    // ── Hoja 1: Resumen + KPIs ──
    const wb = XLSX.utils.book_new();

    // Hoja 1: Períodos
    const filasP = [];
    for (const p of [...colab.periodos].reverse()) {
      const cfg = TIPO_CONFIG[p.tipo] || TIPO_CONFIG.TRUNCA;
      filasP.push({
        "Período": p.esAjuste ? "P0 – Ajuste" : `Año ${p.anio}`,
        "Tipo": cfg.label,
        "Inicio": p.inicio ? fmtDate(p.inicio) : "—",
        "Fin": p.fin ? fmtDate(p.fin) : "—",
        "Gozar hasta": p.fechaVencimiento ? fmtDate(p.fechaVencimiento) : "—",
        "Vence el": p.fechaVencimiento ? fmtDate(new Date(p.fechaVencimiento.getTime() + 86400000)) : "—",
        "Base (días)": p.diasBase,
        "Gozado": p.diasGozados,
        "Comprado": p.diasComprados || 0,
        "Indemnización": p.tipo === "INDEMNIZACION" && p.diasIndemnizacionBruta !== null ? p.diasIndemnizacionBruta : "",
        "Saldo": Math.round(p.saldo * 100) / 100,
        "Ampliado (días)": p.diasExtension || 0,
        "Obs": p.obs || "",
      });
    }

    const encP = ["Período","Tipo","Inicio","Fin","Gozar hasta","Vence el","Base (días)","Gozado","Comprado","Indemnización","Saldo","Ampliado (días)","Obs"];
    const aoaP = [
      // Cabecera del colaborador
      [`DETALLE VACACIONAL — ${colab.nombres}`],
      [`Cód: ${colab.cod}  |  DNI: ${colab.doc}  |  ${colab.gerencia}  |  ${colab.unidadOrg}`],
      [`Fecha de Corte: ${fmtDate(colab.fechaCorte)}  |  Fecha de Ingreso: ${fmtDate(colab.feIngreso)}`],
      [],
      // KPIs
      ["RESUMEN","","","","","",""],
      ["Total ganados","Total gozados","Comprado","Por gozar","Indemnización","Total vencidas",""],
      [
        Math.round(colab.totalGanados * 100) / 100,
        Math.round(colab.totalGozados * 100) / 100,
        Math.round((colab.totalComprados || 0) * 100) / 100,
        Math.round(colab.totalPorGozar * 100) / 100,
        Math.round(((colab.diasIndemnizacion || 0) + (colab.diasVencidas || 0)) * 100) / 100,
        Math.round((colab.totalVencidas || 0) * 100) / 100,
        "",
      ],
      [],
      // Encabezado de períodos
      encP,
      ...filasP.map(f => encP.map(h => f[h] ?? "")),
    ];

    const wsP = XLSX.utils.aoa_to_sheet(aoaP);
    wsP["!cols"] = [14,12,12,12,14,12,10,8,8,12,8,14,20].map(w => ({ wch: w }));

    // Estilos fila título
    const applyStyle = (addr, s) => { if (!wsP[addr]) wsP[addr] = { v: "", t: "s" }; wsP[addr].s = s; };
    const hdrStyle = { font: { bold: true, sz: 13, color: { rgb: "FFFFFF" } }, fill: { fgColor: { rgb: "1A5C2E" } }, alignment: { horizontal: "left" } };
    applyStyle("A1", hdrStyle); applyStyle("A2", { font: { sz: 11 }, fill: { fgColor: { rgb: "F0FDF4" } } });
    applyStyle("A3", { font: { sz: 11 }, fill: { fgColor: { rgb: "F0FDF4" } } });

    // Estilo fila KPI labels (fila 6 = índice 5)
    const kpiLabelStyle = { font: { bold: true, sz: 10, color: { rgb: "6B7280" } }, alignment: { horizontal: "center" } };
    ["A","B","C","D","E","F"].forEach(col => applyStyle(`${col}6`, kpiLabelStyle));

    // Estilo fila KPI valores (fila 7 = índice 6)
    [
      ["A7", "111827"], ["B7", "166534"], ["C7", "F97316"],
      ["D7", "16A34A"], ["E7", "F97316"], ["F7", "DC2626"],
    ].forEach(([addr, rgb]) => applyStyle(addr, { font: { bold: true, sz: 14, color: { rgb } }, alignment: { horizontal: "center" } }));

    // Encabezado de tabla períodos (fila 9 = índice 8)
    encP.forEach((_, ci) => {
      const addr = XLSX.utils.encode_cell({ r: 8, c: ci });
      applyStyle(addr, { font: { bold: true, sz: 11, color: { rgb: "FFFFFF" } }, fill: { fgColor: { rgb: "1A5C2E" } }, alignment: { horizontal: "center" }, border: { bottom: { style: "thin", color: { rgb: "14472A" } } } });
    });

    // Estilos filas de datos de períodos
    filasP.forEach((f, ri) => {
      const r = 9 + ri;
      encP.forEach((h, ci) => {
        const addr = XLSX.utils.encode_cell({ r, c: ci });
        const val = f[h];
        let fillRgb = ri % 2 === 0 ? "FFFFFF" : "F9FAFB";
        let textRgb = "111827";
        let bold = false;
        if (h === "Tipo") {
          if (f["Tipo"] === "Vencida")        { fillRgb = "FEF2F2"; textRgb = "DC2626"; bold = true; }
          else if (f["Tipo"] === "Indemnización") { fillRgb = "FFF7ED"; textRgb = "F97316"; bold = true; }
          else if (f["Tipo"] === "Pendiente") { fillRgb = "FFFBEB"; textRgb = "D97706"; bold = true; }
          else if (f["Tipo"] === "Trunca")    { fillRgb = "F5F3FF"; textRgb = "7C3AED"; bold = true; }
        }
        if (h === "Saldo" && typeof val === "number" && val > 0) { textRgb = "16A34A"; bold = true; }
        if (h === "Indemnización" && typeof val === "number" && val > 0) { textRgb = "F97316"; bold = true; }
        applyStyle(addr, { font: { sz: 11, color: { rgb: textRgb }, bold }, fill: { fgColor: { rgb: fillRgb } }, alignment: { horizontal: typeof val === "number" ? "right" : "left" }, border: { bottom: { style: "thin", color: { rgb: "E5E7EB" } } } });
      });
    });

    wsP["!rows"] = [{ hpt: 22 }, { hpt: 18 }, { hpt: 18 }, { hpt: 8 }, { hpt: 16 }, { hpt: 18 }, { hpt: 22 }, { hpt: 8 }, { hpt: 24 }, ...filasP.map(() => ({ hpt: 20 }))];
    XLSX.utils.book_append_sheet(wb, wsP, "Períodos");

    // ── Hoja 2: Goces detallados ──
    const filasG = [];
    for (const p of [...colab.periodos].reverse()) {
      for (const g of p.goces) {
        filasG.push({
          "Período": p.esAjuste ? "P0" : `Año ${p.anio}`,
          "Tipo período": (TIPO_CONFIG[p.tipo] || TIPO_CONFIG.TRUNCA).label,
          "Fecha inicio": fmtDate(g.inicio),
          "Fecha fin": fmtDate(g.fin),
          "Días gozados": g.dias,
          "Obs": g.obs || "",
          "Por convenio": g.porAcuerdo ? "Sí" : "No",
          "Desde truncas": g.consumoDesdeTracas ? "Sí" : "No",
          "Saldo antes": g.saldoAntes?.toFixed(2) ?? "",
          "Saldo después": g.saldoDespues?.toFixed(2) ?? "",
        });
      }
    }

    const encG = ["Período","Tipo período","Fecha inicio","Fecha fin","Días gozados","Obs","Por convenio","Desde truncas","Saldo antes","Saldo después"];
    const aoaG = [encG, ...filasG.map(f => encG.map(h => f[h] ?? ""))];
    const wsG = XLSX.utils.aoa_to_sheet(aoaG);
    wsG["!cols"] = [10,12,12,12,12,20,12,12,12,12].map(w => ({ wch: w }));
    encG.forEach((_, ci) => {
      const addr = XLSX.utils.encode_cell({ r: 0, c: ci });
      if (!wsG[addr]) wsG[addr] = { v: "", t: "s" };
      wsG[addr].s = { font: { bold: true, sz: 11, color: { rgb: "FFFFFF" } }, fill: { fgColor: { rgb: "1A5C2E" } }, alignment: { horizontal: "center" } };
    });
    wsG["!rows"] = [{ hpt: 24 }, ...filasG.map(() => ({ hpt: 20 }))];
    XLSX.utils.book_append_sheet(wb, wsG, "Goces");

    // ── Hoja 3: Compras ──
    const filasC = [];
    for (const p of [...colab.periodos].reverse()) {
      for (const c of (p.compras || [])) {
        filasC.push({
          "Período": p.esAjuste ? "P0" : `Año ${p.anio}`,
          "Tipo período": (TIPO_CONFIG[p.tipo] || TIPO_CONFIG.TRUNCA).label,
          "Fecha": fmtDate(c.inicio),
          "Días comprados": c.dias,
          "Obs": c.obs || "",
        });
      }
    }
    if (filasC.length > 0) {
      const encC = ["Período","Tipo período","Fecha","Días comprados","Obs"];
      const aoaC = [encC, ...filasC.map(f => encC.map(h => f[h] ?? ""))];
      const wsC = XLSX.utils.aoa_to_sheet(aoaC);
      wsC["!cols"] = [10,12,12,14,20].map(w => ({ wch: w }));
      encC.forEach((_, ci) => {
        const addr = XLSX.utils.encode_cell({ r: 0, c: ci });
        if (!wsC[addr]) wsC[addr] = { v: "", t: "s" };
        wsC[addr].s = { font: { bold: true, sz: 11, color: { rgb: "FFFFFF" } }, fill: { fgColor: { rgb: "F97316" } }, alignment: { horizontal: "center" } };
      });
      XLSX.utils.book_append_sheet(wb, wsC, "Compras");
    }

    const nombre = colab.nombres.replace(/[^a-zA-Z0-9]/g, "_").slice(0, 30);
    XLSX.writeFile(wb, `Detalle_${nombre}_${colab.cod}.xlsx`);
  };

  // ── Exportar tabla plana (Código | Nombre | Período | ...) ──
  const exportarTablaPlana = () => {
    const encTP = ["Código","Apellidos y Nombres","Período","Tipo","Inicio","Fin","Gozar hasta","Vence el","Base (días)","Gozado","Comprado","Indemnización","Saldo","Ampliado (días)","Obs"];
    const filas = [];
    for (const p of [...colab.periodos].reverse()) {
      const cfg = TIPO_CONFIG[p.tipo] || TIPO_CONFIG.TRUNCA;
      filas.push({
        "Código": colab.cod,
        "Apellidos y Nombres": colab.nombres,
        "Período": p.esAjuste ? "P0 – Ajuste" : `Año ${p.anio}`,
        "Tipo": cfg.label,
        "Inicio": p.inicio ? fmtDate(p.inicio) : "—",
        "Fin": p.fin ? fmtDate(p.fin) : "—",
        "Gozar hasta": p.fechaVencimiento ? fmtDate(p.fechaVencimiento) : "—",
        "Vence el": p.fechaVencimiento ? fmtDate(new Date(p.fechaVencimiento.getTime() + 86400000)) : "—",
        "Base (días)": p.diasBase,
        "Gozado": p.diasGozados,
        "Comprado": p.diasComprados || 0,
        "Indemnización": p.tipo === "INDEMNIZACION" && p.diasIndemnizacionBruta !== null ? p.diasIndemnizacionBruta : "",
        "Saldo": Math.round(p.saldo * 100) / 100,
        "Ampliado (días)": p.diasExtension || 0,
        "Obs": p.obs || "",
      });
    }
    const wb = XLSX.utils.book_new();
    const aoa = [encTP, ...filas.map(f => encTP.map(h => f[h] ?? ""))];
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws["!cols"] = [10,28,10,14,12,12,14,12,10,8,8,12,8,14,20].map(w => ({ wch: w }));
    // Estilo encabezado
    encTP.forEach((_, ci) => {
      const addr = XLSX.utils.encode_cell({ r: 0, c: ci });
      if (!ws[addr]) ws[addr] = { v: "", t: "s" };
      ws[addr].s = { font: { bold: true, sz: 11, color: { rgb: "FFFFFF" } }, fill: { fgColor: { rgb: "1A5C2E" } }, alignment: { horizontal: "center" } };
    });
    // Estilos filas de datos
    filas.forEach((f, ri) => {
      const r = 1 + ri;
      encTP.forEach((h, ci) => {
        const addr = XLSX.utils.encode_cell({ r, c: ci });
        const val = f[h];
        let fillRgb = ri % 2 === 0 ? "FFFFFF" : "F9FAFB";
        let textRgb = "111827"; let bold = false;
        if (h === "Tipo") {
          if (f["Tipo"] === "Vencida")           { fillRgb = "FEF2F2"; textRgb = "DC2626"; bold = true; }
          else if (f["Tipo"] === "Indemnización") { fillRgb = "FFF7ED"; textRgb = "F97316"; bold = true; }
          else if (f["Tipo"] === "Pendiente")    { fillRgb = "FFFBEB"; textRgb = "D97706"; bold = true; }
          else if (f["Tipo"] === "Trunca")       { fillRgb = "F5F3FF"; textRgb = "7C3AED"; bold = true; }
        }
        if (h === "Saldo" && typeof val === "number" && val > 0) { textRgb = "16A34A"; bold = true; }
        if (h === "Indemnización" && typeof val === "number" && val > 0) { textRgb = "F97316"; bold = true; }
        if (!ws[addr]) ws[addr] = { v: val ?? "", t: typeof val === "number" ? "n" : "s" };
        ws[addr].s = { font: { sz: 11, color: { rgb: textRgb }, bold }, fill: { fgColor: { rgb: fillRgb } }, alignment: { horizontal: typeof val === "number" ? "right" : "left" }, border: { bottom: { style: "thin", color: { rgb: "E5E7EB" } } } };
      });
    });
    ws["!rows"] = [{ hpt: 24 }, ...filas.map(() => ({ hpt: 20 }))];
    XLSX.utils.book_append_sheet(wb, ws, "Períodos");
    const nombre = colab.nombres.replace(/[^a-zA-Z0-9]/g, "_").slice(0, 30);
    XLSX.writeFile(wb, `Tabla_${nombre}_${colab.cod}.xlsx`);
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      {/* Header con botones exportar */}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 10 }}>
        <div>
          <div style={{ fontSize: 20, fontWeight: 700, color: COLORS.texto }}>{colab.nombres}</div>
          <div style={{ fontSize: 13, color: COLORS.textoMuted, marginTop: 4 }}>
            Cód: {colab.cod} · DNI: {colab.doc} · {colab.gerencia}
          </div>
          <div style={{ display: "flex", gap: 20, marginTop: 6, flexWrap: "wrap" }}>
            <div style={{ fontSize: 12, color: COLORS.textoSecundario }}>
              <span style={{ color: COLORS.textoMuted }}>Fecha de Ingreso: </span>
              <strong>{fmtDate(colab.feIngreso)}</strong>
              {colab.feIngreso && colab.fechaCorte &&
                colab.feIngreso.getTime() !== colab.fechaCorte.getTime() && (
                <span style={{ marginLeft: 6, background: "rgba(139,92,246,0.12)", color: "#A78BFA", borderRadius: 4, padding: "1px 6px", fontSize: 11, fontWeight: 600 }}>Reingreso</span>
              )}
            </div>
            <div style={{ fontSize: 12, color: COLORS.textoSecundario }}>
              <span style={{ color: COLORS.textoMuted }}>Fecha de Corte: </span>
              <strong style={{ color: COLORS.accentLight }}>{fmtDate(colab.fechaCorte)}</strong>
            </div>
          </div>
        </div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <button onClick={exportarDetalleExcel} style={{
            background: "#F0FDF4", border: "1px solid #86EFAC",
            color: COLORS.positivo, borderRadius: 10, padding: "10px 18px",
            cursor: "pointer", fontSize: 12, fontWeight: 700,
            display: "flex", alignItems: "center", gap: 6,
          }}>⬇ Exportar detalle</button>
          <button onClick={exportarTablaPlana} style={{
            background: "#EFF6FF", border: "1px solid #93C5FD",
            color: "#1D4ED8", borderRadius: 10, padding: "10px 18px",
            cursor: "pointer", fontSize: 12, fontWeight: 700,
            display: "flex", alignItems: "center", gap: 6,
          }}>⬇ Tabla plana</button>
        </div>
      </div>

      {/* KPIs */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(6, 1fr)", gap: 10 }}>
        {[
          ["Total ganados",   colab.totalGanados,                                              COLORS.texto],
          ["Total gozados",   colab.totalGozados,                                              COLORS.accentLight],
          ["Comprado",        colab.totalComprados || 0,                                       "#F97316"],
          ["Por gozar",       colab.totalPorGozar,                                             COLORS.positivo],
          ["Indemnización",   (colab.diasIndemnizacion || 0) + (colab.diasVencidas || 0),      "#F97316"],
          ["Total vencidas",  colab.totalVencidas || 0,                                        "#DC2626"],
        ].map(([l, v, c]) => (
          <div key={l} style={{
            background: COLORS.surfaceHigh, borderRadius: 10,
            padding: "12px 14px", border: `0.5px solid ${COLORS.border}`,
            textAlign: "center",
          }}>
            <div style={{ fontSize: 11, color: COLORS.textoMuted, marginBottom: 4 }}>{l}</div>
            <div style={{ fontSize: 20, fontWeight: 700, color: c }}>{Math.round(v * 100) / 100}</div>
          </div>
        ))}
      </div>

      {/* Estructura de períodos */}
      <div style={{ fontSize: 13, fontWeight: 600, color: COLORS.textoMuted, letterSpacing: "0.05em", textTransform: "uppercase" }}>
        Estructura de Períodos
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {[...colab.periodos].reverse().map((p) => {
          const cfg = TIPO_CONFIG[p.tipo] || TIPO_CONFIG.TRUNCA;
          const neg = p.saldo < 0;
          return (
            <div key={p.id} style={{
              background: COLORS.surfaceHigh, borderRadius: 12,
              border: `1px solid ${neg ? "#EF444444" : COLORS.border}`,
              overflow: "hidden",
            }}>
              <div style={{
                display: "flex", alignItems: "center", gap: 12,
                padding: "14px 18px",
                borderLeft: `4px solid ${cfg.color}`,
              }}>
                <Badge tipo={p.tipo} small />
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 13, color: COLORS.texto, fontWeight: 600 }}>
                    {p.esAjuste
                      ? `Año 0 — Ajuste Vacacional${p.obs ? ` (${p.obs})` : ""}`
                      : `Año ${p.anio} — ${fmtDate(p.inicio)} al ${fmtDate(p.fin)}`}
                  </div>
                  {p.fechaVencimiento && (() => {
                    const venceEl = new Date(p.fechaVencimiento.getTime() + 86400000);
                    return (
                      <div style={{ fontSize: 11, color: COLORS.textoMuted, marginTop: 3, display: "flex", gap: 12, flexWrap: "wrap" }}>
                        <span>Gozar hasta: <strong style={{ color: COLORS.textoSecundario }}>{fmtDate(p.fechaVencimiento)}</strong></span>
                        <span>Vence el: <strong style={{ color: p.tipo === "PENDIENTE" ? "#F59E0B" : p.tipo === "VENCIDA" ? "#EF4444" : "#F97316" }}>{fmtDate(venceEl)}</strong></span>
                      </div>
                    );
                  })()}
                  {p.diasExtension > 0 && (
                    <div style={{ marginTop: 4, display: "inline-flex", alignItems: "center", gap: 5, background: "rgba(217,119,6,0.08)", border: "1px solid rgba(217,119,6,0.25)", borderRadius: 6, padding: "2px 8px" }}>
                      <span style={{ fontSize: 10 }}>⏳</span>
                      <span style={{ fontSize: 11, color: COLORS.pendiente, fontWeight: 600 }}>
                        Ampliado +{p.diasExtension} días por Subsidio Enfermedad (D.L. 713)
                      </span>
                    </div>
                  )}
                </div>
                <div style={{ display: "flex", gap: 16, alignItems: "center" }}>
                  <div style={{ textAlign: "center" }}>
                    <div style={{ fontSize: 10, color: COLORS.textoMuted }}>Base</div>
                    <div style={{ fontSize: 14, fontWeight: 600, color: COLORS.texto }}>{p.diasBase}</div>
                  </div>
                  {(p.diasComprados || 0) > 0 && (
                    <div style={{ textAlign: "center" }}>
                      <div style={{ fontSize: 10, color: COLORS.textoMuted }}>Comprado</div>
                      <div style={{ fontSize: 14, fontWeight: 600, color: "#F97316" }}>{p.diasComprados}</div>
                    </div>
                  )}
                  <div style={{ textAlign: "center" }}>
                    <div style={{ fontSize: 10, color: COLORS.textoMuted }}>Gozado</div>
                    <div style={{ fontSize: 14, fontWeight: 600, color: COLORS.accentLight }}>{p.diasGozados}</div>
                  </div>
                  {p.tipo === "INDEMNIZACION" && p.diasIndemnizacionBruta !== null && (
                    <div style={{ textAlign: "center" }}>
                      <div style={{ fontSize: 10, color: COLORS.textoMuted }}>Indemn.</div>
                      <div style={{ fontSize: 14, fontWeight: 600, color: p.diasIndemnizacionBruta >= 0 ? "#F97316" : "#EF4444" }}>
                        {p.diasIndemnizacionBruta >= 0 ? "" : "▼ "}{Math.abs(p.diasIndemnizacionBruta).toFixed(2)}
                      </div>
                    </div>
                  )}
                  <div style={{ textAlign: "center" }}>
                    <div style={{ fontSize: 10, color: COLORS.textoMuted }}>Saldo</div>
                    <SaldoBadge saldo={p.saldo} />
                  </div>
                </div>
              </div>

              {/* Goces */}
              {p.goces.length > 0 && (
                <div style={{ padding: "0 18px 14px", display: "flex", flexDirection: "column", gap: 6 }}>
                  <div style={{ fontSize: 11, color: COLORS.textoMuted, fontWeight: 600, marginBottom: 4, marginTop: 4 }}>
                    GOCES EN ESTE PERÍODO ({p.goces.length})
                  </div>
                  {p.goces.map((g, gi) => (
                    <div key={gi} onClick={() => setGoceSeleccionado(g)}
                      style={{
                        display: "flex", justifyContent: "space-between", alignItems: "center",
                        padding: "8px 12px", background: COLORS.bg,
                        borderRadius: 8, border: `0.5px solid ${COLORS.border}`,
                        cursor: "pointer",
                      }}
                      onMouseEnter={(e) => e.currentTarget.style.background = COLORS.surfaceHigh}
                      onMouseLeave={(e) => e.currentTarget.style.background = COLORS.bg}
                    >
                      <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
                        <span style={{ fontSize: 12, color: COLORS.textoSecundario }}>{fmtDate(g.inicio)} → {fmtDate(g.fin)}</span>
                        {g.obs && <span style={{ fontSize: 10, background: "rgba(16,185,129,0.12)", color: "#10B981", borderRadius: 4, padding: "1px 6px", fontWeight: 600 }}>{g.obs}</span>}
                        {g.acuerdoInfo?.porConvenio && <span style={{ fontSize: 10, background: "rgba(99,102,241,0.12)", color: "#6366F1", borderRadius: 4, padding: "1px 6px", fontWeight: 600, border: "1px solid rgba(99,102,241,0.25)" }}>📋 Por convenio</span>}
                      </div>
                      <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                        {g.consumoDesdeTracas && <span style={{ fontSize: 11, color: "#A78BFA", fontWeight: 600 }}>⚠ Truncas</span>}
                        <span style={{ fontSize: 12, fontWeight: 700, color: COLORS.accentLight }}>{g.dias} días</span>
                        <span style={{ fontSize: 11, color: COLORS.textoMuted }}>▶ ver detalle</span>
                      </div>
                    </div>
                  ))}
                </div>
              )}

              {/* Compras */}
              {p.compras && p.compras.length > 0 && (
                <div style={{ padding: "0 18px 14px", display: "flex", flexDirection: "column", gap: 6 }}>
                  <div style={{ fontSize: 11, color: "#F97316", fontWeight: 600, marginBottom: 4, marginTop: 4 }}>
                    🛒 COMPRAS EN ESTE PERÍODO ({p.compras.length})
                  </div>
                  {p.compras.map((c, ci) => (
                    <div key={ci} onClick={() => setCompraSeleccionada(c)}
                      style={{
                        display: "flex", justifyContent: "space-between", alignItems: "center",
                        padding: "8px 12px", background: "rgba(249,115,22,0.05)",
                        borderRadius: 8, border: "1px solid rgba(249,115,22,0.2)",
                        cursor: "pointer",
                      }}
                      onMouseEnter={(e) => e.currentTarget.style.background = "rgba(249,115,22,0.1)"}
                      onMouseLeave={(e) => e.currentTarget.style.background = "rgba(249,115,22,0.05)"}
                    >
                      <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
                        {c.obs && <span style={{ fontSize: 10, background: "rgba(16,185,129,0.12)", color: "#10B981", borderRadius: 4, padding: "1px 6px", fontWeight: 600 }}>{c.obs}</span>}
                      </div>
                      <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                        <span style={{ fontSize: 12, fontWeight: 700, color: "#F97316" }}>{c.dias} días</span>
                        <span style={{ fontSize: 11, color: COLORS.textoMuted }}>▶ ver detalle</span>
                      </div>
                    </div>
                  ))}
                </div>
              )}

              {/* Notas */}
              {(p.diasCedidosAntiguos > 0 || p.diasCedidosHaciaExceso > 0 || (p.diasBase > 0 && p.diasGozados > p.diasBase) || p.compras?.length > 0 || p.diasExtension > 0 || p.goces?.some(g => g.acuerdoInfo?.porConvenio)) && (
                <div style={{ padding: "0 18px 14px", display: "flex", flexDirection: "column", gap: 8 }}>
                  {p.compras?.length > 0 && (
                    <div style={{ padding: "8px 12px", background: "rgba(249,115,22,0.06)", border: "0.5px solid rgba(249,115,22,0.25)", borderRadius: 8, display: "flex", alignItems: "flex-start", gap: 8 }}>
                      <span style={{ fontSize: 14 }}>🛒</span>
                      <span style={{ fontSize: 11, color: "#92400E", lineHeight: 1.5 }}>
                        {p.compras.length === 1
                          ? <>Se realizó <strong>1 compra</strong> de <strong>{p.compras[0].dias} días</strong> el {fmtDate(p.compras[0].inicio)}. Días compensados económicamente.</>
                          : <>Se realizaron <strong>{p.compras.length} compras</strong> por un total de <strong>{p.compras.reduce((s, c) => s + c.dias, 0)} días</strong> compensados.</>}
                      </span>
                    </div>
                  )}
                  {p.diasExtension > 0 && (
                    <div style={{ padding: "8px 12px", background: "rgba(139,92,246,0.06)", border: "0.5px solid rgba(139,92,246,0.25)", borderRadius: 8, display: "flex", alignItems: "flex-start", gap: 8 }}>
                      <span style={{ fontSize: 14 }}>🏥</span>
                      <span style={{ fontSize: 11, color: "#5B21B6", lineHeight: 1.5 }}>
                        Período ampliado <strong>+{p.diasExtension} días</strong> por subsidio de enfermedad (D.L. 713).
                      </span>
                    </div>
                  )}
                  {p.goces?.some(g => g.acuerdoInfo?.porConvenio) && (
                    <div style={{ padding: "8px 12px", background: "rgba(99,102,241,0.06)", border: "0.5px solid rgba(99,102,241,0.25)", borderRadius: 8, display: "flex", alignItems: "flex-start", gap: 8 }}>
                      <span style={{ fontSize: 14 }}>📋</span>
                      <span style={{ fontSize: 11, color: "#4338CA", lineHeight: 1.5 }}>
                        {(() => {
                          const gC = p.goces.filter(g => g.acuerdoInfo?.porConvenio);
                          return <>Tiene <strong>{gC.length} goce{gC.length !== 1 ? "s" : ""}</strong> por convenio: <strong>{gC.reduce((s, g) => s + g.dias, 0)} días</strong> acumulados bajo acuerdo firmado.</>;
                        })()}
                      </span>
                    </div>
                  )}
                  {p.diasBase > 0 && p.diasGozados > p.diasBase && (
                    <div style={{ padding: "8px 12px", background: "rgba(239,68,68,0.06)", border: "0.5px solid rgba(239,68,68,0.3)", borderRadius: 8, display: "flex", alignItems: "flex-start", gap: 8 }}>
                      <span style={{ fontSize: 14 }}>ℹ️</span>
                      <span style={{ fontSize: 11, color: "#991B1B", lineHeight: 1.5 }}>
                        Exceso de goce de <strong>{(p.diasGozados - p.diasBase).toFixed(2)} días</strong>. Déficit cubierto por otros períodos.
                      </span>
                    </div>
                  )}
                </div>
              )}
            </div>
          );
        })}
      </div>

      {/* Modales de detalle */}
      {goceSeleccionado && <GoceModal goce={goceSeleccionado} onClose={() => setGoceSeleccionado(null)} />}
      {compraSeleccionada && <CompraModal compra={compraSeleccionada} onClose={() => setCompraSeleccionada(null)} />}
    </div>
  );
}

// ─── PÁGINA: FICHA DEL COLABORADOR ───────────────────────────────────────────
function PaginaFicha({ colaboradores, fechaCorteGlobal, todosColaboradores }) {
  const [busqueda, setBusqueda] = useState("");
  const [colab, setColab] = useState(null);
  const [tabActiva, setTabActiva] = useState("ficha");
  const hoy = dateOnly(fechaCorteGlobal);

  const sugerencias = useMemo(() => {
    if (!busqueda || busqueda.length < 2) return [];
    const q = busqueda.toLowerCase();
    return colaboradores
      .filter((c) => c.nombres.toLowerCase().includes(q) || c.cod.includes(q) || c.doc.includes(q))
      .slice(0, 8);
  }, [colaboradores, busqueda]);

  const pendiente = colab?.periodos.find((p) => p.tipo === "PENDIENTE" && p.saldo > 0);
  const trunca = colab?.periodos.find((p) => p.tipo === "TRUNCA" && p.saldo > 0);
  const fechaTope = pendiente
    ? dateOnly(new Date(pendiente.fechaVencimiento.getTime() - (pendiente.saldo - 1) * 86400000))
    : null;
  const diasHastaTope = fechaTope ? daysBetween(hoy, fechaTope) : null;
  const semaforo = !colab ? null
    : colab.totalVencidas > 0 ? { color: "#DC2626", bg: "#FEF2F2", icon: "\uD83D\uDD34", texto: "Tienes dias perdidos", sub: Math.round(colab.totalVencidas) + " dias que ya no se pueden recuperar" }
    : colab.enRiesgo ? { color: "#EA580C", bg: "#FFF7ED", icon: "\uD83D\uDFE0", texto: "Atencion — pronto vencen tus dias", sub: fechaTope ? "Debes salir antes del " + fmtDate(fechaTope) : "" }
    : pendiente ? { color: "#16A34A", bg: "#F0FDF4", icon: "\uD83D\uDFE2", texto: "Estas al dia", sub: "Tienes " + (Math.round(pendiente.saldo * 100) / 100) + " dias disponibles" }
    : { color: "#6B7280", bg: "#F9FAFB", icon: "\u26AA", texto: "Sin dias pendientes", sub: "Consulta con Gestion Humana" };

  const datosAnios = useMemo(() => {
    if (!colab) return [];
    return colab.periodos
      .filter((p) => p.tipo === "INDEMNIZACION" || p.tipo === "VENCIDA" || p.tipo === "PENDIENTE")
      .map((p) => {
        const base = p.diasBase;
        // Verde: gozado a tiempo (diasGozados directamente en el período, sin exceso)
        const gozadoATiempo = Math.min(p.diasGozados, base);
        // Rojo: este período absorbió exceso de período más antiguo → gozó ANTES de que correspondiera
        const gozadoAntes = Math.min(p.diasCedidosAntiguos || 0, base - gozadoATiempo);
        // Amarillo: este período compensó exceso de período más reciente → gozó DESPUÉS
        const gozadoDespues = Math.min(p.diasCedidosHaciaExceso || 0, base - gozadoATiempo - gozadoAntes);
        // Comprados: naranja
        const comprados = p.diasComprados || 0;
        return {
          label: "Ano " + p.anio,
          disponibles: base,
          gozadoATiempo,
          gozadoDespues,
          gozadoAntes,
          comprados,
          totalGozado: gozadoATiempo + gozadoDespues + gozadoAntes + comprados,
        };
      })
      .reverse();
  }, [colab]);

  const maxVal = datosAnios.length > 0 ? Math.max(...datosAnios.map((d) => d.disponibles)) : 30;
  const inputStyle = { background: COLORS.surface, border: "0.5px solid " + COLORS.border, color: COLORS.texto, borderRadius: 10, padding: "10px 14px", fontSize: 13, outline: "none", width: "100%" };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 20, maxWidth: 900 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 12 }}>
        <div>
          <div style={{ fontSize: 20, fontWeight: 600, color: COLORS.texto }}>Ficha del Colaborador</div>
          <div style={{ fontSize: 13, color: COLORS.textoMuted, marginTop: 2 }}>Vista simplificada y detalle completo por colaborador</div>
        </div>
        <div style={{ display: "flex", background: COLORS.bg, borderRadius: 10, border: "0.5px solid " + COLORS.border, padding: 4 }}>
          {[["ficha","\uD83E\uDEAA Ficha"],["detalle","\uD83D\uDCCB Detalle colaborador"],["masivo","\uD83D\uDCE6 Exportar Masivo"]].map(([id, label]) => (
            <button key={id} onClick={() => setTabActiva(id)} style={{
              background: tabActiva === id ? COLORS.surface : "transparent",
              border: tabActiva === id ? "0.5px solid " + COLORS.border : "none",
              borderRadius: 8, padding: "7px 18px", fontSize: 12.5,
              fontWeight: tabActiva === id ? 600 : 400,
              color: tabActiva === id ? COLORS.texto : COLORS.textoMuted,
              cursor: "pointer", boxShadow: tabActiva === id ? "0 1px 3px rgba(0,0,0,0.06)" : "none",
              whiteSpace: "nowrap",
            }}>{label}</button>
          ))}
        </div>
      </div>
      {tabActiva !== "masivo" && (
      <div style={{ background: COLORS.surface, borderRadius: 12, border: "0.5px solid " + COLORS.border, padding: 20 }}>
        <div style={{ position: "relative" }}>
          <input placeholder="Buscar por nombre, codigo o DNI..." value={colab ? colab.nombres : busqueda}
            onChange={(e) => { setBusqueda(e.target.value); setColab(null); setTabActiva("ficha"); }} style={inputStyle} />
          {sugerencias.length > 0 && !colab && (
            <div style={{ position: "absolute", top: "100%", left: 0, right: 0, background: COLORS.surface, border: "0.5px solid " + COLORS.border, borderRadius: 10, zIndex: 10, boxShadow: "0 4px 20px rgba(0,0,0,0.1)", marginTop: 4, overflow: "hidden" }}>
              {sugerencias.map((c) => (
                <div key={c.cod} onClick={() => { setColab(c); setBusqueda(""); setTabActiva("ficha"); }}
                  style={{ padding: "10px 14px", cursor: "pointer", borderBottom: "0.5px solid " + COLORS.border, display: "flex", justifyContent: "space-between", alignItems: "center" }}
                  onMouseEnter={(e) => e.currentTarget.style.background = COLORS.surfaceHigh}
                  onMouseLeave={(e) => e.currentTarget.style.background = "transparent"}>
                  <div><div style={{ fontSize: 13, fontWeight: 500, color: COLORS.texto }}>{c.nombres}</div><div style={{ fontSize: 11, color: COLORS.textoMuted }}>{c.gerencia} · DNI: {c.doc}</div></div>
                  <div style={{ fontSize: 11, color: COLORS.textoSecundario }}>Cod: {c.cod}</div>
                </div>
              ))}
            </div>
          )}
        </div>
        {colab && <button onClick={() => { setColab(null); setBusqueda(""); setTabActiva("ficha"); }} style={{ marginTop: 8, background: "transparent", border: "0.5px solid " + COLORS.border, color: COLORS.textoMuted, borderRadius: 6, padding: "3px 10px", cursor: "pointer", fontSize: 12 }}>Cambiar colaborador</button>}
      </div>
      )}

      {/* TAB: EXPORTAR MASIVO */}
      {tabActiva === "masivo" && (
        <PaginaExportarMasivo colaboradores={todosColaboradores || colaboradores} />
      )}

      {colab && tabActiva === "detalle" && (
        <div style={{ background: COLORS.surface, borderRadius: 12, border: "0.5px solid " + COLORS.border, padding: 28 }}>
          <DetalleColaborador colab={colab} />
        </div>
      )}

      {colab && semaforo && tabActiva === "ficha" && (
        <>
          <div style={{ background: COLORS.surface, borderRadius: 12, border: "0.5px solid " + COLORS.border, overflow: "hidden" }}>
            <div style={{ background: COLORS.accent, padding: "20px 24px", display: "flex", alignItems: "center", gap: 16 }}>
              <div style={{ width: 52, height: 52, borderRadius: "50%", background: "rgba(255,255,255,0.2)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 20, fontWeight: 700, color: "white", flexShrink: 0 }}>
                {colab.nombres.split(" ").slice(0, 2).map((n) => n[0]).join("")}
              </div>
              <div>
                <div style={{ fontSize: 18, fontWeight: 600, color: "white" }}>{colab.nombres}</div>
                <div style={{ fontSize: 12, color: "rgba(255,255,255,0.7)", marginTop: 2 }}>{colab.gerencia} - {colab.unidadOrg}</div>
                <div style={{ fontSize: 12, color: "rgba(255,255,255,0.6)", marginTop: 1 }}>DNI: {colab.doc} - Cod: {colab.cod} - Ingreso: {fmtDate(colab.fechaCorte)}</div>
              </div>
            </div>
            <div style={{ margin: 20, padding: "14px 18px", background: semaforo.bg, borderRadius: 10, display: "flex", alignItems: "center", gap: 12 }}>
              <div style={{ fontSize: 28 }}>{semaforo.icon}</div>
              <div><div style={{ fontSize: 15, fontWeight: 600, color: semaforo.color }}>{semaforo.texto}</div><div style={{ fontSize: 12, color: COLORS.textoSecundario, marginTop: 2 }}>{semaforo.sub}</div></div>
            </div>
            <div style={{ padding: "0 20px 20px", display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 12 }}>
              {[
                { label: "Dias disponibles ahora", value: Math.round((pendiente ? pendiente.saldo : 0) * 100) / 100, sub: "para gozar", color: COLORS.accent, bg: COLORS.bg, border: COLORS.border },
                { label: "Dias acumulandose", value: Math.round((trunca ? trunca.saldo : 0) * 100) / 100, sub: "del periodo en curso", color: "#7C3AED", bg: COLORS.bg, border: COLORS.border },
                { label: "Dias perdidos", value: Math.round(colab.totalVencidas * 100) / 100, sub: "no recuperables", color: colab.totalVencidas > 0 ? "#DC2626" : COLORS.textoMuted, bg: colab.totalVencidas > 0 ? "#FEF2F2" : COLORS.bg, border: colab.totalVencidas > 0 ? "#FCA5A5" : COLORS.border },
              ].map(({ label, value, sub, color, bg, border }) => (
                <div key={label} style={{ padding: "14px 16px", background: bg, borderRadius: 10, border: "0.5px solid " + border, textAlign: "center" }}>
                  <div style={{ fontSize: 11, color: COLORS.textoMuted, marginBottom: 6 }}>{label}</div>
                  <div style={{ fontSize: 26, fontWeight: 600, color }}>{value}</div>
                  <div style={{ fontSize: 11, color: COLORS.textoMuted, marginTop: 4 }}>{sub}</div>
                </div>
              ))}
            </div>
            {fechaTope && (
              <div style={{ margin: "0 20px 20px", padding: "12px 16px", background: diasHastaTope < 0 ? "#FEF2F2" : diasHastaTope <= 30 ? "#FFF7ED" : "#F0FDF4", borderRadius: 10, border: "0.5px solid " + (diasHastaTope < 0 ? "#FCA5A5" : diasHastaTope <= 30 ? "#FCD34D" : "#86EFAC"), display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <div><div style={{ fontSize: 12, color: COLORS.textoMuted }}>Fecha tope para salir de vacaciones</div><div style={{ fontSize: 16, fontWeight: 600, color: diasHastaTope < 0 ? "#DC2626" : diasHastaTope <= 30 ? "#EA580C" : COLORS.accent, marginTop: 2 }}>{fmtDate(fechaTope)}</div></div>
                <div style={{ textAlign: "right" }}><div style={{ fontSize: 11, color: COLORS.textoMuted }}>{diasHastaTope < 0 ? "Vencio hace" : "Quedan"}</div><div style={{ fontSize: 20, fontWeight: 600, color: diasHastaTope < 0 ? "#DC2626" : diasHastaTope <= 30 ? "#EA580C" : COLORS.accent }}>{Math.abs(diasHastaTope)} dias</div></div>
              </div>
            )}
            <div style={{ margin: "0 20px 20px" }}>
              <div style={{ fontSize: 12, fontWeight: 600, color: COLORS.textoMuted, marginBottom: 10, textTransform: "uppercase", letterSpacing: "0.05em" }}>Tus periodos</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                {colab.periodos
                  .filter((p) => p.tipo !== "INDEMNIZACION")
                  .slice(0, 5).map((p, i) => {
                  const esCubierto = p.tipo === "VENCIDA" && (p.diasVencidosReales === 0 || p.diasCedidosAntiguos > 0);
                  const etiqueta = p.tipo === "TRUNCA" ? "Acumulandose"
                    : p.tipo === "PENDIENTE" ? "Disponible"
                    : esCubierto ? "Gozado"
                    : "Vencido sin gozar";
                  const colorP = p.tipo === "TRUNCA" ? "#7C3AED"
                    : p.tipo === "PENDIENTE" ? COLORS.accent
                    : esCubierto ? COLORS.positivo
                    : "#DC2626";
                  const saldoP = p.tipo === "VENCIDA" ? (p.diasVencidosReales || 0) : p.saldo;
                  return (
                    <div key={i} style={{ display: "flex", alignItems: "center", gap: 12, padding: "8px 12px", background: COLORS.bg, borderRadius: 8, border: "0.5px solid " + COLORS.border }}>
                      <div style={{ width: 8, height: 8, borderRadius: "50%", background: colorP, flexShrink: 0 }} />
                      <div style={{ flex: 1, fontSize: 12, color: COLORS.textoSecundario }}>Ano {p.anio} — {fmtDate(p.inicio)} al {fmtDate(p.fin)}</div>
                      <div style={{ fontSize: 11, color: colorP, fontWeight: 500 }}>{etiqueta}</div>
                      <div style={{ fontSize: 13, fontWeight: 600, color: colorP, minWidth: 40, textAlign: "right" }}>{Math.round(saldoP * 100) / 100}d</div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>

          <div style={{ background: COLORS.surface, borderRadius: 12, border: "0.5px solid " + COLORS.border, padding: 24 }}>
            <div style={{ fontSize: 14, fontWeight: 600, color: COLORS.texto, marginBottom: 4 }}>Comparativo por anos laborales</div>
            <div style={{ fontSize: 12, color: COLORS.textoMuted, marginBottom: 20 }}>Dias disponibles vs dias gozados — todos los periodos</div>
            {datosAnios.length === 0 ? (
              <div style={{ textAlign: "center", padding: 30, color: COLORS.textoMuted }}>Sin periodos historicos</div>
            ) : (
              <>
                <div style={{ display: "flex", flexDirection: "column", gap: 10, maxHeight: 400, overflowY: "auto", paddingRight: 4 }}>
                  {datosAnios.map((d, i) => {
                    const pVerde = maxVal > 0 ? (d.gozadoATiempo / maxVal) * 100 : 0;
                    const pAmarillo = maxVal > 0 ? (d.gozadoDespues / maxVal) * 100 : 0;
                    const pRojo = maxVal > 0 ? (d.gozadoAntes / maxVal) * 100 : 0;
                    const pNaranja = maxVal > 0 ? (d.comprados / maxVal) * 100 : 0;
                    const pBase = maxVal > 0 ? (d.disponibles / maxVal) * 100 : 0;
                    return (
                      <div key={i} style={{ display: "flex", alignItems: "center", gap: 12 }}>
                        <div style={{ width: 52, fontSize: 11, color: COLORS.textoMuted, textAlign: "right", flexShrink: 0 }}>{d.label}</div>
                        <div style={{ flex: 1, position: "relative", height: 28, background: COLORS.bg, borderRadius: 6, overflow: "hidden" }}>
                          {/* Base disponible (gris) */}
                          <div style={{ position: "absolute", left: 0, top: 0, height: "100%", width: pBase + "%", background: "#E5E7EB", borderRadius: 6 }} />
                          {/* Verde: gozado a tiempo */}
                          <div style={{ position: "absolute", left: 0, top: 0, height: "100%", width: pVerde + "%", background: COLORS.accent + "CC", borderRadius: 6 }} />
                          {/* Rojo: gozado antes (absorbió exceso de período más antiguo) */}
                          {pRojo > 0 && <div style={{ position: "absolute", left: pVerde + "%", top: 0, height: "100%", width: pRojo + "%", background: "#DC2626CC" }} />}
                          {/* Amarillo: gozado después (compensó exceso de período más reciente) */}
                          {pAmarillo > 0 && <div style={{ position: "absolute", left: (pVerde + pRojo) + "%", top: 0, height: "100%", width: pAmarillo + "%", background: "#F59E0B" }} />}
                          {/* Azul: comprados */}
                          {pNaranja > 0 && <div style={{ position: "absolute", left: (pVerde + pRojo + pAmarillo) + "%", top: 0, height: "100%", width: pNaranja + "%", background: "#3B82F6CC" }} />}
                        </div>
                        <div style={{ width: 90, fontSize: 11, color: COLORS.textoSecundario, flexShrink: 0 }}>
                          <span style={{ color: COLORS.accent, fontWeight: 500 }}>{d.gozadoATiempo}d</span>
                          {d.gozadoDespues > 0 && <span style={{ color: "#F59E0B", fontWeight: 500 }}> +{d.gozadoDespues}d</span>}
                          {d.gozadoAntes > 0 && <span style={{ color: "#DC2626", fontWeight: 500 }}> +{d.gozadoAntes}d</span>}
                          {d.comprados > 0 && <span style={{ color: "#F97316", fontWeight: 500 }}> +{d.comprados}c</span>}
                          <span style={{ color: COLORS.textoMuted }}> / {d.disponibles}d</span>
                        </div>
                      </div>
                    );
                  })}
                </div>
                <div style={{ display: "flex", gap: 16, marginTop: 16, flexWrap: "wrap" }}>
                  {[
                    { color: COLORS.accent + "CC", label: "Gozado a tiempo" },
                    { color: "#DC2626CC", label: "Gozado antes" },
                    { color: "#F59E0B", label: "Gozado despues" },
                    { color: "#3B82F6CC", label: "Comprados" },
                    { color: "#E5E7EB", label: "Base disponible" },
                  ].map(({ color, label }) => (
                    <div key={label} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 11, color: COLORS.textoMuted }}><div style={{ width: 14, height: 10, borderRadius: 3, background: color }} />{label}</div>
                  ))}
                </div>
                <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 10, marginTop: 16 }}>
                  {[
                    { label: "Promedio gozado/ano", value: (datosAnios.reduce((s, d) => s + d.totalGozado, 0) / datosAnios.length).toFixed(1) + "d", color: COLORS.accent },
                    { label: "Total gozado", value: datosAnios.reduce((s, d) => s + d.totalGozado, 0) + "d", color: COLORS.texto },
                    { label: "Total comprado", value: datosAnios.reduce((s, d) => s + d.comprados, 0) + "d", color: "#F97316" },
                  ].map(({ label, value, color }) => (
                    <div key={label} style={{ padding: "10px 14px", background: COLORS.bg, borderRadius: 8, border: "0.5px solid " + COLORS.border, textAlign: "center" }}>
                      <div style={{ fontSize: 10, color: COLORS.textoMuted, marginBottom: 4 }}>{label}</div>
                      <div style={{ fontSize: 18, fontWeight: 600, color }}>{value}</div>
                    </div>
                  ))}
                </div>
              </>
            )}
          </div>
        </>
      )}

      {!colab && (
        <div style={{ textAlign: "center", padding: 60, color: COLORS.textoMuted }}>
          <div style={{ fontSize: 48, marginBottom: 16 }}>🪪</div>
          <div style={{ fontSize: 16, fontWeight: 500, color: COLORS.textoSecundario }}>Busca un colaborador para ver su ficha</div>
          <div style={{ fontSize: 13, marginTop: 6 }}>Ingresa nombre, codigo o DNI en el buscador</div>
        </div>
      )}
    </div>
  );
}


// ─── PÁGINA: EXPORTAR MASIVO ──────────────────────────────────────────────────
function PaginaExportarMasivo({ colaboradores }) {
  const [archivo, setArchivo] = useState(null);
  const [codigos, setCodigos] = useState([]);
  const [noEncontrados, setNoEncontrados] = useState([]);
  const [procesando, setProcesando] = useState(false);
  const [resultado, setResultado] = useState(null); // { total, encontrados }
  const inputRef = React.useRef();

  const leerArchivo = (file) => {
    if (!file) return;
    setArchivo(file);
    setCodigos([]); setNoEncontrados([]); setResultado(null);
    setProcesando(true);
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const wb = XLSX.read(e.target.result, { type: "array" });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });
        // Buscar columna de código (primera columna no vacía, o columna "código"/"cod")
        const header = rows[0] || [];
        let colIdx = 0;
        const hLower = header.map(h => String(h).toLowerCase().trim());
        const posibles = ["código","codigo","cod","code","id"];
        for (const p of posibles) { const idx = hLower.indexOf(p); if (idx >= 0) { colIdx = idx; break; } }
        // Extraer códigos desde fila 1 (saltar encabezado si parece texto)
        const startRow = isNaN(Number(String(rows[0]?.[colIdx]).trim())) ? 1 : 0;
        const codsLeidos = [];
        for (let i = startRow; i < rows.length; i++) {
          const val = String(rows[i][colIdx]).trim();
          if (val && val !== "") codsLeidos.push(val);
        }
        setCodigos(codsLeidos);
      } catch { setCodigos([]); }
      setProcesando(false);
    };
    reader.readAsArrayBuffer(file);
  };

  const exportar = () => {
    if (!codigos.length) return;
    const mapColab = new Map(colaboradores.map(c => [String(c.cod).trim(), c]));
    const encontrados = [];
    const noEnc = [];
    for (const cod of codigos) {
      const c = mapColab.get(cod);
      if (c) encontrados.push(c); else noEnc.push(cod);
    }
    setNoEncontrados(noEnc);
    setResultado({ total: codigos.length, encontrados: encontrados.length });
    if (!encontrados.length) return;

    const encTP = ["Código","Apellidos y Nombres","Período","Tipo","Inicio","Fin","Gozar hasta","Vence el","Base (días)","Gozado","Comprado","Indemnización","Saldo","Ampliado (días)","Obs"];
    const filas = [];
    for (const c of encontrados) {
      for (const p of [...c.periodos].reverse()) {
        const cfg = TIPO_CONFIG[p.tipo] || TIPO_CONFIG.TRUNCA;
        filas.push({
          "Código": c.cod,
          "Apellidos y Nombres": c.nombres,
          "Período": p.esAjuste ? "P0 – Ajuste" : `Año ${p.anio}`,
          "Tipo": cfg.label,
          "Inicio": p.inicio ? fmtDate(p.inicio) : "—",
          "Fin": p.fin ? fmtDate(p.fin) : "—",
          "Gozar hasta": p.fechaVencimiento ? fmtDate(p.fechaVencimiento) : "—",
          "Vence el": p.fechaVencimiento ? fmtDate(new Date(p.fechaVencimiento.getTime() + 86400000)) : "—",
          "Base (días)": p.diasBase,
          "Gozado": p.diasGozados,
          "Comprado": p.diasComprados || 0,
          "Indemnización": p.tipo === "INDEMNIZACION" && p.diasIndemnizacionBruta !== null ? p.diasIndemnizacionBruta : "",
          "Saldo": Math.round(p.saldo * 100) / 100,
          "Ampliado (días)": p.diasExtension || 0,
          "Obs": p.obs || "",
        });
      }
    }

    const wb = XLSX.utils.book_new();
    const aoa = [encTP, ...filas.map(f => encTP.map(h => f[h] ?? ""))];
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws["!cols"] = [10,28,10,14,12,12,14,12,10,8,8,12,8,14,20].map(w => ({ wch: w }));
    // Encabezado verde
    encTP.forEach((_, ci) => {
      const addr = XLSX.utils.encode_cell({ r: 0, c: ci });
      if (!ws[addr]) ws[addr] = { v: "", t: "s" };
      ws[addr].s = { font: { bold: true, sz: 11, color: { rgb: "FFFFFF" } }, fill: { fgColor: { rgb: "1A5C2E" } }, alignment: { horizontal: "center" } };
    });
    // Colores por tipo + zebra
    filas.forEach((f, ri) => {
      const r = 1 + ri;
      encTP.forEach((h, ci) => {
        const addr = XLSX.utils.encode_cell({ r, c: ci });
        const val = f[h];
        let fillRgb = ri % 2 === 0 ? "FFFFFF" : "F9FAFB";
        let textRgb = "111827"; let bold = false;
        if (h === "Tipo") {
          if (f["Tipo"] === "Vencida")           { fillRgb = "FEF2F2"; textRgb = "DC2626"; bold = true; }
          else if (f["Tipo"] === "Indemnización") { fillRgb = "FFF7ED"; textRgb = "F97316"; bold = true; }
          else if (f["Tipo"] === "Pendiente")    { fillRgb = "FFFBEB"; textRgb = "D97706"; bold = true; }
          else if (f["Tipo"] === "Trunca")       { fillRgb = "F5F3FF"; textRgb = "7C3AED"; bold = true; }
        }
        if (h === "Saldo" && typeof val === "number" && val > 0) { textRgb = "16A34A"; bold = true; }
        if (h === "Indemnización" && typeof val === "number" && val > 0) { textRgb = "F97316"; bold = true; }
        if (!ws[addr]) ws[addr] = { v: val ?? "", t: typeof val === "number" ? "n" : "s" };
        ws[addr].s = { font: { sz: 11, color: { rgb: textRgb }, bold }, fill: { fgColor: { rgb: fillRgb } }, alignment: { horizontal: typeof val === "number" ? "right" : "left" }, border: { bottom: { style: "thin", color: { rgb: "E5E7EB" } } } };
      });
    });
    ws["!rows"] = [{ hpt: 24 }, ...filas.map(() => ({ hpt: 20 }))];
    XLSX.utils.book_append_sheet(wb, ws, "Períodos");

    // Hoja 2: no encontrados
    if (noEnc.length > 0) {
      const wsNE = XLSX.utils.aoa_to_sheet([["Código no encontrado"], ...noEnc.map(c => [c])]);
      wsNE["!cols"] = [{ wch: 22 }];
      XLSX.utils.book_append_sheet(wb, wsNE, "No encontrados");
    }

    const fecha = new Date().toISOString().slice(0,10).replace(/-/g,"");
    XLSX.writeFile(wb, `Exportar_Masivo_${fecha}.xlsx`);
  };

  // Generar plantilla de ejemplo
  const descargarPlantilla = () => {
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet([["Código"],["10001"],["10002"],["10003"]]);
    ws["!cols"] = [{ wch: 14 }];
    const addr = "A1"; ws[addr].s = { font: { bold: true, sz: 11, color: { rgb: "FFFFFF" } }, fill: { fgColor: { rgb: "1A5C2E" } }, alignment: { horizontal: "center" } };
    XLSX.utils.book_append_sheet(wb, ws, "Códigos");
    XLSX.writeFile(wb, "Plantilla_Exportar_Masivo.xlsx");
  };

  const cardStyle = { background: COLORS.surface, borderRadius: 12, border: "0.5px solid " + COLORS.border, padding: 24 };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 20, maxWidth: 700 }}>
      <div>
        <div style={{ fontSize: 20, fontWeight: 600, color: COLORS.texto }}>Exportar Masivo</div>
        <div style={{ fontSize: 13, color: COLORS.textoMuted, marginTop: 2 }}>
          Sube un Excel con códigos de colaboradores y descarga el detalle de todos en una tabla plana
        </div>
      </div>

      {/* Paso 1: subir archivo */}
      <div style={cardStyle}>
        <div style={{ fontSize: 13, fontWeight: 600, color: COLORS.texto, marginBottom: 12, display: "flex", alignItems: "center", gap: 8 }}>
          <span style={{ background: COLORS.accent, color: "#fff", borderRadius: "50%", width: 22, height: 22, display: "inline-flex", alignItems: "center", justifyContent: "center", fontSize: 11, fontWeight: 700, flexShrink: 0 }}>1</span>
          Sube tu Excel con códigos
        </div>
        <div
          onClick={() => inputRef.current?.click()}
          onDragOver={(e) => e.preventDefault()}
          onDrop={(e) => { e.preventDefault(); leerArchivo(e.dataTransfer.files[0]); }}
          style={{
            border: `2px dashed ${archivo ? COLORS.accentLight : COLORS.border}`,
            borderRadius: 10, padding: "28px 20px", textAlign: "center",
            cursor: "pointer", background: archivo ? "#F0FDF4" : COLORS.bg,
            transition: "all 0.2s",
          }}
        >
          <div style={{ fontSize: 32, marginBottom: 8 }}>{archivo ? "✅" : "📂"}</div>
          {archivo
            ? <div style={{ fontSize: 13, fontWeight: 600, color: COLORS.positivo }}>{archivo.name} — {codigos.length} código{codigos.length !== 1 ? "s" : ""} leído{codigos.length !== 1 ? "s" : ""}</div>
            : <>
                <div style={{ fontSize: 13, fontWeight: 500, color: COLORS.textoSecundario }}>Arrastra tu Excel aquí o haz clic para seleccionar</div>
                <div style={{ fontSize: 11, color: COLORS.textoMuted, marginTop: 4 }}>El archivo debe tener una columna con los códigos de los colaboradores</div>
              </>}
          <input ref={inputRef} type="file" accept=".xlsx,.xls" style={{ display: "none" }}
            onChange={(e) => leerArchivo(e.target.files[0])} />
        </div>
        <div style={{ display: "flex", gap: 8, marginTop: 10, alignItems: "center", flexWrap: "wrap" }}>
          <button onClick={descargarPlantilla} style={{
            background: "transparent", border: "0.5px solid " + COLORS.border,
            color: COLORS.textoMuted, borderRadius: 8, padding: "6px 14px",
            cursor: "pointer", fontSize: 12,
          }}>⬇ Descargar plantilla de ejemplo</button>
          {archivo && <button onClick={() => { setArchivo(null); setCodigos([]); setNoEncontrados([]); setResultado(null); }} style={{
            background: "transparent", border: "0.5px solid " + COLORS.border,
            color: COLORS.textoMuted, borderRadius: 8, padding: "6px 14px",
            cursor: "pointer", fontSize: 12,
          }}>✕ Limpiar</button>}
        </div>
      </div>

      {/* Paso 2: previsualizar y exportar */}
      {codigos.length > 0 && (
        <div style={cardStyle}>
          <div style={{ fontSize: 13, fontWeight: 600, color: COLORS.texto, marginBottom: 14, display: "flex", alignItems: "center", gap: 8 }}>
            <span style={{ background: COLORS.accent, color: "#fff", borderRadius: "50%", width: 22, height: 22, display: "inline-flex", alignItems: "center", justifyContent: "center", fontSize: 11, fontWeight: 700, flexShrink: 0 }}>2</span>
            Códigos detectados — {codigos.length} en total
          </div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6, maxHeight: 160, overflowY: "auto", marginBottom: 16 }}>
            {codigos.map((cod, i) => {
              const existe = colaboradores.some(c => String(c.cod).trim() === cod);
              return (
                <span key={i} style={{
                  fontSize: 12, padding: "3px 10px", borderRadius: 6, fontWeight: 500,
                  background: existe ? "#F0FDF4" : "#FEF2F2",
                  color: existe ? COLORS.positivo : "#DC2626",
                  border: `1px solid ${existe ? "#86EFAC" : "#FCA5A5"}`,
                }}>{cod}</span>
              );
            })}
          </div>
          <div style={{ display: "flex", gap: 12, alignItems: "center", flexWrap: "wrap" }}>
            <button onClick={exportar} style={{
              background: COLORS.accent, color: "#fff", border: "none",
              borderRadius: 10, padding: "11px 24px", cursor: "pointer",
              fontSize: 13, fontWeight: 700, display: "flex", alignItems: "center", gap: 8,
            }}>⬇ Exportar Excel masivo</button>
            <div style={{ fontSize: 12, color: COLORS.textoMuted }}>
              {colaboradores.filter(c => codigos.includes(String(c.cod).trim())).length} colaboradores encontrados en base de datos
            </div>
          </div>
        </div>
      )}

      {/* Resultado */}
      {resultado && (
        <div style={{ ...cardStyle, background: resultado.encontrados > 0 ? "#F0FDF4" : "#FEF2F2", border: `1px solid ${resultado.encontrados > 0 ? "#86EFAC" : "#FCA5A5"}` }}>
          <div style={{ fontSize: 14, fontWeight: 600, color: resultado.encontrados > 0 ? COLORS.positivo : "#DC2626", marginBottom: 8 }}>
            {resultado.encontrados > 0 ? "✅ Excel generado correctamente" : "⚠️ No se encontró ningún código"}
          </div>
          <div style={{ fontSize: 12, color: COLORS.textoSecundario }}>
            {resultado.encontrados} de {resultado.total} colaboradores encontrados y exportados.
            {noEncontrados.length > 0 && ` El Excel incluye una hoja "No encontrados" con los ${noEncontrados.length} códigos sin match.`}
          </div>
          {noEncontrados.length > 0 && (
            <div style={{ marginTop: 10, display: "flex", flexWrap: "wrap", gap: 6 }}>
              {noEncontrados.map((c, i) => (
                <span key={i} style={{ fontSize: 12, padding: "3px 10px", borderRadius: 6, fontWeight: 500, background: "#FEF2F2", color: "#DC2626", border: "1px solid #FCA5A5" }}>{c}</span>
              ))}
            </div>
          )}
        </div>
      )}

      {/* Info de columnas */}
      <div style={{ ...cardStyle, background: COLORS.bg }}>
        <div style={{ fontSize: 12, fontWeight: 600, color: COLORS.textoMuted, marginBottom: 8 }}>📋 Columnas del Excel exportado</div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
          {["Código","Apellidos y Nombres","Período","Tipo","Inicio","Fin","Gozar hasta","Vence el","Base (días)","Gozado","Comprado","Indemnización","Saldo","Ampliado (días)","Obs"].map(col => (
            <span key={col} style={{ fontSize: 11, padding: "3px 8px", background: COLORS.surfaceHigh, borderRadius: 5, color: COLORS.textoSecundario, border: "0.5px solid " + COLORS.border }}>{col}</span>
          ))}
        </div>
      </div>
    </div>
  );
}


  // ── FIREBASE SOLICITUDES ─────────────────────────────────────────────────
  function useSolicitudes(bpUsuario, bpAdmin) {
    const [solicitudes, setSolicitudes] = React.useState([]);
    const [cargando, setCargando] = React.useState(true);

    React.useEffect(() => {
      const fb = window._firebase;
      if (!fb) return;

      // Wait for Firebase to be ready
      const checkFirebase = setInterval(() => {
        if (window._firebase?.db) {
          clearInterval(checkFirebase);
          const { db, collection, onSnapshot, query, orderBy, where } = window._firebase;

          let q;
          if (bpAdmin) {
            q = query(collection(db, "solicitudes"), orderBy("fechaCreacion", "desc"));
          } else {
            q = query(collection(db, "solicitudes"), where("bpUsuario", "==", bpUsuario), orderBy("fechaCreacion", "desc"));
          }

          const unsub = onSnapshot(q, (snap) => {
            const data = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            setSolicitudes(data);
            setCargando(false);
          }, (err) => {
            console.error("Firebase error:", err);
            setCargando(false);
          });

          return () => unsub();
        }
      }, 500);

      return () => clearInterval(checkFirebase);
    }, [bpUsuario, bpAdmin]);

    return { solicitudes, cargando };
  }

  async function enviarSolicitud(datos) {
    const checkFirebase = () => new Promise((resolve) => {
      const interval = setInterval(() => {
        if (window._firebase?.db) { clearInterval(interval); resolve(window._firebase); }
      }, 200);
    });
    const fb = await checkFirebase();
    const { db, collection, addDoc } = fb;
    return addDoc(collection(db, "solicitudes"), {
      ...datos,
