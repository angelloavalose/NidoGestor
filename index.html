// ─── Componente: Simulador ────────────────────────────────────────────────────
function TabSimulador({ alertas, fechaCorteGlobal }) {
  const initFecha = fechaCorteGlobal instanceof Date
    ? `${fechaCorteGlobal.getFullYear()}-${String(fechaCorteGlobal.getMonth() + 1).padStart(2, "0")}-${String(fechaCorteGlobal.getDate()).padStart(2, "0")}`
    : "";
  const [busqSim, setBusqSim] = useState("");
  const [fechaSimLocal, setFechaSimLocal] = useState(initFecha);

  const fechaSimDate = useMemo(() => {
    if (!fechaSimLocal) return null;
    const d = new Date(fechaSimLocal + "T00:00:00");
    return isNaN(d.getTime()) ? null : dateOnly(d);
  }, [fechaSimLocal]);

  const todosSimulados = useMemo(() => {
    return alertas.map((a) => {
      if (!fechaSimDate) return { ...a, diasPerdidos: 0, diasSalvados: a.saldoPendiente };
      const salvados = Math.max(0, Math.min(a.saldoPendiente, daysBetween(fechaSimDate, a.fechaVenc) + 1));
      const perdidos = a.saldoPendiente - salvados;
      return { ...a, diasPerdidos: perdidos, diasSalvados: salvados };
    }).sort((a, b) => b.diasPerdidos - a.diasPerdidos);
  }, [alertas, fechaSimDate]);

  const filtradosSim = useMemo(() => {
    const q = busqSim.toLowerCase();
    return !q ? todosSimulados : todosSimulados.filter((a) =>
      a.nombres.toLowerCase().includes(q) || a.cod.includes(q) || a.gerencia.toLowerCase().includes(q)
    );
  }, [todosSimulados, busqSim]);

  const totalPerdidos = filtradosSim.reduce((s, a) => s + a.diasPerdidos, 0);
  const afectados = filtradosSim.filter((a) => a.diasPerdidos > 0).length;

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ background: COLORS.surfaceHigh, borderRadius: 14, border: `1px solid ${COLORS.border}`, padding: "20px 24px" }}>
        <div style={{ fontSize: 15, fontWeight: 700, color: COLORS.texto, marginBottom: 4 }}>
          🔮 Simulador: ¿Qué pasa si los colaboradores salen el...?
        </div>
        <div style={{ fontSize: 13, color: COLORS.textoMuted, marginBottom: 16 }}>
          Ingresa una fecha hipotética. Ver qué días se pierden y cuáles se salvan para cada colaborador con pendientes.
        </div>
        <div style={{ display: "flex", gap: 12, flexWrap: "wrap", alignItems: "flex-end" }}>
          <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
            <label style={{ fontSize: 12, color: COLORS.textoMuted }}>Fecha hipotética de salida</label>
            <input type="date" value={fechaSimLocal}
              onChange={(e) => setFechaSimLocal(e.target.value)}
              style={{ background: COLORS.bg, border: `1px solid ${COLORS.border}`, color: COLORS.texto, borderRadius: 10, padding: "8px 14px", fontSize: 13, outline: "none", colorScheme: "dark" }} />
          </div>
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
            {fechaSimDate && (
              <div style={{ padding: "10px 16px", background: "rgba(139,92,246,0.1)", borderRadius: 10, border: "1px solid #8B5CF633", textAlign: "center" }}>
                <div style={{ fontSize: 11, color: "#A78BFA" }}>Fecha simulada</div>
                <div style={{ fontSize: 15, fontWeight: 700, color: COLORS.texto }}>{fmtDate(fechaSimDate)}</div>
              </div>
            )}
            <div style={{ padding: "10px 16px", background: "rgba(239,68,68,0.08)", borderRadius: 10, border: "1px solid #EF444433", textAlign: "center" }}>
              <div style={{ fontSize: 11, color: "#EF4444" }}>Con pérdidas</div>
              <div style={{ fontSize: 15, fontWeight: 700, color: COLORS.texto }}>{afectados}</div>
            </div>
            <div style={{ padding: "10px 16px", background: "rgba(239,68,68,0.06)", borderRadius: 10, border: "1px solid #EF444422", textAlign: "center" }}>
              <div style={{ fontSize: 11, color: "#EF4444" }}>Días perdidos</div>
              <div style={{ fontSize: 15, fontWeight: 700, color: COLORS.texto }}>{totalPerdidos}</div>
            </div>
            <div style={{ padding: "10px 16px", background: "rgba(59,130,246,0.08)", borderRadius: 10, border: `1px solid ${COLORS.accent}33`, textAlign: "center" }}>
              <div style={{ fontSize: 11, color: COLORS.accentLight }}>Total con pendientes</div>
              <div style={{ fontSize: 15, fontWeight: 700, color: COLORS.texto }}>{alertas.length}</div>
            </div>
          </div>
        </div>
      </div>

      <input
        placeholder="🔍 Buscar colaborador por nombre, código o gerencia..."
        value={busqSim}
        onChange={(e) => setBusqSim(e.target.value)}
        style={{ background: COLORS.surfaceHigh, border: `1px solid ${COLORS.border}`, color: COLORS.texto, borderRadius: 10, padding: "10px 14px", fontSize: 13, outline: "none" }}
      />

      <div style={{ display: "flex", flexDirection: "column", gap: 6, maxHeight: 500, overflowY: "auto" }}>
        {filtradosSim.length === 0 && (
          <div style={{ textAlign: "center", padding: 32, color: COLORS.textoMuted, fontSize: 14 }}>Sin resultados</div>
        )}
        {filtradosSim.map((a) => {
          const pct = a.saldoPendiente > 0 ? (a.diasSalvados / a.saldoPendiente) * 100 : 100;
          const sinPerdida = a.diasPerdidos === 0;
          const borde = sinPerdida ? COLORS.positivo : "#EF4444";
          return (
            <div key={a.cod} style={{
              background: COLORS.surfaceHigh, borderRadius: 10,
              border: `1px solid ${borde}22`, padding: "12px 16px",
              borderLeft: `3px solid ${borde}`,
            }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 12 }}>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 13, fontWeight: 700, color: COLORS.texto, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{a.nombres}</div>
                  <div style={{ fontSize: 11, color: COLORS.textoMuted }}>{a.gerencia} · Cód: {a.cod}</div>
                  <div style={{ fontSize: 11, color: COLORS.textoSecundario, marginTop: 3 }}>
                    {a.saldoPendiente}d pendientes · Tope: {fmtDate(a.fechaMinimaSalida)} · Gozar hasta: {fmtDate(a.fechaVenc)} · Vence: {fmtDate(new Date(a.fechaVenc.getTime() + 86400000))}
                  </div>
                  <div style={{ height: 4, background: COLORS.bg, borderRadius: 2, overflow: "hidden", display: "flex", marginTop: 6 }}>
                    <div style={{ width: `${100 - pct}%`, background: "#EF4444" }} />
                    <div style={{ width: `${pct}%`, background: COLORS.positivo }} />
                  </div>
                </div>
                <div style={{ display: "flex", gap: 12, textAlign: "center", flexShrink: 0 }}>
                  <div>
                    <div style={{ fontSize: 18, fontWeight: 800, color: a.diasPerdidos > 0 ? "#EF4444" : COLORS.textoMuted }}>{a.diasPerdidos}</div>
                    <div style={{ fontSize: 10, color: COLORS.textoMuted }}>se pierden</div>
                  </div>
                  <div>
                    <div style={{ fontSize: 18, fontWeight: 800, color: COLORS.positivo }}>{a.diasSalvados}</div>
                    <div style={{ fontSize: 10, color: COLORS.textoMuted }}>se salvan</div>
                  </div>
                </div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function severidadAlerta(a) {
  // Crítica: vencido hace más de 1 año o más de 2 períodos vencidos
  if (a.todoVencido && a.diasHastaVenc < -365) return { nivel: "critica", label: "🔴 Crítica", color: "#DC2626", bg: "rgba(220,38,38,0.1)" };
  if (a.colab && a.colab.periodos && a.colab.periodos.filter(p => p.tipo === "VENCIDA" || p.tipo === "INDEMNIZACION").length > 2) return { nivel: "critica", label: "🔴 Crítica", color: "#DC2626", bg: "rgba(220,38,38,0.1)" };
  // Media: vencido reciente o convenio no procede
  if (a.todoVencido) return { nivel: "media", label: "🟡 Media", color: "#D97706", bg: "rgba(217,119,6,0.1)" };
  if (a.diasHastaVenc <= 90) return { nivel: "media", label: "🟡 Media", color: "#D97706", bg: "rgba(217,119,6,0.1)" };
  // Baja: vence en menos de 30 días o nunca ha gozado
  if (a.diasHastaVenc <= 180) return { nivel: "baja", label: "🟢 Baja", color: "#16A34A", bg: "rgba(22,163,74,0.1)" };
  return { nivel: "baja", label: "🟢 Baja", color: "#16A34A", bg: "rgba(22,163,74,0.1)" };
}

function PaginaAlertas({ colaboradores, fechaCorteGlobal, filtroGerenciaExterno = "Todas", setFiltroGerenciaExterno }) {
  const [tabActiva, setTabActiva] = useState("a1");
  const [filtroMeses, setFiltroMeses] = useState(12);
  const [filtroGerenciaAlertas, setFiltroGerenciaAlertasLocal] = useState(filtroGerenciaExterno);
  const [detalle, setDetalle] = useState(null);
  const [filtroGestion, setFiltroGestion] = useState("todas"); // todas / pendientes / gestionadas
  const [modalGestion, setModalGestion] = useState(null); // alerta seleccionada para gestionar
  const [gestionForm, setGestionForm] = useState({ fecha: "", comentario: "", gestor: "" });

  // localStorage key para alertas gestionadas
  const LS_KEY = "alertas_gestionadas_v1";
  const [alertasGestionadas, setAlertasGestionadas] = useState(() => {
    try { return JSON.parse(localStorage.getItem(LS_KEY) || "{}"); } catch { return {}; }
  });

  const guardarGestion = (alertaKey, datos) => {
    const nuevo = { ...alertasGestionadas, [alertaKey]: datos };
    setAlertasGestionadas(nuevo);
    try { localStorage.setItem(LS_KEY, JSON.stringify(nuevo)); } catch {}
  };

  const alertaKey = (a) => `${a.cod}_${a.fechaVenc?.getTime?.() ?? ""}`;

  // Sincronizar filtro externo al montar
  useEffect(() => {
    setFiltroGerenciaAlertasLocal(filtroGerenciaExterno);
  }, [filtroGerenciaExterno]);

  const setFiltroGerenciaAlertas = (val) => {
    setFiltroGerenciaAlertasLocal(val);
    if (setFiltroGerenciaExterno) setFiltroGerenciaExterno(val);
  };

  const gerenciasAlertas = useMemo(() => {
    const set = new Set(colaboradores.map((c) => c.gerencia));
    return ["Todas", ...Array.from(set).sort()];
  }, [colaboradores]);

  // Calcular alertas para todos los colaboradores con saldo pendiente
  const alertasTodas = useMemo(() => {
    return colaboradores
      .map((c) => calcularAlertaColab(c, fechaCorteGlobal))
      .filter(Boolean)
      .sort((a, b) => a.diasHastaVenc - b.diasHastaVenc);
  }, [colaboradores, fechaCorteGlobal]);

  // Filtrar por gerencia
  const alertas = useMemo(() =>
    filtroGerenciaAlertas === "Todas"
      ? alertasTodas
      : alertasTodas.filter((a) => a.gerencia === filtroGerenciaAlertas),
    [alertasTodas, filtroGerenciaAlertas]
  );

  // Alerta 1: filtrados por meses
  const alerta1 = useMemo(() =>
    alertas.filter((a) => a.todoVencido || a.diasHastaVenc <= filtroMeses * 30),
    [alertas, filtroMeses]
  );

  // Alerta 2: todos ordenados por proximidad del tope
  const alerta2 = useMemo(() =>
    alertas.slice().sort((a, b) => a.diasHastaTope - b.diasHastaTope),
    [alertas]
  );

  // Alerta 3: tope ya pasó
  const alerta3 = useMemo(() =>
    alertas.filter((a) => a.topeYaPaso || a.diasHastaTope <= 0)
      .sort((a, b) => b.diasVencidosYa - a.diasVencidosYa),
    [alertas]
  );

  // Críticos esta semana: tope en 7 días o ya pasó
  const criticosSemana = useMemo(() =>
    alertas.filter((a) => a.diasHastaTope <= 7)
      .sort((a, b) => a.diasHastaTope - b.diasHastaTope),
    [alertas]
  );

  // KPIs
  const vencen1mes = alertas.filter((a) => a.diasHastaVenc <= 30).length;
  const vencen3mes = alertas.filter((a) => a.diasHastaVenc <= 90).length;
  const topeProximo = alertas.filter((a) => a.diasHastaTope >= 0 && a.diasHastaTope <= 30).length;
  const topePasado = alertas.filter((a) => a.topeYaPaso).length;
  const diasEnRiesgoSemana = criticosSemana.reduce((s, a) => s + a.saldoPendiente, 0);
  const sinRiesgo = alertas.filter((a) => a.diasHastaTope > 90).length;

  const TabBtn = ({ id, label, badge, color }) => (
    <button onClick={() => setTabActiva(id)} style={{
      padding: "10px 20px", borderRadius: 10, border: "none",
      background: tabActiva === id ? (color || COLORS.accent) + "22" : "transparent",
      color: tabActiva === id ? (color || COLORS.accentLight) : COLORS.textoMuted,
      borderBottom: tabActiva === id ? `2px solid ${color || COLORS.accent}` : "2px solid transparent",
      cursor: "pointer", fontSize: 13, fontWeight: 600, display: "flex", alignItems: "center", gap: 8,
    }}>
      {label}
      {badge > 0 && (
        <span style={{
          background: color || COLORS.accent, color: "#fff",
          borderRadius: 10, padding: "1px 8px", fontSize: 11, fontWeight: 700,
        }}>{badge}</span>
      )}
    </button>
  );

  const MesesFilter = ({ value, onChange }) => (
    <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
      <span style={{ fontSize: 12, color: COLORS.textoMuted }}>Mostrar que vencen en:</span>
      {[1,2,3,4,6,9,12].map((m) => (
        <button key={m} onClick={() => onChange(m)} style={{
          background: value === m ? COLORS.accent : COLORS.surfaceHigh,
          border: `1px solid ${value === m ? COLORS.accent : COLORS.border}`,
          color: value === m ? "#fff" : COLORS.textoSecundario,
          borderRadius: 7, padding: "5px 12px", cursor: "pointer", fontSize: 12, fontWeight: 600,
        }}>{m} {m === 1 ? "mes" : "meses"}</button>
      ))}
    </div>
  );

  const urgenciaColor = (dias) => {
    if (dias <= 30) return "#EF4444";
    if (dias <= 90) return "#F59E0B";
    if (dias <= 180) return "#F97316";
    return COLORS.positivo;
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 12 }}>
        <div>
          <div style={{ fontSize: 22, fontWeight: 700, color: COLORS.texto }}>Alertas Vacacionales</div>
          <div style={{ fontSize: 14, color: COLORS.textoMuted, marginTop: 2 }}>
            Basado en saldo pendiente por colaborador · Corte {fmtDate(fechaCorteGlobal)}
          </div>
        </div>
        {/* Filtro gerencia */}
        <select value={filtroGerenciaAlertas} onChange={(e) => setFiltroGerenciaAlertas(e.target.value)}
          style={{ background: COLORS.surfaceHigh, border: `1px solid ${COLORS.border}`, color: COLORS.texto, borderRadius: 10, padding: "8px 14px", fontSize: 13, outline: "none", minWidth: 180 }}>
          {gerenciasAlertas.map((g) => (
            <option key={g} value={g}>{g === "Todas" ? "Todas las gerencias" : (g.length > 28 ? g.slice(0, 28) + "…" : g)}</option>
          ))}
        </select>
      </div>

      {/* Filtro gestión + exportar */}
      <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
        {["todas","pendientes","gestionadas"].map(f => (
          <button key={f} onClick={() => setFiltroGestion(f)} style={{
            padding: "7px 16px", borderRadius: 8, border: "none", cursor: "pointer", fontSize: 12, fontWeight: 600,
            background: filtroGestion === f ? COLORS.accent : COLORS.surfaceHigh,
            color: filtroGestion === f ? "#fff" : COLORS.textoMuted,
          }}>
            {f === "todas" ? "Todas" : f === "pendientes" ? "⏳ Pendientes" : "✅ Gestionadas"}
          </button>
        ))}
        <button onClick={() => {
          const filas = alertas.map(a => {
            const key = alertaKey(a);
            const g = alertasGestionadas[key];
            const sev = severidadAlerta(a);
            return {
              "Cód": a.cod, "Apellidos y Nombres": a.nombres, "Gerencia": a.gerencia,
              "Días pendientes": a.saldoPendiente, "Gozar hasta": fmtDate(a.fechaVenc),
              "Severidad": sev.label,
              "Gestionada": g ? "Sí" : "No",
              "Fecha gestión": g?.fecha || "",
              "Gestor": g?.gestor || "",
              "Comentario": g?.comentario || "",
            };
          });
          const ws = XLSX.utils.json_to_sheet(filas);
          const wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, "Alertas");
          XLSX.writeFile(wb, "Alertas_Vacacionales.xlsx");
        }} style={{
          marginLeft: "auto", background: COLORS.accent, color: "#fff", border: "none",
          borderRadius: 8, padding: "7px 16px", cursor: "pointer", fontSize: 12, fontWeight: 700,
        }}>⬇ Exportar Excel</button>
      </div>

      {/* KPIs globales */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(150px, 1fr))", gap: 12 }}>
        <KPICard label="Vencen en 1 mes" value={vencen1mes} icon="🔴" color="#EF4444" />
        <KPICard label="Vencen en 3 meses" value={vencen3mes} icon="🟠" color="#F97316" />
        <KPICard label="Tope en 30 días" value={topeProximo} icon="⏰" color="#F59E0B" sub="Deben salir pronto" />
        <KPICard label="Tope ya pasó" value={topePasado} icon="🚨" color="#EF4444" sub="Días perdiéndose ahora" />
        <KPICard label="Críticos esta semana" value={criticosSemana.length} icon="🔥" color="#DC2626" sub={`${diasEnRiesgoSemana} días en riesgo`} />
        <KPICard label="Sin riesgo inmediato" value={sinRiesgo} icon="✅" color={COLORS.positivo} sub="Tope > 90 días" />
        <KPICard label="Con pendientes" value={alertas.length} icon="📋" color={COLORS.accentLight} />
      </div>

      {/* Tabs */}
      <div style={{
        display: "flex", gap: 4, borderBottom: `1px solid ${COLORS.border}`,
        background: COLORS.surface, borderRadius: "12px 12px 0 0", padding: "8px 8px 0",

        <TabBtn id="a1" label="⏳ Proximidad" badge={alerta1.length} />

      {/* ── ALERTA 1: Proximidad de vencimiento ── */}

        const en_riesgo    = alerta1.filter((a) => a.enRiesgoHoy);
        const todo_vencido = alerta1.filter((a) => a.todoVencido);

        const CardA1 = ({ a, seccion }) => {

              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 12 }}>
                <div style={{ flex: 1 }}>

                  <div style={{ fontSize: 12, color: COLORS.textoMuted, marginTop: 2 }}>{a.gerencia} · Cód: {a.cod}</div>

                  {/* Línea principal */}
                  <div style={{ fontSize: 12, color: COLORS.textoSecundario, marginTop: 8 }}>
                    Tiene <strong style={{ color: COLORS.accentLight }}>{a.saldoPendiente} días</strong> pendientes
                    · Gozar hasta: <strong style={{ color: color }}>{fmtDate(a.fechaVenc)}</strong>
                    {!a.todoVencido && (
                      <span> · Vence el: <strong style={{ color: "#F59E0B" }}>{fmtDate(new Date(a.fechaVenc.getTime() + 86400000))}</strong></span>

                  {/* Envolse: fecha mínima de salida */}
                  {seccion === "tiempo" && (
                    <div style={{
                      marginTop: 8, padding: "8px 12px",
                      background: "rgba(59,130,246,0.08)", borderRadius: 8,

                      fontSize: 12, color: COLORS.accentLight, fontWeight: 600,

                    </div>
                  )}

                  {/* Englose: en riesgo — ya pasó la mínima pero aún hay días salvables */}
                  {seccion === "riesgo" && (
                    <div style={{
                      marginTop: 8, padding: "8px 12px",
                      background: "rgba(249,115,22,0.08)", borderRadius: 8,
                      border: "1px solid rgba(249,115,22,0.25)",
                      fontSize: 12,
                    }}>
                      <div style={{ color: "#F97316", fontWeight: 700, marginBottom: 4 }}>
                        ⚠ Debió salir el {fmtDate(a.fechaMinimaSalida)}
                      </div>
                      <div style={{ color: COLORS.textoSecundario }}>

                        se vencen <strong style={{ color: "#EF4444" }}>{a.diasVencidosHoy} días</strong>
                        , se salvan <strong style={{ color: COLORS.positivo }}>{a.diasSalvablesHoy} días</strong>
                      </div>
                      {/* Barra */}
                      <div style={{ height: 5, background: COLORS.bg, borderRadius: 3, overflow: "hidden", display: "flex", marginTop: 8 }}>

                  {/* Englose: todo vencido */}
                  {seccion === "vencido" && (
                    <div style={{
                      marginTop: 8, padding: "8px 12px",
                      background: "rgba(220,38,38,0.08)", borderRadius: 8,
                      border: "1px solid rgba(220,38,38,0.25)",

                    }}>

                <div style={{ textAlign: "right", flexShrink: 0 }}>
                  {!a.todoVencido && a.diasHastaVenc >= 0 ? (

                </div>
                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  {en_riesgo.map((a) => <CardA1 key={a.cod} a={a} seccion="riesgo" />)}

            {/* Sección: Todo vencido — Vacaciones vencidas recientes */}
            {todo_vencido.length > 0 && (

                <div style={{ fontSize: 12, fontWeight: 700, color: "#DC2626", letterSpacing: "0.06em", textTransform: "uppercase", marginBottom: 10 }}>

                </div>
                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  {todo_vencido.map((a) => <CardA1 key={a.cod} a={a} seccion="vencido" />)}

            {alerta1.length === 0 && (
              <div style={{ textAlign: "center", padding: 40, color: COLORS.textoMuted, fontSize: 14 }}>
                ✅ Ningún colaborador con pendientes que venzan en este período
              </div>
            )}
          </div>
        );
      })()}

      {/* ── ALERTA 2: Fecha tope de salida ── */}
      {tabActiva === "a2" && (
        <TabFechaTope alerta2={alerta2} setDetalle={setDetalle} fechaCorteGlobal={fechaCorteGlobal} />
      )}

      {/* ── ALERTA 3: Días perdiéndose ahora ── */}
      {tabActiva === "a3" && (
        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          <div style={{ padding: "12px 16px", background: "rgba(239,68,68,0.06)", borderRadius: 10, border: "1px solid #EF444433" }}>

                      </div>
                    </div>
                    <div style={{ textAlign: "right", flexShrink: 0 }}>

      {tabActiva === "gerencia" && (() => {

        for (const a of alertasTodas) {

function PaginaSimulacion({ colaboradores, fechaCorteGlobal }) {
  const [mesesExtra, setMesesExtra] = useState(6);

  const simulados = useMemo(() => {
    const fechaFutura = new Date(fechaCorteGlobal);
    fechaFutura.setMonth(fechaFutura.getMonth() + mesesExtra);

    return colaboradores.map((c) => {
      const periodosF = calcularPeriodos(c.fechaCorte, fechaFutura);
      const vencidasF = periodosF.filter((p) => p.tipo === "VENCIDA");
      const nuevasVencidas = vencidasF.length - c.periodos.filter((p) => p.tipo === "VENCIDA").length;
      return { ...c, periodosSimulados: periodosF, nuevasVencidas: Math.max(0, nuevasVencidas) };
    }).filter((c) => c.nuevasVencidas > 0).slice(0, 100);
  }, [colaboradores, mesesExtra, fechaCorteGlobal]);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
      <div>
        <div style={{ fontSize: 22, fontWeight: 700, color: COLORS.texto }}>Simulación de Vencimientos</div>
        <div style={{ fontSize: 14, color: COLORS.textoMuted }}>Proyecta futuros vencimientos en el tiempo</div>
      </div>

      <div style={{ display: "flex", alignItems: "center", gap: 16, background: COLORS.surfaceHigh, padding: "16px 20px", borderRadius: 12, border: `1px solid ${COLORS.border}` }}>
        <span style={{ fontSize: 14, color: COLORS.textoSecundario }}>Proyectar</span>
        <input type="range" min={1} max={24} value={mesesExtra} onChange={(e) => setMesesExtra(+e.target.value)}
          style={{ flex: 1, accentColor: COLORS.accent }} />
        <span style={{ fontSize: 16, fontWeight: 700, color: COLORS.texto, minWidth: 100 }}>+{mesesExtra} meses</span>
        <span style={{ fontSize: 13, color: COLORS.textoMuted }}>({simulados.length} nuevas vencidas)</span>
      </div>

      <div style={{ background: COLORS.surfaceHigh, borderRadius: 16, border: `1px solid ${COLORS.border}`, padding: 20 }}>
        <div style={{ fontSize: 13, color: COLORS.textoMuted, marginBottom: 12 }}>
          Colaboradores que generarán nuevas vencidas en los próximos {mesesExtra} meses (primeros 100)
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 8, maxHeight: 480, overflowY: "auto" }}>
          {simulados.map((c) => (
            <div key={c.cod} style={{
              display: "flex", justifyContent: "space-between", alignItems: "center",
              padding: "10px 14px", background: COLORS.bg, borderRadius: 8,
              border: `1px solid ${COLORS.border}`,
            }}>
              <div>
                <div style={{ fontSize: 13, color: COLORS.texto, fontWeight: 500 }}>{c.nombres}</div>
                <div style={{ fontSize: 11, color: COLORS.textoMuted }}>{c.gerencia}</div>
              </div>
              <span style={{ background: "rgba(239,68,68,0.1)", color: "#EF4444", borderRadius: 6, padding: "3px 10px", fontSize: 12, fontWeight: 700 }}>
                +{c.nuevasVencidas} período{c.nuevasVencidas > 1 ? "s" : ""}
              </span>
            </div>
          ))}
          {simulados.length === 0 && (
            <div style={{ textAlign: "center", color: COLORS.textoMuted, padding: 24, fontSize: 14 }}>
              ✅ Ningún colaborador generará nuevas vencidas en ese período
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function PaginaSolicitud({ colaboradores, fechaCorteGlobal, colabPreseleccionado = null, onColabUsado }) {
  const [busqueda, setBusqueda] = useState("");
  const [colabSeleccionado, setColabSeleccionado] = useState(colabPreseleccionado);
  const [fechaInicio, setFechaInicio] = useState("");
  const [fechaFin, setFechaFin] = useState("");
  const [error, setError] = useState("");
  const [exito, setExito] = useState(false);

  // Si llega un colaborador preseleccionado desde Colaboradores, usarlo
  useEffect(() => {
    if (colabPreseleccionado) {
      setColabSeleccionado(colabPreseleccionado);
      setBusqueda("");
      setFechaInicio("");
      setFechaFin("");
      setError("");
      if (onColabUsado) onColabUsado();
    }
  }, [colabPreseleccionado]);

  const inputStyle = {
    background: COLORS.surfaceHigh, border: `1px solid ${COLORS.border}`,
    color: COLORS.texto, borderRadius: 10, padding: "9px 14px",
    fontSize: 13, outline: "none", width: "100%",
  };

  // Filtrar colaboradores por búsqueda
  const sugerencias = useMemo(() => {
    if (!busqueda || busqueda.length < 2) return [];
    const q = busqueda.toLowerCase();
    return colaboradores
      .filter((c) => c.nombres.toLowerCase().includes(q) || c.cod.includes(q) || c.doc.includes(q))
      .slice(0, 8);
  }, [colaboradores, busqueda]);

  // Período PENDIENTE del colaborador seleccionado
  const pendiente = colabSeleccionado
    ? colabSeleccionado.periodos.find((p) => p.tipo === "PENDIENTE" && p.saldo > 0)
    : null;

  // Calcular días solicitados
  const calcularDias = () => {
    if (!fechaInicio || !fechaFin) return 0;
    const ini = new Date(fechaInicio + "T12:00:00");
    const fin = new Date(fechaFin + "T12:00:00");
    if (fin < ini) return 0;
    return daysBetween(ini, fin) + 1;
  };
  const diasSolicitados = calcularDias();
  const fechaRetorno = fechaFin
    ? (() => { const d = new Date(fechaFin + "T12:00:00"); d.setDate(d.getDate() + 1); return d; })()
    : null;

  // Validar
  const validar = () => {
    if (!colabSeleccionado) return "Selecciona un colaborador.";
    if (!pendiente) return "El colaborador no tiene saldo de vacaciones pendientes.";
    if (!fechaInicio || !fechaFin) return "Ingresa las fechas de inicio y fin.";
    const ini = new Date(fechaInicio + "T12:00:00");
    const fin = new Date(fechaFin + "T12:00:00");
    if (fin < ini) return "La fecha de fin debe ser posterior a la de inicio.";
    if (diasSolicitados > pendiente.saldo) return `Solo tiene ${pendiente.saldo} días pendientes disponibles.`;
    // Regla de mínimo de días
    const minimoRequerido = pendiente.saldo >= 7 ? 7 : Math.ceil(pendiente.saldo);
    if (diasSolicitados < minimoRequerido) {
      if (pendiente.saldo >= 7) return `Debe solicitar como mínimo 7 días de vacaciones.`;
      else return `Debe solicitar todos sus días pendientes disponibles (${minimoRequerido} días).`;
    }
    // Validar que las fechas estén dentro del rango del período pendiente
    const limiteVenc = new Date(pendiente.fechaVencimiento.getTime() - 86400000);
    if (ini > limiteVenc) return `Las fechas deben ser antes del ${fmtDate(pendiente.fechaVencimiento)} (vencimiento del período).`;
    return "";
  };

  // Generar PDF usando ventana de impresión del navegador

    const err = validar();
    if (err) { setError(err); return; }
    setError("");

    const c = colabSeleccionado;

    </div>
  </div>
  <script>window.onload = function(){ window.print(); }<\/script>
</body>
</html>`;

    // Descargar como archivo HTML que el navegador puede abrir e imprimir como PDF
    const blob = new Blob([htmlContent], { type: "text/html;charset=utf-8" });

            {!pendiente && (

              </div>

            {pendiente && (
              <div style={{ marginTop: 10, fontSize: 11, color: COLORS.textoMuted }}>
                Período afecto: <strong style={{ color: COLORS.texto }}>{fmtDate(pendiente.inicio)} al {fmtDate(pendiente.fin)}</strong>
                · Gozar hasta: <strong style={{ color: COLORS.accent }}>{fmtDate(pendiente.fechaVencimiento)}</strong>
              </div>

        )}
      </div>

      {/* Fechas */}
      {colabSeleccionado && pendiente && (
        <div style={{ background: COLORS.surfaceHigh, borderRadius: 16, border: `1px solid ${COLORS.border}`, padding: 24 }}>
          <div style={{ fontSize: 13, fontWeight: 700, color: COLORS.texto, marginBottom: 16 }}>2. Ingresa las fechas de vacaciones
            <span style={{ fontSize: 11, fontWeight: 400, color: COLORS.textoMuted, marginLeft: 8 }}>

              <label style={{ fontSize: 12, color: COLORS.textoMuted, display: "block", marginBottom: 6 }}>Fecha de inicio</label>
              <input type="date" value={fechaInicio} onChange={(e) => { setFechaInicio(e.target.value); setError(""); }}
                min={fechaInicio || undefined}
                style={{ ...inputStyle, colorScheme: "light" }} />
            </div>
            <div>
              <label style={{ fontSize: 12, color: COLORS.textoMuted, display: "block", marginBottom: 6 }}>Fecha de fin</label>
              <input type="date" value={fechaFin} onChange={(e) => { setFechaFin(e.target.value); setError(""); }}
                min={fechaInicio || undefined}
                style={{ ...inputStyle, colorScheme: "light" }} />
            </div>
          </div>

          {/* Resumen calculado */}
          {fechaInicio && fechaFin && diasSolicitados > 0 && (
            <div style={{ marginTop: 16, display: "flex", gap: 10, flexWrap: "wrap" }}>
              {[
                { label: "Días solicitados", value: diasSolicitados, color: COLORS.accent },
                { label: "Saldo disponible", value: Math.round(pendiente.saldo * 100) / 100, color: COLORS.positivo },
                { label: "Saldo restante", value: Math.round((pendiente.saldo - diasSolicitados) * 100) / 100, color: pendiente.saldo - diasSolicitados >= 0 ? COLORS.positivo : COLORS.vencida },
                { label: "Fecha de retorno", value: fechaRetorno ? fmtDate(fechaRetorno) : "—", color: COLORS.texto },
              ].map(({ label, value, color }) => (

                  <div style={{ fontSize: 10, color: COLORS.textoMuted, marginBottom: 2 }}>{label}</div>
                  <div style={{ fontSize: 15, fontWeight: 700, color }}>{value}</div>

          )}

      )}

      {/* Error */}
      {error && (
        <div style={{ padding: "12px 16px", background: "rgba(239,68,68,0.08)", border: "1px solid #EF444433", borderRadius: 10, color: COLORS.vencida, fontSize: 13 }}>

      {/* Botón generar */}
      {colabSeleccionado && pendiente && (
        <button onClick={generarPDF} style={{
          background: COLORS.accent, color: "white", border: "none",
          borderRadius: 12, padding: "14px", fontSize: 15, fontWeight: 700,

      )}
    </div>

}

// ─── PÁGINA: HISTORIAL DE VENCIMIENTOS ───────────────────────────────────────
function PaginaHistorial({ colaboradores, fechaCorteGlobal }) {
  const hoy = dateOnly(fechaCorteGlobal);
  const [mesSeleccionado, setMesSeleccionado] = useState(() => {
    return `${hoy.getFullYear()}-${String(hoy.getMonth() + 1).padStart(2, "0")}`;
  });
  const [busqueda, setBusqueda] = useState("");

  const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

  // Generar lista de meses disponibles (desde el más antiguo hasta hoy)
  const mesesDisponibles = useMemo(() => {
    const set = new Set();
    for (const c of colaboradores) {
      for (const p of c.periodos) {
        if (p.tipo === "INDEMNIZACION" || p.tipo === "VENCIDA") {
          // La fecha en que venció = fechaVencimiento + 1 día
          if (p.fechaVencimiento) {
            const venceEl = new Date(p.fechaVencimiento.getTime() + 86400000);
            if (venceEl <= hoy) {
              set.add(`${venceEl.getFullYear()}-${String(venceEl.getMonth() + 1).padStart(2, "0")}`);
            }
          }
        }
      }
    }
    return Array.from(set).sort().reverse(); // más reciente primero
  }, [colaboradores, hoy]);

  // Colaboradores con vencimientos en el mes seleccionado
  const vencidosMes = useMemo(() => {
    if (!mesSeleccionado) return [];
    const [año, mes] = mesSeleccionado.split("-").map(Number);
    const resultados = [];

    for (const c of colaboradores) {
      let diasVencidosMes = 0;
      const periodosVencidosMes = [];

      for (const p of c.periodos) {
        if ((p.tipo === "INDEMNIZACION" || p.tipo === "VENCIDA") && p.fechaVencimiento) {
          const venceEl = new Date(p.fechaVencimiento.getTime() + 86400000);
          if (venceEl.getFullYear() === año && venceEl.getMonth() + 1 === mes && venceEl <= hoy) {
            // Los días que se vencieron = diasBase - diasGozados - diasComprados
            // Usamos diasIndemnizacionBruta si es positivo, sino diasBase
            const diasVenc = p.diasIndemnizacionBruta !== null
              ? Math.max(0, p.diasIndemnizacionBruta)
              : Math.max(0, p.diasBase - p.diasGozados - (p.diasComprados || 0));
            if (diasVenc > 0) {
              diasVencidosMes += diasVenc;
              periodosVencidosMes.push({
                id: p.id,
                anio: p.anio,
                inicio: p.inicio,
                fin: p.fin,
                fechaVencioEl: venceEl,
                diasVencidos: diasVenc,
                diasGozados: p.diasGozados,
                diasBase: p.diasBase,
              });
            }
          }
        }
      }

      if (diasVencidosMes > 0) {
        resultados.push({ ...c, diasVencidosMes, periodosVencidosMes });
      }
    }

    return resultados.sort((a, b) => b.diasVencidosMes - a.diasVencidosMes);
  }, [colaboradores, mesSeleccionado, hoy]);

  const filtrados = useMemo(() => {
    const q = busqueda.toLowerCase();
    return !q ? vencidosMes : vencidosMes.filter((c) =>
      c.nombres.toLowerCase().includes(q) || c.cod.includes(q) || c.gerencia.toLowerCase().includes(q)
    );
  }, [vencidosMes, busqueda]);

  const totalDiasVencidosMes = filtrados.reduce((s, c) => s + c.diasVencidosMes, 0);
  // Años disponibles
  const añosDisponibles = useMemo(() => {
    const set = new Set(mesesDisponibles.map((m) => m.split("-")[0]));
    return Array.from(set).sort().reverse();
  }, [mesesDisponibles]);

  const [añoSeleccionado, setAñoSeleccionado] = useState(() => {
    return hoy.getFullYear().toString();
  });

  // Meses del año seleccionado
  const mesesDelAño = useMemo(() => {
    return mesesDisponibles.filter((m) => m.startsWith(añoSeleccionado));
  }, [mesesDisponibles, añoSeleccionado]);

  const exportar = () => {
    const filas = filtrados.map((c) => ({
      "Código": c.cod,
      "DNI": c.doc,
      "Nombres": c.nombres,
      "Gerencia": c.gerencia,
      "Unidad Org.": c.unidadOrg,
      "Días Vencidos en el Mes": c.diasVencidosMes,
      "Períodos": c.periodosVencidosMes.map(p => `Año ${p.anio} (${p.diasVencidos}d)`).join(", "),
    }));
    const ws = XLSX.utils.json_to_sheet(filas);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Historial");
    XLSX.writeFile(wb, `Historial_Vencimientos_${mesSeleccionado}.xlsx`);
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
      {/* Header */}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 12 }}>
        <div>
          <div style={{ fontSize: 22, fontWeight: 700, color: COLORS.texto }}>Historial de Vencimientos</div>
          <div style={{ fontSize: 14, color: COLORS.textoMuted, marginTop: 2 }}>
            Días pendientes que pasaron a vencidos por mes
          </div>
        </div>
        {filtrados.length > 0 && (
          <button onClick={exportar} style={{ background: COLORS.positivo + "22", border: `1px solid ${COLORS.positivo}44`, color: COLORS.positivo, borderRadius: 10, padding: "9px 18px", cursor: "pointer", fontSize: 13, fontWeight: 600 }}>
            ⬇ Exportar Excel
          </button>
        )}
      </div>

      {/* Selector de mes */}
      <div style={{ background: COLORS.surfaceHigh, borderRadius: 14, border: `1px solid ${COLORS.border}`, padding: "20px 24px", display: "flex", flexDirection: "column", gap: 16 }}>

        {/* Selector de año */}
        <div>
          <div style={{ fontSize: 12, fontWeight: 600, color: COLORS.textoMuted, marginBottom: 10, textTransform: "uppercase", letterSpacing: "0.04em" }}>Año</div>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            {añosDisponibles.map((a) => (
              <button key={a} onClick={() => {
                setAñoSeleccionado(a);
                // Seleccionar el primer mes disponible de ese año
                const primero = mesesDisponibles.find((m) => m.startsWith(a));
                if (primero) setMesSeleccionado(primero);
                setBusqueda("");
              }} style={{
                background: añoSeleccionado === a ? COLORS.accent : COLORS.bg,
                border: `1px solid ${añoSeleccionado === a ? COLORS.accent : COLORS.border}`,
                color: añoSeleccionado === a ? "white" : COLORS.textoSecundario,
                borderRadius: 8, padding: "7px 18px", cursor: "pointer",
                fontSize: 13, fontWeight: añoSeleccionado === a ? 700 : 400,
              }}>{a}</button>
            ))}
          </div>
        </div>

        {/* Selector de mes */}
        {añoSeleccionado && (
          <div>
            <div style={{ fontSize: 12, fontWeight: 600, color: COLORS.textoMuted, marginBottom: 10, textTransform: "uppercase", letterSpacing: "0.04em" }}>Mes</div>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              {mesesDelAño.length === 0 && (
                <div style={{ fontSize: 13, color: COLORS.textoMuted }}>Sin vencimientos en {añoSeleccionado}</div>
              )}
              {mesesDelAño.map((m) => {
                const me = parseInt(m.split("-")[1]);
                const activo = m === mesSeleccionado;
                return (
                  <button key={m} onClick={() => { setMesSeleccionado(m); setBusqueda(""); }} style={{
                    background: activo ? COLORS.vencida : COLORS.bg,
                    border: `1px solid ${activo ? COLORS.vencida : COLORS.border}`,
                    color: activo ? "white" : COLORS.textoSecundario,
                    borderRadius: 8, padding: "7px 16px", cursor: "pointer",
                    fontSize: 12, fontWeight: activo ? 700 : 400,
                  }}>{MESES[me - 1]}</button>
                );
              })}
            </div>
          </div>
        )}
      </div>

      {/* ── GRÁFICO DE BARRAS DOBLE: períodos y días vencidos por mes ── */}
      {añoSeleccionado && (() => {
        const mesesDelAñoTodos = Array.from({ length: 12 }, (_, i) => {
          const m = String(i + 1).padStart(2, "0");
          return `${añoSeleccionado}-${m}`;
        });
        const datosGrafico = mesesDelAñoTodos.map(mes => {
          const [a, me] = mes.split("-").map(Number);
          let periodos = 0, dias = 0;
          for (const c of colaboradores) {
            for (const p of c.periodos) {
              if ((p.tipo === "INDEMNIZACION" || p.tipo === "VENCIDA") && p.fechaVencimiento) {
                const venceEl = new Date(p.fechaVencimiento.getTime() + 86400000);
                if (venceEl.getFullYear() === a && venceEl.getMonth() + 1 === me && venceEl <= hoy) {
                  const dv = p.diasIndemnizacionBruta !== null ? Math.max(0, p.diasIndemnizacionBruta) : Math.max(0, p.diasBase - p.diasGozados - (p.diasComprados || 0));
                  if (dv > 0) { periodos++; dias += dv; }
                }
              }
            }
          }
          return { mes, label: MESES[me - 1].slice(0, 3), periodos, dias };
        });
        const maxDias = Math.max(...datosGrafico.map(d => d.dias), 1);
        const maxPeriodos = Math.max(...datosGrafico.map(d => d.periodos), 1);
        const barH = 100;
        return (
          <div style={{ background: COLORS.surfaceHigh, borderRadius: 14, border: `1px solid ${COLORS.border}`, padding: "20px 24px" }}>
            <div style={{ fontSize: 13, fontWeight: 700, color: COLORS.texto, marginBottom: 16 }}>
              📊 Vencimientos por mes — {añoSeleccionado}
              <span style={{ fontSize: 11, fontWeight: 400, color: COLORS.textoMuted, marginLeft: 12 }}>
                Clic en un mes para ver el detalle
              </span>
            </div>
            <div style={{ display: "flex", gap: 16, marginBottom: 10 }}>
              <span style={{ fontSize: 11, display: "flex", alignItems: "center", gap: 4 }}><span style={{ width: 12, height: 12, background: "#EF4444", borderRadius: 2, display: "inline-block" }} />Períodos vencidos</span>
              <span style={{ fontSize: 11, display: "flex", alignItems: "center", gap: 4 }}><span style={{ width: 12, height: 12, background: "#F97316", borderRadius: 2, display: "inline-block" }} />Días vencidos</span>
            </div>
            <div style={{ display: "flex", gap: 4, alignItems: "flex-end", height: barH + 30 }}>
              {datosGrafico.map(d => {
                const hDias = d.dias > 0 ? Math.max(4, (d.dias / maxDias) * barH) : 0;
                const hPer = d.periodos > 0 ? Math.max(4, (d.periodos / maxPeriodos) * barH) : 0;
                const activo = d.mes === mesSeleccionado;
                return (
                  <div key={d.mes} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 2, cursor: "pointer" }}
                    onClick={() => { setMesSeleccionado(d.mes); setBusqueda(""); }}>
                    <div style={{ display: "flex", gap: 2, alignItems: "flex-end", height: barH }}>
                      <div style={{ width: 10, height: hPer, background: activo ? "#DC2626" : "#EF4444", borderRadius: "3px 3px 0 0", transition: "height 0.3s" }} title={`${d.periodos} períodos`} />
                      <div style={{ width: 10, height: hDias, background: activo ? "#EA580C" : "#F97316", borderRadius: "3px 3px 0 0", transition: "height 0.3s" }} title={`${d.dias} días`} />
                    </div>
                    <div style={{ fontSize: 9, color: activo ? COLORS.texto : COLORS.textoMuted, fontWeight: activo ? 700 : 400 }}>{d.label}</div>
                  </div>
                );
              })}
            </div>
          </div>
        );
      })()}

      {/* KPIs del mes */}
      {mesSeleccionado && (
        <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 12 }}>
          <div style={{ background: COLORS.surfaceHigh, borderRadius: 12, border: `1px solid ${COLORS.border}`, padding: "16px 20px" }}>
            <div style={{ fontSize: 12, color: COLORS.textoMuted, marginBottom: 4 }}>Colaboradores afectados</div>

          <div style={{ background: COLORS.surfaceHigh, borderRadius: 12, border: `1px solid ${COLORS.border}`, padding: "16px 20px" }}>
            <div style={{ fontSize: 12, color: COLORS.textoMuted, marginBottom: 4 }}>Total días vencidos</div>
            <div style={{ fontSize: 28, fontWeight: 700, color: COLORS.vencida }}>{Math.round(totalDiasVencidosMes)}</div>
          </div>
          <div style={{ background: COLORS.surfaceHigh, borderRadius: 12, border: `1px solid ${COLORS.border}`, padding: "16px 20px" }}>
            <div style={{ fontSize: 12, color: COLORS.textoMuted, marginBottom: 4 }}>Promedio por colaborador</div>
            <div style={{ fontSize: 28, fontWeight: 700, color: COLORS.pendiente }}>

      {/* Buscador */}
      {vencidosMes.length > 0 && (

          value={busqueda} onChange={(e) => setBusqueda(e.target.value)}

                      <span style={{ color: COLORS.vencida, fontWeight: 700, marginLeft: 6 }}>−{p.diasVencidos} días</span>
                      <span style={{ color: COLORS.textoMuted, marginLeft: 4 }}>venció el {fmtDate(p.fechaVencioEl)}</span>
                    </div>

                <div style={{ fontSize: 26, fontWeight: 800, color: COLORS.vencida }}>{Math.round(c.diasVencidosMes)}</div>
                <div style={{ fontSize: 11, color: COLORS.textoMuted }}>días vencidos</div>
              </div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── PÁGINA: INCAPACIDADES MÉDICAS ───────────────────────────────────────────
function PaginaIncapacidades({ colaboradores }) {
  const [busqueda, setBusqueda] = useState("");
  const [filtroGerencia, setFiltroGerencia] = useState("Todas");
  const [filtroTipo, setFiltroTipo] = useState("Todos");

  const gerencias = useMemo(() => ["Todas", ...Array.from(new Set(colaboradores.map(c => c.gerencia))).sort()], [colaboradores]);

  const afectados = useMemo(() => {
    return colaboradores
      .filter(c => c.tieneExtension || (c.eventosSubsidio && c.eventosSubsidio.length > 0))
      .filter(c => filtroGerencia === "Todas" || c.gerencia === filtroGerencia)
      .filter(c => {
        if (filtroTipo === "Todos") return true;
        if (filtroTipo === "Con extensión") return c.tieneExtension;
        if (filtroTipo === "Sin extensión") return !c.tieneExtension;
        return true;
      })
      .filter(c => {
        if (!busqueda) return true;
        const q = busqueda.toLowerCase();
        return c.nombres.toLowerCase().includes(q) || c.cod.includes(q) || c.gerencia.toLowerCase().includes(q);
      })
      .sort((a, b) => (b.diasExtension || 0) - (a.diasExtension || 0));
  }, [colaboradores, filtroGerencia, filtroTipo, busqueda]);

  const totalExtension = afectados.reduce((s, c) => s + (c.diasExtension || 0), 0);
  const conExtension = afectados.filter(c => c.tieneExtension).length;

  const inputStyle = { background: COLORS.surfaceHigh, border: `1px solid ${COLORS.border}`, color: COLORS.texto, borderRadius: 10, padding: "9px 14px", fontSize: 13, outline: "none" };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
      <div>
        <div style={{ fontSize: 22, fontWeight: 700, color: COLORS.texto }}>Incapacidades Médicas</div>
        <div style={{ fontSize: 14, color: COLORS.textoMuted, marginTop: 2 }}>Impacto en el año laboral por Subsidio Enfermedad — D.L. 713</div>
      </div>

      {/* KPIs */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(170px, 1fr))", gap: 14 }}>
        <KPICard label="Colaboradores con incapacidad" value={afectados.length} icon="🏥" color={COLORS.texto} />
        <KPICard label="Con extensión de año" value={conExtension} icon="📅" color={COLORS.pendiente} sub="Subsidio Enfermedad > 60 días" />
        <KPICard label="Total días de extensión" value={totalExtension} icon="⏳" color={COLORS.pendiente} sub="Días añadidos al año laboral" />
        <KPICard label="Sin extensión" value={afectados.length - conExtension} icon="✅" color={COLORS.positivo} sub="Subsidio ≤ 60 días o accidente" />
      </div>

      {/* Filtros */}
      <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
        <input placeholder="🔍 Buscar por nombre, código o gerencia..." value={busqueda} onChange={e => setBusqueda(e.target.value)} style={{ ...inputStyle, flex: "1 1 260px" }} />
        <select value={filtroGerencia} onChange={e => setFiltroGerencia(e.target.value)} style={{ ...inputStyle, minWidth: 160 }}>
          {gerencias.map(g => <option key={g} value={g}>{g === "Todas" ? "Gerencias" : (g.length > 24 ? g.slice(0,24)+"…" : g)}</option>)}
        </select>
        <select value={filtroTipo} onChange={e => setFiltroTipo(e.target.value)} style={{ ...inputStyle }}>
          {["Todos", "Con extensión", "Sin extensión"].map(t => <option key={t} value={t}>{t}</option>)}
        </select>
      </div>

      {/* Lista */}
      {afectados.length === 0 && (
        <div style={{ textAlign: "center", padding: 60, color: COLORS.textoMuted, fontSize: 14 }}>
          {colaboradores.filter(c => c.tieneExtension).length === 0
            ? "📂 Carga el archivo de Incapacidades Médicas en Importación para ver los datos"
            : "✅ Ningún colaborador cumple los filtros seleccionados"}
        </div>
      )}

      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {afectados.map(c => {
          const color = c.tieneExtension ? COLORS.pendiente : COLORS.positivo;
          return (
            <div key={c.cod} style={{ background: COLORS.surfaceHigh, borderRadius: 12, border: `1px solid ${color}33`, borderLeft: `4px solid ${color}`, padding: "16px 18px" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 12 }}>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 14, fontWeight: 700, color: COLORS.texto }}>{c.nombres}</div>
                  <div style={{ fontSize: 12, color: COLORS.textoMuted, marginTop: 2 }}>{c.gerencia} · Cód: {c.cod} · DNI: {c.doc}</div>

                  {/* Eventos de subsidio */}
                  {c.eventosSubsidio && c.eventosSubsidio.length > 0 && (
                    <div style={{ marginTop: 10, display: "flex", flexDirection: "column", gap: 6 }}>
                      {c.eventosSubsidio.map((ev, i) => (
                        <div key={i} style={{ padding: "8px 12px", background: COLORS.bg, borderRadius: 8, border: `1px solid ${COLORS.border}`, fontSize: 12 }}>
                          <div style={{ display: "flex", gap: 16, flexWrap: "wrap" }}>
                            <span style={{ color: COLORS.textoMuted }}>Evento {i + 1}</span>
                            {ev.inicioDM && (
                              <span style={{ color: COLORS.textoMuted }}>
                                DM: <strong style={{ color: COLORS.texto }}>
                                  {fmtDate(ev.inicioDM)}{ev.finDM && ev.finDM.getTime() !== ev.inicioDM.getTime() ? ` al ${fmtDate(ev.finDM)}` : ""} ({ev.diasDM} {ev.diasDM === 1 ? "día" : "días"})
                                </strong>
                              </span>
                            )}
                            <span style={{ color: COLORS.textoMuted }}>Subsidio Enfermedad: <strong style={{ color: COLORS.texto }}>{ev.diasSubsidio} días</strong></span>
                            {ev.diasExtension > 0
                              ? <span style={{ color: COLORS.pendiente, fontWeight: 700 }}>⏳ Extensión: +{ev.diasExtension} días al año laboral</span>
                              : <span style={{ color: COLORS.positivo, fontWeight: 600 }}>✅ Sin extensión (≤ 60 días)</span>
                            }
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                {/* Badge derecho */}
                <div style={{ textAlign: "right", flexShrink: 0 }}>
                  {c.tieneExtension ? (
                    <>
                      <div style={{ fontSize: 24, fontWeight: 800, color: COLORS.pendiente }}>+{c.diasExtension}d</div>
                      <div style={{ fontSize: 11, color: COLORS.textoMuted }}>extensión año laboral</div>
                    </>
                  ) : (
                    <>
                      <div style={{ fontSize: 16, fontWeight: 700, color: COLORS.positivo }}>Sin extensión</div>
                      <div style={{ fontSize: 11, color: COLORS.textoMuted }}>subsidio ≤ 60 días</div>
                    </>
                  )}
                </div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}
