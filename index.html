<script type="text/babel" data-presets="react">
  const { useState, useEffect, useMemo, useCallback, useRef } = React;
  // XLSX is available as global from CDN


  function LoginScreen({ onLogin }) {
    const [usuario, setUsuario] = React.useState("");
    const [password, setPassword] = React.useState("");
    const [error, setError] = React.useState("");
    const [loading, setLoading] = React.useState(false);

    const handleLogin = async () => {
      if (!usuario || !password) { setError("Ingresa usuario y contraseña"); return; }
      setLoading(true);
      setError("");
      try {
        // Esperar a que Firebase esté listo
        let intentos = 0;
        while (!window._firebase?.db && intentos < 20) {
          await new Promise(r => setTimeout(r, 300));
          intentos++;
        }
        if (!window._firebase?.db) {
          setError("No se pudo conectar. Revisa tu internet e intenta de nuevo.");
          setLoading(false);
          return;
        }
        const { db, collection } = window._firebase;
        const snap = await window._firebase.getDocs(collection(db, "usuarios"));
        const usuarios = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        const bp = usuarios.find(b =>
          b.activo !== false &&
          b.u === usuario.toLowerCase().trim() &&
          b.p === password.trim()
        );
        if (bp) {
          onLogin({ u: bp.u, p: bp.p, n: bp.n, g: bp.g || [], admin: bp.admin || false });
        } else {
          setError("Usuario o contraseña incorrectos");
        }
      } catch(e) {
        console.error("Error en login:", e);
        setError("Error al conectar. Intenta de nuevo.");
      }
      setLoading(false);
    };

    const handleKey = (e) => { if (e.key === "Enter") handleLogin(); };
    return (
      <div className="login-bg">
        <div className="login-card">
          <div className="login-brand">
            <div className="login-logo-mark">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.5" strokeLinecap="round">
                <path d="M12 2C8 2 5 5 5 9c0 5 7 13 7 13s7-8 7-13c0-4-3-7-7-7z"/>
                <circle cx="12" cy="9" r="2" fill="#fff" stroke="none"/>
              </svg>
            </div>
            <span className="login-logo-name">LA CALERA</span>
          </div>
          <div className="login-logo-year">· 1970 ·</div>
          <hr className="login-divider" />
          <div className="login-subtitle">Nido Gestor Vacacional</div>
          {error && <div className="login-error">{error}</div>}
          <label className="login-label">Usuario</label>
          <input className="login-input" type="text" placeholder="Ej: Dluna" value={usuario}
            onChange={e => { setUsuario(e.target.value); setError(""); }} onKeyDown={handleKey} autoFocus />
          <label className="login-label">Contraseña</label>
          <input className="login-input" type="password" placeholder="••••••••" value={password}
            onChange={e => { setPassword(e.target.value); setError(""); }} onKeyDown={handleKey} />
          <button className="login-btn" onClick={handleLogin} disabled={loading}>
            {loading ? "Verificando..." : "Ingresar"}
          </button>
          <p className="login-note">Consulta con Gestión Humana si tienes problemas de acceso.</p>
        </div>
        <div className="login-footer">
          <div className="login-footer-dot"></div>
          <span className="login-footer-text">GESTIÓN HUMANA · LA CALERA</span>
          <div className="login-footer-dot"></div>
        </div>
      </div>
    );
  }

  function AppWrapper() {
    const [bpSession, setBpSession] = React.useState(() => {
      // Al iniciar, leer la sesión guardada en localStorage (si existe)
      try {
        const saved = localStorage.getItem("nidogestor_session");
        return saved ? JSON.parse(saved) : null;
      } catch { return null; }
    });

    const handleLogin = (bp) => {
      // Guardar sesión en localStorage al hacer login
      try { localStorage.setItem("nidogestor_session", JSON.stringify(bp)); } catch {}
      setBpSession(bp);
    };

    const handleLogout = () => {
      // Borrar sesión de localStorage al cerrar sesión
      try { localStorage.removeItem("nidogestor_session"); } catch {}
      if (window.__setAdminStatus) window.__setAdminStatus(false);
      setBpSession(null);
    };

    if (!bpSession) return <LoginScreen onLogin={handleLogin} />;
    return (
      <App bpGerencias={bpSession.g} bpNombre={bpSession.n} bpAdmin={bpSession.admin === true}
        onLogout={handleLogout} />
    );
  }



// ExcelJS loaded via CDN in the artifact environment - using XLSX with style workaround
// We'll use a custom styled export using XLSX with cell styles via html table approach

// ─── EXCEL STYLING UTILITY ───────────────────────────────────────────────────
const EXCEL_COLORS = {
  headerBg: "1A5C2E",
  headerText: "FFFFFF",
  vencidaBg: "FEF2F2",
  vencidaText: "DC2626",
  riesgoBg: "FFF7ED",
  riesgoText: "EA580C",
  positivoBg: "F0FDF4",
  positivoText: "16A34A",
  ejemploBg: "F0FDF4",
  instrBg: "F9FAFB",
  borderColor: "E5E7EB",
  textMain: "111827",
  textMuted: "6B7280",
};

function crearEstiloExcel(filas, encabezados, nombreHoja, nombreArchivo, optsColumnas = {}) {
  // Crear workbook con estilos usando SheetJS + HTML trick para máxima compatibilidad
  const wb = XLSX.utils.book_new();

  // Construir datos con encabezado
  const aoa = [encabezados, ...filas.map((f) => encabezados.map((h) => f[h] ?? ""))];
  const ws = XLSX.utils.aoa_to_sheet(aoa);

  // Anchos de columna
  ws["!cols"] = encabezados.map((h) => ({
    wch: Math.max(h.length + 4, optsColumnas[h]?.wch || 14),
  }));

  // Freeze primera fila + primeras 3 columnas
  ws["!freeze"] = { xSplit: 3, ySplit: 1, topLeftCell: "D2", activeCell: "D2", sqref: "D2" };

  // Aplicar estilos celda por celda
  const cols = encabezados.length;
  const rows = aoa.length;

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const addr = XLSX.utils.encode_cell({ r, c });
      if (!ws[addr]) ws[addr] = { v: "", t: "s" };

      const h = encabezados[c];
      const val = r === 0 ? h : filas[r - 1][h];

      if (r === 0) {
        // Encabezado
        ws[addr].s = {
          fill: { fgColor: { rgb: EXCEL_COLORS.headerBg } },
          font: { bold: true, color: { rgb: EXCEL_COLORS.headerText }, sz: 11, name: "Calibri" },
          alignment: { horizontal: "center", vertical: "center", wrapText: true },
          border: {
            bottom: { style: "thin", color: { rgb: EXCEL_COLORS.headerBg } },
          },
        };
      } else {
        // Datos
        let fillRgb = null;
        let textRgb = EXCEL_COLORS.textMain;
        let bold = false;

        const numVal = parseFloat(val);
        const isNum = !isNaN(numVal);

        if ((h === "Vencidas" || h === "Vencidas Recientes" || h === "Vencidas Antiguas" || h === "Total vencidas") && isNum && numVal > 0) {
          fillRgb = EXCEL_COLORS.vencidaBg; textRgb = EXCEL_COLORS.vencidaText; bold = true;
        } else if ((h === "En Riesgo (90d)" || h === "Tiene Vencidas") && val === "Sí") {
          fillRgb = EXCEL_COLORS.riesgoBg; textRgb = EXCEL_COLORS.riesgoText; bold = true;
        } else if ((h === "Días Indemnización" || h === "Indemnización") && isNum && numVal > 0) {
          fillRgb = EXCEL_COLORS.riesgoBg; textRgb = EXCEL_COLORS.riesgoText; bold = true;
        } else if ((h === "Total Por Gozar" || h === "Por gozar" || h === "Días Pendientes") && isNum && numVal > 0) {
          fillRgb = EXCEL_COLORS.positivoBg; textRgb = EXCEL_COLORS.positivoText; bold = true;
        }

        ws[addr].s = {
          fill: fillRgb ? { fgColor: { rgb: fillRgb } } : { fgColor: { rgb: "FFFFFF" } },
          font: { color: { rgb: textRgb }, sz: 11, name: "Calibri", bold },
          alignment: {
            horizontal: isNum ? "right" : "left",
            vertical: "center",
          },
          border: {
            bottom: { style: "thin", color: { rgb: EXCEL_COLORS.borderColor } },
          },
        };
      }
    }
  }

  // Altura filas
  ws["!rows"] = [{ hpt: 28 }, ...filas.map(() => ({ hpt: 20 }))];

  XLSX.utils.book_append_sheet(wb, ws, nombreHoja);
  XLSX.writeFile(wb, nombreArchivo);
}

// ─── MOTOR DE CÁLCULO VACACIONAL ───────────────────────────────────────────
// FECHA_CORTE_SISTEMA se lee desde la celda K1 del Excel "Base de Datos"
// y se pasa como parámetro a calcularPeriodos / procesarColaborador.

function addYears(date, years) {
  const d = new Date(date);
  d.setFullYear(d.getFullYear() + years);
  return d;
}
function addMonths(date, months) {
  const d = new Date(date);
  d.setMonth(d.getMonth() + months);
  return d;
}
function daysBetween(a, b) {
  return Math.floor((b - a) / 86400000);
}
function dateOnly(d) {
  if (!d) return null;
  const dt = d instanceof Date ? d : new Date(d);
  return new Date(dt.getFullYear(), dt.getMonth(), dt.getDate());
}
function excelDateToJS(serial) {
  if (serial instanceof Date) return dateOnly(serial);
  if (typeof serial === "number") {
    const utc = new Date(Date.UTC(1899, 11, 30));
    utc.setUTCDate(utc.getUTCDate() + serial);
    return dateOnly(utc);
  }
  return dateOnly(new Date(serial));
}
function fmtDate(d) {
  if (!d) return "—";
  const dt = d instanceof Date ? d : new Date(d);
  return `${String(dt.getDate()).padStart(2, "0")}/${String(dt.getMonth() + 1).padStart(2, "0")}/${dt.getFullYear()}`;
}
// Parsear fecha evitando desfase timezone: YYYY-MM-DD como UTC midnight = día incorrecto en UTC-N
// Solución: añadir T12:00:00 para interpretar como hora local
const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
function fmtMesAnio(d) {
  if (!d) return "—";
  const dt = d instanceof Date ? d : new Date(d);
  return `${MESES[dt.getMonth()]} ${dt.getFullYear()}`;
}

function parseFechaSegura(val) {
  if (!val) return null;
  if (val instanceof Date) return isNaN(val.getTime()) ? null : dateOnly(val);
  const str = String(val).trim();
  const d = new Date(str.length === 10 && /^\d{4}-\d{2}-\d{2}$/.test(str) ? str + 'T12:00:00' : str);
  return isNaN(d.getTime()) ? null : dateOnly(d);
}

// Calcular períodos vacacionales desde fecha de corte individual.
// Regla: un período es COMPLETO (30 días) solo si su fin natural < fechaCorteGlobal.
// Si el período empezó pero aún no terminó → es TRUNCA proporcional.
// fechaCorteGlobal: Date leída desde K1 del Excel.
//
// FECHA DE VENCIMIENTO (corregida):
//   El trabajador labora el Año N: desde fechaCorte+(N-1)años hasta fechaCorte+N años - 1 día.
//   Tiene el año siguiente completo para gozarlo, es decir hasta finNatural + 1 año.
//   Ejemplo: laborado 01/05/2019→30/04/2020 → plazo de goce 01/05/2020→30/04/2021 → vence 30/04/2021.
//   Fórmula: fechaVencimiento = addYears(finNatural, 1)   [NO addYears(corte, N+1)]
function calcularPeriodos(fechaCorte, fechaCorteGlobal, eventosSubsidio = []) {
  const corte = dateOnly(fechaCorte);
  const hoy = dateOnly(fechaCorteGlobal);
  const periodos = [];
  let anio = 1;
  let offsetDias = 0; // días acumulados de extensión de períodos anteriores

  while (true) {
    // Inicio = fecha corte + (anio-1) años + offset de extensiones anteriores
    const inicioBase = dateOnly(addYears(corte, anio - 1));
    const inicio = dateOnly(new Date(inicioBase.getTime() + offsetDias * 86400000));

    // Fin base = inicio + 1 año - 1 día
    const finNaturalBase = dateOnly(new Date(addYears(inicio, 1).getTime() - 86400000));

    // Extensión por subsidio/LSG para este año laboral
    let diasExtSubsidioAnio = 0;
    let diasExtLSGAnio = 0;
    for (const ev of eventosSubsidio) {
      if (ev.tipo === "LSG") {
        diasExtLSGAnio += ev.diasExtensionPorPeriodo?.[anio] || 0;
      } else {
        diasExtSubsidioAnio += ev.diasExtensionPorPeriodo?.[anio] || 0;
      }
    }
    const diasExtAnio = diasExtSubsidioAnio + diasExtLSGAnio;

    const finNatural = dateOnly(new Date(finNaturalBase.getTime() + diasExtAnio * 86400000));
    const fechaVencimiento = dateOnly(addYears(finNatural, 1));

    if (inicio >= hoy) break;

    if (finNatural >= hoy) {
      const diasTranscurridos = daysBetween(inicio, hoy);
      const mesesCompletos = Math.floor(diasTranscurridos / 30);
      const diasExtra = diasTranscurridos % 30;
      // Denominador = 360 + días de subsidio — el período se alarga pero el tope es 30 días (D.L. 713)
      const denominador = 360 + diasExtAnio;
      const diasTrunca = Math.min(30, Math.round(((mesesCompletos * 30 + diasExtra) / denominador) * 30 * 100) / 100);
      if (diasTrunca > 0) {
        periodos.push({
          id: `P${anio}`, anio, inicio, fin: finNatural,
          fechaVencimiento: null, tipo: "TRUNCA",
          diasBase: diasTrunca, diasGozados: 0, saldo: diasTrunca,
          goces: [], compras: [], diasExtension: diasExtAnio, diasExtensionSubsidio: diasExtSubsidioAnio, diasExtensionLSG: diasExtLSGAnio,
        });
      }
      break;
    }

    const tipo = fechaVencimiento < hoy ? "VENCIDA" : "PENDIENTE";
    periodos.push({
      id: `P${anio}`, anio, inicio, fin: finNatural,
      fechaVencimiento, tipo, diasBase: 30,
      diasComprados: 0, diasGozados: 0, saldo: 30,
      goces: [], compras: [], diasExtension: diasExtAnio, diasExtensionSubsidio: diasExtSubsidioAnio, diasExtensionLSG: diasExtLSGAnio,
    });

    // El siguiente período hereda el offset acumulado + extensión de este período
    offsetDias += diasExtAnio;
    anio++;
  }

  return periodos;
}

// Agrupar días individuales en bloques contiguos
function agruparBloques(fechas) {
  if (!fechas.length) return [];
  const sorted = [...fechas].sort((a, b) => a - b);
  const bloques = [];
  let ini = sorted[0], prev = sorted[0];
  for (let i = 1; i < sorted.length; i++) {
    const diff = daysBetween(prev, sorted[i]);
    if (diff === 1) {
      prev = sorted[i];
    } else {
      bloques.push({ inicio: ini, fin: prev, dias: daysBetween(ini, prev) + 1 });
      ini = sorted[i];
      prev = sorted[i];
    }
  }
  bloques.push({ inicio: ini, fin: prev, dias: daysBetween(ini, prev) + 1 });
  return bloques;
}

// Determinar a qué período pertenece un bloque de goce.
//
// REGLA CLAVE: el trabajador tiene DERECHO a gozar un período hasta su
// fechaVencimiento (no solo hasta el fin del año laboral).
// Ejemplo: P7 año laboral 01/03/2025→28/02/2026, vence 01/03/2027.
// Un goce del 09/03/2026 cae DESPUÉS del fin del año pero ANTES del vencimiento
// → pertenece a P7, NO a trunca.
//
// Algoritmo:
// 1. Para cada período (no TRUNCA), el rango válido de goce es [inicio, fechaVencimiento).
// 2. Calculamos el solapamiento del bloque con ese rango extendido.
// 3. El período con mayor solapamiento gana.
// 4. Fallback a TRUNCA solo si ningún período tiene solapamiento.
function asignarPeriodo(bloqueInicio, bloqueFin, periodos) {
  // Ordenar períodos de más antiguo a más reciente
  const periodosOrdenados = [...periodos]
    .filter(p => p.tipo !== "TRUNCA")
    .sort((a, b) => {
      // Ordenar por inicio del período (fecha real), el más antiguo primero
      if (a.inicio && b.inicio) return a.inicio.getTime() - b.inicio.getTime();
      return (a.anio ?? 999) - (b.anio ?? 999);
    });

  // Estrategia: para cada día del bloque, encontrar el período más antiguo
  // cuyo rango de goce [inicio, fechaVencimiento] lo contenga.
  // Un período "contiene" el INICIO del bloque si bloqueInicio <= limiteGoceDerecho del período
  // y bloqueInicio >= inicio del período.
  //
  // Prioridad: el período más antiguo cuyo rango de goce contenga el INICIO del bloque.
  for (const p of periodosOrdenados) {
    const limiteGoceDerecho = p.fechaVencimiento
      ? new Date(p.fechaVencimiento.getTime() - 86400000)
      : p.fin;

    // El inicio del bloque debe caer dentro del rango de goce del período
    if (bloqueInicio >= p.inicio && bloqueInicio <= limiteGoceDerecho) {
      return { periodo: p, esTrunca: false };
    }
  }

  // Fallback: mayor overlap
  let maxOverlap = 0;
  let mejorPeriodo = null;
  for (const p of periodosOrdenados) {
    const limiteGoceDerecho = p.fechaVencimiento
      ? new Date(p.fechaVencimiento.getTime() - 86400000)
      : p.fin;
    const ovIni = bloqueInicio >= p.inicio ? bloqueInicio : p.inicio;
    const ovFin = bloqueFin <= limiteGoceDerecho ? bloqueFin : limiteGoceDerecho;
    if (ovIni <= ovFin) {
      const overlap = daysBetween(ovIni, ovFin) + 1;
      if (overlap > maxOverlap) {
        maxOverlap = overlap;
        mejorPeriodo = p;
      }
    }
  }

  if (!mejorPeriodo) {
    for (const p of periodos) {
      if (p.tipo === "TRUNCA") return { periodo: p, esTrunca: true };
    }
  }
  return { periodo: mejorPeriodo, esTrunca: false };
}

// ── Parser de Cesados ────────────────────────────────────────────────────────
function parseCesados(arrayBuffer) {
  const wb = XLSX.read(arrayBuffer, { type: "array", cellDates: true });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const raw = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true });
  let headerRow = -1;
  for (let i = 0; i < raw.length; i++) {
    if (raw[i].some((c) => String(c).trim() === "Nº pers.")) { headerRow = i; break; }
  }
  if (headerRow === -1) throw new Error("No se encontró cabecera en Cesados");
  const headers = raw[headerRow].map((h) => String(h).trim());
  const colMap = {};
  headers.forEach((h, i) => { colMap[h] = i; });
  const cesadosPorCod = {};
  for (let i = headerRow + 1; i < raw.length; i++) {
    const row = raw[i];
    const cod = String(row[colMap["Nº pers."]] || "").trim();
    if (!cod) continue;
    const estado = String(row[colMap["Estado"]] || "").trim();
    if (estado !== "Cesados" && estado !== "Cesado") continue;
    const fechaRaw = row[colMap["Fecha"]];
    if (!fechaRaw) continue;
    let fecha = null;
    if (fechaRaw instanceof Date) {
      fecha = dateOnly(fechaRaw);
    } else if (typeof fechaRaw === "number") {
      const d = new Date(Math.round((fechaRaw - 25569) * 86400 * 1000));
      fecha = isNaN(d.getTime()) ? null : dateOnly(d);
    } else {
      fecha = parseFechaSegura(fechaRaw);
    }
    if (!fecha) continue;
    // Guardar la fecha más reciente por código
    if (!cesadosPorCod[cod] || fecha > cesadosPorCod[cod]) {
      cesadosPorCod[cod] = fecha;
    }
  }
  return cesadosPorCod;
}

// ── Parser de Licencias Sin Goce ─────────────────────────────────────────────
function parseLSG(arrayBuffer) {
  const wb = XLSX.read(arrayBuffer, { type: "array", cellDates: true });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const raw = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true });
  let headerRow = -1;
  for (let i = 0; i < raw.length; i++) {
    if (raw[i].some((c) => String(c).trim() === "Nº pers.")) { headerRow = i; break; }
  }
  if (headerRow === -1) throw new Error("No se encontró cabecera en Licencia Sin Goce");
  const headers = raw[headerRow].map((h) => String(h).trim());
  const colMap = {};
  headers.forEach((h, i) => { colMap[h] = i; });
  const lsgPorCod = {};
  const visto = new Set();
  for (let i = headerRow + 1; i < raw.length; i++) {
    const row = raw[i];
    const cod = String(row[colMap["Nº pers."]] || "").trim();
    if (!cod) continue;
    const fechaRaw = row[colMap["Fecha"]];
    if (!fechaRaw) continue;
    const fecha = parseFechaSegura(fechaRaw);
    if (!fecha) continue;
    const tipo = String(row[colMap["Txt.explicativo"]] || "").trim();
    if (tipo !== "Licencia sin goce (Dias)" && tipo !== "Licencias") continue;
    const key = `${cod}_${fecha.toISOString().slice(0, 10)}`;
    if (visto.has(key)) continue;
    visto.add(key);
    if (!lsgPorCod[cod]) lsgPorCod[cod] = [];
    lsgPorCod[cod].push({ cod, fecha });
  }
  return lsgPorCod;
}

// ── Motor de extensión por Licencia Sin Goce ─────────────────────────────────
// Regla: bloques consecutivos >= 30 días (o mes completo de febrero) extienden el período
function calcularExtensionLSG(lsgEmp, fechaCorte) {
  if (!lsgEmp || lsgEmp.length === 0) return { diasExtensionLSG: 0, eventosLSG: [] };

  const corte = dateOnly(fechaCorte);
  const registros = [...lsgEmp].sort((a, b) => a.fecha - b.fecha);

  // Agrupar días consecutivos en bloques
  const bloques = [];
  let bloqueActual = null;
  for (const reg of registros) {
    if (!bloqueActual) {
      bloqueActual = { inicio: reg.fecha, fin: reg.fecha, dias: 1 };
    } else {
      const diff = daysBetween(bloqueActual.fin, reg.fecha);
      if (diff === 1) {
        bloqueActual.fin = reg.fecha;
        bloqueActual.dias++;
      } else {
        bloques.push(bloqueActual);
        bloqueActual = { inicio: reg.fecha, fin: reg.fecha, dias: 1 };
      }
    }
  }
  if (bloqueActual) bloques.push(bloqueActual);

  // Helper: detectar si un bloque es mes completo de febrero
  const esMesCompletoFebrero = (inicio, fin) => {
    if (inicio.getMonth() !== 1 || fin.getMonth() !== 1) return false;
    if (inicio.getFullYear() !== fin.getFullYear()) return false;
    const primerDia = new Date(inicio.getFullYear(), 1, 1);
    const ultimoDia = new Date(inicio.getFullYear(), 2, 0);
    return inicio.getTime() === primerDia.getTime() && fin.getTime() === ultimoDia.getTime();
  };

  // Helper: en qué año laboral cae una fecha
  const getAnioLaboral = (fecha) => {
    let anio = 1;
    while (true) {
      const inicioP = dateOnly(addYears(corte, anio - 1));
      const finP = dateOnly(new Date(addYears(corte, anio) - 86400000));
      if (fecha >= inicioP && fecha <= finP) return anio;
      if (inicioP > fecha) return anio - 1;
      anio++;
      if (anio > 50) break;
    }
    return 1;
  };

  const eventosLSG = [];
  let diasExtensionLSGTotal = 0;

  for (const bloque of bloques) {
    const califica = bloque.dias >= 30 || esMesCompletoFebrero(bloque.inicio, bloque.fin);
    if (!califica) continue;

    // Distribuir días de extensión por período aniversario
    const diasExtensionPorPeriodo = {};
    let diaActual = new Date(bloque.inicio);
    for (let d = 0; d < bloque.dias; d++) {
      const periodo = getAnioLaboral(dateOnly(diaActual));
      diasExtensionPorPeriodo[periodo] = (diasExtensionPorPeriodo[periodo] || 0) + 1;
      diaActual.setDate(diaActual.getDate() + 1);
    }

    diasExtensionLSGTotal += bloque.dias;
    eventosLSG.push({
      inicio: bloque.inicio,
      fin: bloque.fin,
      dias: bloque.dias,
      diasExtension: bloque.dias,
      diasExtensionPorPeriodo,
      tipo: "LSG",
    });
  }

  return { diasExtensionLSG: diasExtensionLSGTotal, eventosLSG };
}

// Procesar un colaborador completo
function procesarColaborador(emp, gocesEmp, fechaCorteGlobal, comprasEmp = [], ajuste = null, incapacidadesEmp = [], acuerdosEmp = [], regimenEmp = [], lsgEmp = [], fechaCese = null) {
  const fechaCorte = dateOnly(emp.fechaCorte);
  const feIngreso = dateOnly(emp.feIngreso);

  const fechaBase = feIngreso.getTime() !== fechaCorte.getTime() ? feIngreso : fechaCorte;
  const tieneHistoriaAnterior = feIngreso.getTime() < fechaCorte.getTime();

  const { diasExtension, eventos: eventosSubsidio } = calcularExtensionSubsidio(incapacidadesEmp, fechaBase);
  const { diasExtensionLSG, eventosLSG } = calcularExtensionLSG(lsgEmp, fechaBase);
  const todosEventosExtension = [...eventosSubsidio, ...eventosLSG];
  const periodos = calcularPeriodos(fechaBase, fechaCorteGlobal, todosEventosExtension);

  // ── Ajustar diasBase por régimen especial (15 días en vez de 30) ──────────
  if (regimenEmp.length > 0) {
    for (const p of periodos) {
      if (!p.inicio || !p.fin) continue;
      for (const r of regimenEmp) {
        // Ver cuánto del período cae dentro del rango de régimen especial
        const overlapInicio = p.inicio >= r.inicio ? p.inicio : r.inicio;
        const overlapFin = p.fin <= r.fin ? p.fin : r.fin;
        if (overlapInicio > overlapFin) continue; // no hay overlap

        const diasPeriodo = daysBetween(p.inicio, p.fin) + 1;
        const diasOverlap = daysBetween(overlapInicio, overlapFin) + 1;
        const proporcion = diasOverlap / diasPeriodo;

        if (proporcion >= 0.99) {
          // Período completamente dentro del régimen especial → 15 días
          const nuevoBase = p.tipo === "TRUNCA"
            ? Math.round(p.diasBase * 0.5 * 100) / 100  // trunca también se reduce proporcional
            : 15;
          p.diasBase = nuevoBase;
          p.saldo = Math.round(Math.max(0, nuevoBase - (p.diasGozados || 0) - (p.diasComprados || 0)) * 100) / 100;
        } else if (proporcion > 0) {
          // Período parcialmente en régimen especial → proporcional
          const diasNormales = Math.round(p.diasBase * (1 - proporcion) * 100) / 100;
          const diasEspeciales = Math.round(15 * proporcion * 100) / 100;
          const nuevoBase = Math.round((diasNormales + diasEspeciales) * 100) / 100;
          p.diasBase = nuevoBase;
          p.saldo = Math.round(Math.max(0, nuevoBase - (p.diasGozados || 0) - (p.diasComprados || 0)) * 100) / 100;
        }
        break; // solo aplicar el primer rango que hace overlap
      }
    }
  }
  // ─────────────────────────────────────────────────────────────────────────

  // Si hay historia anterior a fechaCorte, marcar esos períodos como gozados automáticamente
  if (tieneHistoriaAnterior) {
    for (const p of periodos) {
      if (!p.inicio) continue;
      // Período completamente anterior a fechaCorte
      if (p.fin && p.fin < fechaCorte) {
        const diasAuto = p.diasBase;
        p.diasGozados = diasAuto;
        p.saldo = Math.round((p.diasBase - diasAuto) * 100) / 100;
        p.goces.push({
          inicio: p.inicio,
          fin: p.fin,
          dias: diasAuto,
          obs: "Automático",
          tipoMovimiento: "GOCE_AUTO",
          periodoId: p.id,
        });
      }
      // Período que contiene la fechaCorte (partido)
      else if (p.inicio < fechaCorte && p.fin >= fechaCorte) {
        // Calcular días proporcionales desde inicio del período hasta fechaCorte
        const diasTranscurridos = daysBetween(p.inicio, fechaCorte);
        const denominador = 360 + (p.diasExtension || 0);
        const diasAuto = Math.min(p.diasBase, Math.round((diasTranscurridos / denominador) * 30 * 100) / 100);
        if (diasAuto > 0) {
          p.diasGozados = diasAuto;
          p.saldo = Math.round((p.diasBase - diasAuto) * 100) / 100;
          p.goces.push({
            inicio: p.inicio,
            fin: dateOnly(new Date(fechaCorte.getTime() - 86400000)),
            dias: diasAuto,
            obs: "Automático",
            tipoMovimiento: "GOCE_AUTO",
            periodoId: p.id,
          });
        }
      }
    }
  }

  // ── Período de Ajuste (P0) — se inserta AL INICIO del array ────────────────
  // Al mostrar en orden reverso, queda debajo del Año 1 (al final de la lista visual).
  // tipo INDEMNIZACION → hereda todas las fórmulas de redistribución.
  if (ajuste && ajuste.ctd > 0) {
    periodos.unshift({
      id: "P0",
      anio: 0,
      inicio: null,
      fin: null,
      fechaVencimiento: null,
      tipo: "INDEMNIZACION",
      diasBase: ajuste.ctd,
      diasComprados: 0,
      diasGozados: 0,
      saldo: ajuste.ctd,
      diasIndemnizacionBruta: ajuste.ctd,
      goces: [],
      compras: [],
      esAjuste: true,
      obs: ajuste.obs,
    });
  }

  // Filtrar goces: los reales solo desde fechaCorte (los anteriores se marcaron como Automático)
  // Además, recortar goces que superen fechaCorteGlobal (fecha de recálculo)
  const hoyCorte = dateOnly(fechaCorteGlobal);
  const gocesValidos = gocesEmp
    .filter((g) => g.fecha >= fechaCorte && g.fecha <= hoyCorte)
    .map((g) => ({ ...g }));
  const gocesIgnorados = gocesEmp.filter((g) => g.fecha < fechaCorte);
  // Bloques completos (sin corte) para Registros del Mes — fechas reales del SAP
  const bloquesCompletosRaw = agruparBloques(gocesEmp.filter(g => g.fecha >= fechaCorte).map(g => g.fecha));

  // Mapa obs por fecha para recuperarlo al armar bloques
  const obsPorFecha = {};
  gocesValidos.forEach((g) => {
    const k = g.fecha.toISOString ? g.fecha.toISOString().slice(0, 10) : String(g.fecha);
    if (g.obs) obsPorFecha[k] = g.obs;
  });
  // Mapa de bloque completo: cada día del bloque → finReal para Registros del Mes
  // Se mapea cada día (no solo el inicio) para cubrir sub-bloques partidos por límites de período
  const finRealPorInicio = {};
  bloquesCompletosRaw.forEach(b => {
    let d = new Date(b.inicio);
    while (d <= b.fin) {
      const k = d.toISOString().slice(0, 10);
      finRealPorInicio[k] = b.fin;
      d.setDate(d.getDate() + 1);
    }
  });

  // Agrupar en bloques y partirlos en los límites de los períodos
  // Esto asegura que un bloque que cruza el fin de un período se divide correctamente
  const bloquesRaw = agruparBloques(gocesValidos.map((g) => g.fecha));
  const bloques = [];
  for (const bloque of bloquesRaw) {
    // Encontrar todos los límites de períodos que caen dentro del bloque
    // Cortamos tanto en el fin del año laboral como en la fechaVencimiento
    const limites = new Set();
    for (const p of periodos) {
      // Límite en el fin del año laboral
      if (p.fin && p.fin >= bloque.inicio && p.fin < bloque.fin) {
        limites.add(dateOnly(new Date(p.fin.getTime() + 86400000)).getTime());
      }
      // Límite en la fechaVencimiento (último día para gozar)
      if (p.fechaVencimiento && p.fechaVencimiento >= bloque.inicio && p.fechaVencimiento < bloque.fin) {
        limites.add(dateOnly(new Date(p.fechaVencimiento.getTime() + 86400000)).getTime());
      }
    }
    if (limites.size === 0) {
      bloques.push(bloque);
    } else {
      // Partir el bloque en sub-bloques por cada límite
      const cortesOrdenados = Array.from(limites).sort((a, b) => a - b);
      let subInicio = bloque.inicio;
      for (const corteMs of cortesOrdenados) {
        const corte = dateOnly(new Date(corteMs));
        if (corte > bloque.fin) break;
        const subFin = dateOnly(new Date(corte.getTime() - 86400000));
        if (subInicio <= subFin) {
          bloques.push({ inicio: subInicio, fin: subFin, dias: daysBetween(subInicio, subFin) + 1 });
        }
        subInicio = corte;
      }
      if (subInicio <= bloque.fin) {
        bloques.push({ inicio: subInicio, fin: bloque.fin, dias: daysBetween(subInicio, bloque.fin) + 1 });
      }
    }
  }

  // Verificar si tiene períodos pendientes (no trunca)
  const tienePendientes = periodos.some(
    (p) => p.tipo !== "TRUNCA" && p.saldo > 0
  );

  // Calcular si cada acuerdo procede según la nueva regla de aplicación:
  // 1. VENCIDA al firmar → NO procede
  // 2. TRUNCA al firmar → NO procede
  // 3. Firmó con > 30 días antes del vencimiento → NO procede
  // 4. Al vencerse el período tenía > 23 días pendientes sin gozar → NO procede
  //    Al vencerse tenía ≤ 23 días pendientes → SÍ procede
  const acuerdosActivos = acuerdosEmp.map(a => {
    let procede = null;
    let motivoNoProcede = null;
    if (a.fechaFirma) {
      const periodoReal = periodos.find(p => acuerdoMatchPeriodo(a, p));
      if (periodoReal && periodoReal.inicio) {
        const firma = dateOnly(a.fechaFirma);
        const finNatural = periodoReal.fin;
        const fechaVenc = periodoReal.fechaVencimiento;
        let estadoAlFirmar;
        if (firma < periodoReal.inicio || firma <= finNatural) {
          estadoAlFirmar = "TRUNCA";
        } else if (fechaVenc && firma <= fechaVenc) {
          estadoAlFirmar = "PENDIENTE";
        } else {
          estadoAlFirmar = "VENCIDA";
        }

        if (estadoAlFirmar === "VENCIDA") {
          // Punto 1: VENCIDA al firmar → NO procede
          procede = false;
          motivoNoProcede = "Período ya vencido al momento de la firma";
        } else if (estadoAlFirmar === "TRUNCA") {
          // Punto 2: TRUNCA al firmar → NO procede
          procede = false;
          motivoNoProcede = "Período en trunca al momento de la firma";
        } else if (estadoAlFirmar === "PENDIENTE") {
          const diasParaVencer = daysBetween(firma, fechaVenc);
          if (diasParaVencer > 30) {
            // Punto 3: Firmó con > 30 días de anticipación → NO procede
            procede = false;
            motivoNoProcede = "Período pendiente con más de 1 mes para vencer al momento de la firma";
          } else {
            // Punto 4: verificar saldo al vencerse (saldoPreConvenio se calcula después de pasada 1)
            // Se evalúa después de la pasada 1 — por ahora dejamos pendiente y lo resolvemos post-pasada1
            procede = null; // se resolverá después de pasada 1
          }
        }
      }
    }
    return { ...a, diasRestantes: a.diasAcordados, procede: procede ?? true, motivoNoPrecedeTemp: motivoNoProcede };
  });

  // Helper para registrar un sub-bloque en un período
  const registrarSubBloque = (subInicio, subFin, subDias, periodoDestino, esPorAcuerdo, esTruncaBloque, acuerdoAplicado) => {
    let obsBloque = null;
    let d = new Date(subInicio);
    while (d <= subFin) {
      const k = d.toISOString().slice(0, 10);
      if (obsPorFecha[k]) { obsBloque = obsPorFecha[k]; break; }
      d.setDate(d.getDate() + 1);
    }
    const saldoAntes = Math.round(periodoDestino.saldo * 100) / 100;
    periodoDestino.diasGozados += subDias;
    periodoDestino.saldo = Math.round((periodoDestino.diasBase - (periodoDestino.diasComprados || 0) - periodoDestino.diasGozados) * 100) / 100;
    const saldoDespues = Math.round(periodoDestino.saldo * 100) / 100;
    // Buscar finReal del bloque completo (sin corte de fecha global)
    const inicioKey = subInicio.toISOString ? subInicio.toISOString().slice(0, 10) : String(subInicio).slice(0, 10);
    const finReal = finRealPorInicio[inicioKey] || subFin;
    periodoDestino.goces.push({
      inicio: subInicio, fin: subFin, finReal, dias: subDias,
      tipoMovimiento: "GOCE",
      periodoId: periodoDestino.id,
      periodoTipo: periodoDestino.tipo,
      esTrunca: esPorAcuerdo ? false : esTruncaBloque,
      consumoDesdeTracas: !esPorAcuerdo && esTruncaBloque && !tienePendientes,
      saldoAntes,
      saldoDespues,
      obs: obsBloque,
      porAcuerdo: esPorAcuerdo,
      acuerdoInfo: acuerdoAplicado,
    });
  };

  // ── PASADA 1: procesar TODOS los goces normalmente por fecha ──────────────
  // Sin tocar convenio. Esto establece el saldo real de cada período.
  for (const bloque of bloques) {
    const resultado = asignarPeriodo(bloque.inicio, bloque.fin, periodos);
    const periodoDestino = resultado.periodo;
    const esTruncaBloque = resultado.esTrunca;
    if (!periodoDestino) continue;
    registrarSubBloque(bloque.inicio, bloque.fin, bloque.dias, periodoDestino, false, esTruncaBloque, null);
  }

  // Guardar saldoPreConvenio en cada período (después de pasada 1, antes de pasada 2)
  for (const p of periodos) {
    p.saldoPreConvenio = Math.max(0, Math.round((p.diasBase - p.diasGozados - (p.diasComprados || 0)) * 100) / 100);
  }

  // ── Aplicar Punto 4: verificar saldo al vencerse ──────────────────────────
  // Ahora que tenemos saldoPreConvenio, resolver los acuerdos que quedaron en null
  for (const a of acuerdosActivos) {
    if (a.procede !== null) continue; // ya resuelto (puntos 1, 2 o 3)
    const periodoReal = periodos.find(p => acuerdoMatchPeriodo(a, p));
    if (!periodoReal) { a.procede = false; a.motivoNoPrecedeTemp = "Período no encontrado"; continue; }
    const saldoAlVencer = periodoReal.saldoPreConvenio;
    if (saldoAlVencer > 23) {
      a.procede = false;
      a.motivoNoPrecedeTemp = "Al vencerse el período tenía " + saldoAlVencer + " días pendientes (más de 23)";
    } else {
      a.procede = true;
      a.motivoNoPrecedeTemp = null;
    }
  }

  // ── PASADA 2: reasignar goces posteriores al vencimiento del convenio ─────
  // Ahora que los goces normales ya están registrados, calcular la cuota real
  // (saldo del período del convenio DESPUÉS de la pasada 1).
  // Luego retirar esos goces del período donde quedaron y moverlos al período del convenio.
  for (const acuerdo of acuerdosActivos) {
    if (!acuerdo.procede) continue;

    const periodoConvenio = periodos.find(p => acuerdoMatchPeriodo(acuerdo, p));
    if (!periodoConvenio) continue;
    if (!periodoConvenio.fechaVencimiento) continue;

    // Saldo real después de pasada 1
    const saldoRealPostPasada1 = Math.max(0,
      periodoConvenio.diasBase - periodoConvenio.diasGozados - (periodoConvenio.diasComprados || 0)
    );
    if (saldoRealPostPasada1 <= 0) continue; // no hay saldo que reasignar

    let cuotaRestante = Math.min(acuerdo.diasAcordados, saldoRealPostPasada1);
    if (cuotaRestante <= 0) continue;

    // Buscar bloques que ocurrieron DESPUÉS del vencimiento del convenio
    // y reasignarlos al período del convenio hasta agotar la cuota
    for (const bloque of bloques) {
      if (cuotaRestante <= 0) break;
      if (bloque.inicio <= periodoConvenio.fechaVencimiento) continue;

      // Este bloque ocurrió después del vencimiento → candidato a reasignar
      // Encontrar en qué período quedó registrado en pasada 1
      const periodoActual = periodos.find(p =>
        p.goces.some(g => g.inicio.getTime() === bloque.inicio.getTime() && g.fin.getTime() === bloque.fin.getTime())
      );
      if (!periodoActual) continue;
      if (periodoActual === periodoConvenio) continue; // ya está en el correcto

      const diasAReasignar = Math.min(bloque.dias, cuotaRestante);
      const diasQueQuedan = bloque.dias - diasAReasignar;

      // Retirar del período actual
      const goceIdx = periodoActual.goces.findIndex(
        g => g.inicio.getTime() === bloque.inicio.getTime() && g.fin.getTime() === bloque.fin.getTime()
      );
      if (goceIdx === -1) continue;
      periodoActual.goces.splice(goceIdx, 1);
      periodoActual.diasGozados -= bloque.dias;
      periodoActual.saldo = Math.round(
        (periodoActual.diasBase - (periodoActual.diasComprados || 0) - periodoActual.diasGozados) * 100
      ) / 100;

      // Registrar en el período del convenio (parte que va al convenio)
      const subFinConvenio = dateOnly(new Date(bloque.inicio.getTime() + (diasAReasignar - 1) * 86400000));
      const acuerdoInfo = { periodo: acuerdo.periodo, diasImputados: diasAReasignar, diasRestantes: cuotaRestante - diasAReasignar, porConvenio: true };
      registrarSubBloque(bloque.inicio, subFinConvenio, diasAReasignar, periodoConvenio, true, false, acuerdoInfo);
      cuotaRestante -= diasAReasignar;

      // Si el bloque se partió, registrar el resto en su período natural
      if (diasQueQuedan > 0) {
        const subInicioResto = dateOnly(new Date(subFinConvenio.getTime() + 86400000));
        const subFinResto = bloque.fin;
        const resultadoResto = asignarPeriodo(subInicioResto, subFinResto, periodos);
        const periodoResto = resultadoResto.periodo;
        if (periodoResto) {
          registrarSubBloque(subInicioResto, subFinResto, diasQueQuedan, periodoResto, false, resultadoResto.esTrunca, null);
        }
      }
    }
  }

  // ── Compras: asignar a período usando anioInicio/anioFin y DESCONTAR del saldo ──
  for (const compra of comprasEmp) {
    // Buscar el período que corresponde al año que impacta
    let periodoDestino = null;
    if (compra.anioInicio && compra.anioFin) {
      // Buscar período cuyo inicio sea del año anioInicio y fin del año anioFin
      periodoDestino = periodos.find(p =>
        p.inicio && p.fin &&
        p.inicio.getFullYear() === compra.anioInicio &&
        p.fin.getFullYear() === compra.anioFin
      );
      // Si no encuentra exacto, buscar por año de inicio
      if (!periodoDestino) {
        periodoDestino = periodos.find(p =>
          p.inicio && p.inicio.getFullYear() === compra.anioInicio
        );
      }
    }
    // Fallback: asignar al período activo según fecha de compra
    if (!periodoDestino && compra.inicio) {
      const { periodo } = asignarPeriodo(compra.inicio, compra.inicio, periodos);
      periodoDestino = periodo;
    }
    if (!periodoDestino) continue;

    const dias = compra.dias || 0;
    periodoDestino.diasComprados = (periodoDestino.diasComprados || 0) + dias;
    periodoDestino.saldo = Math.round((periodoDestino.diasBase - periodoDestino.diasComprados - periodoDestino.diasGozados) * 100) / 100;

    periodoDestino.compras.push({
      inicio: compra.inicio || periodoDestino.inicio,
      fin: compra.inicio || periodoDestino.inicio,
      dias,
      tipoMovimiento: "COMPRA",
      periodoId: periodoDestino.id,
      periodoTipo: periodoDestino.tipo,
      obs: compra.obs || null,
      estado: compra.estado || null,
      registrado: compra.registrado || false,
    });
  }

  const totalCompras = comprasEmp.reduce((s, c) => s + (c.dias || 0), 0);

  // ── Clasificar períodos: INDEMNIZACIÓN vs VENCIDA real ─────────────────
  // El P0 (ajuste) ya es INDEMNIZACION y no participa en la clasificación
  const periodosClasificables = periodos.filter((p) => !p.esAjuste);
  const idxPendiente = periodosClasificables.findIndex((p) => p.tipo === "PENDIENTE");
  const idxUltimaVencida = idxPendiente > 0
    ? idxPendiente - 1
    : periodosClasificables.filter((p) => p.tipo === "VENCIDA").length > 0
      ? periodosClasificables.map((p) => p.tipo).lastIndexOf("VENCIDA")
      : -1;

  periodosClasificables.forEach((p, idx) => {
    if (p.tipo === "VENCIDA") {
      p.tipo = idx < idxUltimaVencida ? "INDEMNIZACION" : "VENCIDA";
    }
  });

  // ── Calcular diasIndemnizacionBruta ANTES de redistribuir ──────────────
  // base - (gozado + comprado), sin redistribución. Puede ser negativo.
  // Solo aplica a períodos INDEMNIZACION.
  // Para VENCIDA: diasVencidosReales = base - gozado - comprado (ajustable por redistribución)
  periodos.forEach((p) => {
    if (p.esAjuste) return;
    if (p.tipo === "INDEMNIZACION") {
      p.diasIndemnizacionBruta = Math.round((p.diasBase - (p.diasGozados + (p.diasComprados || 0))) * 100) / 100;
    } else {
      p.diasIndemnizacionBruta = null;
    }
    // Para VENCIDA: inicializar diasVencidosReales = bruto
    if (p.tipo === "VENCIDA") {
      p.diasVencidosReales = Math.round(Math.max(0, p.diasBase - p.diasGozados - (p.diasComprados || 0)) * 100) / 100;
    }
  });

  // ── Redistribuir saldos negativos ──────────────────────────────────────
  // Regla: un saldo negativo significa que ese período prestó días a otro.
  // Ese exceso se descuenta de otros períodos con saldo positivo según prioridad.
  //
  // INDEMNIZACION negativa → busca en orden:
  //   1. INDEMNIZACION más antiguas (idx menor) con saldo > 0
  //   2. INDEMNIZACION más recientes (idx mayor) con saldo > 0
  //   3. VENCIDA con saldo > 0
  //   4. PENDIENTE con saldo > 0
  //   5. TRUNCA con saldo > 0
  //
  // VENCIDA negativa → PENDIENTE → TRUNCA
  // PENDIENTE negativa → TRUNCA
  //
  // NUEVA REGLA: cuando un período más reciente cede días a uno más antiguo con exceso,
  // esos días cedidos ya fueron gozados anticipadamente → reducen su diasIndemnizacionBruta.
  // Solo aplica cuando el donador (j) es más reciente que el deficitario (i), es decir j > i.
  for (let i = 0; i < periodos.length; i++) {
    const p = periodos[i];
    if (p.saldo >= 0) continue;

    let deficit = Math.round(Math.abs(p.saldo) * 100) / 100;
    p.saldo = 0;

    const absorber = (donor, def, haciaReciente) => {
      const tomar = Math.min(donor.saldo, def);
      donor.saldo = Math.round((donor.saldo - tomar) * 100) / 100;

      if (haciaReciente && tomar > 0) {
        // Cualquier tipo que absorba días de un período más antiguo con exceso
        if (donor.tipo === "INDEMNIZACION" && donor.diasIndemnizacionBruta > 0) {
          donor.diasIndemnizacionBruta = Math.round(Math.max(0, donor.diasIndemnizacionBruta - tomar) * 100) / 100;
        }
        // Si el donor es VENCIDA y el deficitario (p) es INDEMNIZACION más antigua,
        // NO reducir diasVencidosReales — la VENCIDA no absorbió el exceso del período antiguo
        if (donor.tipo === "VENCIDA" && p.tipo !== "INDEMNIZACION" && donor.diasVencidosReales > 0) {
          donor.diasVencidosReales = Math.round(Math.max(0, donor.diasVencidosReales - tomar) * 100) / 100;
        }
        if (!donor.diasCedidosAntiguos) donor.diasCedidosAntiguos = 0;
        donor.diasCedidosAntiguos = Math.round((donor.diasCedidosAntiguos + tomar) * 100) / 100;
        donor.periodoExcesoRef = p.anio || p.id;
      }

      if (!haciaReciente && donor.tipo === "INDEMNIZACION" && tomar > 0) {
        if (!donor.diasCedidosHaciaExceso) donor.diasCedidosHaciaExceso = 0;
        donor.diasCedidosHaciaExceso = Math.round((donor.diasCedidosHaciaExceso + tomar) * 100) / 100;
        if (!donor.periodoExcesoRefAntiguo) donor.periodoExcesoRefAntiguo = [];
        if (!donor.periodoExcesoRefAntiguo.includes(p.anio || p.id))
          donor.periodoExcesoRefAntiguo.push(p.anio || p.id);
      }

      if (!haciaReciente && donor.tipo === "VENCIDA" && donor.diasVencidosReales > 0) {
        donor.diasVencidosReales = Math.round(Math.max(0, donor.diasVencidosReales - tomar) * 100) / 100;
        if (!donor.diasCedidosHaciaExceso) donor.diasCedidosHaciaExceso = 0;
        donor.diasCedidosHaciaExceso = Math.round((donor.diasCedidosHaciaExceso + tomar) * 100) / 100;
        donor.periodoExcesoRef = p.anio || p.id;
      }

      return Math.round((def - tomar) * 100) / 100;
    };

    if (p.tipo === "INDEMNIZACION") {
      // 1. INDEMN más antiguas → más recientes (j=0 hacia i-1)
      for (let j = 0; j < i && deficit > 0; j++) {
        if (periodos[j].tipo === "INDEMNIZACION" && periodos[j].saldo > 0)
          deficit = absorber(periodos[j], deficit, false);
      }
      // 2. INDEMN más recientes (idx mayor) — hacia adelante, SÍ reduce indem (ya gozados antes)
      for (let j = i + 1; j < periodos.length && deficit > 0; j++) {
        if (periodos[j].tipo === "INDEMNIZACION" && periodos[j].saldo > 0)
          deficit = absorber(periodos[j], deficit, true);
      }
      // 3. VENCIDA — siempre más reciente que INDEMNIZACION → haciaReciente = true
      for (let j = 0; j < periodos.length && deficit > 0; j++) {
        if (periodos[j].tipo === "VENCIDA" && periodos[j].saldo > 0)
          deficit = absorber(periodos[j], deficit, true);
      }
      // 4. PENDIENTE — siempre más reciente que INDEMNIZACION → haciaReciente = true
      for (let j = 0; j < periodos.length && deficit > 0; j++) {
        if (periodos[j].tipo === "PENDIENTE" && periodos[j].saldo > 0)
          deficit = absorber(periodos[j], deficit, true);
      }
      // 5. TRUNCA — siempre más reciente → haciaReciente = true
      for (let j = 0; j < periodos.length && deficit > 0; j++) {
        if (periodos[j].tipo === "TRUNCA" && periodos[j].saldo > 0)
          deficit = absorber(periodos[j], deficit, true);
      }
    } else if (p.tipo === "VENCIDA") {
      // 1. INDEMN/VENCIDA más antiguas → más recientes (j=0 hacia i-1)
      for (let j = 0; j < i && deficit > 0; j++) {
        if ((periodos[j].tipo === "INDEMNIZACION" || periodos[j].tipo === "VENCIDA") && periodos[j].saldo > 0)
          deficit = absorber(periodos[j], deficit, false);
      }
      // 2. INDEMN/VENCIDA más recientes (idx mayor) → SÍ reduce (ya gozados antes)
      for (let j = i + 1; j < periodos.length && deficit > 0; j++) {
        if ((periodos[j].tipo === "INDEMNIZACION" || periodos[j].tipo === "VENCIDA") && periodos[j].saldo > 0)
          deficit = absorber(periodos[j], deficit, true);
      }
      // 3. PENDIENTE
      for (let j = 0; j < periodos.length && deficit > 0; j++) {
        if (periodos[j].tipo === "PENDIENTE" && periodos[j].saldo > 0)
          deficit = absorber(periodos[j], deficit, true);
      }
      // 4. TRUNCA
      for (let j = 0; j < periodos.length && deficit > 0; j++) {
        if (periodos[j].tipo === "TRUNCA" && periodos[j].saldo > 0)
          deficit = absorber(periodos[j], deficit, true);
      }
    } else if (p.tipo === "PENDIENTE") {
      // 1. INDEMN/VENCIDA más antiguas → más recientes (j=0 hacia i-1)
      for (let j = 0; j < i && deficit > 0; j++) {
        if ((periodos[j].tipo === "INDEMNIZACION" || periodos[j].tipo === "VENCIDA") && periodos[j].saldo > 0)
          deficit = absorber(periodos[j], deficit, false);
      }
      // 2. INDEMN/VENCIDA más recientes (idx mayor)
      for (let j = i + 1; j < periodos.length && deficit > 0; j++) {
        if ((periodos[j].tipo === "INDEMNIZACION" || periodos[j].tipo === "VENCIDA") && periodos[j].saldo > 0)
          deficit = absorber(periodos[j], deficit, true);
      }
      // 3. TRUNCA
      for (let j = 0; j < periodos.length && deficit > 0; j++) {
        if (periodos[j].tipo === "TRUNCA" && periodos[j].saldo > 0)
          deficit = absorber(periodos[j], deficit, false);
      }
    }
  }

  // ── KPIs ────────────────────────────────────────────────────────────────
  const totalGanados = periodos.reduce((s, p) => s + p.diasBase, 0);
  const totalGozados = periodos.reduce((s, p) => s + p.diasGozados, 0);
  const totalCompradosKPI = periodos.reduce((s, p) => s + (p.diasComprados || 0), 0);

  // Por gozar = ganados - gozados - comprados
  const totalPorGozar = Math.round((totalGanados - totalGozados - totalCompradosKPI) * 100) / 100;

  const diasPendientes = periodos
    .filter((p) => p.tipo === "PENDIENTE" && p.saldo > 0)
    .reduce((s, p) => s + p.saldo, 0);
  const diasTrunca = periodos
    .filter((p) => p.tipo === "TRUNCA" && p.saldo > 0)
    .reduce((s, p) => s + p.saldo, 0);

  // Total Vencidas = ganados − (gozados + comprados + pendientes + trunca)
  const totalVencidas = Math.round((totalGanados - (totalGozados + totalCompradosKPI + diasPendientes + diasTrunca)) * 100) / 100;

  // Vencidas recientes: mínimo entre diasVencidosReales y saldo
  // diasVencidosReales = Base - Gozado - Comprado (antes de redistribución)
  // saldo = lo que queda después de redistribución
  // El menor de los dos es el valor real visible en pantalla
  const vencidaReal = idxUltimaVencida >= 0 ? periodosClasificables[idxUltimaVencida] : null;
  const diasVencidas = vencidaReal && vencidaReal.tipo === "VENCIDA"
    ? Math.round(Math.min(vencidaReal.diasVencidosReales || 0, vencidaReal.saldo || 0) * 100) / 100
    : 0;

  // Indemnización: suma de diasIndemnizacionBruta positivos + saldo del período VENCIDA real
  const diasIndemnizacion = Math.round((
    periodos
      .filter((p) => p.tipo === "INDEMNIZACION" && p.diasIndemnizacionBruta > 0)
      .reduce((s, p) => s + p.diasIndemnizacionBruta, 0)
    + diasVencidas
  ) * 100) / 100;

  // Marcar el período VENCIDA real con su indemnización para mostrarlo en la vista
  if (vencidaReal && diasVencidas > 0) {
    vencidaReal.diasIndemnizacionBruta = diasVencidas;
  }

  const tieneVencidas = diasVencidas > 0;
  const tieneIndemnizacion = diasIndemnizacion > 0;
  const tieneTotalVencidas = totalVencidas > 0;

  const proximaVencida = periodos
    .filter((p) => p.tipo === "PENDIENTE")
    .sort((a, b) => a.fechaVencimiento - b.fechaVencimiento)[0];
  const diasParaVencer = proximaVencida
    ? daysBetween(dateOnly(fechaCorteGlobal), dateOnly(proximaVencida.fechaVencimiento))
    : null;

  return {
    ...emp,
    periodos,
    gocesIgnorados,
    totalGanados: Math.round(totalGanados * 100) / 100,
    totalGozados: Math.round(totalGozados * 100) / 100,
    totalComprados: Math.round(totalCompradosKPI * 100) / 100,
    totalPorGozar,
    totalVencidas,
    diasVencidas,
    diasIndemnizacion: Math.round(diasIndemnizacion * 100) / 100,
    diasPendientes: Math.round(diasPendientes * 100) / 100,
    diasTrunca: Math.round(diasTrunca * 100) / 100,
    tieneVencidas,
    tieneIndemnizacion,
    tieneTotalVencidas,
    diasParaVencer,
    totalCompras,
    enRiesgo: diasParaVencer !== null && diasParaVencer <= 90,
    consumoDesdeTracas: periodos.some((p) =>
      p.goces.some((g) => g.consumoDesdeTracas)
    ),
    diasExtension,
    eventosSubsidio,
    eventosLSG,
    diasExtensionLSG,
    fechaCese,
    esCesado: fechaCese !== null,
    tieneExtension: diasExtension > 0,
    tieneAcuerdo: acuerdosEmp.length > 0,
    acuerdosVacacionales: acuerdosEmp,
  };
}

// ─── PARSER DE EXCEL ─────────────────────────────────────────────────────────
function parseBasedatos(arrayBuffer) {
  const wb = XLSX.read(arrayBuffer, { type: "array", cellDates: true });
  const ws = wb.Sheets[wb.SheetNames[0]];

  // ── Leer fecha de corte global desde la celda K1 ──────────────────────────
  // K = columna 11 (índice 10, base-0). La celda K1 en notación A1 es "K1".
  let fechaCorteGlobal = null;
  const celdaK1 = ws["K1"];
  if (celdaK1) {
    const val = celdaK1.v; // valor raw de la celda
    if (val instanceof Date) {
      fechaCorteGlobal = dateOnly(val);
    } else if (typeof val === "number") {
      // Número de serie Excel → fecha JS
      const utc = new Date(Date.UTC(1899, 11, 30));
      utc.setUTCDate(utc.getUTCDate() + val);
      fechaCorteGlobal = dateOnly(utc);
    } else if (typeof val === "string" && val.trim()) {
      fechaCorteGlobal = dateOnly(new Date(val.trim()));
    }
  }
  if (!fechaCorteGlobal || isNaN(fechaCorteGlobal.getTime())) {
    // Fallback: usar 30/04/2026 si K1 está vacía o no es una fecha válida
    fechaCorteGlobal = new Date(2026, 3, 30);
    console.warn("K1 no contiene una fecha válida. Se usará 30/04/2026 como fallback.");
  }
  // ─────────────────────────────────────────────────────────────────────────

  const raw = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, dateNF: "yyyy-mm-dd" });

  let headerRow = -1;
  for (let i = 0; i < raw.length; i++) {
    if (raw[i].some((c) => String(c).trim() === "Cod")) {
      headerRow = i;
      break;
    }
  }
  if (headerRow === -1) throw new Error("No se encontró cabecera en Base de datos");

  const headers = raw[headerRow].map((h) => String(h).trim());
  const colMap = {};
  headers.forEach((h, i) => { colMap[h] = i; });
  console.log("[parseBasedatos] Headers:", headers);
  console.log("[parseBasedatos] colMap Estado:", colMap["Estado"]);
  const empleados = [];
  for (let i = headerRow + 1; i < raw.length; i++) {
    const row = raw[i];
    if (!row[colMap["Cod"]]) continue;

    const parseFecha = (val) => {
      if (!val) return null;
      if (val instanceof Date) return dateOnly(val);
      const str = String(val).trim();
      // Formato yyyy-mm-dd
      if (/^\d{4}-\d{2}-\d{2}$/.test(str)) return dateOnly(new Date(str + "T12:00:00"));
      // Formato M/D/YY o M/D/YYYY (americano)
      const mdy = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
      if (mdy) {
        let y = parseInt(mdy[3]);
        if (y < 100) y += y < 30 ? 2000 : 1900;
        return dateOnly(new Date(y, parseInt(mdy[1]) - 1, parseInt(mdy[2])));
      }
      const d = new Date(str);
      return isNaN(d.getTime()) ? null : dateOnly(d);
    };

    const feIngreso = parseFecha(row[colMap["Fe. Ingreso"]]);
    const fechaCorte = parseFecha(row[colMap["Fecha de Corte"]]);
    if (!feIngreso || !fechaCorte) continue; // saltar filas con fechas inválidas

    // Log para cesado conocido
    const codActual = String(row[colMap["Cod"]] || row[0] || "").trim();
    
    empleados.push({
      cod: String(row[colMap["Cod"]] || row[0] || "").trim(),
      doc: String(row[colMap["Doc"]] || row[1] || "").trim(),
      nom: String(row[colMap["Nóm"]] || row[2] || "").trim(),
      estado: String(row[3] || "Activo").trim(), // índice fijo — Estado siempre en columna D
      feCese: parseFecha(row[4]), // índice fijo — Fe. Cese siempre en columna E
      unidadOrg: String(row[colMap["Unid. Org."]] || "").trim(),
      ceco: String(row[colMap["Descrip. CeCo"]] ?? row[colMap["Descrip. Ceco"]] ?? row[colMap["CeCo"]] ?? row[colMap["CECO"]] ?? "").trim(),
      posicion: String(row[colMap["Posición"]] || "").trim(),
      gerencia: String(row[colMap["Gerencia"]] || "").trim(),
      nombres: String(row[colMap["Nombres"]] || "").trim(),
      feIngreso,
      fechaCorte,
    });
  }
  // Retornamos tanto los empleados como la fecha de corte global leída de K1
  return { empleados, fechaCorteGlobal };
}

function parseVacacionesGozadas(arrayBuffer) {
  const wb = XLSX.read(arrayBuffer, { type: "array", cellDates: true });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const raw = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false });

  let headerRow = -1;
  for (let i = 0; i < raw.length; i++) {
    if (raw[i].some((c) => String(c).trim() === "Cod")) {
      headerRow = i;
      break;
    }
  }
  if (headerRow === -1) throw new Error("No se encontró cabecera en Vacaciones Gozadas");

  const headers = raw[headerRow].map((h) => String(h).trim());
  const colMap = {};
  headers.forEach((h, i) => { colMap[h] = i; });
  // Columna Obs: buscar por nombre o usar índice 6 (columna G) como fallback
  const obsIdx = colMap["Obs"] ?? colMap["obs"] ?? 6;

  const gocesPorCod = {};
  const visto = new Set();

  for (let i = headerRow + 1; i < raw.length; i++) {
    const row = raw[i];
    const cod = String(row[colMap["Cod"]] || "").trim();
    if (!cod) continue;
    const fechaRaw = row[colMap["Fecha"]];
    if (!fechaRaw) continue;
    const fecha = parseFechaSegura(fechaRaw);
    if (!fecha) continue;

    const key = `${cod}_${fecha.toISOString().slice(0, 10)}`;
    if (visto.has(key)) continue;
    visto.add(key);

    if (!gocesPorCod[cod]) gocesPorCod[cod] = [];
    gocesPorCod[cod].push({
      cod,
      fecha,
      txtExpl: String(row[colMap["Txt.expl."]] || "Vacaciones").trim(),
      ctd: parseFloat(row[colMap["Ctd."]] || 1),
      obs: row[obsIdx] != null && String(row[obsIdx]).trim() !== "" ? String(row[obsIdx]).trim() : null,
      tipo: "GOCE",
    });
  }
  return gocesPorCod;
}

// ─────────────────────────────────────────────────────────────────────
// GOCES VIRTUALES: solicitudes APROBADAS de tipo GOCE que aún no están en el Excel de SAP.
// Se expanden a un registro por día (misma forma que los goces del Excel).
// Cruce anti-duplicado por código + fecha de inicio exacta.
// ─────────────────────────────────────────────────────────────────────
function construirGocesVirtuales(solicitudes, gocesPorCodExcel) {
  const out = {};
  if (!Array.isArray(solicitudes)) return out;

  const toDate = (v) => {
    if (!v) return null;
    if (v instanceof Date) return isNaN(v.getTime()) ? null : v;
    if (typeof v.toDate === "function") { const d = v.toDate(); return isNaN(d.getTime()) ? null : d; }
    const s = String(v).trim();
    let d = null;
    if (/^\d{4}-\d{2}-\d{2}/.test(s)) d = new Date(s.slice(0,10) + "T12:00:00");
    else if (/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(s)) {
      const p = s.split("/");
      d = new Date(p[2] + "-" + String(p[1]).padStart(2,"0") + "-" + String(p[0]).padStart(2,"0") + "T12:00:00");
    } else d = new Date(s);
    return (d && !isNaN(d.getTime())) ? d : null;
  };

  // Índice de fechas de inicio ya presentes en el Excel, por código
  const iniExcel = {};
  if (gocesPorCodExcel) {
    for (const cod in gocesPorCodExcel) {
      const dias = (gocesPorCodExcel[cod] || []).map(g => g.fecha).filter(Boolean).sort((a,b) => a-b);
      const set = new Set();
      let prev = null;
      dias.forEach(d => {
        if (!prev || Math.round((d - prev) / 86400000) > 1) set.add(d.toISOString().slice(0,10));
        prev = d;
      });
      iniExcel[cod] = set;
    }
  }

  solicitudes.forEach(s => {
    if (!s || s.estado !== "APROBADA") return;
    // Solo goces: excluye COMPRA y CONVENIO
    const t = String(s.tipo || "").toUpperCase();
    if (t === "COMPRA" || t === "CONVENIO") return;

    const cod = String(s.colaboradorCod || s.cod || "").trim();
    if (!cod) return;
    const ini = toDate(s.fechaInicio);
    const fin = toDate(s.fechaFin);
    if (!ini || !fin || fin < ini) return;

    const iniKey = dateOnly(ini).toISOString().slice(0,10);
    // Anti-duplicado: si el Excel ya trae un bloque que arranca ese día, se descarta
    if (iniExcel[cod] && iniExcel[cod].has(iniKey)) return;
    if (!out[cod]) out[cod] = [];

    let d = dateOnly(ini);
    const dFin = dateOnly(fin);
    let guard = 0;
    while (d <= dFin && guard < 400) {
      out[cod].push({
        cod,
        fecha: new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12, 0, 0),
        txtExpl: "Vacaciones",
        ctd: 1,
        obs: "Con registro en el sistema",
        tipo: "GOCE",
        origenSistema: true,
        solicitudId: s.id || null,
      });
      d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1);
      guard++;
    }
  });
  return out;
}

// Fusiona los goces del Excel con los virtuales (sin mutar el original)
function fusionarGoces(gocesExcel, gocesVirtuales) {
  if (!gocesVirtuales || Object.keys(gocesVirtuales).length === 0) return gocesExcel || {};
  const out = {};
  for (const cod in (gocesExcel || {})) out[cod] = (gocesExcel[cod] || []).slice();
  for (const cod in gocesVirtuales) {
    if (!out[cod]) out[cod] = [];
    out[cod] = out[cod].concat(gocesVirtuales[cod]);
  }
  return out;
}

// Parser de Vacaciones Compradas — misma estructura que Goces, tipo COMPRA
function parseVacacionesCompradas(arrayBuffer) {
  const wb = XLSX.read(arrayBuffer, { type: "array", cellDates: true });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const raw = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false });

  // Nueva estructura: Cód | Apellidos y Nombres | Año que impacta | Días | Mes de compra | Comentario | Estado
  const cc = (v) => v === null || v === undefined ? "" : String(v).trim().replace(/^'/, "");
  const normalizar = (v) => cc(v).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

  let headerRow = -1;
  for (let i = 0; i < Math.min(raw.length, 10); i++) {
    if (!raw[i]) continue;
    if (raw[i].some(c => normalizar(c) === "cod")) { headerRow = i; break; }
  }
  if (headerRow === -1) throw new Error("No se encontró cabecera en Vacaciones Compradas");

  const headers = raw[headerRow].map(h => cc(h));
  const colMap = {};
  headers.forEach((h, i) => { colMap[h] = i; });

  // Mapeo flexible de columnas
  const colCod      = colMap["Cód"] ?? colMap["Cod"] ?? 0;
  const colAnio     = colMap["Año que impacta"] ?? colMap["Ano que impacta"] ?? 2;
  const colDias     = colMap["Días"] ?? colMap["Dias"] ?? 3;
  const colMes      = colMap["Mes de compra"] ?? 4;
  const colComent   = colMap["Comentario"] ?? colMap["Obs"] ?? colMap["obs"] ?? 5;
  const colEstado   = colMap["Estado"] ?? 6;

  const MESES_MAP = {
    "enero":1,"febrero":2,"marzo":3,"abril":4,"mayo":5,"junio":6,
    "julio":7,"agosto":8,"septiembre":9,"octubre":10,"noviembre":11,"diciembre":12
  };

  const comprasPorCod = {};

  for (let i = headerRow + 1; i < raw.length; i++) {
    const row = raw[i];
    if (!row) continue;
    const cod = cc(row[colCod]);
    if (!cod) continue;

    // Parsear "Mes de compra" → fecha inicio (ej: "Febrero 2019" → 2019-02-01)
    const mesStr = cc(row[colMes] || "");
    let fechaInicio = null;
    const mesMatch = mesStr.match(/([a-záéíóúü]+)\s+(\d{4})/i);
    if (mesMatch) {
      const mesNum = MESES_MAP[mesMatch[1].toLowerCase()];
      const anioNum = parseInt(mesMatch[2]);
      if (mesNum && anioNum) fechaInicio = dateOnly(new Date(anioNum, mesNum - 1, 1));
    }

    // Parsear "Año que impacta" → inicio y fin del período (ej: "2017 - 2018")
    const anioStr = cc(row[colAnio] || "");
    let anioInicio = null, anioFin = null;
    const anioMatch = anioStr.match(/(\d{4})\s*[-–]\s*(\d{4})/);
    if (anioMatch) {
      anioInicio = parseInt(anioMatch[1]);
      anioFin = parseInt(anioMatch[2]);
    }

    const dias = parseFloat(cc(row[colDias] || "0")) || 0;
    const obs = cc(row[colComent] || "");
    const estado = cc(row[colEstado] || "");
    const registrado = obs.toLowerCase().includes("registro") || estado.toLowerCase().includes("registrado");

    if (!comprasPorCod[cod]) comprasPorCod[cod] = [];
    comprasPorCod[cod].push({
      cod,
      inicio: fechaInicio,
      fin: fechaInicio, // se usa inicio como referencia de mes
      dias,
      obs,
      estado,
      registrado,
      anioInicio,
      anioFin,
      tipo: "COMPRA",
    });
  }
  return comprasPorCod;
}


// Crea un período tipo INDEMNIZACION con Base = Ctd., Saldo = Ctd.
function parseRegimenEspecial(arrayBuffer) {
  const wb = XLSX.read(arrayBuffer, { type: "array", cellDates: true });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const raw = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, dateNF: "yyyy-mm-dd" });

  let headerRow = -1;
  for (let i = 0; i < Math.min(raw.length, 10); i++) {
    if (!raw[i]) continue;
    if (raw[i].some(c => String(c).trim().toLowerCase() === "cód" || String(c).trim().toLowerCase() === "cod")) {
      headerRow = i; break;
    }
  }
  if (headerRow === -1) headerRow = 0;

  const headers = raw[headerRow].map(h => String(h).trim());
  const colMap = {};
  headers.forEach((h, i) => { colMap[h] = i; });

  const colCod     = colMap["Cód"] ?? colMap["Cod"] ?? 0;
  const colInicio  = colMap["Periodo Inicio"] ?? colMap["Inicio"] ?? 2;
  const colFin     = colMap["Periodo Fin"] ?? colMap["Fin"] ?? 3;

  const parseFechaR = (val) => {
    if (!val) return null;
    if (val instanceof Date) return dateOnly(val);
    const str = String(val).trim();
    if (/^\d{4}-\d{2}-\d{2}$/.test(str)) return dateOnly(new Date(str + "T12:00:00"));
    const mdy = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
    if (mdy) {
      let y = parseInt(mdy[3]);
      if (y < 100) y += y < 30 ? 2000 : 1900;
      return dateOnly(new Date(y, parseInt(mdy[1]) - 1, parseInt(mdy[2])));
    }
    const d = new Date(str);
    return isNaN(d.getTime()) ? null : dateOnly(d);
  };

  const regimenPorCod = {};
  for (let i = headerRow + 1; i < raw.length; i++) {
    const row = raw[i];
    if (!row) continue;
    const cod = String(row[colCod] || "").trim();
    if (!cod) continue;
    const inicio = parseFechaR(row[colInicio]);
    const fin = parseFechaR(row[colFin]);
    if (!inicio || !fin) continue;
    if (!regimenPorCod[cod]) regimenPorCod[cod] = [];
    regimenPorCod[cod].push({ inicio, fin });
  }
  return regimenPorCod;
}

// ── Motor de extensión por Subsidio Enfermedad (D.L. 713) ────────────────────
// - Descanso Médico: genera vacas ✅ resetea contador subsidio
// - Subsidio Enfermedad: primeros 60 días ✅, día 61+ extiende el año
// - Subsidio Accidente: todos los días computan ✅ sin límite
// - Subsidio sin DM previo: se acumula al evento anterior
function calcularExtensionSubsidio(incapacidadesEmp, fechaCorte) {
  if (!incapacidadesEmp || incapacidadesEmp.length === 0) return { diasExtension: 0, eventos: [] };

  const corte = dateOnly(fechaCorte);
  const registros = [...incapacidadesEmp].sort((a, b) => a.fecha - b.fecha);

  // Agrupar registros consecutivos del mismo tipo en bloques
  const bloques = [];
  let bloqueActual = null;
  for (const reg of registros) {
    if (!bloqueActual) {
      bloqueActual = { tipo: reg.tipo, inicio: reg.fecha, fin: reg.fecha, dias: 1 };
    } else {
      const diff = daysBetween(bloqueActual.fin, reg.fecha);
      if (diff === 1 && reg.tipo === bloqueActual.tipo) {
        bloqueActual.fin = reg.fecha;
        bloqueActual.dias++;
      } else {
        bloques.push(bloqueActual);
        bloqueActual = { tipo: reg.tipo, inicio: reg.fecha, fin: reg.fecha, dias: 1 };
      }
    }
  }
  if (bloqueActual) bloques.push(bloqueActual);

  // Helper: determinar en qué año laboral cae una fecha
  const getAnioLaboral = (fecha) => {
    let anio = 1;
    while (true) {
      const inicioP = dateOnly(addYears(corte, anio - 1));
      const finP = dateOnly(new Date(addYears(corte, anio) - 86400000));
      if (fecha >= inicioP && fecha <= finP) return anio;
      if (inicioP > fecha) return anio - 1;
      anio++;
      if (anio > 50) break;
    }
    return 1;
  };

  const eventos = [];
  let contadorSubsidio = 0;
  let diasExtensionEvento = 0;
  let eventoActual = null;
  let bloquesSubsidioEvento = [];

  const cerrarEvento = () => {
    if (!eventoActual) return;
    // Todos los días de extensión van al período donde se supera el día 61
    // Es decir, el período donde cae el día 61 del subsidio acumulado
    const diasExtensionPorPeriodo = {};
    if (diasExtensionEvento > 0) {
      // Encontrar el día 61 del subsidio acumulado
      let contadorAcum = contadorSubsidio - bloquesSubsidioEvento.reduce((s, b) => s + b.dias, 0);
      let periodoDestino = null;
      outer: for (const bs of bloquesSubsidioEvento) {
        let diaActual = new Date(bs.inicio);
        for (let d = 0; d < bs.dias; d++) {
          contadorAcum++;
          if (contadorAcum === 61) {
            // Este es el día 61 → todos los días de extensión van a este período
            const fecha = dateOnly(new Date(diaActual));
            periodoDestino = getAnioLaboral(fecha);
            break outer;
          }
          diaActual.setDate(diaActual.getDate() + 1);
        }
      }
      if (periodoDestino !== null) {
        diasExtensionPorPeriodo[periodoDestino] = diasExtensionEvento;
      }
    }
    eventos.push({
      ...eventoActual,
      diasSubsidio: contadorSubsidio,
      diasExtension: diasExtensionEvento,
      diasExtensionPorPeriodo,
    });
  };

  for (const bloque of bloques) {
    if (bloque.tipo === "Descanso Médico") {
      cerrarEvento();
      contadorSubsidio = 0;
      diasExtensionEvento = 0;
      bloquesSubsidioEvento = [];
      eventoActual = { inicioDM: bloque.inicio, finDM: bloque.fin, diasDM: bloque.dias };
    } else if (bloque.tipo === "Subsidio Enfermedad") {
      const yaDescontados = Math.max(0, contadorSubsidio - 60);
      contadorSubsidio += bloque.dias;
      const nuevosDescontados = Math.max(0, contadorSubsidio - 60) - yaDescontados;
      diasExtensionEvento += nuevosDescontados;
      bloquesSubsidioEvento.push(bloque);
      if (!eventoActual) eventoActual = { inicioDM: null, finDM: null, diasDM: 0 };
    }
    // Subsidio Accidente: no afecta el contador
  }
  cerrarEvento();

  return {
    diasExtension: eventos.reduce((s, e) => s + e.diasExtension, 0),
    eventos,
  };
}



// ── Parser de Acuerdo de Acumulación Vacacional ──────────────────────────────
function parseAcuerdoAcumulacion(arrayBuffer) {
  const wb = XLSX.read(arrayBuffer, { type: "array", cellDates: true });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const raw = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false });
  let headerRow = -1;
  for (let i = 0; i < raw.length; i++) {
    if (raw[i].some((c) => String(c).trim() === "Cod")) { headerRow = i; break; }
  }
  if (headerRow === -1) throw new Error("No se encontró cabecera en Acuerdo de Acumulación");
  const headers = raw[headerRow].map((h) => String(h).trim());
  const colMap = {};
  headers.forEach((h, i) => { colMap[h] = i; });
  // Detectar columna Fecha de firma (varias formas posibles)
  const colFechaFirma = colMap["Fecha de firma"] ?? colMap["Fecha de Firma"] ?? colMap["Fecha firma"] ?? colMap["FechaFirma"] ?? null;

  const acuerdosPorCod = {};
  for (let i = headerRow + 1; i < raw.length; i++) {
    const row = raw[i];
    const cod = String(row[colMap["Cod"]] || "").trim().replace(/\.0$/, "");
    if (!cod) continue;
    const periodo = String(row[colMap["Periodo"]] || "").trim();
    const colDias = colMap["Días"] ?? colMap["Dias"] ?? colMap["dias"] ?? colMap["D\u00edas"] ?? Object.keys(colMap).find(k => k.toLowerCase().includes("dia"));
    const dias = parseFloat(row[colDias] || 0);
    const nombres = String(row[colMap["Apellidos y Nombres"]] || "").trim();
    if (!periodo || !dias) continue;
    const partes = periodo.split("-").map(p => parseInt(p.trim()));
    if (partes.length < 2 || isNaN(partes[0]) || isNaN(partes[1])) continue;

    // Leer fecha de firma si existe la columna
    let fechaFirma = null;
    if (colFechaFirma !== null && row[colFechaFirma] != null && String(row[colFechaFirma]).trim() !== "") {
      fechaFirma = parseFechaSegura(row[colFechaFirma]);
    }

    if (!acuerdosPorCod[cod]) acuerdosPorCod[cod] = [];
    acuerdosPorCod[cod].push({ cod, nombres, periodo, anoInicio: partes[0], anoFin: partes[1], diasAcordados: dias, fechaFirma });
  }
  // Detectar códigos que no están en la base de datos (se resuelve en importación)
  return { acuerdosPorCod };
}

function acuerdoMatchPeriodo(acuerdo, periodo) {
  if (!periodo.inicio || !periodo.fin) return false;
  return periodo.inicio.getFullYear() === acuerdo.anoInicio &&
         periodo.fin.getFullYear() === acuerdo.anoFin;
}

// Hook para detectar si estamos en pantalla móvil (< 768px)
function useIsMobile() {
  const [isMobile, setIsMobile] = React.useState(() => window.innerWidth < 768);
  React.useEffect(() => {
    const handler = () => setIsMobile(window.innerWidth < 768);
    window.addEventListener("resize", handler);
    return () => window.removeEventListener("resize", handler);
  }, []);
  return isMobile;
}

      minWidth: 60,
      textAlign: "center",
    }}>{neg ? "▼ " : ""}{Math.abs(saldo).toFixed(2)}</span>

}

function CompraModal({ compra, onClose }) {

    <div style={{

      display: "flex", alignItems: "center", justifyContent: "center",

    }} onClick={onClose}>
      <div style={{
        background: COLORS.surface, border: `0.5px solid ${COLORS.border}`,
        borderRadius: 14, padding: 28, maxWidth: 480, width: "100%",
        boxShadow: "0 8px 40px rgba(0,0,0,0.10)",
      }} onClick={(e) => e.stopPropagation()}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 24 }}>
          <div>
            <div style={{ fontSize: 18, fontWeight: 700, color: COLORS.texto }}>Detalle de la Compra</div>
            <div style={{ fontSize: 13, color: COLORS.textoMuted, marginTop: 2 }}>Información del período adquirido</div>
          </div>
          <button onClick={onClose} style={{
            background: COLORS.surfaceHigh, border: `0.5px solid ${COLORS.border}`,

            cursor: "pointer", fontSize: 13,
          }}>✕ Cerrar</button>
        </div>
        <div style={{ display: "grid", gap: 10 }}>
          {rows.map(([k, v]) => (
            <div key={k} style={{
              display: "flex", justifyContent: "space-between", alignItems: "center",
              padding: "10px 14px", background: COLORS.surfaceHigh,
              borderRadius: 10, border: `0.5px solid ${COLORS.border}`,
            }}>
              <span style={{ fontSize: 13, color: COLORS.textoMuted }}>{k}</span>

                      <div style={{ textAlign: "center" }}>
                        <div style={{ fontSize: 10, color: COLORS.textoMuted }}>Indemn.</div>

                              {fmtDate(g.inicio)} → {fmtDate(g.fin)}

                            <span style={{ fontSize: 10, background: "rgba(16,185,129,0.12)", color: "#10B981", borderRadius: 4, padding: "1px 6px", fontWeight: 600 }}>
                              {g.obs}

                        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>

                    <div style={{ fontSize: 11, color: "#F97316", fontWeight: 600, marginBottom: 4, marginTop: 4 }}>

                        onClick={() => setCompraSeleccionada(c)}
                        style={{
                          display: "flex", justifyContent: "space-between", alignItems: "center",
                          padding: "8px 12px", background: "rgba(249,115,22,0.05)",
                          borderRadius: 8, border: "1px solid rgba(249,115,22,0.2)",
                          cursor: "pointer", transition: "background 0.2s",
                        }}
                        onMouseEnter={(e) => e.currentTarget.style.background = "rgba(249,115,22,0.1)"}

                      <div style={{ padding: "8px 12px", background: "rgba(139,92,246,0.06)", border: "0.5px solid rgba(139,92,246,0.25)", borderRadius: 8, display: "flex", alignItems: "flex-start", gap: 8 }}>

                          El plazo de goce se extendió proporcionalmente para proteger el derecho vacacional del colaborador.
                        </span>
                      </div>
                    )}
                    {/* Nota: convenio */}
                    {p.goces && p.goces.some(g => g.acuerdoInfo?.porConvenio) && (
                      <div style={{ padding: "8px 12px", background: "rgba(99,102,241,0.06)", border: "0.5px solid rgba(99,102,241,0.25)", borderRadius: 8, display: "flex", alignItems: "flex-start", gap: 8 }}>
